<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic',sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* 1. 최상단 글로벌 바 */
        .top-bar {
            background: #12121e;
            border-bottom: 1px solid #2a2a3e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 50px;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-title {
            font-size: 18px;
            font-weight: bold;
            color: #7090ff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(112,144,255,0.4);
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.3);
            box-shadow: inset 0 0 10px rgba(112,144,255,0.1), 0 0 10px rgba(112,144,255,0.2);
        }

        .neon-item {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .neon-item.up { color: #ff5555; text-shadow: 0 0 6px rgba(255,85,85,0.6); }
        .neon-item.dn { color: #55aaff; text-shadow: 0 0 6px rgba(85,170,255,0.6); }
        .neon-item.neu { color: #ddd; }
        .neon-vix-warn { color: #ffcc00; text-shadow: 0 0 6px rgba(255,204,0,0.6); }

        .top-time-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
        }

        .live-dot.active {
            background: #00ff66;
            box-shadow: 0 0 10px #00ff66;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* 2. 패널 그리드 */
        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 320px;
            overflow-y: auto;
        }

        .panel:last-child { border-right: none; }

        .ph {
            display: flex;
            justify-content: flex-start;
            align-items: baseline;
            gap: 15px;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
        }

        .ticker-group { display: flex; align-items: baseline; gap: 6px; }
        .ticker { font-size: 22px; font-weight: bold; }
        .ticker-sub { font-size: 13px; color: #8899aa; }
        .price-group { display: flex; align-items: baseline; gap: 8px; }
        .price-now { font-size: 22px; font-weight: bold; }
        .price-diff { font-size: 13px; font-weight: bold; }
        .price-chg { font-size: 13px; font-weight: bold; }

        .up { color: #ff5555; }
        .dn { color: #55aaff; }
        .neu { color: #aaaaaa; }

        .strategy-box {
            border: 1px solid #aaaa22;
            border-radius: 8px;
            padding: 10px;
            background: #11111a;
            flex-shrink: 0;
        }

        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #333;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .sb-title { color: #ffff44; font-size: 15px; font-weight: bold; }
        .sb-trend { font-size: 11px; color: #ddd; background: #1a1a2e; padding: 3px 6px; border-radius: 4px; }

        .timeline {
            position: relative;
            height: 70px;
            margin: 0 10px;
        }

        .tl-track {
            position: absolute;
            top: 35px;
            left: 8%;
            right: 8%;
            height: 3px;
            background: #2a2a3e;
            border-radius: 2px;
        }

        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 75px;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        .node-top { bottom: 45px; }
        .node-bottom { top: 45px; }

        .dot {
            position: absolute;
            top: 36.5px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        .dot-small { width: 10px; height: 10px; z-index: 2; }
        .dot-large { width: 14px; height: 14px; z-index: 10; border: 2px solid #fff; box-shadow: 0 0 10px; }

        .lbl-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #11111a;
            padding: 0 3px;
            border-radius: 4px;
        }

        .lbl { font-size: 10px; color: #aaa; font-weight: bold; margin-bottom: 1px; }
        .val { font-size: 12px; font-weight: bold; }

        .c-red { color: #ff5555; }
        .bg-red { background: #ff5555; }
        .c-green { color: #44ff66; }
        .bg-green { background: #44ff66; }
        .c-blue { color: #55aaff; }
        .bg-blue { background: #55aaff; }
        .c-gold { color: #ffcc00; }
        .bg-gold { background: #ffcc00; }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 10px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .oi-title { font-size: 15px; font-weight: bold; color: #88aaff; }
        .oi-dte { background: #aa33ff; color: #fff; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
            color: #ccc;
            border-bottom: 1px solid #2a2a3e;
            padding-bottom: 8px;
            margin-bottom: 10px;
            background: #12121e;
            padding-top: 6px;
            border-radius: 6px;
        }

        .oi-sum-item b { color: #fff; }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 50px 42px 55px 42px 50px 1fr;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 50px 42px 55px 42px 50px 1fr;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 3px;
        }

        .oi-bar-wrap { display: flex; width: 100%; align-items: center; }
        .oi-bar-wrap.left { justify-content: flex-end; }
        .oi-bar-wrap.right { justify-content: flex-start; }

        .oi-bar.call { height: 7px; border-radius: 2px 0 0 2px; background: #ff5555; }
        .oi-bar.put { height: 7px; border-radius: 0 2px 2px 0; background: #55aaff; }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 2px 0;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 12px;
        }

        .strike-box.atm { background: #ffcc00; color: #000; box-shadow: 0 0 5px #ffcc00; }
        .oi-vol { font-size: 11px; color: #f0f0f0; white-space: nowrap; font-weight: bold; }

        .chart-section {
            flex: 1;
            min-height: 180px;
            height: 100%;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            position: relative;
        }

        @media screen and (max-width: 1200px) {
            .dashboard-grid { flex-direction: column; overflow-y: auto; }
            html, body { overflow-y: auto; height: auto; }
            .panel { height: auto; min-height: 750px; border-right: none; border-bottom: 2px solid #2a2a3e; }
        }

        @media screen and (max-width: 600px) {
            .top-bar { padding: 0 10px; height: auto; padding-top: 8px; padding-bottom: 8px; justify-content: center; }
            .neon-ticker-bar { width: 100%; justify-content: center; margin-top: 5px; }
            .panel { padding: 8px; gap: 8px; min-height: 700px; }
        }
    </style>
</head>
<body>

    <!-- 최상단 글로벌 바 -->
    <div class="top-bar">
        <span class="top-title">OPTIONS DASHBOARD</span>

        <div class="neon-ticker-bar">
            <span class="neon-item" id="neon-qqq">QQQ 0.00%</span>
            <span style="color:#555;">|</span>
            <span class="neon-item" id="neon-spy">SPY 0.00%</span>
            <span style="color:#555;">|</span>
            <span class="neon-item" id="neon-vix">VIX 0.00</span>
        </div>

        <div class="top-time-area">
            <div class="live-dot" id="live-indicator"></div>
            <span id="h-time">0000-00-00 00:00:00 갱신</span>
        </div>
    </div>

    <!-- 3분할 패널 그리드 -->
    <div class="dashboard-grid">
        <script>
            document.write([0, 1, 2].map(i => `
                <div class="panel" id="panel-${i}">
                    <div class="ph">
                        <div class="ticker-group">
                            <span class="ticker" id="p${i}-ticker">WAIT</span>
                            <span class="ticker-sub" id="p${i}-sub">대기중</span>
                        </div>
                        <div class="price-group">
                            <span class="price-now neu" id="p${i}-price">─</span>
                            <span class="price-diff neu" id="p${i}-diff">─</span>
                            <span class="price-chg neu" id="p${i}-chg">─</span>
                        </div>
                    </div>

                    <div class="strategy-box">
                        <div class="sb-header">
                            <span class="sb-title" id="p${i}-sigtitle">🟡 방향성 탐색 (관망)</span>
                            <span class="sb-trend" id="p${i}-trend">대기중</span>
                        </div>
                        <div class="timeline" id="p${i}-timeline"></div>
                    </div>

                    <div class="oi-box">
                        <div class="oi-header">
                            <span class="oi-title">📊 실시간 14단 옵션 체인</span>
                            <span class="oi-dte" id="p${i}-dte">🗓️ 대기중</span>
                        </div>

                        <div class="oi-summary">
                            <span class="oi-sum-item" id="p${i}-sum-power">수급 대기중</span>
                            <span class="oi-sum-item" id="p${i}-sum-env">지수 대기중</span>
                            <span class="oi-sum-item" id="p${i}-sum-hoga">호가 대기중</span>
                        </div>

                        <div class="oi-grid-header">
                            <div style="text-align:right; padding-right:8px;">콜 수급</div>
                            <div>OI/Vol</div><div>등락</div><div>행사가</div><div>등락</div><div>OI/Vol</div>
                            <div style="text-align:left; padding-left:8px;">풋 수급</div>
                        </div>
                        <div id="p${i}-oi-rows"></div>
                    </div>

                    <div class="chart-section" id="chart-${i}"></div>
                </div>`).join(''));
        </script>
    </div>

    <script>
        const nameMap = { "TSLA": "테슬라", "NVDA": "엔비디아", "PLTR": "팔란티어", "AAPL": "애플", "MSFT": "마이크로소프트" };
        let globQqq = 0, globSpy = 0, globVix = 0, globVixState = "안정";
        let lastMsgTime = 0;

        setInterval(() => {
            const dot = document.getElementById('live-indicator');
            if (dot && Date.now() - lastMsgTime > 15000) dot.classList.remove('active');
        }, 1000);

        // [공통 수신 처리기] 윈폼 다이렉트든 외부 웹 파이어베이스든 이 함수로 데이터를 받아 그려줍니다.
        window.onWsMessage = function (d) {
            if (!d || !d.type) return;

            lastMsgTime = Date.now();
            const dot = document.getElementById('live-indicator');
            if (dot) dot.classList.add('active');

            if (d.type === 'headerUpdate') {
                globQqq = d.qqq || 0; globSpy = d.spy || 0;
                globVix = d.vix || 0; globVixState = d.vixState || "안정";

                updateNeonTicker(globQqq, globSpy, globVix, globVixState);

                if (d.time) {
                    const now = new Date();
                    const yy = now.getFullYear();
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const dd = String(now.getDate()).padStart(2, '0');
                    document.getElementById('h-time').textContent = `${yy}-${mm}-${dd} ${d.time} 갱신`;
                }
            }
            if (d.type === 'optionUpdate') updatePanel(d.panel, d);
        };

        // [환경 분기 처리]
        // 1. 만약 로컬 윈폼(WebView2) 안에서 실행 중이라면 파이어베이스 리스너를 실행하지 않고 C# 다이렉트 통신만 사용합니다.
        // 2. 외부 웹브라우저로 접속한 경우에만 파이어베이스 서버 구독을 활성화합니다.
        const isWinForms = window.chrome && window.chrome.webview; // WebView2 환경 감지

        if (!isWinForms) {
            // 외부 웹 사용자용 파이어베이스 연동
            const scriptApp = document.createElement('script');
            scriptApp.src = "https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js";
            scriptApp.onload = function() {
                const scriptDb = document.createElement('script');
                scriptDb.src = "https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js";
                scriptDb.onload = function() {
                    const firebaseConfig = {
                        databaseURL: "https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/"
                    };
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    
                    const dbRef = firebase.database().ref('tickers');
                    const dashTickersMap = ["TSLA", "NVDA", "PLTR"];

                    dbRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (!data) return;

                        let firstKey = Object.keys(data)[0];
                        if (firstKey && data[firstKey].header) {
                            window.onWsMessage(data[firstKey].header);
                        }

                        dashTickersMap.forEach((tName, idx) => {
                            if (data[tName] && data[tName].panel) {
                                let pData = data[tName].panel;
                                pData.panel = idx;
                                window.onWsMessage(pData);
                            }
                        });
                    });
                };
                document.head.appendChild(scriptDb);
            };
            document.head.appendChild(scriptApp);
        }

        function updateNeonTicker(qqq, spy, vix, vixState) {
            const qEl = document.getElementById('neon-qqq');
            const sEl = document.getElementById('neon-spy');
            const vEl = document.getElementById('neon-vix');

            qEl.textContent = `QQQ ${qqq > 0 ? '+' : ''}${qqq.toFixed(2)}%`;
            qEl.className = 'neon-item ' + (qqq > 0 ? 'up' : qqq < 0 ? 'dn' : 'neu');

            sEl.textContent = `SPY ${spy > 0 ? '+' : ''}${spy.toFixed(2)}%`;
            sEl.className = 'neon-item ' + (spy > 0 ? 'up' : spy < 0 ? 'dn' : 'neu');

            vEl.textContent = `VIX ${vix.toFixed(2)} (${vixState})`;
            vEl.className = 'neon-item ' + (vixState.includes('공포') ? 'up' : vixState.includes('주의') ? 'neon-vix-warn' : 'neu');
        }

        function updatePanel(panel, d) {
            const p = 'p' + panel + '-';

            document.getElementById(p + 'ticker').textContent = d.ticker;
            document.getElementById(p + 'sub').textContent = nameMap[d.ticker] || '';

            const pxEl = document.getElementById(p + 'price');
            pxEl.textContent = '$' + (d.price ? d.price.toFixed(2) : '0.00');
            pxEl.className = 'price-now ' + (d.change > 0 ? 'up' : d.change < 0 ? 'dn' : 'neu');

            const diffEl = document.getElementById(p + 'diff');
            const diffVal = d.priceDiff || 0;
            diffEl.textContent = (diffVal > 0 ? '(+$' : '(-$') + Math.abs(diffVal).toFixed(2) + ')';
            diffEl.className = 'price-diff ' + (diffVal > 0 ? 'up' : diffVal < 0 ? 'dn' : 'neu');

            const chgEl = document.getElementById(p + 'chg');
            chgEl.textContent = (d.change > 0 ? '▲ +' : d.change < 0 ? '▼ ' : '') + (d.change || 0).toFixed(2) + '%';
            chgEl.className = 'price-chg ' + (d.change > 0 ? 'up' : d.change < 0 ? 'dn' : 'neu');

            const sigTitle = document.getElementById(p + 'sigtitle');
            if (d.signal === 'BUY') { sigTitle.textContent = '🟢 매수 유리 (롱)'; sigTitle.style.color = '#44ff66'; }
            else if (d.signal === 'SELL') { sigTitle.textContent = '🔴 매도 압박 (숏)'; sigTitle.style.color = '#ff5555'; }
            else { sigTitle.textContent = '🟡 방향성 탐색 (관망)'; sigTitle.style.color = '#ffff44'; }
            document.getElementById(p + 'trend').innerHTML = d.trendText || '대기중';

            renderTimeline(p, d);

            document.getElementById(p + 'dte').textContent = `🗓️ ${d.dteLabel}`;

            let powerStr = '팽팽함';
            if ((d.score || 5) > 5.5) powerStr = `<b class="c-red">콜 우세</b> (${d.score.toFixed(1)}점)`;
            else if ((d.score || 5) < 4.5) powerStr = `<b class="c-blue">풋 우세</b> (${d.score.toFixed(1)}점)`;
            document.getElementById(p + 'sum-power').innerHTML = `수급: ${powerStr}`;

            const qStr = globQqq > 0 ? `<b class="c-red">▲ 상승</b>` : globQqq < 0 ? `<b class="c-blue">▼ 하락</b>` : '<b>- 보합</b>';
            const sStr = globSpy > 0 ? `<b class="c-red">▲ 상승</b>` : globSpy < 0 ? `<b class="c-blue">▼ 하락</b>` : '<b>- 보합</b>';
            const vColor = globVixState.includes('공포') ? 'c-red' : globVixState.includes('주의') ? 'c-gold' : 'c-green';
            document.getElementById(p + 'sum-env').innerHTML = `지수: QQQ ${qStr} &nbsp;/&nbsp; SPY ${sStr} &nbsp;/&nbsp; VIX <b class="${vColor}">${globVixState}</b>`;

            const hStr = d.imbalance > 0.1 ? '<b class="c-red">매수우위</b>' : d.imbalance < -0.1 ? '<b class="c-blue">매도압박</b>' : '<b>팽팽함</b>';
            document.getElementById(p + 'sum-hoga').innerHTML = `호가: ${hStr}`;

            if (d.optionRows && d.optionRows.length > 0) renderOiGrid(p, d.optionRows, d.price);

            if (!window['tvTicker' + panel] || window['tvTicker' + panel] !== d.ticker) {
                window['tvTicker' + panel] = d.ticker;
                new TradingView.widget({
                    "autosize": true, "symbol": d.ticker, "interval": "3", "theme": "dark", "style": "1",
                    "hide_top_toolbar": true, "container_id": "chart-" + panel
                });
            }
        }

        function renderTimeline(p, d) {
            const tl = document.getElementById(p + 'timeline');
            let vals = [d.support2, d.support1, d.maxPain, d.price, d.resistance1, d.resistance2].filter(v => v > 0);
            if (vals.length === 0) return;

            let minP = Math.min(...vals), maxP = Math.max(...vals);
            let span = maxP - minP || 1;
            minP -= span * 0.1; maxP += span * 0.1; span = maxP - minP;

            const getPos = v => 8 + Math.max(0, Math.min(1, (v - minP) / span)) * 84;

            let bots = [
                { id: 's2', val: d.support2, lbl: '2차 지지', c: 'c-green', bg: 'bg-green' },
                { id: 's1', val: d.support1, lbl: '1차 지지', c: 'c-green', bg: 'bg-green' },
                { id: 'r1', val: d.resistance1, lbl: '1차 저항', c: 'c-red', bg: 'bg-red' },
                { id: 'r2', val: d.resistance2, lbl: '2차 저항', c: 'c-red', bg: 'bg-red' }
            ].filter(n => n.val > 0);

            bots.forEach(n => n.pos = getPos(n.val));
            bots.sort((a, b) => a.pos - b.pos);
            for (let i = 1; i < bots.length; i++) {
                if (bots[i].pos - bots[i - 1].pos < 12) bots[i].pos = bots[i - 1].pos + 12;
            }

            let tops = [
                { id: 'pain', val: d.maxPain, lbl: '🧲 MaxPain', c: 'c-gold', bg: 'bg-gold', isLarge: false },
                { id: 'now', val: d.price, lbl: '현재가', c: 'c-blue', bg: 'bg-blue', isLarge: true }
            ].filter(n => n.val > 0);

            tops.forEach(n => n.pos = getPos(n.val));
            tops.sort((a, b) => a.pos - b.pos);

            if (tops.length === 2 && Math.abs(tops[1].pos - tops[0].pos) < 10) {
                tops[0].transX = '-100%';
                tops[1].transX = '0%';
            }

            let html = '<div class="tl-track"></div>';

            bots.forEach(n => {
                html += `
                    <div class="node node-bottom" style="left: ${n.pos}%;">
                        <div class="lbl-box"><span class="val ${n.c}">${n.val.toFixed(1)}</span><span class="lbl">${n.lbl}</span></div>
                    </div>
                    <div class="dot dot-small ${n.bg}" style="left: ${n.pos}%;"></div>`;
            });

            tops.forEach(n => {
                let shift = n.transX ? `transform: translateX(${n.transX});` : '';
                html += `
                    <div class="node node-top" style="left: ${n.pos}%; ${shift} z-index: ${n.isLarge ? 20 : 10};">
                        <div class="lbl-box"><span class="lbl ${n.c}">${n.lbl}</span><span class="val ${n.c}">${n.val.toFixed(1)}</span></div>
                    </div>
                    <div class="dot ${n.isLarge ? 'dot-large' : 'dot-small'} ${n.bg}" style="left: ${n.pos}%; z-index: ${n.isLarge ? 20 : 10};"></div>`;
            });

            tl.innerHTML = html;
        }

        function renderOiGrid(p, rows, price) {
            let maxOi = Math.max(...rows.map(r => Math.max(r.callOI + r.callVol, r.putOI + r.putVol, 1)));
            let atm = rows.reduce((prev, curr) => Math.abs(curr.strike - price) < Math.abs(prev.strike - price) ? curr : prev).strike;
            const fmt = v => v >= 1000 ? (v / 1000).toFixed(1) + 'K' : (v === 0 ? '-' : v);

            let html = rows.map(r => {
                let cw = Math.max(1, ((r.callOI + r.callVol) / maxOi) * 100);
                let pw = Math.max(1, ((r.putOI + r.putVol) / maxOi) * 100);
                let isAtm = r.strike === atm ? 'atm' : '';

                let cc = r.callChg > 0 ? 'up' : r.callChg < 0 ? 'dn' : 'neu';
                let pc = r.putChg > 0 ? 'up' : r.putChg < 0 ? 'dn' : 'neu';
                let ct = (r.callChg > 0 ? '+' : '') + (r.callChg).toFixed(1) + '%';
                let pt = (r.putChg > 0 ? '+' : '') + (r.putChg).toFixed(1) + '%';

                return `
                    <div class="oi-row">
                        <div class="oi-bar-wrap left"><div class="oi-bar call" style="width:${cw}%;"></div></div>
                        <div class="oi-vol">${fmt(r.callOI)}/${fmt(r.callVol)}</div>
                        <div class="${cc}">${ct}</div>
                        <div><span class="strike-box ${isAtm}">${r.strike.toFixed(1)}</span></div>
                        <div class="${pc}">${pt}</div>
                        <div class="oi-vol">${fmt(r.putOI)}/${fmt(r.putVol)}</div>
                        <div class="oi-bar-wrap right"><div class="oi-bar put" style="width:${pw}%;"></div></div>
                    </div>`;
            }).join('');

            document.getElementById(p + 'oi-rows').innerHTML = html;
        }
    </script>
</body>
</html>
