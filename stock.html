<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }

        /* ── 초기 로딩 오버레이 ── */
        #initial-loading {
            position: fixed;
            inset: 0;
            background: #07070c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

            #initial-loading.fade-out {
                opacity: 0;
                pointer-events: none;
            }

        .il-logo {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .il-strike {
            font-size: 36px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
        }

        .il-zone {
            font-size: 36px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
        }

        .il-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        .il-msg {
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
        }

        /* ── 패널 전환 오버레이 ── */
        .panel-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,12,0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 8px;
            flex-direction: column;
            gap: 12px;
        }

            .panel-overlay.active {
                display: flex;
            }

        .po-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .po-msg {
            font-size: 12px;
            color: #888;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── 상단 바 ── */
        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6),0 0 24px rgba(255,200,0,0.4);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8),0 0 24px rgba(255,100,0,0.5);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 6px 0;
            box-shadow: 0 0 5px rgba(255,204,0,0.5);
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            text-transform: uppercase;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 1400px;
        }

        .sep {
            color: #1a1a30;
            padding: 0 2px;
        }

        .neon-item {
            font-size: 12px;
            font-weight: bold;
            color: #444;
            white-space: nowrap;
        }

            .neon-item.up {
                color: #ff4444;
                text-shadow: 0 0 6px rgba(255,68,68,0.5);
            }

            .neon-item.dn {
                color: #4488ff;
                text-shadow: 0 0 6px rgba(68,136,255,0.5);
            }

            .neon-item.neu {
                color: #ccc;
            }

        .neon-vix-warn {
            color: #ffcc00;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 시계 텍스트 흰색 변경 */
        .top-time {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

            .ws-dot.live {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: np 1.5s infinite;
            }

            .ws-dot.dead {
                background: #1a1a2a;
                animation: none;
            }

        @keyframes np {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: 0.3
            }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

            .oi-dot.flash {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: oiF 0.4s ease-in-out 2;
            }

        @keyframes oiF {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: 0.05
            }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
            position: relative;
        }

            .panel:last-child {
                border-right: none;
            }

        .ph {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            gap: 8px;
            align-items: center;
        }

        .ph-top {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .ticker-select {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            background: #0b0b14;
            border: 1px solid #2a2a3e;
            border-radius: 5px;
            padding: 2px 10px;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
            text-shadow: 0 0 8px rgba(255,204,0,0.4);
            width: 210px;
        }

            .ticker-select:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .ticker-select option {
                background: #0d0d1a;
                color: #fff;
                font-size: 13px;
            }

                .ticker-select option:disabled {
                    color: #444;
                }

        .price-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
            justify-content: center;
        }

        .price-now {
            font-size: 20px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-diff {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-chg {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .vol-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1a2238;
            color: #77aaee;
            border: 1px solid #2a3a5e;
            white-space: nowrap;
            margin-left: 10px;
            letter-spacing: 0.5px;
        }

        .up {
            color: #ff4444 !important;
        }

        .dn {
            color: #4488ff !important;
        }

        .neu {
            color: #aaa !important;
        }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2a2a2a;
            padding-bottom: 5px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .sb-title {
            color: #ddbb00;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            min-width: 0;
        }

        .sb-trend {
            font-size: 10px;
            color: #aaa;
            background: #1a1a2e;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .timeline {
            position: relative;
            height: 70px;
            margin: 0 6px;
        }

        .tl-track {
            position: absolute;
            top: 38px;
            left: 6%;
            right: 6%;
            height: 3px;
            background: #2a2a3e;
            border-radius: 2px;
        }

        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        .node-top {
            bottom: 42px;
        }

        .node-bottom {
            top: 46px;
        }

        .dot-triangle {
            position: absolute;
            top: 31px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #4488ff;
            z-index: 20;
        }

        .dot-tl {
            position: absolute;
            top: 39.5px;
            transform: translate(-50%,-50%);
            border-radius: 50%;
        }

        .dot-small {
            width: 9px;
            height: 9px;
            z-index: 2;
        }

        .lbl-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d0d15;
            padding: 0 2px;
            border-radius: 3px;
        }

        .lbl {
            font-size: 9px;
            color: #888;
            font-weight: bold;
            margin-bottom: 1px;
        }

        .val {
            font-size: 11px;
            font-weight: bold;
        }

        .c-red {
            color: #ff4444;
        }

        .bg-red {
            background: #ff4444;
        }

        .c-green {
            color: #44ff66;
        }

        .bg-green {
            background: #44ff66;
        }

        .c-blue {
            color: #4488ff;
        }

        .bg-blue {
            background: #4488ff;
        }

        .c-gold {
            color: #ffcc00;
        }

        .bg-gold {
            background: #ffcc00;
        }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 8px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .oi-title {
            font-size: 13px;
            font-weight: bold;
            color: #7799dd;
            display: flex;
            align-items: center;
        }

        .oi-dte {
            background: #7722cc;
            color: #fff;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: #bbb;
            border-bottom: 1px solid #2a2a3e;
            padding: 5px 0 6px;
            margin-bottom: 8px;
            background: #0f0f1a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            font-size: 10px;
            color: #fff;
            margin-bottom: 4px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            align-items: center;
            gap: 1px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 2px;
        }

        .oi-bar-wrap {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 0 3px;
        }

            .oi-bar-wrap.left {
                justify-content: flex-end;
            }

            .oi-bar-wrap.right {
                justify-content: flex-start;
            }

        .oi-bar.call {
            height: 6px;
            border-radius: 2px 0 0 2px;
            background: #cc3333;
        }

        .oi-bar.put {
            height: 6px;
            border-radius: 0 2px 2px 0;
            background: #3366cc;
        }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 1px 0;
            border-radius: 3px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 11px;
        }

            .strike-box.atm {
                background: #ffcc00;
                color: #000;
                box-shadow: 0 0 4px #ffcc00;
            }

        .oi-vol {
            font-size: 9.5px;
            color: #eee;
            white-space: nowrap;
            font-weight: bold;
        }

        .oi-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            color: #444;
            font-size: 12px;
            gap: 8px;
        }

        .oi-pending-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #222;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .chart-wrapper {
            flex: 0 0 240px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section {
            width: 100%;
            height: 100%;
        }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15,15,25,0.85);
            color: #ffcc00;
            border: 1px solid rgba(255,204,0,0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

            .chart-interval-select option {
                background: #0b0b14;
                color: #fff;
            }

        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }

            .sidebar::-webkit-scrollbar {
                display: none;
            }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name {
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
            line-height: 1;
            width: 100%;
        }

        .sl-strike {
            font-size: 30px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
            text-transform: uppercase;
        }

        .sl-zone {
            font-size: 30px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
            text-transform: uppercase;
        }

        .sl-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 12px 0 10px;
        }

        .sl-sub {
            font-size: 11.5px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .sidebar-menu {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #2a2a4a;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
        }

        .sidebar-watchlist {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px solid #1e1e30;
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .watchlist-title {
            margin: 0 0 8px;
            font-size: 13px;
            color: #aaa;
            font-weight: 600;
            flex-shrink: 0;
        }

        .ticker-list {
            overflow-y: auto;
            flex: 1;
            max-height: 340px;
        }

            .ticker-list::-webkit-scrollbar {
                width: 3px;
            }

            .ticker-list::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 2px;
            }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-bottom: 1px solid #1a1a28;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 3px;
        }

            .ticker-item:hover {
                background: #111120;
                color: #ddd;
            }

            .ticker-item.active-panel {
                color: #ffcc00;
            }

        .panel-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            background: #1a2a3e;
            color: #4488ff;
            margin-left: auto;
            white-space: nowrap;
            flex-shrink: 0;
        }

            .panel-badge.p0 {
                background: #2a1a1a;
                color: #ff6666;
            }

            .panel-badge.p1 {
                background: #1a2a1a;
                color: #66cc66;
            }

            .panel-badge.p2 {
                background: #1a1a2a;
                color: #6688ff;
            }

        .sidebar-ad {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #222;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 12px;
        }

        /* ── 모바일 환경 미디어 쿼리 (상단 배지 스타일 정돈) ── */
        @media screen and (max-width:1200px) {
            body {
                min-width: unset;
            }

            .top-bar {
                height: auto;
                flex-wrap: wrap;
                padding: 10px;
                gap: 8px;
            }

            .logo-top {
                width: 100%;
                order: 1;
                align-items: center;
                margin-top: 2px;
            }

            .top-right {
                order: 2;
                width: 100%;
                justify-content: center;
            }

            /* 모바일에서는 | 선을 숨기고 배지 형태로 둥글게 출력 */
            .neon-ticker-bar {
                width: 100%;
                max-width: none;
                order: 3;
                margin-top: 6px;
                padding: 8px 6px;
                justify-content: center;
                flex-wrap: wrap;
                gap: 8px 10px;
                background: transparent;
                border: none;
            }

                .neon-ticker-bar .sep {
                    display: none;
                }

                .neon-ticker-bar .neon-item {
                    background: rgba(255,255,255,0.05);
                    padding: 6px 10px;
                    border-radius: 6px;
                    border: 1px solid rgba(255,255,255,0.1);
                    font-size: 11.5px;
                }

            .content-wrapper {
                flex-direction: column;
                overflow-y: auto;
                padding: 6px;
                gap: 8px;
            }

            .dashboard-grid {
                flex-direction: column;
                overflow-y: visible;
                min-height: 0;
            }

            html, body {
                overflow-y: auto;
                height: auto;
            }

            .panel {
                height: auto;
                min-height: 0;
                border-right: none;
                border-bottom: 1px solid #1a1a2e;
                overflow-y: visible;
            }

            .ph {
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .ph-top {

    <script>
        var WATCH_LIST = [
            { ticker: 'TSLA', name: '테슬라' },
            { ticker: 'NVDA', name: '엔비디아' },
            { ticker: 'PLTR', name: '팔란티어' },
            { ticker: 'SPY', name: 'S&P 500 ETF' },
            { ticker: 'QQQ', name: '나스닥 100 ETF' },
            { ticker: 'AAPL', name: '애플' },
            { ticker: 'AMZN', name: '아마존' },
            { ticker: 'META', name: '메타' },
            { ticker: 'MU', name: '마이크론 테크' },
            { ticker: 'MSTR', name: '마이크로스트래티지' },
            { ticker: 'AMD', name: '에이엠디' },
            { ticker: 'IWM', name: '러셀 2000 ETF' },
            { ticker: 'COIN', name: '코인베이스' },
            { ticker: 'SPX', name: 'S&P 500 지수옵션' }
        ];

        var DEFAULT_PANELS = ['TSLA', 'NVDA', 'PLTR'];
        var LS_PANELS = 'sz_panels';
        var LS_INTERVAL = 'sz_interval';

        var panelTickers = loadLS(LS_PANELS, DEFAULT_PANELS);
        var panelIntervals = loadLS(LS_INTERVAL, { 0: '3', 1: '3', 2: '3' });

        var panelDataStore = {};
        var fbRefs = {};
        var headerPrevClose = {};
        var PricingData = null;

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';
        var currentChartTicker = { 0: null, 1: null, 2: null };
        var initialLoadDone = false;
        var switchTimers = { 0: null, 1: null, 2: null };
        var switchLocked = { 0: false, 1: false, 2: false };

        function loadLS(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }

        function numberWithCommas(x) {
            if (!x && x !== 0) return '─';
            return Number(x).toLocaleString('en-US');
        }

        function hideInitialLoading() {
            if (initialLoadDone) return;
            initialLoadDone = true;
            var el = document.getElementById('initial-loading');
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(function () { el.style.display = 'none'; }, 600);
        }
        setTimeout(hideInitialLoading, 8000);

        function buildPanelHTML(i) {
            var opts = WATCH_LIST.map(function (w) {
                return '<option value="' + w.ticker + '">' + w.ticker + ' (' + w.name + ')</option>';
            }).join('');

            return '<div class="panel" id="panel-' + i + '">'
                + '<div class="panel-overlay" id="overlay-' + i + '"><div class="po-spinner"></div><div class="po-msg" id="overlay-msg-' + i + '">종목 전환 중...</div></div>'
                + '<div class="ph">'
                + '<div class="ph-top">'
                + '<span class="ws-dot dead" id="p' + i + '-dot"></span>'
                + '<select class="ticker-select" id="ticker-select-' + i + '" onchange="onTickerSelectChange(' + i + ',this.value)">' + opts + '</select>'
                + '</div>'
                + '<div class="price-container">'
                + '<div class="price-block" id="p' + i + '-reg-block">'
                + '<span class="price-now" id="p' + i + '-price">─</span>'
                + '<span class="price-diff" id="p' + i + '-diff">─</span>'
                + '<span class="price-chg"  id="p' + i + '-chg">─</span>'
                + '<span class="vol-badge"  id="p' + i + '-vol">거래량: ─</span>'
                + '</div>'
                + '<div class="ext-block" id="p' + i + '-ext-block" style="display:none;">'
                + '<span class="ext-price" id="p' + i + '-ext-price">─</span>'
                + '<span class="ext-diff"  id="p' + i + '-ext-diff">─</span>'
                + '<span class="ext-chg"   id="p' + i + '-ext-chg">─</span>'
                + '</div>'
                + '</div>'
                + '</div>'
                + '<div class="strategy-box">'
                + '<div class="sb-header"><span class="sb-title" id="p' + i + '-sigtitle">🟡 방향성 탐색 (관망)</span><span class="sb-trend" id="p' + i + '-trend">대기중</span></div>'
                + '<div class="timeline" id="p' + i + '-timeline"></div>'
                + '</div>'
                + '<div class="oi-box">'
                + '<div class="oi-header">'
                + '<span class="oi-title"><span class="oi-dot" id="p' + i + '-oi-dot"></span><span id="p' + i + '-oi-title">─ 옵션 체인</span></span>'
                + '<span class="oi-dte" id="p' + i + '-dte">🗓️ 대기중</span>'
                + '</div>'
                + '<div class="oi-summary"><span id="p' + i + '-sum-power">수급 대기중</span><span id="p' + i + '-sum-env">지수 대기중</span></div>'
                + '<div class="oi-grid-header"><div style="text-align:right;padding-right:2px;">콜</div><div>OI/V</div><div>등락</div><div>행사가</div><div>등락</div><div>OI/V</div><div style="text-align:left;padding-left:2px;">풋</div></div>'
                + '<div id="p' + i + '-oi-rows"></div>'
                + '</div>'
                + '<div class="chart-wrapper">'
                + '<select class="chart-interval-select" id="interval-' + i + '" onchange="changeInterval(' + i + ',this.value)">'
                + '<option value="1">1분봉</option><option value="3" selected>3분봉</option><option value="5">5분봉</option><option value="15">15분봉</option><option value="60">1시간</option><option value="D">일봉</option>'
                + '</select>'
                + '<div class="chart-section" id="chart-' + i + '"></div>'
                + '</div>'
                + '</div>';
        }

        function initDashboard() {
            var grid = document.getElementById('dashboard-grid');
            grid.innerHTML = [0, 1, 2].map(buildPanelHTML).join('');

            [0, 1, 2].forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i);
                if (sel) sel.value = panelTickers[i];
                var intSel = document.getElementById('interval-' + i);
                if (intSel) intSel.value = panelIntervals[i] || '3';
            });
        }

        function buildWatchlist() {
            var list = document.getElementById('ticker-list');
            list.innerHTML = WATCH_LIST.map(function (w) {
                return '<div class="ticker-item" id="wl-' + w.ticker + '">'
                    + '<span style="font-weight:bold;min-width:44px;">' + w.ticker + '</span>'
                    + '<span style="font-size:10px;color:#666;">' + w.name + '</span>'
                    + '<span class="panel-badge" id="wl-badge-' + w.ticker + '" style="display:none;"></span>'
                    + '</div>';
            }).join('');
            refreshWatchlistBadges();
        }

        function refreshWatchlistBadges() {
            WATCH_LIST.forEach(function (w) {
                var badge = document.getElementById('wl-badge-' + w.ticker);
                var item = document.getElementById('wl-' + w.ticker);
                if (!badge || !item) return;
                var idx = panelTickers.indexOf(w.ticker);
                if (idx >= 0) {
                    badge.textContent = '패널' + (idx + 1);
                    badge.className = 'panel-badge p' + idx;
                    badge.style.display = '';
                    item.classList.add('active-panel');
                } else {
                    badge.style.display = 'none';
                    item.classList.remove('active-panel');
                }
            });
        }

        function onTickerSelectChange(panelIdx, newTicker) {
            var dupIdx = panelTickers.indexOf(newTicker);
            if (dupIdx >= 0 && dupIdx !== panelIdx) {
                alert('이미 패널' + (dupIdx + 1) + '에서 표시 중인 종목입니다.\n다른 종목을 선택해 주세요.');
                var sel = document.getElementById('ticker-select-' + panelIdx);
                if (sel) sel.value = panelTickers[panelIdx];
                return;
            }

            clearTimeout(switchTimers[panelIdx]);
            showPanelOverlay(panelIdx, newTicker + ' 데이터 수신 중...');

            switchTimers[panelIdx] = setTimeout(function () {
                executePanelSwitch(panelIdx, newTicker);
            }, 800);
        }

        function executePanelSwitch(panelIdx, newTicker) {
            if (panelDataStore['_timeout_' + panelIdx]) {
                clearTimeout(panelDataStore['_timeout_' + panelIdx]);
                panelDataStore['_timeout_' + panelIdx] = null;
            }

            panelTickers[panelIdx] = newTicker;
            saveLS(LS_PANELS, panelTickers);

            setSelectDisabled(panelIdx, true);
            switchLocked[panelIdx] = true;
            panelDataStore[panelIdx] = null;
            resetPanelUI(panelIdx, newTicker);

            subscribeFirebase(panelIdx, newTicker);

            currentChartTicker[panelIdx] = null;
            setTimeout(function () {
                updateChartWidget(panelIdx, newTicker);
            }, 200);

            var timeoutId = setTimeout(function () {
                if (!panelDataStore[panelIdx]) {
                    hidePanelOverlay(panelIdx);
                    setOiPending(panelIdx, newTicker);
                    setSelectDisabled(panelIdx, false);
                    switchLocked[panelIdx] = false;
                }
            }, 12000);

            panelDataStore['_timeout_' + panelIdx] = timeoutId;

            refreshWatchlistBadges();
            refreshAllDropdowns();

            try {
                if (typeof window.chrome !== 'undefined' && typeof window.chrome.webview !== 'undefined') {
                    window.chrome.webview.postMessage(JSON.stringify({
                        type: 'panelChange',
                        panels: panelTickers
                    }));
                }
            } catch (e) { }
        }

        function resetPanelUI(panelIdx, ticker) {
            var p = 'p' + panelIdx + '-';
            var fields = ['price', 'diff', 'chg', 'vol'];
            fields.forEach(function (f) { var el = document.getElementById(p + f); if (el) el.textContent = '─'; });
            var sig = document.getElementById(p + 'sigtitle'); if (sig) sig.textContent = '🟡 방향성 탐색 (관망)';
            var tr = document.getElementById(p + 'trend'); if (tr) tr.textContent = '대기중';
            var dte = document.getElementById(p + 'dte'); if (dte) dte.textContent = '🗓️ 대기중';
            var tl = document.getElementById(p + 'timeline'); if (tl) tl.innerHTML = '<div class="tl-track"></div>';
            var oit = document.getElementById(p + 'oi-title'); if (oit) oit.textContent = ticker + ' 옵션 체인';
            setOiPending(panelIdx, ticker);
        }

        function setOiPending(panelIdx, ticker) {
            var el = document.getElementById('p' + panelIdx + '-oi-rows');
            if (el) el.innerHTML = '<div class="oi-pending"><div class="oi-pending-spinner"></div><span>데이터 준비중...</span></div>';
            var sp = document.getElementById('p' + panelIdx + '-sum-power');
            if (sp) sp.innerHTML = '수급: <span style="color:#444;">데이터 준비중</span>';
        }

        function showPanelOverlay(panelIdx, msg) {
            var ov = document.getElementById('overlay-' + panelIdx); if (ov) ov.classList.add('active');
            var om = document.getElementById('overlay-msg-' + panelIdx); if (om) om.textContent = msg || '종목 전환 중...';
        }
        function hidePanelOverlay(panelIdx) {
            var ov = document.getElementById('overlay-' + panelIdx); if (ov) ov.classList.remove('active');
        }
        function setSelectDisabled(panelIdx, val) {
            var sel = document.getElementById('ticker-select-' + panelIdx); if (sel) sel.disabled = val;
            var isel = document.getElementById('interval-' + panelIdx); if (isel) isel.disabled = val;
        }

        function refreshAllDropdowns() {
            [0, 1, 2].forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i); if (!sel) return;
                var opts = sel.options;
                for (var k = 0; k < opts.length; k++) {
                    var t = opts[k].value;
                    var usedIdx = panelTickers.indexOf(t);
                    opts[k].disabled = (usedIdx >= 0 && usedIdx !== i);
                }
            });
        }

        /* ═══════════ Firebase 구독 ═══════════ */
        var FIREBASE_URL = 'https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/';
        var fbGen = { 0: 0, 1: 0, 2: 0 };

        function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_URL });
                [0, 1, 2].forEach(function (i) { subscribeFirebase(i, panelTickers[i]); });
            } catch (e) { }
        }

        function subscribeFirebase(panelIdx, ticker) {
            if (!ticker) return;
            unsubscribeFirebase(panelIdx);
            fbGen[panelIdx]++;
            var myGen = fbGen[panelIdx];

            try {
                if (!firebase.apps || !firebase.apps.length) {
                    initFirebase();
                    return;
                }

                var rtRef = firebase.database().ref('tickers/' + ticker + '/realtime');
                rtRef.on('value', function (snap) {
                    if (fbGen[panelIdx] !== myGen) return;
                    if (panelTickers[panelIdx] !== ticker) return;
                    var rtData = snap.val();
                    if (!rtData) return;

                    updatePanelPrice(
                        panelIdx,
                        rtData.price,
                        rtData.changeRate,
                        rtData.change,
                        rtData.volume
                    );
                });

                var panelRef = firebase.database().ref('tickers/' + ticker + '/panel');
                panelRef.on('value', function (snap) {
                    if (fbGen[panelIdx] !== myGen) return;
                    if (panelTickers[panelIdx] !== ticker) return;
                    var panelData = snap.val();
                    if (!panelData) return;

                    var p = JSON.parse(JSON.stringify(panelData));
                    p.ticker = ticker;
                    p.type = 'optionUpdate';
                    window.onWsMessage(p);
                });

                fbRefs[panelIdx] = { refs: [rtRef, panelRef], ticker: ticker, gen: myGen };
            } catch (e) { }
        }

        function unsubscribeFirebase(panelIdx) {
            try {
                if (fbRefs[panelIdx] && fbRefs[panelIdx].refs) {
                    fbRefs[panelIdx].refs.forEach(function (r) { r.off(); });
                }
            } catch (e) { }
            fbRefs[panelIdx] = null;
            fbGen[panelIdx]++;
        }

        window.onWsMessage = function (d) {
            if (!d || !d.type) return;

            // 1. 가벼운 텍스트 업데이트 (실시간 시세 버벅임 방지)
            if (d.type === 'fastPrice') {
                var panelIdx = panelTickers.indexOf(d.ticker);
                if (panelIdx >= 0) {
                    updatePanelPrice(panelIdx, d.price, d.change, d.priceDiff, d.volume);
                }
                return;
            }

            // 2. 무거운 화면 통째로 렌더링 (옵션 데이터 갱신 시)
            if (d.type === 'optionUpdate') {
                var ticker = d.ticker;
                if (ticker === undefined || ticker === null) return;

                var panel = panelTickers.indexOf(ticker);
                if (panel < 0) return;

                if (d.maxPain !== undefined && d.maxPain !== null) panelDataStore[panel] = JSON.parse(JSON.stringify(d));
                else { if (!panelDataStore[panel]) panelDataStore[panel] = {}; Object.assign(panelDataStore[panel], d); }

                if (panelDataStore['_timeout_' + panel]) { clearTimeout(panelDataStore['_timeout_' + panel]); panelDataStore['_timeout_' + panel] = null; }

                var dotEl = document.getElementById('p' + panel + '-oi-dot');
                if (dotEl && d.maxPain !== undefined && d.maxPain !== null) { dotEl.className = 'oi-dot flash'; setTimeout(function () { dotEl.className = 'oi-dot'; }, 900); }

                renderPanel(panel, panelDataStore[panel]);

                hidePanelOverlay(panel);
                setSelectDisabled(panel, false);
                switchLocked[panel] = false;
                if (panelDataStore['_timeout_' + panel]) {
                    clearTimeout(panelDataStore['_timeout_' + panel]);
                    panelDataStore['_timeout_' + panel] = null;
                }
            }
        };

        function updatePanelPrice(idx, price, changeRate, changeAmt, volume) {
            var p = 'p' + idx + '-';

            var numPrice = Number(String(price).replace(/[^0-9.-]+/g, "")) || 0;
            var numAmt = Number(String(changeAmt).replace(/[^0-9.-]+/g, "")) || 0;

            var cleanRateStr = String(changeRate || '0').replace('%', '').trim();
            var numRate = Number(cleanRateStr) || 0;

            var cls = numRate > 0 ? 'up' : numRate < 0 ? 'dn' : 'neu';

            var pxText = numPrice > 0 ? numPrice.toFixed(2) : '─';
            var dfText = numPrice > 0 ? (numAmt > 0 ? '+' : '') + numAmt.toFixed(2) : '─';
            var cgText = numPrice > 0 ? '(' + (numRate > 0 ? '+' : '') + numRate.toFixed(2) + '%)' : '─';

            var pxEl = document.getElementById(p + 'price');
            var dfEl = document.getElementById(p + 'diff');
            var cgEl = document.getElementById(p + 'chg');
            var volEl = document.getElementById(p + 'vol');

            if (pxEl) { pxEl.textContent = pxText; pxEl.className = 'price-now ' + cls; }
            if (dfEl) { dfEl.textContent = dfText; dfEl.className = 'price-diff ' + cls; }
            if (cgEl) { cgEl.textContent = cgText; cgEl.className = 'price-chg ' + cls; }
            if (volEl) { volEl.textContent = '거래량: ' + numberWithCommas(volume); }

            var dot = document.getElementById(p + 'dot'); if (dot) dot.className = 'ws-dot live';
        }

        function renderPanel(panel, d) {
            var p = 'p' + panel + '-';
            var price = d.price || 0;

            if (d.score !== undefined) {
                var sigEl = document.getElementById(p + 'sigtitle');
                if (sigEl) {
                    if (d.score >= 9.0) { sigEl.textContent = '극단적 과열 (차익실현 경계)'; sigEl.style.color = '#ff3333'; }
                    else if (d.score >= 7.5) { sigEl.textContent = '강한 상승 (추격매수 주의)'; sigEl.style.color = '#ff6666'; }
                    else if (d.score >= 5.6) { sigEl.textContent = '상승 추세 (콜 매수세 유입)'; sigEl.style.color = '#ffaaaa'; }
                    else if (d.score >= 4.5) { sigEl.textContent = '방향성 탐색 (수급 팽팽)'; sigEl.style.color = '#ddbb00'; }
                    else if (d.score >= 2.6) { sigEl.textContent = '하락 추세 (풋 매수세 유입)'; sigEl.style.color = '#88bbff'; }
                    else if (d.score >= 1.1) { sigEl.textContent = '강한 하락 (투매 동참 주의)'; sigEl.style.color = '#4488ff'; }
                    else { sigEl.textContent = '극단적 투매 (숏커버링 유의)'; sigEl.style.color = '#aa44ff'; }
                }
                var trEl = document.getElementById(p + 'trend'); if (trEl) trEl.innerHTML = d.trendText || '대기중';
            }

            if (d.maxPain > 0 && price > 0) renderTimeline(p, Object.assign({}, d, { price: price }));

            var dteEl = document.getElementById(p + 'dte'); if (dteEl && d.dteLabel) dteEl.textContent = '🗓️ ' + d.dteLabel;

            if (d.score !== undefined) {
                var spEl = document.getElementById(p + 'sum-power');
                if (spEl) {
                    var s = '';
                    if (d.score >= 9.0) s = '<b style="color:#ff3333;">숏 스퀴즈 절정</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 7.5) s = '<b style="color:#ff6666;">콜 매수 쏠림</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 5.6) s = '<b style="color:#ffaaaa;">상승 우위</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 4.5) s = '<b class="c-gold">보합 (중립)</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 2.6) s = '<b style="color:#88bbff;">하락 우위</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 1.1) s = '<b style="color:#4488ff;">풋 매수 쏠림</b> (' + d.score.toFixed(1) + '점)';
                    else s = '<b style="color:#aa44ff;">패닉셀 / 과매도</b> (' + d.score.toFixed(1) + '점)';
                    spEl.innerHTML = '수급: ' + s;
                }
            }
            updateEnvSummary(panel);

            if (d.optionRows && d.optionRows.length) {
                renderOiSafe(panel, d.optionRows, price || (d.maxPain || 100));
            } else setOiPending(panel, panelTickers[panel]);

            var chartTicker = d.ticker || panelTickers[panel];
            if (!currentChartTicker[panel] || currentChartTicker[panel] !== chartTicker) {
                currentChartTicker[panel] = chartTicker;
                updateChartWidget(panel, chartTicker);
            }

            hideInitialLoading();
        }

        function updateEnvSummary(i) {
            var el = document.getElementById('p' + i + '-sum-env'); if (!el) return;
            var qStr = globQqq === null ? '─' : globQqq > 0 ? '<b class="c-red">▲ 상승</b>' : globQqq < 0 ? '<b class="c-blue">▼ 하락</b>' : '<b>─</b>';
            var sStr = globSpy === null ? '─' : globSpy > 0 ? '<b class="c-red">▲ 상승</b>' : globSpy < 0 ? '<b class="c-blue">▼ 하락</b>' : '<b>─</b>';
            var vCol = globVixState.indexOf('공포') >= 0 ? 'c-red' : globVixState.indexOf('주의') >= 0 ? 'c-gold' : 'c-green';
            var vStr = globVix === null ? '─' : '<b class="' + vCol + '">' + globVixState + '</b>';
            el.innerHTML = '지수: QQQ ' + qStr + ' / SPY ' + sStr + ' / VIX ' + vStr;
        }

        function updateTimeDisplay() {
            var el = document.getElementById('h-time'); if (!el) return;
            var n = new Date();
            var days = ['일', '월', '화', '수', '목', '금', '토'];
            var ampm = n.getHours() >= 12 ? '오후' : '오전';
            var h = n.getHours() % 12 || 12;

            el.textContent = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0') + ' ' + ampm + ' ' + String(h).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0') + ':' + String(n.getSeconds()).padStart(2, '0');
        }
        setInterval(updateTimeDisplay, 1000);

        function renderTimeline(p, d) {
            var tl = document.getElementById(p + 'timeline'); if (!tl) return;
            var vals = [d.support2, d.support1, d.maxPain, d.price, d.resistance1, d.resistance2].filter(function (v) { return v > 0; });
            if (!vals.length) return;
            var isMobile = window.innerWidth <= 1200;
            var bots = [
                { val: d.support2, lbl: '2차 지지', c: 'c-red', bg: 'bg-red' },
                { val: d.support1, lbl: '1차 지지', c: 'c-red', bg: 'bg-red' },
                { val: d.maxPain, lbl: 'MaxPain', c: 'c-gold', bg: 'bg-gold' },
                { val: d.resistance1, lbl: '1차 저항', c: 'c-blue', bg: 'bg-blue' },
                { val: d.resistance2, lbl: '2차 저항', c: 'c-blue', bg: 'bg-blue' }
            ].filter(function (n) { return n.val > 0; });
            var tops = [{ val: d.price, lbl: '현재가', c: 'c-blue', bg: 'bg-blue', lg: true }].filter(function (n) { return n.val > 0; });
            var allNodes = bots.concat(tops); allNodes.sort(function (a, b) { return a.val - b.val; });
            if (isMobile && allNodes.length > 1) {
                var step = 88 / (allNodes.length - 1);
                allNodes.forEach(function (n, idx) { n.pos = 6 + (idx * step); });
                bots.forEach(function (bNode) { var f = allNodes.filter(function (an) { return an.val === bNode.val; })[0]; if (f) bNode.pos = f.pos; });
                tops.forEach(function (tNode) { var f = allNodes.filter(function (an) { return an.val === tNode.val; })[0]; if (f) tNode.pos = f.pos; });
            } else {
                var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), sp = mx - mn || 1;
                mn -= sp * 0.1; mx += sp * 0.1; sp = mx - mn;
                var gp = function (v) { return 6 + Math.max(0, Math.min(1, (v - mn) / sp)) * 88; };
                bots.forEach(function (n) { n.pos = gp(n.val); });
                tops.forEach(function (n) { n.pos = gp(n.val); });
            }
            var html = '<div class="tl-track"></div>';
            bots.forEach(function (n) { html += '<div class="node node-bottom" style="left:' + n.pos + '%"><div class="lbl-box"><span class="val ' + n.c + '">' + n.val.toFixed(1) + '</span><span class="lbl">' + n.lbl + '</span></div></div><div class="dot-tl dot-small ' + n.bg + '" style="left:' + n.pos + '%"></div>'; });
            tops.forEach(function (n) { html += '<div class="node node-top" style="left:' + n.pos + '%;z-index:20;"><div class="lbl-box"><span class="val ' + n.c + '">' + n.lbl + ' ' + n.val.toFixed(1) + '</span></div></div><div class="dot-triangle" style="left:' + n.pos + '%;"></div>'; });
            tl.innerHTML = html;
        }

        function renderOiSafe(panelIdx, rows, price) {
            var p = 'p' + panelIdx + '-';
            renderOiGrid(p, rows, price);
        }

        function renderOiGrid(p, rows, price) {
            var el = document.getElementById(p + 'oi-rows'); if (!el) return;
            var isMobile = el.closest('.panel') ? el.closest('.panel').offsetWidth <= 400 : window.innerWidth <= 1200;
            var mx = Math.max.apply(null, rows.map(function (r) { return Math.max(r.callOI + r.callVol, r.putOI + r.putVol, 1); }));
            var atm = rows.reduce(function (pv, cv) { return Math.abs(cv.strike - price) < Math.abs(pv.strike - price) ? cv : pv; }).strike;
            var fmt = function (v) { return v >= 1000 ? (v / 1000).toFixed(1) + 'K' : (v === 0 ? '-' : v); };

            hideInitialLoading();

            el.innerHTML = rows.map(function (r) {
                var cw = Math.max(1, ((r.callOI + r.callVol) / mx) * 100), pw = Math.max(1, ((r.putOI + r.putVol) / mx) * 100);
                var ia = r.strike === atm ? 'atm' : '';
                var cc = r.callChg > 0 ? 'up' : r.callChg < 0 ? 'dn' : 'neu', pc = r.putChg > 0 ? 'up' : r.putChg < 0 ? 'dn' : 'neu';
                var callVolText = isMobile ? fmt(r.callOI + r.callVol) : (fmt(r.callOI) + '/' + fmt(r.callVol));
                var putVolText = isMobile ? fmt(r.putOI + r.putVol) : (fmt(r.putOI) + '/' + fmt(r.putVol));
                var ct = (r.callChg > 0 ? '+' : '') + Math.round(r.callChg) + '%', pt = (r.putChg > 0 ? '+' : '') + Math.round(r.putChg) + '%';
                return '<div class="oi-row"><div class="oi-bar-wrap left"><div class="oi-bar call" style="width:' + cw + '%"></div></div><div class="oi-vol">' + callVolText + '</div><div class="' + cc + '">' + ct + '</div><div><span class="strike-box ' + ia + '">' + r.strike.toFixed(1) + '</span></div><div class="' + pc + '">' + pt + '</div><div class="oi-vol">' + putVolText + '</div><div class="oi-bar-wrap right"><div class="oi-bar put" style="width:' + pw + '%"></div></div></div>';
            }).join('');
        }

        var chartTimers = { 0: null, 1: null, 2: null };

        function updateChartWidget(panel, ticker) {
            if (!ticker) return;
            var containerId = 'chart-' + panel;
            var container = document.getElementById(containerId);
            if (!container) return;

            if (chartTimers[panel]) { clearTimeout(chartTimers[panel]); chartTimers[panel] = null; }
            container.innerHTML = '';

            chartTimers[panel] = setTimeout(function () {
                var currentInterval = panelIntervals[panel] || '3';
                if (panelTickers[panel] !== ticker) return;
                try {
                    new TradingView.widget({
                        autosize: true, symbol: ticker, interval: currentInterval,
                        theme: 'dark', style: '1',
                        hide_top_toolbar: true, hide_side_toolbar: true, hide_legend: true,
                        allow_symbol_change: false, save_image: false,
                        details: false, withdateranges: false,
                        container_id: containerId
                    });
                } catch (e) { }
            }, 300);
        }

        function changeInterval(panel, val) {
            panelIntervals[panel] = val;
            saveLS(LS_INTERVAL, panelIntervals);
            updateChartWidget(panel, panelTickers[panel]);
        }

        /* ═══════════ 파이어베이스 기반 상단 거시경제 지표 및 환율 리스너 ═══════════ */

        /* QQQ, SPY 스트리밍 (기존 야후 웹소켓 유지) */
        var HEADER_TICKERS = ['QQQ', 'SPY'];
        function getAllSubs() {
            var all = WATCH_LIST.map(function (w) { return w.ticker; }).concat(HEADER_TICKERS);
            all = all.map(function (t) { return t === 'SPX' ? '^SPX' : t; });
            var seen = {}, result = [];
            all.forEach(function (t) { if (!seen[t]) { seen[t] = true; result.push(t); } });
            return result;
        }

        (function initProto() {
            var P = 'syntax="proto3";message PricingData{string id=1;float price=2;sint64 time=3;string currency=4;string exchange=5;int32 quoteType=6;int32 marketHours=7;float changePercent=8;sint64 dayVolume=9;float dayHigh=10;float dayLow=11;float change=12;string shortName=13;sint64 expireDate=14;float openPrice=15;float previousClose=16;float strikePrice=17;string underlyingSymbol=18;sint64 openInterest=19;sint64 optionsType=20;sint64 miniOption=21;sint64 lastSize=22;float bid=23;sint64 bidSize=24;float ask=25;sint64 askSize=26;sint64 priceHint=27;sint64 vol_24hr=28;sint64 volAllCurrencies=29;string fromcurrency=30;string lastMarket=31;double circulatingSupply=32;double marketcap=33;}';
            try { var root = protobuf.parse(P).root; root.resolveAll(); PricingData = root.lookupType('PricingData'); } catch (e) { }
        })();

        var yahooWs = null;
        function yahooWsConnect() {
            try {
                yahooWs = new WebSocket('wss://streamer.finance.yahoo.com');
                yahooWs.binaryType = 'arraybuffer';
                yahooWs.onopen = function () {
                    yahooWs.send(JSON.stringify({ subscribe: getAllSubs() }));
                };
                yahooWs.onmessage = function (ev) {
                    if (!PricingData) return;
                    try {
                        var bytes;
                        if (ev.data instanceof ArrayBuffer) { bytes = new Uint8Array(ev.data); }
                        else { var bin = atob(ev.data); bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); }
                        var msg = PricingData.decode(bytes);

                        if (msg && msg.id && msg.price > 0) {
                            var ticker = msg.id;
                            var price = msg.price;
                            var prev = headerPrevClose[ticker] || msg.previousClose || 0;
                            headerPrevClose[ticker] = prev;
                            var chg = prev > 0 ? ((price - prev) / prev * 100) : msg.changePercent;

                            if (ticker === 'QQQ') {
                                globQqq = chg;
                                updateNeonItem('neon-qqq', '나스닥(QQQ)', price, chg);
                            } else if (ticker === 'SPY') {
                                globSpy = chg;
                                updateNeonItem('neon-spy', 'S&P500(SPY)', price, chg);
                            }

                            var hd = document.getElementById('ws-dot-header'); if (hd) hd.className = 'ws-dot live';
                            [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                        }
                    } catch (e) { }
                };
            } catch (e) { }
        }

        /* 서버(파이어베이스 system/macro)에서 거시지표 읽어오기 */
        function initMacroListener() {
            try {
                var macroRef = firebase.database().ref('system/macro');
                macroRef.on('value', function (snap) {
                    var data = snap.val();
                    if (!data) return;

                    // 일반 지표 업데이트
                    if (data.nq_f) updateNeonItem('neon-nq', '나스닥선물', data.nq_f.price, data.nq_f.changeRate);
                    if (data.cl_f) updateNeonItem('neon-cl', 'WTI원유', data.cl_f.price, data.cl_f.changeRate);
                    if (data.tnx) updateNeonItem('neon-tnx', '미국채10년', data.tnx.price, data.tnx.changeRate);
                    if (data.dxy) updateNeonItem('neon-dxy', '달러인덱스', data.dxy.price, data.dxy.changeRate);

                    // VIX 업데이트
                    if (data.vix) {
                        var vPrice = data.vix.price || 0;
                        var vState = data.vix.vixState || '안정';
                        var vCol = vState === '공포패닉' ? 'up' : vState === '불안' || vState === '주의' ? 'neon-vix-warn' : 'neu';

                        var vixEl = document.getElementById('neon-vix');
                        if (vixEl) {
                            vixEl.textContent = 'VIX ' + vPrice.toFixed(2) + ' [' + vState + ']';
                            vixEl.className = 'neon-item ' + vCol;
                        }
                        globVix = vPrice;
                        globVixState = vState;
                    }

                    // ★ 피어앤그리드 분리 업데이트
                    if (data.fearGreed) {
                        var fgScore = Math.round(data.fearGreed.score) || 0;
                        var fgRating = data.fearGreed.rating || 'Unknown';

                        // 한국어 등급 변환 (디자인 가독성 목적)
                        var ratingKr = fgRating.toLowerCase();
                        if (ratingKr.includes('extreme fear')) ratingKr = '극단적 공포';
                        else if (ratingKr.includes('fear')) ratingKr = '공포';
                        else if (ratingKr.includes('extreme greed')) ratingKr = '극단적 탐욕';
                        else if (ratingKr.includes('greed')) ratingKr = '탐욕';
                        else ratingKr = '중립';

                        // 점수에 따른 텍스트 색상 (공포일수록 붉은 계열, 탐욕일수록 푸른 계열)
                        var fgCol = fgScore <= 25 ? 'up' : (fgScore >= 75 ? 'dn' : (fgScore <= 45 ? 'neon-vix-warn' : 'neu'));

                        var fgEl = document.getElementById('neon-fg');
                        if (fgEl) {
                            fgEl.textContent = 'F&G ' + fgScore + ' [' + ratingKr + ']';
                            fgEl.className = 'neon-item ' + fgCol;
                        }
                    }

                    [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                });
            } catch (e) { console.error(e); }
        }

        /* 서버(파이어베이스 system/exchangeRate)에서 환율 읽어오기 */
        function initUsdKrwListener() {
            try {
                var krwRef = firebase.database().ref('system/exchangeRate');
                krwRef.on('value', function (snap) {
                    var data = snap.val();
                    var el = document.getElementById('neon-usdkrw');
                    if (el && data) {
                        var price = typeof data === 'object' ? (Number(data.price) || 0) : (Number(data) || 0);
                        var rateStr = typeof data === 'object' ? (data.changeRate || '0') : '0';
                        var rate = Number(String(rateStr).replace('%', '')) || 0;
                        var cls = rate > 0 ? 'up' : rate < 0 ? 'dn' : 'neu';

                        el.textContent = '원달러환율 ' + price.toFixed(2) + '원';
                        el.className = 'neon-item ' + cls;
                    }
                });
            } catch (e) { console.error(e); }
        }

        // 공통 업데이트 함수
        function updateNeonItem(elementId, labelName, price, changeRate) {
            var el = document.getElementById(elementId);
            if (!el) return;
            var p = Number(price) || 0;
            var chg = Number(changeRate) || 0;
            var sign = chg > 0 ? '+' : '';
            var cls = chg > 0 ? 'up' : chg < 0 ? 'dn' : 'neu';

            el.textContent = labelName + ' ' + p.toFixed(2) + ' (' + sign + chg.toFixed(2) + '%)';
            el.className = 'neon-item ' + cls;
        }

        /* ── 시작 ── */
        (function start() {
            initDashboard();
            buildWatchlist();
            refreshAllDropdowns();
            initFirebase();

            // 상단 바 관련 통신 3가지 동시 실행
            yahooWsConnect();       // QQQ, SPY
            initMacroListener();    // 선물, 원유, 국채, 달러, VIX, F&G
            initUsdKrwListener();   // 환율
        })();
    </script>
