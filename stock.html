<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic',sans-serif;
            background: #07070c;
            color: #ffffff;
            display: grid;
            grid-template-rows: 50px 1fr;
            grid-template-columns: 1fr 1fr 1fr;
            min-height: 100vh;
            min-width: 360px;
            overflow-x: auto;
            overflow-y: auto;
            gap: 0;
        }

        .top-bar {
            grid-column: 1/4;
            background: #12121e;
            border-bottom: 2px solid #2a2a3e;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            font-size: 15px;
        }

        .top-title {
            font-size: 18px;
            font-weight: bold;
            color: #7090ff;
            letter-spacing: 1px;
        }

        .idx-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .idx-label {
            color: #8899aa;
            font-weight: bold;
        }

        .idx-val {
            font-size: 15px;
            font-weight: bold;
        }

        .up {
            color: #ff5555;
        }

        .dn {
            color: #5599ff;
        }

        .neu {
            color: #aaaaaa;
        }

        .top-time-area {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #aaa;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 0 2px #000;
        }

            .live-dot.active {
                background: #00ff66;
                box-shadow: 0 0 8px #00ff66, 0 0 15px #00ff66;
                animation: blink 1.2s infinite ease-in-out;
            }

        @keyframes blink {
            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.3;
            }
        }

        .sess-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            margin-left: 4px;
        }

        .sess-open {
            background: #0a2a0a;
            color: #22dd44;
            border: 1px solid #226622;
        }

        .sess-closed {
            background: #222;
            color: #aaa;
            border: 1px solid #555;
        }

        .panel {
            border-right: 2px solid #1a1a2e;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
            gap: 8px;
            overflow: hidden;
        }

            .panel:last-child {
                border-right: none;
            }

        .ph {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-shrink: 0;
            background: #12121e;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
        }

        .ph-left {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .ticker {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .ticker-sub {
            font-size: 13px;
            color: #8899aa;
        }

        .ph-right {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .price-now {
            font-size: 24px;
            font-weight: bold;
        }

        .price-chg {
            font-size: 14px;
            font-weight: bold;
        }

        .sig-box {
            border-radius: 8px;
            padding: 8px 12px;
            flex-shrink: 0;
        }

            .sig-box.BUY {
                background: #0a2a0a;
                border: 2px solid #22aa44;
            }

            .sig-box.SELL {
                background: #2a0a0a;
                border: 2px solid #ff4444;
            }

            .sig-box.WAIT {
                background: #1e1e0a;
                border: 2px solid #aaaa22;
            }

        .sig-label {
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .sig-title {
            font-size: 16px;
            font-weight: bold;
        }

            .sig-title.BUY {
                color: #44ff66;
            }

            .sig-title.SELL {
                color: #ff6666;
            }

            .sig-title.WAIT {
                color: #ffff44;
            }

        .sig-prices {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .sig-price {
            flex: 1;
            text-align: center;
        }

        .sp-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 2px;
        }

        .sp-val {
            font-size: 16px;
            font-weight: bold;
        }

        .sp-entry {
            color: #44ff66;
        }

        .sp-target {
            color: #66aaff;
        }

        .sp-stop {
            color: #ff6666;
        }

        .mkt-row {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .mkt-badge {
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .mkt-sym {
            font-weight: normal;
            font-size: 11px;
            display: block;
            color: #ccc;
        }

        .mkt-badge.up {
            background: #1a0a0a;
            border: 1px solid #aa3333;
            color: #ff5555;
        }

        .mkt-badge.dn {
            background: #0a1a2a;
            border: 1px solid #3355aa;
            color: #5599ff;
        }

        .mkt-badge.neu {
            background: #222;
            border: 1px solid #555;
            color: #aaa;
        }

        .mid-container {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            height: 125px;
        }

        .vbar-section {
            flex: 0.95;
            background: #12121e;
            border-radius: 8px;
            padding: 8px 6px;
            position: relative;
            border: 1px solid #2a2a3e;
            display: flex;
        }

        .vtrack {
            width: 5px;
            background: #333;
            border-radius: 3px;
            position: relative;
            margin-left: 55px;
            height: 100%;
        }

        .vmarker {
            position: absolute;
            left: 60px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid #44aaff;
            transition: top 0.5s ease-out;
            transform: translateY(-6px);
            z-index: 10;
        }

        .vmarker-price {
            position: absolute;
            left: 2px;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: bold;
            color: #44aaff;
            z-index: 11;
            width: 48px;
            text-align: right;
        }

        .vlabels {
            flex: 1;
            position: relative;
            height: 100%;
        }
        /* 💡 수정: 가격(v-val)과 태그(v-tag)가 트랙 선과 조금 떨어지도록 여백 10px 부여 */
        .vlabel-item {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            transform: translateY(-50%);
            font-size: 11px;
            gap: 4px;
            padding-left: 10px;
        }

        .v-val {
            font-weight: bold;
            color: #fff;
            min-width: 38px;
        }

        .v-tag {
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 3px;
            font-size: 10px;
        }

            .v-tag.res {
                color: #ff6666;
            }

            .v-tag.sup {
                color: #66ff66;
            }

            .v-tag.pain {
                color: #ffff66;
            }

            .v-tag.stop {
                color: #ffaa44;
            }

        .reason-section {
            flex: 1.55;
            background: #12121e;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a3e;
        }

        .reason-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dte-badge {
            background: #aa33ff;
            color: #fff;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 11px;
        }

        .reason-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .reason-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
        }

        .rdot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 3px;
            flex-shrink: 0;
        }

            .rdot.bull {
                background: #44ff66;
            }

            .rdot.bear {
                background: #ff4444;
            }

            .rdot.neu {
                background: #ffff44;
            }

        .reason-val {
            color: #99aaff;
            font-weight: normal;
            margin-left: 2px;
        }

        .oi-section {
            flex-shrink: 0;
            height: 165px;
            background: #12121e;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a3e;
        }

        .oi-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-bottom: 4px;
            border-bottom: 1px solid #2a2a3e;
        }

        .oi-rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 2px;
        }

        /* 💡 수정: 호가창 완벽 대칭 구조로 그리드 재설계 (막대-거래량-등락률-행사가-등락률-거래량-막대) */
        .oi-row {
            display: grid;
            grid-template-columns: 1fr 40px 42px 50px 42px 40px 1fr;
            align-items: center;
            gap: 4px;
            font-size: 10px;
        }

        /* 💡 수정: 사이버펑크 네온 그라데이션 막대 디자인 */
        .oi-bar-wrap {
            display: flex;
            width: 100%;
            align-items: center;
        }

            .oi-bar-wrap.left {
                justify-content: flex-end;
            }

            .oi-bar-wrap.right {
                justify-content: flex-start;
            }

        .oi-bar.call {
            height: 10px;
            border-radius: 4px 0 0 4px;
            background: linear-gradient(90deg, rgba(255,68,68,0.1) 0%, #cc3333 100%);
        }

        .oi-bar.put {
            height: 10px;
            border-radius: 0 4px 4px 0;
            background: linear-gradient(270deg, rgba(68,136,255,0.1) 0%, #3366cc 100%);
        }

        /* 💡 수정: 중앙 가격(행사가) ATM 강조 디자인 */
        .oi-strike {
            text-align: center;
            font-weight: bold;
            color: #eee;
            font-size: 11px;
            padding: 2px 0;
        }

            .oi-strike.atm {
                color: #fff;
                background: #2a2a4a;
                border: 1px solid #555588;
                border-radius: 4px;
                box-shadow: 0 0 6px rgba(100, 150, 255, 0.3);
            }

        /* 💡 수정: 거래량은 차분하게, 등락률은 선명하게 (위계 분리) */
        .oi-vol {
            font-weight: normal;
            color: #999;
            font-size: 10px;
        }

            .oi-vol.call {
                text-align: right;
            }

            .oi-vol.put {
                text-align: left;
            }

        .oi-chg {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }

            .oi-chg.up {
                color: #ff6666;
            }

            .oi-chg.dn {
                color: #66aaff;
            }

            .oi-chg.neu {
                color: #888;
            }

        .chart-section {
            flex: 1;
            min-height: 140px;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            position: relative;
        }

            /* 💡 수정: 트레이딩뷰 위젯 내부 빈 공간(블랙홀)을 강제로 100% 꽉 채우는 마법의 치트키 */
            .chart-section iframe, .chart-section > div {
                height: 100% !important;
                min-height: 100% !important;
            }

        .iv-alert {
            background: #331a00;
            border: 1px solid #ff9900;
            border-radius: 6px;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #ffcc00;
            display: none;
            text-align: center;
            margin-bottom: 6px;
        }

            .iv-alert.show {
                display: block;
            }

        /* ========================================================
           모바일 최적화 (독립된 카드형 UI 적용)
        ======================================================== */
        @media screen and (max-width: 1100px) {
            body {
                display: flex;
                flex-direction: column;
                height: auto;
                background: #020204;
                padding: 10px;
                gap: 15px;
            }

            .top-bar {
                width: 100%;
                height: auto;
                min-height: 50px;
                flex-wrap: wrap;
                padding: 15px;
                border-radius: 12px;
                border: 1px solid #1a1a2e;
            }

            .panel {
                width: 100%;
                background: #0b0b14;
                border: 1px solid #2a2a3e;
                border-radius: 16px;
                padding: 18px 12px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            }

            .mid-container {
                flex-direction: column;
                height: auto;
            }

            .vbar-section {
                height: 80px;
                margin-bottom: 10px;
            }

            .oi-section {
                height: 190px;
            }

            .chart-section {
                /* 모바일에서 차트 높이 고정 (화면 비율에 맞춰 예쁘게 세팅) */
                height: 280px;
                min-height: 280px;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="top-title">OPTIONS DASHBOARD</span>
        <div class="idx-item"><span class="idx-label">QQQ</span><span class="idx-val neu" id="h-qqq">─</span></div>
        <div class="idx-item"><span class="idx-label">SPY</span><span class="idx-val neu" id="h-spy">─</span></div>
        <div class="idx-item"><span class="idx-label">DIA</span><span class="idx-val neu" id="h-dia">─</span></div>
        <span class="sess-badge sess-closed" id="h-sess">휴장</span>
        <div class="top-time-area">
            <div class="live-dot" id="live-indicator" title="데이터 수신 인디케이터"></div>
            <span id="h-time">연도-월-일 00:00:00 갱신</span>
        </div>
    </div>

    <script>
        document.write([0, 1, 2].map(i => `
                <div class="panel" id="panel-${i}">
                    <div class="ph">
                        <div class="ph-left">
                            <span class="ticker" id="p${i}-ticker">WAIT</span>
                            <span class="ticker-sub" id="p${i}-sub">대기중</span>
                        </div>
                        <div class="ph-right">
                            <div class="price-now neu" id="p${i}-price">─</div>
                            <div class="price-chg neu" id="p${i}-chg">─</div>
                        </div>
                    </div>

                    <div class="sig-box WAIT" id="p${i}-sigbox">
                        <div class="sig-label">매매 참고 신호 <span class="sess-badge sess-closed" id="p${i}-sess" style="padding:1px 6px; font-size:10px;">대기</span></div>
                        <div class="sig-title WAIT" id="p${i}-sigtitle">데이터 수신 대기</div>
                        <div class="sig-prices">
                            <div class="sig-price"><div class="sp-label">지지(진입)</div><div class="sp-val sp-entry" id="p${i}-entry">─</div></div>
                            <div class="sig-price"><div class="sp-label">저항(1차목표)</div><div class="sp-val sp-target" id="p${i}-target">─</div></div>
                            <div class="sig-price"><div class="sp-label">손절 기준</div><div class="sp-val sp-stop" id="p${i}-stop">─</div></div>
                        </div>
                    </div>

                    <div class="mkt-row">
                        <div class="mkt-badge neu" id="p${i}-qqq"><span class="mkt-sym">QQQ 흐름</span>─</div>
                        <div class="mkt-badge neu" id="p${i}-spy"><span class="mkt-sym">SPY 흐름</span>─</div>
                        <div class="mkt-badge neu" id="p${i}-hoga"><span class="mkt-sym">호가 잔량</span>─</div>
                        <div class="mkt-badge neu" id="p${i}-score"><span class="mkt-sym">종합 점수</span>─</div>
                    </div>

                    <div class="iv-alert" id="p${i}-ivalert">⚠ IV 급등 감지 — 신뢰도 낮음</div>

                    <div class="mid-container">
                        <div class="vbar-section">
                            <div class="vtrack"></div>
                            <div class="vmarker-price" id="p${i}-vprice">-$</div>
                            <div class="vmarker" id="p${i}-vmarker"></div>
                            <div class="vlabels" id="p${i}-vlabels"></div>
                        </div>

                        <div class="reason-section">
                            <div class="reason-title">판단 근거 <span class="dte-badge" id="p${i}-dte">만기 D-?</span></div>
                            <div class="reason-list" id="p${i}-reasons">수신 대기중...</div>
                        </div>
                    </div>

                    <div class="oi-section">
                        <div class="oi-title"><span>콜 (저항구간)</span><span id="p${i}-oi-status" style="font-size:13px;">수급 분석</span><span>풋 (지지구간)</span></div>
                        <div class="oi-rows" id="p${i}-oi">─</div>
                    </div>

                    <div class="chart-section" id="chart-${i}"></div>
                </div>`).join(''));
    </script>

    <script>
        const nameMap = { "TSLA": "테슬라", "NVDA": "엔비디아", "PLTR": "팔란티어", "AAPL": "애플", "MSFT": "마이크로소프트" };
        let lastMsgTime = 0;

        setInterval(() => {
            const dot = document.getElementById('live-indicator');
            if (dot && Date.now() - lastMsgTime > 15000) {
                dot.classList.remove('active');
            }
        }, 1000);

        window.onWsMessage = function (d) {
            if (!d || !d.type) return;
            lastMsgTime = Date.now();
            const dot = document.getElementById('live-indicator');
            if (dot) dot.classList.add('active');

            switch (d.type) {
                case 'optionUpdate': updatePanel(d.panel, d); break;
                case 'headerUpdate': updateHeader(d); break;
            }
        };

        function updateHeader(d) {
            function fmtIdx(v, el) {
                if (v === undefined || v === null) return;
                el.textContent = (v > 0 ? '+' : '') + v.toFixed(2) + '%';
                el.className = 'idx-val ' + (v > 0 ? 'up' : v < 0 ? 'dn' : 'neu');
            }
            fmtIdx(d.qqq, document.getElementById('h-qqq'));
            fmtIdx(d.spy, document.getElementById('h-spy'));
            fmtIdx(d.dia, document.getElementById('h-dia'));

            if (d.time) {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                document.getElementById('h-time').textContent = `${yyyy}-${mm}-${dd} ${d.time} 갱신`;
            }
        }

        function updatePanel(panel, d) {
            const p = 'p' + panel + '-';

            document.getElementById(p + 'ticker').textContent = d.ticker;
            document.getElementById(p + 'sub').textContent = nameMap[d.ticker] || '';

            const priceEl = document.getElementById(p + 'price');
            priceEl.textContent = '$' + d.price.toFixed(2);
            priceEl.className = 'price-now ' + (d.change > 0 ? 'up' : d.change < 0 ? 'dn' : 'neu');

            const chgEl = document.getElementById(p + 'chg');
            chgEl.textContent = (d.change > 0 ? '▲ +' : d.change < 0 ? '▼ ' : '') + d.change.toFixed(2) + '%';
            chgEl.className = 'price-chg ' + (d.change > 0 ? 'up' : d.change < 0 ? 'dn' : 'neu');

            const sessMap = { 'REG': ['정규장', 'sess-open'], 'PRE': ['프리마켓', 'sess-pre'], 'POST': ['애프터', 'sess-after'], 'CLOSED': ['휴장', 'sess-closed'] };
            let rawSess = d.sessionLabel || 'CLOSED';
            let isDteErr = d.dte < 0 && d.dte !== -999;

            const sigBox = document.getElementById(p + 'sigbox');
            const sigTitle = document.getElementById(p + 'sigtitle');
            const sig = d.signal || 'WAIT';
            sigBox.className = 'sig-box ' + (isDteErr ? 'WAIT' : sig);

            const sigMap = { 'BUY': '매수 유리 (롱 포지션)', 'SELL': '매도 압력 (숏 포지션)', 'WAIT': '방향성 탐색 (관망)' };
            sigTitle.textContent = isDteErr ? '만기 데이터 (매매 금지)' : sigMap[sig];
            sigTitle.className = 'sig-title ' + (isDteErr ? 'WAIT' : sig);

            const sessEl = document.getElementById(p + 'sess');
            sessEl.textContent = rawSess;
            if (isDteErr) { sessEl.style.background = '#882222'; sessEl.style.color = '#fff'; border = 'none'; }

            document.getElementById(p + 'entry').textContent = '$' + d.support.toFixed(1);
            document.getElementById(p + 'target').textContent = '$' + d.resistance.toFixed(1);
            document.getElementById(p + 'stop').textContent = '$' + d.stopLoss.toFixed(1);

            mktBadge(p + 'qqq', d.qqqChange, 'QQQ 흐름');
            mktBadge(p + 'spy', d.spyChange, 'SPY 흐름');

            const hogaEl = document.getElementById(p + 'hoga');
            hogaEl.className = 'mkt-badge ' + (d.imbalance > 0.1 ? 'up' : d.imbalance < -0.1 ? 'dn' : 'neu');
            hogaEl.innerHTML = `<span class="mkt-sym">호가 잔량</span>${d.imbalance > 0.1 ? '매수 우위' : d.imbalance < -0.1 ? '매도 우위' : '팽팽함'}`;

            const scoreEl = document.getElementById(p + 'score');
            scoreEl.className = 'mkt-badge ' + (d.score >= 7 ? 'up' : d.score <= 3 ? 'dn' : 'neu');
            scoreEl.innerHTML = `<span class="mkt-sym">종합 점수</span>${d.score.toFixed(1)}점`;

            const alertEl = document.getElementById(p + 'ivalert');
            if (alertEl) alertEl.className = 'iv-alert' + (d.ivAlert ? ' show' : '');

            const dteEl = document.getElementById(p + 'dte');
            if (d.dte !== undefined && d.dte !== -999) {
                if (d.dte < 0) { dteEl.textContent = `만기 지남 (D+${Math.abs(d.dte)})`; dteEl.style.background = '#ff2222'; dteEl.style.color = '#fff'; }
                else if (d.dte === 0) { dteEl.textContent = '만기 당일 (D-0)'; dteEl.style.background = '#ffaa00'; dteEl.style.color = '#000'; }
                else { dteEl.textContent = `만기 D-${d.dte}`; dteEl.style.background = '#aa33ff'; dteEl.style.color = '#fff'; }
            } else { dteEl.textContent = '만기 D-?'; }

            updateThermometer(p, d);
            updateReasons(p, d);
            if (d.optionRows && d.optionRows.length > 0) updateOI(p, d.optionRows, d.isMarketOpen, d.price);

            if (!window['tvTicker' + panel] || window['tvTicker' + panel] !== d.ticker) {
                window['tvTicker' + panel] = d.ticker;
                new TradingView.widget({
                    "autosize": true, "symbol": d.ticker, "interval": "3", "timezone": "exchange",
                    "theme": "dark", "style": "1", "locale": "kr", "enable_publishing": false,
                    "backgroundColor": "#07070c", "gridColor": "#1a1a2e", "hide_top_toolbar": true,
                    "hide_legend": false, "save_image": false, "container_id": "chart-" + panel,
                    "studies": ["VWAP@tv-basicstudies"]
                });
            }
        }

        function updateThermometer(p, d) {
            const vlabels = document.getElementById(p + 'vlabels');
            const vmarker = document.getElementById(p + 'vmarker');
            const vprice = document.getElementById(p + 'vprice');

            let allVals = [d.resistance, d.maxPain, d.support, d.stopLoss, d.price];
            let maxP = Math.max(...allVals) + 1;
            let minP = Math.min(...allVals) - 1;
            let span = maxP - minP;
            if (span <= 0) return;

            const getPos = val => Math.max(0, Math.min(100, 100 - ((val - minP) / span * 100)));

            let items = [
                { val: d.resistance, tag: 'res', label: '저항' },
                { val: d.maxPain, tag: 'pain', label: 'MaxPain' },
                { val: d.support, tag: 'sup', label: '지지' },
                { val: d.stopLoss, tag: 'stop', label: '손절' }
            ];

            items.forEach(item => item.pos = getPos(item.val));
            items.sort((a, b) => a.pos - b.pos);
            for (let i = 1; i < items.length; i++) {
                if (items[i].pos - items[i - 1].pos < 14) items[i].pos = items[i - 1].pos + 14;
            }

            let html = '';
            items.forEach(item => {
                html += `<div class="vlabel-item" style="top: ${item.pos}%;">
                                    <span class="v-val">$${item.val.toFixed(1)}</span>
                                    <span class="v-tag ${item.tag}">${item.label}</span>
                                 </div>`;
            });
            vlabels.innerHTML = html;

            let nowPos = getPos(d.price);
            vmarker.style.top = nowPos + '%';
            vprice.style.top = nowPos + '%';
            vprice.textContent = '$' + d.price.toFixed(1);

            if (d.price >= d.resistance) vmarker.style.borderLeftColor = '#ff4444';
            else if (d.price <= d.support) vmarker.style.borderLeftColor = '#44ff66';
            else vmarker.style.borderLeftColor = '#44aaff';
        }

        function updateReasons(p, d) {
            const el = document.getElementById(p + 'reasons');
            let rs = [];

            if (d.dte !== undefined && d.dte < 0 && d.dte !== -999) {
                rs.push({ c: 'bear', m: '<span style="color:#ff4444; font-size:12px;">⚠ 만기 지난 데이터 (매매 금지)</span>', v: `D+${Math.abs(d.dte)}` });
            }

            if (d.pcr < 0.7) rs.push({ c: 'bull', m: '콜 미결제약정 압도적 우세', v: 'PCR ' + d.pcr.toFixed(2) });
            else if (d.pcr < 0.9) rs.push({ c: 'bull', m: '콜 매수세 약간 우세', v: 'PCR ' + d.pcr.toFixed(2) });
            else if (d.pcr > 1.2) rs.push({ c: 'bear', m: '풋 미결제약정 압도적 우세', v: 'PCR ' + d.pcr.toFixed(2) });
            else if (d.pcr > 1.0) rs.push({ c: 'bear', m: '풋 매수세 약간 우세', v: 'PCR ' + d.pcr.toFixed(2) });

            let mp = d.price - d.maxPain;
            if (Math.abs(mp) < 2) rs.push({ c: 'neu', m: 'MaxPain(균형점) 횡보장세', v: '$' + d.maxPain.toFixed(1) });
            else if (mp > 0) rs.push({ c: 'bear', m: '균형점 대비 고평가 (하방압력)', v: '이격 +$' + mp.toFixed(1) });
            else rs.push({ c: 'bull', m: '균형점 대비 저평가 (상방여력)', v: '이격 -$' + Math.abs(mp).toFixed(1) });

            let mkt = (d.qqqChange > 0 ? 1 : -1) + (d.spyChange > 0 ? 1 : -1);
            if (mkt === 2) rs.push({ c: 'bull', m: '시장 지수(QQQ, SPY) 동반 상승세', v: '' });
            else if (mkt === -2) rs.push({ c: 'bear', m: '시장 지수(QQQ, SPY) 동반 하락세', v: '' });

            if (!d.isMarketOpen) rs.push({ c: 'neu', m: '장 마감 상태 (최종 OI 기준 분석)', v: '' });

            el.innerHTML = rs.map(r => `<div class="reason-item"><div class="rdot ${r.c}"></div>${r.m} <span class="reason-val">${r.v}</span></div>`).join('');
        }

        // 💡 수정: 호가창 완벽 대칭 재배치 (막대-수량-등락률-행사가-등락률-수량-막대) 및 네온 글로우 스타일
        function updateOI(p, rows, isMarketOpen, currentPrice) {
            const el = document.getElementById(p + 'oi');
            const statusEl = document.getElementById(p + 'oi-status');

            let sorted = rows.slice().sort((a, b) => (b.callOI + b.putOI) - (a.callOI + a.putOI))
                .slice(0, 8).sort((a, b) => b.strike - a.strike);

            let callPower = 0, putPower = 0;

            sorted.forEach(r => {
                if (isMarketOpen) {
                    callPower += r.callOI * (1 + (r.callChg / 100));
                    putPower += r.putOI * (1 + (r.putChg / 100));
                } else {
                    callPower += r.callOI;
                    putPower += r.putOI;
                }
            });

            let totalPower = callPower + putPower;
            if (totalPower > 0) {
                let callPct = (callPower / totalPower * 100).toFixed(0);
                let putPct = (putPower / totalPower * 100).toFixed(0);

                if (callPower > putPower) {
                    statusEl.innerHTML = `<span style="color:#ff6666; font-weight:bold; text-shadow: 0 0 5px rgba(255,100,100,0.4);">🔥 콜 우세 (${callPct}%)</span>`;
                } else {
                    statusEl.innerHTML = `<span style="color:#66aaff; font-weight:bold; text-shadow: 0 0 5px rgba(100,150,255,0.4);">🌊 풋 우세 (${putPct}%)</span>`;
                }
            } else {
                statusEl.textContent = '수급 우세 분석';
            }

            let maxOI = 0;
            sorted.forEach(r => { if (r.callOI > maxOI) maxOI = r.callOI; if (r.putOI > maxOI) maxOI = r.putOI; });
            let safeMax = maxOI > 0 ? maxOI : 1;
            let maxPx = 75;

            // ATM 판단을 위한 로직 (현재가와 가장 가까운 행사가 찾기)
            let atmStrike = sorted.reduce((prev, curr) => Math.abs(curr.strike - currentPrice) < Math.abs(prev.strike - currentPrice) ? curr : prev).strike;

            el.innerHTML = sorted.map(r => {
                let putW = Math.max(1, (r.putOI / safeMax) * maxPx);
                let callW = Math.max(1, (r.callOI / safeMax) * maxPx);
                let fmtK = v => v >= 1000 ? (v / 1000).toFixed(1) + 'K' : v.toFixed(0);

                let cCls = r.callChg > 0 ? 'up' : r.callChg < 0 ? 'dn' : 'neu';
                let pCls = r.putChg > 0 ? 'up' : r.putChg < 0 ? 'dn' : 'neu';
                let cTxt = (r.callChg > 0 ? '+' : '') + r.callChg.toFixed(1) + '%';
                let pTxt = (r.putChg > 0 ? '+' : '') + r.putChg.toFixed(1) + '%';

                // ATM 라인 시각적 강조
                let isAtm = r.strike === atmStrike;
                let strikeClass = isAtm ? 'oi-strike atm' : 'oi-strike';

                return `<div class="oi-row">
                            <div class="oi-bar-wrap left"><div class="oi-bar call" style="width:${callW}px;"></div></div>
                            <div class="oi-vol call">${fmtK(r.callOI)}</div>
                            <div class="oi-chg ${cCls}">${cTxt}</div>
                            <div class="${strikeClass}">${r.strike.toFixed(1)}</div>
                            <div class="oi-chg ${pCls}">${pTxt}</div>
                            <div class="oi-vol put">${fmtK(r.putOI)}</div>
                            <div class="oi-bar-wrap right"><div class="oi-bar put" style="width:${putW}px;"></div></div>
                        </div>`;
            }).join('');
        }

        function mktBadge(id, val, label) {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = 'mkt-badge ' + (val > 0.1 ? 'up' : val < -0.1 ? 'dn' : 'neu');
            el.innerHTML = `<span class="mkt-sym">${label}</span>${val > 0 ? '+' : ''}${val.toFixed(2)}%`;
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const isWebView = window.chrome && window.chrome.webview;

        if (!isWebView) {
            console.log("외부 브라우저 접속 확인: 파이어베이스 실시간 수신을 시작합니다.");
            db.ref('tickers').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                Object.keys(data).forEach(ticker => {
                    const item = data[ticker];
                    if (item.header) window.onWsMessage(item.header);
                    if (item.panel) window.onWsMessage(item.panel);
                });
            });
        }
    </script>
