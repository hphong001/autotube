    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }

        #initial-loading {
            position: fixed;
            inset: 0;
            background: #07070c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

            #initial-loading.fade-out {
                opacity: 0;
                pointer-events: none;
            }

        .il-logo {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .il-strike {
            font-size: 36px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
        }

        .il-zone {
            font-size: 36px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
        }

        .il-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        .il-msg {
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
        }

        .panel-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,12,0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 8px;
            flex-direction: column;
            gap: 12px;
        }

            .panel-overlay.active {
                display: flex;
            }

        .po-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .po-msg {
            font-size: 12px;
            color: #888;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes tlPulse {
            0%,100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes tlPulseBorder {
            0%,100% {
                box-shadow: 0 0 6px rgba(255,204,0,0.4);
            }

            50% {
                box-shadow: 0 0 18px rgba(255,204,0,1.0);
            }
        }

        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 6px 0;
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 1400px;
        }

        .sep {
            color: #1a1a30;
            padding: 0 2px;
        }

        .neon-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
        }

            .neon-item .tit {
                font-size: 12px;
                color: #8b949e;
                font-weight: normal;
            }

            .neon-item .val {
                font-size: 13px;
                font-weight: bold;
                color: #ccc;
            }

                .neon-item .val.up {
                    color: #ff4444;
                    text-shadow: 0 0 6px rgba(255,68,68,0.3);
                }

                .neon-item .val.dn {
                    color: #4488ff;
                    text-shadow: 0 0 6px rgba(68,136,255,0.3);
                }

                .neon-item .val.warn {
                    color: #ffcc00;
                    text-shadow: 0 0 6px rgba(255,204,0,0.3);
                }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-time {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

            .ws-dot.live {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: np 2s ease-in-out infinite;
            }

            .ws-dot.kiwoom {
                background: #ff4444;
                box-shadow: 0 0 8px #ff4444;
                animation: np 2s ease-in-out infinite;
            }

            .ws-dot.dead {
                background: #1a1a2a;
                box-shadow: none;
                animation: none;
            }

        @keyframes np {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* 패널 status dot — 키움(빨강) / 야후(파랑) 부드러운 펄스 */
        .dot-red {
            background: #ff4444 !important;
            box-shadow: 0 0 8px #ff4444 !important;
            animation: np 2s ease-in-out infinite !important;
        }

        .dot-blue {
            background: #00aaff !important;
            box-shadow: 0 0 8px #00aaff !important;
            animation: np 2s ease-in-out infinite !important;
        }

            /* 데이터 지연(10초 이상 미수신): 같은 색, 흐리게, 깜빡임 없음 */
            .dot-red.dot-stale,
            .dot-blue.dot-stale,
            .ws-dot.stale {
                opacity: 0.35 !important;
                box-shadow: none !important;
                animation: none !important;
            }


        /* ★ 추가: blinkDot 키프레임 (JS에서 animation 이름으로 참조됨) */
        @keyframes blinkDot {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0.15;
            }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

            .oi-dot.flash {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: oiF 0.4s ease-in-out 2;
            }

        @keyframes oiF {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.05;
            }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            gap: 8px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
            position: relative;
        }

            .panel:last-child {
                border-right: none;
            }

        .ph {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            gap: 8px;
        }

        .ph-top {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            height: 30px;
        }

        .ticker-select-wrap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-select {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            background: #0b0b14;
            border: 1px solid #2a2a3e;
            border-radius: 5px;
            padding: 2px 10px;
            cursor: pointer;
            outline: none;
            width: 160px;
        }

            .ticker-select:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .ticker-select option {
                background: #0d0d1a;
                color: #fff;
                font-size: 13px;
            }

        .price-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
            justify-content: center;
        }

        .price-now {
            font-size: 20px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-diff {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-chg {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        /* ★ 장외 시간 2줄 표시: 1줄 = 정규장 종가, 2줄 = 프리/애프터/오버나이트 현재가 */
        .reg-label {
            font-size: 11px;
            color: #8899aa;
            white-space: nowrap;
        }

        .price-ext {
            flex-basis: 100%;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .price-ext .ext-px {
            font-size: 17px;
            font-weight: bold;
            white-space: nowrap;
        }

        .price-ext .ext-diff, .price-ext .ext-chg {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .price-ext .ext-label {
            font-size: 11px;
            color: #99aacc;
            white-space: nowrap;
        }

        .vol-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1a2238;
            color: #77aaee;
            border: 1px solid #2a3a5e;
            white-space: nowrap;
            margin-left: 10px;
        }

        .up {
            color: #ff4444 !important;
        }

        .dn {
            color: #4488ff !important;
        }

        .neu {
            color: #aaa !important;
        }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            padding: 8px 12px;
            background: #0d0d1f;
            border-radius: 6px;
            border-left: 3px solid #ddbb00;
            margin-bottom: 6px;
            text-align: center;
            border-left: none;
            border: 1px solid #2a2a4a;
            box-shadow: inset 0 0 20px rgba(255,221,0,0.04);
        }

        .sb-line1 {
            font-size: 13px;
            font-weight: 900;
            color: #ffdd00;
            margin-bottom: 4px;
        }

        .sb-line2 {
            font-size: 13px;
            font-weight: 700;
            color: #ffdd00;
            margin-bottom: 4px;
        }

        .sb-line3 {
            font-size: 13px;
            font-weight: 700;
            color: #ffdd00;
        }

        .timeline {
            position: relative;
            width: 100%;
        }

        /* ★ 분석 문구 줄바꿈 정리: 단어·항목 단위로만 줄바꿈 */
        .strategy-box { word-break: keep-all; overflow-wrap: break-word; }
        .nw { white-space: nowrap; }
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: baseline;
            row-gap: 2px;
        }
        .chips { column-gap: 14px; }                         /* 구분선 대신 간격 → 줄 머리에 구분자가 남지 않음 */
        .chips .chip { white-space: nowrap; }
        .plan-line { color: #ccc; margin-top: 3px; }

        /* ★ 시세 영역: 가격 묶음 / 거래량·종가시각 묶음 단위로만 줄바꿈 */
        .px-group { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
        .meta-group { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .meta-group .vol-badge { margin-left: 0; }

        .c-red {
            color: #ff4444;
        }

        .bg-red {
            background: #ff4444;
        }

        .c-green {
            color: #44ff66;
        }

        .bg-green {
            background: #44ff66;
        }

        .c-blue {
            color: #4488ff;
        }

        .bg-blue {
            background: #4488ff;
        }

        .c-gold {
            color: #ffcc00;
        }

        .bg-gold {
            background: #ffcc00;
        }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 8px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .oi-title {
            font-size: 13px;
            font-weight: bold;
            color: #7799dd;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .oi-dte {
            background: rgba(243, 156, 18, 0.1);
            color: #f39c12;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: #bbb;
            border-bottom: 1px solid #2a2a3e;
            padding: 5px 0 6px;
            margin-bottom: 8px;
            background: #0f0f1a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            font-size: 10px;
            color: #fff;
            margin-bottom: 4px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            align-items: center;
            gap: 1px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 2px;
        }

        .oi-bar-wrap {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 0 3px;
        }

            .oi-bar-wrap.left {
                justify-content: flex-end;
            }

            .oi-bar-wrap.right {
                justify-content: flex-start;
            }

        .oi-bar.call {
            height: 6px;
            border-radius: 2px 0 0 2px;
            background: #cc3333;
        }

        .oi-bar.put {
            height: 6px;
            border-radius: 0 2px 2px 0;
            background: #3366cc;
        }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 1px 0;
            border-radius: 3px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 11px;
        }

            .strike-box.atm {
                background: #ffcc00;
                color: #000;
                box-shadow: 0 0 4px #ffcc00;
            }

        .oi-vol {
            font-size: 9.5px;
            color: #eee;
            white-space: nowrap;
            font-weight: bold;
        }

        .oi-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            color: #444;
            font-size: 12px;
            gap: 8px;
        }

        .oi-pending-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #222;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .chart-wrapper {
            flex: 1;
            min-height: 220px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section {
            width: 100%;
            height: 100%;
        }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15,15,25,0.85);
            color: #ffcc00;
            border: 1px solid rgba(255,204,0,0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

            .chart-interval-select option {
                background: #0b0b14;
                color: #fff;
            }

        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }

            .sidebar::-webkit-scrollbar {
                display: none;
            }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name {
            display: flex;
            align-items: baseline;

        }

            font-size: 30px;

        }

        .sl-zone {

            .ticker-item:hover {

            }

            .ticker-item.active-panel {
                color: #ffcc00;
            }

            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            background: #1a2a3e;
            color: #4488ff;

        }

            .panel-badge.p0 {
                background: #2a1a1a;

            }

            .panel-badge.p1 {

    <script>
        var WATCH_LIST = [
            { ticker: 'TSLA', name: '테슬라' }, { ticker: 'NVDA', name: '엔비디아' },
            { ticker: 'PLTR', name: '팔란티어' }, { ticker: 'SPY', name: 'S&P 500 ETF' },
            { ticker: 'QQQ', name: '나스닥 100 ETF' }, { ticker: 'AAPL', name: '애플' },
            { ticker: 'AMZN', name: '아마존' }, { ticker: 'META', name: '메타' },
            { ticker: 'MU', name: '마이크론 테크' }, { ticker: 'MSTR', name: '마이크로스트래티지' },
            { ticker: 'AMD', name: '에이엠디' }, { ticker: 'IWM', name: '러셀 2000 ETF' },
            { ticker: 'COIN', name: '코인베이스' }, { ticker: 'SPX', name: 'S&P 500 지수옵션' }
        ];

        // ════════════════════════════════════════════════════════
        // ★ 콤보박스/관심종목 목록 = 서버(Firebase tickers)에 등록된 종목
        //   - 위 WATCH_LIST 는 서버 목록을 받기 전·실패 시에만 쓰는 초기값
        //   - 한글 이름: system/symbolNames (C#이 기록하면 우선 사용) → 아래 기본 이름표 → 티커
        //   - 콤보박스 순서: 아래 이름표 순서, 이름표에 없는 종목은 뒤에 알파벳순
        // ════════════════════════════════════════════════════════
        var TICKER_NAMES = {
            'TSLA': '테슬라',
            'NVDA': '엔비디아',
            'PLTR': '팔란티어',
            'AAPL': '애플',
            'AMD': 'AMD',
            'AMZN': '아마존닷컴',
            'MU': '마이크론 테크놀로지',
            'META': '메타 플랫폼스',
            'MSFT': '마이크로소프트',
            'AVGO': '브로드컴',
            'GOOGL': '알파벳 A',
            'MSTR': '마이크로스트레티지',
            'COIN': '코인베이스',
            'IBIT': '블랙록 비트코인 ETF',
            'GDX': '금광주 ETF',
            'GLD': '금 현물 ETF',
            'TSM': 'TSMC(ADR)',
            'SKHY': 'SK하이닉스(ADR)',
            'SPCX': '스페이스X',
            'LLY': '일라이 릴리',
            'JPM': '제이피모간 체이스',
            'WMT': '월마트',
            'GOOG': '알파벳 C',
            'IWM': '러셀2000 ETF',
            'IVV': 'S&P 500 코어 아이셰어즈 ETF',
            'SPX': 'S&P 500 지수옵션',
            'QQQ': '나스닥100(QQQ)',
            'SPY': 'S&P500(SPY)',
            'DIA': '다우(DIA)',
            'SQQQ': '나스닥 3배 인버스',
            'TQQQ': '나스닥 3배 레버리지',
            'SOXX': '반도체 섹터',
            'XLK': '기술주 섹터',
            'XLF': '금융주 섹터',
            'XLE': '에너지 섹터',
            'XLV': '헬스케어 섹터',
            'XLI': '산업재 섹터',
            'XLY': '임의소비재 섹터',
            'XLP': '필수소비재 섹터',
            'XLB': '소재 섹터',
            'IBB': '바이오테크 섹터',
            'TLT': '미국 20년 국채 ETF',
            'UUP': '달러 인덱스 ETF',
            'FXI': '중국 대형주 ETF',
            'MARA': '비트코인 채굴(MARA)',
            'RIOT': '비트코인 채굴(RIOT)',
            'USO': 'WTI 원유 ETF',
            'IAU': '금 현물 ETF(IAU)'
        };
        // ★ system/symbolList : 윈폼(C#)이 코드 순서대로 기록한 [{cd, nm}, ...]
        //   → 콤보박스 순서와 한글 이름은 이 목록을 그대로 따름
        var serverSymbolOrder = [];   // ['SQQQ','TQQQ', ...] (윈폼 코드 순서)
        var serverTickerNames = {};   // { SQQQ:'나스닥 3배 인버스', ... }

        function tickerName(t) { return serverTickerNames[t] || TICKER_NAMES[t] || t; }

        function orderTickers(list) {
            // 윈폼 순서가 있으면 그 순서, 없으면 기본 이름표 순서. 둘 다 없는 종목은 뒤에 알파벳순
            var order = serverSymbolOrder.length ? serverSymbolOrder : Object.keys(TICKER_NAMES);
            return list.slice().sort(function (a, b) {
                var ia = order.indexOf(a), ib = order.indexOf(b);
                if (ia < 0 && ib < 0) return a < b ? -1 : a > b ? 1 : 0;
                if (ia < 0) return 1;
                if (ib < 0) return -1;
                return ia - ib;
            });
        }

        // 서버 종목 목록으로 콤보박스 3개 + 관심종목 사이드바 다시 만들기
        function applyTickerList(list) {
            var ordered = orderTickers(list);
            // 현재 패널에 떠 있는 종목이 목록에 없으면 선택이 깨지지 않도록 유지
            panelTickers.forEach(function (t) { if (t && ordered.indexOf(t) < 0) ordered.push(t); });
            var newWatch = ordered.map(function (t) { return { ticker: t, name: tickerName(t) }; });
            if (JSON.stringify(newWatch) === JSON.stringify(WATCH_LIST)) return; // 변화 없음
            WATCH_LIST = newWatch;

            var opts = WATCH_LIST.map(function (w) { return '<option value="' + w.ticker + '">' + w.ticker + ' (' + w.name + ')</option>'; }).join('');
            [0, 1, 2].forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i);
                if (!sel) return;
                sel.innerHTML = opts;
                sel.value = panelTickers[i];
            });
            buildWatchlist();
            refreshAllDropdowns();
            console.log('[종목] 콤보박스 갱신: ' + WATCH_LIST.length + '종목');
        }

        function loadServerTickerNames() {
            try {
                return firebase.database().ref('system/symbolList').once('value').then(function (snap) {
                    var v = snap.val();
                    if (!v || typeof v !== 'object') return;
                    // 배열로 오거나 {"0":{..},"1":{..}} 형태로 올 수 있음 → 번호 순으로 정리
                    var items = Array.isArray(v) ? v : Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; });
                    var order = [], names = {};
                    items.forEach(function (it) {
                        if (!it || !it.cd || names.hasOwnProperty(it.cd)) return;
                        order.push(it.cd);
                        names[it.cd] = it.nm || it.cd;
                    });
                    if (order.length) { serverSymbolOrder = order; serverTickerNames = names; }
                }).catch(function () { });
            } catch (e) { return Promise.resolve(); }
        }

        var DEFAULT_PANELS = ['TSLA', 'NVDA', 'PLTR'];
        var LS_PANELS = 'sz_panels';
        var LS_INTERVAL = 'sz_interval';

        var panelTickers = loadLS(LS_PANELS, DEFAULT_PANELS);
        var panelIntervals = loadLS(LS_INTERVAL, { 0: '3', 1: '3', 2: '3' });

        var panelDataStore = {};
        var fbRefs = {};
        var PricingData = null;

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';
        var currentChartTicker = { 0: null, 1: null, 2: null };
        var initialLoadDone = false;
        var switchTimers = { 0: null, 1: null, 2: null };
        var switchLocked = { 0: false, 1: false, 2: false };

        function loadLS(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }
        function numberWithCommas(x) {
            if (x === null || x === undefined || x === '') return '─';
            var n = Number(String(x).replace(/,/g, ''));
            if (isNaN(n) || n <= 0) return '─';
            return n.toLocaleString('en-US');
        }

        // ════════════════════════════════════════════════════════
        // ★ 상태 dot 블링킹 함수
        //   panelIdx : 패널 번호 (0,1,2)
        //   color    : '#ff4444' (키움/빨강) 또는 '#00aaff' (야후/파랑)
        //   0.7초 동안 켜졌다가 자동으로 꺼짐 (write 이벤트마다 한 번씩 점등)
        // ════════════════════════════════════════════════════════
        // 현재 패널 dot 상태 추적 (QQQ 헤더와 동일: 상태가 유지되는 동안 계속 켜짐)
        var _dotState = { 0: null, 1: null, 2: null }; // null | 'red' | 'blue'

        function setDotState(panelIdx, state) {
            // state: 'red' | 'blue' | 'red-stale' | 'blue-stale' | null(소등)
            var dotEl = document.getElementById('p' + panelIdx + '-status-dot');
            if (!dotEl) return;
            if (_dotState[panelIdx] === state) return; // 이미 같은 상태면 무시
            _dotState[panelIdx] = state;
            dotEl.classList.remove('dot-red', 'dot-blue', 'dot-stale');
            dotEl.style.removeProperty('background-color');
            dotEl.style.removeProperty('box-shadow');
            dotEl.style.removeProperty('opacity');
            void dotEl.offsetWidth; // reflow
            if (state && state.indexOf('red') === 0) dotEl.classList.add('dot-red');
            else if (state && state.indexOf('blue') === 0) dotEl.classList.add('dot-blue');
            if (state && state.indexOf('-stale') > 0) dotEl.classList.add('dot-stale');
        }

        // blinkDot은 하위 호환용으로 유지 — 색만 전달하면 됨
        function blinkDot(panelIdx, color) {
            var state = (color === '#ff4444' || color === 'red') ? 'red' : 'blue';
            setDotState(panelIdx, state);
        }

        // ──────────────────────────────────────────────────────────
        // ★ [PRO 버전] 아이콘 없음 + VWAP 중복 수정 + 매크로 종합 시황 추가
        // ──────────────────────────────────────────────────────────
        // ════════════════════════════════════════════════════════
        // ★ 실시간 단타 엔진 (틱 버퍼 → 모멘텀·거래량·VWAP·레벨 이벤트)
        //   - VWAP: 키움 연결 시 C#이 체결 단위로 계산한 값(realtime.vwap) 사용
        //           야후 시세일 때는 페이지를 연 뒤 수집한 값으로 자체 계산
        //   - VWAP 세션 기준(ET): 20:00~ / 04:00~ / 09:30~ (C# VwapAnchorEt 와 동일)
        // ════════════════════════════════════════════════════════
        var RT = {};                       // 패널별 실시간 상태
        var RT_KEEP_MS = 15 * 60 * 1000;   // 틱 15분 보관
        var RT_ZONE = 0.15;                // 레벨 "터치" 판정 거리(%)
        var RT_AWAY = 0.30;                // 레벨에서 "벗어남" 판정 거리(%)
        var RT_CROSS = 0.10;               // 돌파/이탈 확정 거리(%)

        function rtState(idx) {
            var tk = panelTickers[idx], s = RT[idx];
            if (!s || s.ticker !== tk) {
                s = RT[idx] = { ticker: tk, ticks: [], pv: 0, vol: 0, lastCum: 0, levels: {}, events: [],
                                src: '', extVwap: 0, sessKey: '' };
            }
            return s;
        }

        // 시세가 들어올 때마다 호출 (applyPanelQuote 안에서)
        // 현재 ET 시각 기준 VWAP 세션 키 (20:00~ / 04:00~ / 09:30~)
        function rtSessKey() {
            var et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            var m = et.getHours() * 60 + et.getMinutes();
            var d = new Date(et.getFullYear(), et.getMonth(), et.getDate());
            if (m < 240) { d.setDate(d.getDate() - 1); return d.toDateString() + ' 20'; }
            return d.toDateString() + (m >= 1200 ? ' 20' : m >= 570 ? ' 0930' : ' 04');
        }

        function rtTick(idx, price, cumVol, src, extVwap) {
            if (!(price > 0)) return;
            var s = rtState(idx), now = Date.now();

            // 소스(키움↔야후)가 바뀌면 누적거래량 기준이 달라지므로 거래량 기준점 초기화
            if (src && s.src !== src) {
                s.src = src; s.lastCum = 0; s.pv = 0; s.vol = 0;
                s.ticks.forEach(function (tk) { tk.cv = 0; });
            }
            // C#이 계산한 정확한 VWAP (키움 소스일 때만)
            s.extVwap = (src === 'kiwoom' && extVwap > 0) ? extVwap : 0;

            // ── 자체 VWAP (야후 대체용): 세션이 바뀌면 초기화 ──
            var key = rtSessKey();
            if (s.sessKey !== key) { s.sessKey = key; s.pv = 0; s.vol = 0; s.lastCum = 0; }
            if (cumVol > 0) {
                if (s.lastCum > 0 && cumVol < s.lastCum) { s.pv = 0; s.vol = 0; }      // 누적거래량 리셋
                if (s.lastCum > 0 && cumVol > s.lastCum) {
                    var dv = cumVol - s.lastCum; s.pv += dv * price; s.vol += dv;
                }
                s.lastCum = cumVol;
            }

            s.ticks.push({ t: now, p: price, cv: cumVol || 0 });
            while (s.ticks.length && now - s.ticks[0].t > RT_KEEP_MS) s.ticks.shift();

            var d = panelDataStore[idx];
            if (d) {
                rtLevel(s, 'S1', '1차지지', d.support1, price, now, 'sup');
                rtLevel(s, 'S2', '2차지지', d.support2, price, now, 'sup');
                rtLevel(s, 'R1', '1차저항', d.resistance1, price, now, 'res');
                rtLevel(s, 'R2', '2차저항', d.resistance2, price, now, 'res');
                rtLevel(s, 'MP', 'MaxPain', d.maxPain, price, now, 'mag');
                var vw = rtVwap(s);
                if (vw) rtLevel(s, 'VW', 'VWAP', Math.round(vw * 100) / 100, price, now, 'vwap');
            }
            paperOnTick(s.ticker, price);   // ★ 가상매매 체결·청산 판정
        }

        // ── 레벨별 터치 횟수 / 돌파·이탈·재탈환 이벤트 ──
        function rtLevel(s, key, name, lv, price, now, kind) {
            if (!(lv > 0)) return;
            var L = s.levels[key];
            // VWAP은 계속 움직이므로 값이 바뀌어도 상태 유지
            if (!L || (kind !== 'vwap' && L.lv !== lv)) {
                L = s.levels[key] = { lv: lv, touches: 0, far: true, side: price >= lv ? 1 : -1, since: now, zoneSince: 0 };
            }
            // VWAP 값이 한 번에 0.2% 넘게 바뀌면(데이터 소스 전환·초기화) 가격 교차가 아니므로 이벤트 없이 기준만 갱신
            if (kind === 'vwap' && L.lv > 0 && Math.abs(lv - L.lv) / L.lv * 100 > 0.2) {
                L.side = price >= lv ? 1 : -1; L.far = true; L.zoneSince = 0;
            }
            L.lv = lv;
            var dist = (price - lv) / lv * 100;

            // 터치 카운트 (벗어났다가 다시 붙을 때 1회)
            if (Math.abs(dist) > RT_AWAY) { L.far = true; L.zoneSince = 0; }
            else if (Math.abs(dist) <= RT_ZONE) {
                if (!L.zoneSince) L.zoneSince = now;
                if (L.far) {
                    L.far = false; L.touches++;
                    if (L.touches >= 2 && kind !== 'vwap') rtEvent(s, name + ' $' + lv.toFixed(1) + ' ' + L.touches + '번째 터치', 'touch', key);
                }
            }

            // 교차 (0.1% 이상 넘어가야 확정 → 노이즈 방지)
            var side = dist > RT_CROSS ? 1 : dist < -RT_CROSS ? -1 : L.side;
            if (side !== L.side) {
                var txt;
                if (kind === 'sup') txt = side < 0 ? ' 이탈' : ' 재탈환';
                else if (kind === 'res') txt = side > 0 ? ' 돌파' : ' 돌파 실패(되밀림)';
                else txt = side > 0 ? ' 상향 돌파' : ' 하향 이탈';
                rtEvent(s, name + ' $' + lv.toFixed(1) + txt, side > 0 ? 'up' : 'down', key);
                L.side = side; L.since = now;
            }
        }

        function rtEvent(s, msg, dir, key) {
            s.events.unshift({ t: Date.now(), msg: msg, dir: dir, key: key });
            if (s.events.length > 6) s.events.pop();
        }

        // sec 초 전 대비 등락(%)
        function rtChange(s, sec) {
            var n = s.ticks.length; if (n < 2) return null;
            var last = s.ticks[n - 1];
            for (var i = n - 1; i >= 0; i--) {
                if (last.t - s.ticks[i].t >= sec * 1000) return (last.p - s.ticks[i].p) / s.ticks[i].p * 100;
            }
            return null;
        }

        // 최근 1분 거래량 ÷ 직전 10분 분당 평균
        function rtVolSurge(s) {
            var n = s.ticks.length; if (n < 2) return null;
            var last = s.ticks[n - 1];
            function cvAt(sec) {
                for (var i = n - 1; i >= 0; i--) if (last.t - s.ticks[i].t >= sec * 1000) return s.ticks[i].cv;
                return null;
            }
            var c1 = cvAt(60), c11 = cvAt(660);
            if (c1 == null || c11 == null || !last.cv || !c11) return null;
            var avg = (c1 - c11) / 10;
            return avg > 0 ? (last.cv - c1) / avg : null;
        }

        function rtVwap(s) {
            if (s.extVwap > 0) return s.extVwap;
            return s.vol > 0 ? s.pv / s.vol : null;
        }

        // 미국 동부시간 기준 장중 구간
        function rtSessionNote() {
            var et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            var m = et.getHours() * 60 + et.getMinutes(), dow = et.getDay();
            var open = 9 * 60 + 30, close = 16 * 60;
            if (m < open || m >= close) return '정규장 외 (호가 얇음 · 손절폭 주의)';
            if (m < open + 30) return '개장 30분: 변동성 최대 · 첫 돌파는 속임수 잦음';
            if (m >= 11 * 60 + 30 && m < 13 * 60 + 30) return '점심 구간: 거래 감소 · 박스권 가능성 ↑';
            if (dow === 5 && m >= 14 * 60) return '만기일 오후: MaxPain 쪽 쏠림(핀) 효과 강함';
            if (m >= 15 * 60) return '파워아워: 추세 가속·되돌림 모두 큼';
            return '';
        }

        function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
        function fmtAgo(t) {
            var s = Math.round((Date.now() - t) / 1000);
            return s < 60 ? s + '초 전' : Math.floor(s / 60) + '분 전';
        }

        // 손익비 계산: 진입·손절·목표
        function rtPlan(dir, price, stop, target) {
            if (!(stop > 0 && target > 0)) return null;
            var risk = dir === 'long' ? price - stop : stop - price;
            var reward = dir === 'long' ? target - price : price - target;
            if (risk <= 0 || reward <= 0) return null;
            return { dir: dir, entry: price, stop: stop, target: target, rr: reward / risk,
                     riskPct: risk / price * 100, rewardPct: reward / price * 100 };
        }
        // 항목 배열 → 항목 단위로만 줄바꿈되는 칩 묶음
        function chipsHtml(items, extraClass) {
            return '<div class="chips' + (extraClass ? ' ' + extraClass : '') + '">' +
                items.filter(Boolean).map(function (t) { return '<span class="chip">' + t + '</span>'; }).join('') + '</div>';
        }
        // "A → B · C" 형태의 문장을 구분자 단위로 묶어 중간에서 끊기지 않게
        function nwJoin(text) {
            var toks = String(text).split(/( → | · )/);
            var out = '<span class="nw">' + toks[0] + '</span>';
            for (var i = 1; i < toks.length; i += 2) out += ' <span class="nw">' + toks[i].trim() + ' ' + (toks[i + 1] || '') + '</span>';
            return out;
        }

        function planText(pl) {
            if (!pl) return '';
            return chipsHtml([
                (pl.dir === 'long' ? '🔺롱' : '🔻숏') + ' 진입 $' + pl.entry.toFixed(2),
                '손절 $' + pl.stop.toFixed(2) + ' (' + pl.riskPct.toFixed(2) + '%)',
                '목표 $' + pl.target.toFixed(2) + ' (' + pl.rewardPct.toFixed(2) + '%)',
                '손익비 1:' + pl.rr.toFixed(1)
            ], 'plan-line');
        }

        // ════════════════════════════════════════════════════════
        // ★ 전략 문구 (1초마다 갱신)
        // ════════════════════════════════════════════════════════
        function applySmartStrategy(panelIdx) {
            var d = panelDataStore[panelIdx];
            if (!d || !d.price || !d.resistance1 || !d.support1) return;
            var s = rtState(panelIdx);

            var price = d.price, r1 = d.resistance1, r2 = d.resistance2, s1 = d.support1, s2 = d.support2;
            var score = d.score || 5, mp = d.maxPain || 0;

            // ── 실시간 지표 ──
            var vwReal = rtVwap(s), vwap = vwReal || d.vwap || ((d.dayHigh || price) + (d.dayLow || price) + price) / 3;
            var vwLabel = s.extVwap > 0 ? 'VWAP' : vwReal ? 'VWAP(수집)' : 'VWAP(추정)';
            var vwDist = (price - vwap) / vwap * 100;
            var m1 = rtChange(s, 60), m3 = rtChange(s, 180), m10 = rtChange(s, 600);
            var surge = rtVolSurge(s);

            var optState = score >= 8.5 ? '콜 과열' : score <= 1.5 ? '풋 과열' :
                           score >= 6 ? '콜 우위' : score <= 4 ? '풋 우위' : '중립';

            // ── 방향 점수 (-4 ~ +4): VWAP 위치 + 3분 모멘텀 + 10분 추세 + 옵션수급 ──
            var bias = 0;
            bias += vwDist > 0.1 ? 1 : vwDist < -0.1 ? -1 : 0;
            if (m3 != null) bias += m3 > 0.15 ? 1 : m3 < -0.15 ? -1 : 0;
            if (m10 != null) bias += m10 > 0.3 ? 1 : m10 < -0.3 ? -1 : 0;
            bias += score >= 6 ? 1 : score <= 4 ? -1 : 0;

            // 속도 표현
            var speed = '';
            if (m1 != null) {
                var am1 = Math.round(Math.abs(m1) * 100) / 100;   // 표시값(소수 2자리)과 판정 일치
                speed = am1 >= 0.3 ? (m1 > 0 ? '급등' : '급락') :
                        am1 >= 0.1 ? (m1 > 0 ? '상승' : '하락') : '횡보';
            }
            var volTxt = surge == null ? '' : surge >= 2 ? '거래량 폭증 ' + surge.toFixed(1) + '배' :
                         surge >= 1.3 ? '거래량 증가 ' + surge.toFixed(1) + '배' :
                         surge < 0.6 ? '거래량 한산' : '거래량 보통';
            var volStrong = surge != null && surge >= 1.5;

            // ── 가장 최근 이벤트 (90초 이내면 헤드라인) ──
            var ev = s.events[0], fresh = ev && Date.now() - ev.t < 90 * 1000;

            // 가장 가까운 레벨
            var lvList = [
                { k: 'R2', n: '2차저항', v: r2 }, { k: 'R1', n: '1차저항', v: r1 },
                { k: 'S1', n: '1차지지', v: s1 }, { k: 'S2', n: '2차지지', v: s2 },
                { k: 'MP', n: 'MaxPain', v: mp }
            ].filter(function (x) { return x.v > 0; });
            lvList.forEach(function (x) { x.dist = (price - x.v) / x.v * 100; });
            var near = lvList.slice().sort(function (a, b) { return Math.abs(a.dist) - Math.abs(b.dist); })[0];
            var nearL = near ? s.levels[near.k] : null;

            // ── 위/아래 다음 레벨 (손절·목표 계산용) ──
            var above = lvList.concat(vwReal ? [{ n: 'VWAP', v: vwap }] : [])
                .filter(function (x) { return x.v > price * 1.001; }).sort(function (a, b) { return a.v - b.v; });
            var below = lvList.concat(vwReal ? [{ n: 'VWAP', v: vwap }] : [])
                .filter(function (x) { return x.v < price * 0.999; }).sort(function (a, b) { return b.v - a.v; });

            var line1 = '', line3 = '', color = '#ddbb00', plan = null;

            if (fresh && (ev.dir === 'up' || ev.dir === 'down')) {
                // ⚡ 방금 돌파/이탈 발생
                var confirmed = volStrong && ((ev.dir === 'up' && m1 > 0) || (ev.dir === 'down' && m1 < 0));
                // 이미 레벨에서 0.3% 넘게 멀어졌으면 추격 진입 금지 (손절이 멀어져 손익비가 나빠짐)
                var evLv = s.levels[ev.key] ? s.levels[ev.key].lv : 0;
                var chasing = evLv > 0 && Math.abs(price - evLv) / evLv * 100 > RT_AWAY;
                line1 = '⚡ ' + ev.msg + ' (' + fmtAgo(ev.t) + ')' + (confirmed ? ' · 거래량 동반 ✅' : ' · 거래량 미확인 ⚠️');
                color = ev.dir === 'up' ? '#ff4444' : '#4488ff';
                // 거래량이 확인되지 않은 돌파/이탈은 휩소가 잦으므로 매매 계획을 만들지 않음 (문구만 안내)
                if (ev.dir === 'up') {
                    if (confirmed && !chasing) plan = rtPlan('long', price, s.levels[ev.key] ? s.levels[ev.key].lv * 0.998 : (below[0] && below[0].v), above[0] && above[0].v);
                    line3 = confirmed && chasing ? '이미 레벨에서 멀어짐. 추격 금지, 눌림 대기'
                          : confirmed ? '돌파 추종 가능. 레벨 아래로 다시 밀리면 즉시 청산'
                                      : '거래량 없는 돌파는 되밀림 잦음. 리테스트(되돌림 후 지지) 확인 후 진입';
                } else {
                    if (confirmed && !chasing) plan = rtPlan('short', price, s.levels[ev.key] ? s.levels[ev.key].lv * 1.002 : (above[0] && above[0].v), below[0] && below[0].v);
                    line3 = confirmed && chasing ? '이미 레벨에서 멀어짐. 추격 금지, 반등 대기'
                          : confirmed ? '이탈 추종 가능. 레벨 위로 재탈환하면 즉시 청산'
                                      : '거래량 없는 이탈은 재탈환(휩소) 잦음. 저가 매도 추격 금지';
                }
            }
            else if (near && Math.abs(near.dist) <= RT_AWAY) {
                // 🎯 레벨 근접 공방
                var touches = nearL ? nearL.touches : 0;
                var stay = nearL && nearL.zoneSince ? Math.round((Date.now() - nearL.zoneSince) / 60000) : 0;
                // 레벨의 역할은 현재가 위치로 판단 (돌파한 저항은 지지, 이탈한 지지는 저항으로 전환)
                //   0.1% 이상 넘어가야 역할이 바뀜 (돌파/이탈 판정과 동일한 기준 → 레벨 근처 잔떨림 무시)
                var isSup = nearL ? nearL.side > 0 : price >= near.v;
                var flipped = (isSup && (near.k === 'R1' || near.k === 'R2')) || (!isSup && (near.k === 'S1' || near.k === 'S2'));
                var roleTxt = isSup ? (flipped ? ' 돌파 후 지지 확인' : ' 방어전') : (flipped ? ' 이탈 후 저항 확인' : ' 테스트');
                line1 = '🎯 ' + near.n + ' $' + near.v.toFixed(1) + roleTxt +
                        (touches > 0 ? ' · ' + touches + '번째 터치' : '') + (stay > 0 ? ' · ' + stay + '분째 공방' : '');
                color = isSup ? '#66bbff' : '#ff6666';

                if (isSup) {
                    var weakening = touches >= 3;                         // 여러 번 두드리면 약해짐
                    var bouncing = m1 != null && m1 > 0.05;               // 막 반등 중
                    if (bouncing && bias >= -1 && !weakening) {
                        plan = rtPlan('long', price, near.v * 0.998, above[0] && above[0].v);
                        line3 = '지지 반등 시작. 저가 이탈 없으면 롱 타점';
                    } else if (bias <= -2 || weakening) {
                        // 진입가 = 문구의 이탈 확인가와 동일 (이미 그 아래면 현재가)
                        plan = rtPlan('short', Math.min(price, near.v * 0.999), near.v * 1.002, below.length > 1 ? below[1].v : (below[0] && below[0].v));
                        line3 = (weakening ? touches + '회 터치로 지지 약화. ' : '하방 우위. ') + '$' + (near.v * 0.999).toFixed(2) + ' 이탈 확인 시 숏';
                    } else {
                        line3 = '방향 미정. 반등(1분 +) 또는 이탈($' + (near.v * 0.999).toFixed(2) + '↓) 확인 후 대응';
                    }
                } else {
                    var pushing = m1 != null && m1 > 0.05 && volStrong;
                    if (pushing && bias >= 1) {
                        plan = rtPlan('long', near.v * 1.001, near.v * 0.997, above.length > 1 ? above[1].v : null);
                        line3 = '거래량 실린 돌파 시도. $' + (near.v * 1.001).toFixed(2) + ' 돌파 시 롱';
                    } else {
                        // 저항에서 밀리는 것을 확인한 뒤 진입 (레벨 -0.2% 아래, 이미 그 아래면 현재가)
                        plan = rtPlan('short', Math.min(price, near.v * 0.998), near.v * 1.003, below[0] && below[0].v);
                        line3 = (touches >= 3 ? '저항 반복 터치 → 돌파 가능성도 커지는 중. ' : '') +
                                '돌파 힘 부족. $' + (near.v * 0.998).toFixed(2) + ' 아래로 밀리면 숏';
                    }
                }
            }
            else {
                // 🧭 레벨 사이 이동 중
                var dirTxt = bias >= 2 ? '상승 우위' : bias <= -2 ? '하락 우위' : '방향성 탐색';
                var tgt = bias >= 0 ? above[0] : below[0];
                line1 = '🧭 ' + dirTxt + (tgt ? ' → 다음 ' + tgt.n + ' $' + tgt.v.toFixed(1) + ' (' + fmtPct((tgt.v - price) / price * 100) + ')' : '');
                color = bias >= 2 ? '#ff6666' : bias <= -2 ? '#66bbff' : '#ddbb00';
                if (Math.abs(bias) >= 2 && tgt) {
                    var opp = bias > 0 ? below[0] : above[0];
                    plan = rtPlan(bias > 0 ? 'long' : 'short', price, opp && opp.v, tgt.v);
                    line3 = '추세 방향 눌림/반등에서만 진입. 레벨 사이 추격은 손익비 불리';
                } else {
                    line3 = '레벨 사이 중간 구간. 다음 레벨 도달 전까지 관망';
                }
            }

            // ★ 가상매매: 현재 계획을 대기주문으로 반영 (손익비 기준 미만은 제외)
            paperSetPlan(s.ticker, plan, {
                price: price, vwap: vwap, score: score, src: s.src,
                signal: paperPlain(line1) + ' / ' + paperPlain(line3)
            });

            // 손익비 나쁘면 경고
            if (plan && plan.rr < 1.2) line3 += ' ⚠️ 손익비 낮음(1:' + plan.rr.toFixed(1) + ') — 진입 비추천';
            else if (plan) line3 += planText(plan);

            // ── 2번째 줄: 수치 대시보드 ──
            var parts = [];
            parts.push(vwLabel + ' $' + vwap.toFixed(2) + ' ' + (vwDist >= 0 ? '위' : '아래') + '(' + fmtPct(vwDist) + ')');
            if (m1 != null) parts.push('1분 ' + fmtPct(m1) + (speed ? ' ' + speed : ''));
            if (m3 != null) parts.push('3분 ' + fmtPct(m3));
            if (volTxt) parts.push(volTxt);
            parts.push('옵션 ' + optState + '(' + score.toFixed(1) + ')');
            var line2 = parts.join(' | ');

            // ── 세션 메모 + 최근 이벤트 로그 ──
            var note = rtSessionNote();
            var log = s.events.slice(0, 3).map(function (e) {
                var c = e.dir === 'up' ? '#ff6666' : e.dir === 'down' ? '#66bbff' : '#aaa';
                return '<span class="nw" style="color:' + c + '">' + fmtAgo(e.t) + ' ' + e.msg + '</span>';
            }).join(' · ');
            var extra = paperStatusHtml(s.ticker, price) + (note ? '<div style="color:#e0a040;font-size:0.9em">⏱ ' + nwJoin(note) + '</div>' : '') +
                        (log ? '<div style="font-size:0.85em">📜 ' + log + '</div>' : '') +
                        (s.ticks.length < 20 ? '<div style="color:#888;font-size:0.8em">※ 실시간 데이터 수집 중 (모멘텀·거래량은 페이지를 연 뒤부터 계산)</div>' : '') +
                        (!(s.extVwap > 0) ? '<div style="color:#888;font-size:0.8em">※ 키움 VWAP 미수신 → ' + vwLabel + ' 사용</div>' : '');

            var p = 'p' + panelIdx + '-';
            var sigEl = document.getElementById(p + 'sigtitle');
            if (sigEl) { sigEl.innerHTML = nwJoin(line1); sigEl.style.color = color; }
            var subEl = document.getElementById(p + 'trend-sub');
            if (subEl) subEl.innerHTML = chipsHtml(parts);
            var nextEl = document.getElementById(p + 'trend-next');
            if (nextEl) nextEl.innerHTML = '- ' + line3 + extra;
        }


        // ════════════════════════════════════════════════════════
        // ★ 가상매매 (백테스트 기록용, 슬리피지·수수료 무시)
        //   - 윈폼 대시보드 창(WebView2) 안에서만 기록 / 일반 브라우저는 보기 전용
        //   - 전략 문구의 계획(진입·손절·목표)을 대기주문으로 걸고, 가격이 진입가에 닿으면 체결
        //   - 청산: 손절 / 목표 / 반대신호 / 최대 보유시간 / 정규장 마감(15:59 ET)
        //   - 정규장(09:30~16:00 ET)에만 신규 진입, 15:55 이후 신규 진입 없음
        //   - 윈폼이 2초마다 window.paperDrain() 으로 체결·청산 내역을 가져감
        // ════════════════════════════════════════════════════════
        var PAPER_RECORDER = !!(window.chrome && window.chrome.webview);
        var PAPER_NOTIONAL = 10000;        // 1회 매매 금액($)
        var PAPER_MAX_HOLD_MIN = 60;       // 최대 보유시간(분)
        var PAPER_MIN_RR = 1.2;            // 이 손익비 미만 계획은 매매하지 않음
        var PAPER_LAST_ENTRY_MIN = 955;    // 15:55 ET 이후 신규 진입 금지
        var PAPER_EOD_MIN = 959;           // 15:59 ET 에 전량 청산
        var PAPER_COOLDOWN_SEC = 60;       // 청산 후 같은 종목 재진입 대기(초)
        var PAPER_LS_KEY = 'paperState_v1';
        var paper = { day: '', pos: {}, pend: {}, queue: [], lastClose: {} };

        function paperPad(n) { return (n < 10 ? '0' : '') + n; }
        function paperEt() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' })); }
        function paperDay(et) { return et.getFullYear() + '-' + paperPad(et.getMonth() + 1) + '-' + paperPad(et.getDate()); }
        function paperStamp(et) { return paperDay(et) + ' ' + paperPad(et.getHours()) + ':' + paperPad(et.getMinutes()) + ':' + paperPad(et.getSeconds()); }
        function paperMin(et) { return et.getHours() * 60 + et.getMinutes(); }
        function paperRegular(et) {
            var d = et.getDay(); if (d === 0 || d === 6) return false;
            var m = paperMin(et); return m >= 570 && m < 960;
        }
        function paperPlain(html) { var t = document.createElement('div'); t.innerHTML = html || ''; return (t.textContent || '').trim(); }

        function paperSave() {
            if (!PAPER_RECORDER) return;
            try { localStorage.setItem(PAPER_LS_KEY, JSON.stringify(paper)); } catch (e) { }
        }

        function paperLoad() {
            if (!PAPER_RECORDER) return;
            var today = paperDay(paperEt());
            try {
                var saved = JSON.parse(localStorage.getItem(PAPER_LS_KEY) || 'null');
                if (saved && saved.pos) {
                    paper.queue = saved.queue || [];
                    if (saved.day === today) {
                        paper.pos = saved.pos;          // 같은 날 창을 다시 열면 보유 포지션 이어서 관리
                    } else {
                        // 지난 거래일에 창이 닫혀 청산되지 못한 포지션 → 마지막 가격으로 기록 후 정리
                        Object.keys(saved.pos).forEach(function (tk) {
                            var p = saved.pos[tk];
                            paperCloseTrade(p, p.last || p.entry, '미청산(창 종료)', p.lastStamp || p.openTime);
                        });
                    }
                }
            } catch (e) { }
            paper.day = today; paper.pend = {};
            paperSave();
        }

        // 1초마다 전략 계산 후 호출: 현재 계획을 대기주문으로 반영
        function paperSetPlan(ticker, plan, ctx) {
            if (!PAPER_RECORDER || !ticker) return;
            var et = paperEt();
            var pos = paper.pos[ticker];
            var ok = plan && plan.rr >= PAPER_MIN_RR && paperRegular(et) && paperMin(et) < PAPER_LAST_ENTRY_MIN;
            if (!ok || (pos && pos.dir === plan.dir)) { delete paper.pend[ticker]; return; }   // 같은 방향 추가 진입 없음
            if (!pos && paper.lastClose[ticker] && (Date.now() - paper.lastClose[ticker]) / 1000 < PAPER_COOLDOWN_SEC) {
                delete paper.pend[ticker]; return;                                                 // 청산 직후 재진입 방지
            }

            var cur = paper.pend[ticker];
            function same(a, b) { return Math.abs(a - b) / b < 0.0005; }
            if (cur && cur.dir === plan.dir && same(cur.entry, plan.entry) && same(cur.stop, plan.stop) && same(cur.target, plan.target)) return;

            paper.pend[ticker] = {
                dir: plan.dir, entry: plan.entry, stop: plan.stop, target: plan.target, rr: plan.rr,
                // 계획 시점 가격 대비 진입가 위치로 체결 조건 결정
                trig: plan.entry > ctx.price * 1.0001 ? 'up' : plan.entry < ctx.price * 0.9999 ? 'down' : 'now',
                signal: ctx.signal, vwap: ctx.vwap, score: ctx.score, src: ctx.src
            };
        }

        // 시세가 들어올 때마다 호출: 체결·청산 판정
        function paperOnTick(ticker, price) {
            if (!PAPER_RECORDER || !ticker || !(price > 0)) return;
            var et = paperEt(), m = paperMin(et), stamp = paperStamp(et), changed = false;
            if (paper.day !== paperDay(et)) { paper.day = paperDay(et); paper.pend = {}; changed = true; }

            // ── 보유 포지션 청산 판정 ──
            var pos = paper.pos[ticker];
            if (pos) {
                pos.last = price; pos.lastStamp = stamp;
                var exitPx = null, reason = '';
                if (pos.dir === 'long') {
                    if (price <= pos.stop) { exitPx = pos.stop; reason = '손절'; }
                    else if (price >= pos.target) { exitPx = pos.target; reason = '목표'; }
                } else {
                    if (price >= pos.stop) { exitPx = pos.stop; reason = '손절'; }
                    else if (price <= pos.target) { exitPx = pos.target; reason = '목표'; }
                }
                if (exitPx === null && (Date.now() - pos.openAt) / 60000 >= PAPER_MAX_HOLD_MIN) { exitPx = price; reason = '시간초과'; }
                if (exitPx === null && (!paperRegular(et) || m >= PAPER_EOD_MIN)) { exitPx = price; reason = '장마감'; }
                if (exitPx !== null) { paperCloseTrade(pos, exitPx, reason, stamp); delete paper.pos[ticker]; pos = null; changed = true; }
            }

            // ── 대기주문 체결 판정 ──
            var pd = paper.pend[ticker];
            if (pd && paperRegular(et) && m < PAPER_LAST_ENTRY_MIN) {
                var hit = pd.trig === 'now' || (pd.trig === 'up' && price >= pd.entry) || (pd.trig === 'down' && price <= pd.entry);
                if (hit) {
                    var fill = pd.trig === 'now' ? price : pd.entry;
                    var valid = pd.dir === 'long' ? (pd.stop < fill && fill < pd.target) : (pd.target < fill && fill < pd.stop);
                    if (valid) {
                        if (pos) { paperCloseTrade(pos, fill, '반대신호', stamp); delete paper.pos[ticker]; }
                        var np = {
                            id: ticker + '-' + Date.now(), day: paper.day, ticker: ticker, dir: pd.dir,
                            entry: fill, stop: pd.stop, target: pd.target,
                            planRR: Math.abs(pd.target - fill) / Math.abs(fill - pd.stop),
                            openAt: Date.now(), openTime: stamp, last: price, lastStamp: stamp,
                            signal: pd.signal, vwap: pd.vwap, score: pd.score, src: pd.src
                        };
                        paper.pos[ticker] = np;
                        paper.queue.push({ type: 'open', trade: paperRow(np, null) });
                    }
                    delete paper.pend[ticker];
                    changed = true;
                }
            }
            if (changed) paperSave();
        }

        function paperCloseTrade(pos, exitPx, reason, stamp) {
            if (!paper.lastClose) paper.lastClose = {};
            paper.lastClose[pos.ticker] = Date.now();
            paper.queue.push({ type: 'close', trade: paperRow(pos, { price: exitPx, reason: reason, time: stamp }) });
        }

        function paperRow(p, ex) {
            var r = {
                id: p.id, day: p.day, ticker: p.ticker, dir: p.dir === 'long' ? '롱' : '숏',
                openTime: p.openTime, entry: +p.entry.toFixed(4), stop: +p.stop.toFixed(4), target: +p.target.toFixed(4),
                planRR: +p.planRR.toFixed(2), vwap: +(p.vwap || 0).toFixed(4), score: +(p.score || 0).toFixed(1),
                src: p.src || '', signal: p.signal || ''
            };
            if (ex) {
                var sign = p.dir === 'long' ? 1 : -1;
                var pnl = (ex.price - p.entry) * sign;
                var risk = Math.abs(p.entry - p.stop);
                r.exitTime = ex.time; r.exit = +ex.price.toFixed(4); r.reason = ex.reason;
                r.pnlPct = +(pnl / p.entry * 100).toFixed(3);
                r.pnlUsd = +(pnl / p.entry * PAPER_NOTIONAL).toFixed(2);
                r.rMult = risk > 0 ? +(pnl / risk).toFixed(2) : 0;
                r.holdMin = +((Date.now() - p.openAt) / 60000).toFixed(1);
            }
            return r;
        }

        // 윈폼이 호출: 쌓인 체결·청산 내역을 넘기고 비움
        window.paperDrain = function () {
            var q = paper.queue; paper.queue = [];
            if (q.length) paperSave();
            return q;
        };

        // 패널에 표시할 가상매매 상태 한 줄
        function paperStatusHtml(ticker, price) {
            if (!PAPER_RECORDER || !ticker) return '';
            var pos = paper.pos[ticker], pd = paper.pend[ticker];
            if (pos) {
                var pnl = (price - pos.entry) / pos.entry * 100 * (pos.dir === 'long' ? 1 : -1);
                var mins = Math.floor((Date.now() - pos.openAt) / 60000);
                return '<div style="font-size:0.85em;color:' + (pnl >= 0 ? '#ff7777' : '#77aaff') + '">' + nwJoin('🧪 가상 ' +
                    (pos.dir === 'long' ? '롱' : '숏') + ' 보유 · 진입 $' + pos.entry.toFixed(2) +
                    ' · 손절 $' + pos.stop.toFixed(2) + ' · 목표 $' + pos.target.toFixed(2) +
                    ' · 현재 ' + (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '% · ' + mins + '분') + '</div>';
            }
            if (pd) {
                var how = pd.trig === 'now' ? '즉시' : '$' + pd.entry.toFixed(2) + (pd.trig === 'up' ? ' 이상' : ' 이하') + ' 도달 시';
                return '<div style="font-size:0.85em;color:#aaa">🧪 가상 대기: ' + (pd.dir === 'long' ? '롱' : '숏') + ' ' + how + ' 체결</div>';
            }
            return '';
        }

        paperLoad();

                + '</div>'

        var FIREBASE_URL = 'https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/';

        // ── 키움 하트비트 구독 ─────────────────────────────────
        function initKiwoomHeartbeat() {

                firebase.database().ref('.info/serverTimeOffset').on('value', function (s) { fbServerOffset = Number(s.val()) || 0; });

                var firstSnap = true;

        // ── 패널 시세 출력 (현재 소스 기준) ─────────────────────
        // 키움이 살아있으면 키움 값, 꺼져 있으면 야후 값

        function pickQuote(ticker) {
            var k = kiwoomCache[ticker], y = yahooCache[ticker], r = restCache[ticker];
            if (kiwoomAlive && k && k.price > 0) return { q: k, src: 'kiwoom' };
            // 야후 WebSocket 과 REST(Worker) 중 더 최근에 받은 값
            var yOk = y && y.price > 0, rOk = r && r.price > 0;

            return null;
        }

        // ════════════════════════════════════════════════════════
        // ★ 첫 화면 즉시 시세: Worker /quote (야후 REST 중계)
        //   - 페이지를 열 때 화면 종목을 1번 조회 → WebSocket 데이터가 오면 그 종목은 REST 중단
        //   - WebSocket이 30초 넘게 조용한 종목만 30초 간격으로 보조 조회 (거래 뜸한 시간 대비)
        //   - 키움 시세를 쓰는 중이거나, 탭이 숨겨져 있으면 조회하지 않음
        // ════════════════════════════════════════════════════════
        var restCache = {};        // ticker → { price, change, changeRate, volume, recvAt }
        var yahooWsAt = {};        // ticker → 마지막 WebSocket 수신 시각
        var restLastAt = {};       // ticker → 마지막 REST 조회 시각
        var REST_SILENT_MS = 30000;
        var restBusy = false;

        function restNeeded(t) {
            if (!t) return false;
            var k = kiwoomCache[t];
            if (kiwoomAlive && k && k.price > 0) return false;                    // 키움 시세 사용 중
            if (Date.now() - (yahooWsAt[t] || 0) < REST_SILENT_MS) return false;  // WebSocket 정상 수신 중
            return Date.now() - (restLastAt[t] || 0) >= REST_SILENT_MS;           // 처음이거나 30초 경과
        }

        function restTick() {
            if (restBusy || !CLOSE_WORKER_URL || CLOSE_WORKER_URL.indexOf('YOUR-ACCOUNT') >= 0) return;
            if (document.visibilityState === 'hidden') return;

            panelTickers.concat(HEADER_TICKERS).forEach(function (t) { if (t && !seen[t] && restNeeded(t)) { seen[t] = 1; list.push(t); } });
            if (!list.length) return;

            list.forEach(function (t) { restLastAt[t] = Date.now(); });
            fetch(CLOSE_WORKER_URL.replace(/\/+$/, '') + '/quote?s=' + encodeURIComponent(list.join(',')), { cache: 'no-store' })
                .then(function (r) { return r.json(); })

        // ════════════════════════════════════════════════════════

        function subscribeFirebase(panelIdx, ticker) {

            try {
                var rtRef = firebase.database().ref('tickers/' + ticker + '/realtime');

        }

        function unsubscribeFirebase(panelIdx) { try { if (fbRefs[panelIdx] && fbRefs[panelIdx].refs) fbRefs[panelIdx].refs.forEach(function (r) { r.off(); }); } catch (e) { } fbRefs[panelIdx] = null; fbGen[panelIdx]++; }

        // ════════════════════════════════════════════════════════
        // ★ panel/optionUpdate 이벤트 처리 (Firebase panelRef → onWsMessage)
        //   - 점 색상은 renderPanelQuote 에서 현재 가격 소스 기준으로 결정
        // ════════════════════════════════════════════════════════
        window.onWsMessage = function (d) {
            if (!d || !d.type || d.type !== 'optionUpdate' || !d.ticker) return;
            var panel = panelTickers.indexOf(d.ticker);
            if (panel < 0) return;


            if (d.optionRows && d.optionRows.length > 0) {
                var tCall = 0, tPut = 0;
                d.optionRows.forEach(function (r) {
                    var cChgMult = (1 + Math.abs(r.callChg) / 100.0) * (r.callChg >= 0 ? 1 : -1);
                    var pChgMult = (1 + Math.abs(r.putChg) / 100.0) * (r.putChg >= 0 ? 1 : -1);
                    tCall += (r.callOI + r.callVol) * cChgMult;
                    tPut += (r.putOI + r.putVol) * pChgMult;
                });

                var totalEnergy = Math.abs(tCall) + Math.abs(tPut);
                if (totalEnergy > 0) {
                    var eRatio = (tCall - tPut) / totalEnergy;
                    var isIndex = (d.ticker === 'QQQ' || d.ticker === 'SPY' || d.ticker === 'IWM' || d.ticker === 'SPX');
                    var targetVol = isIndex ? 2.5 : 6.0;

                        if (matches) domRate = Number(matches[matches.length - 1]) || 0;
                    }
                    if (domRate === 0 && d.change !== undefined) domRate = Number(d.change) || 0;
                    var intensity = Math.min(1.0, Math.abs(domRate) / targetVol);
                    var calcScore = 5.0 + (eRatio * 5.0 * intensity);
                    d.score = Math.max(0, Math.min(10, calcScore));
                }
            }

            panelDataStore[panel] = JSON.parse(JSON.stringify(d));

        function updatePanelPriceOnly(idx, price, changeRate, changeAmt, volume) {
            var p = 'p' + idx + '-';
            var numPrice = Number(String(price).replace(/[^0-9.-]+/g, "")) || 0;
            var numAmt = Number(String(changeAmt).replace(/[^0-9.-]+/g, "")) || 0;
            var numRate = Number(String(changeRate || '0').replace('%', '').trim()) || 0;
            var cls = numRate > 0 ? 'up' : numRate < 0 ? 'dn' : 'neu';
