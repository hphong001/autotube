<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }

        /* ── 상단 바 ── */
        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6), 0 0 24px rgba(255,200,0,0.4);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8), 0 0 24px rgba(255,100,0,0.5);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg, transparent, #ffcc00, transparent);
            margin: 6px 0;
            box-shadow: 0 0 5px rgba(255,204,0,0.5);
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 6px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            text-transform: uppercase;
            margin-right: -6px;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 450px;
        }

        .neon-item {
            font-size: 12px;
            font-weight: bold;
            color: #444;
            white-space: nowrap;
        }

            .neon-item.up {
                color: #ff4444;
                text-shadow: 0 0 6px rgba(255,68,68,0.5);
            }

            .neon-item.dn {
                color: #4488ff;
                text-shadow: 0 0 6px rgba(68,136,255,0.5);
            }

            .neon-item.neu {
                color: #ccc;
            }

        .neon-vix-warn {
            color: #ffcc00;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-time {
            font-size: 11px;
            color: #333;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

            .ws-dot.live {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: np 1.5s infinite;
            }

            .ws-dot.dead {
                background: #1a1a2a;
                animation: none;
            }

        @keyframes np {
            0%,100% { opacity: 1 }
            50% { opacity: 0.3 }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

            .oi-dot.flash {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: oiF 0.4s ease-in-out 2;
            }

        @keyframes oiF {
            0%,100% { opacity: 1 }
            50% { opacity: 0.05 }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
        }

            .panel:last-child { border-right: none; }

        .ph {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            flex-wrap: nowrap;
        }

        .ticker-name {
            font-size: 20px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .price-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .price-divider {
            color: #3a3a5a;
            font-size: 18px;
            font-weight: bold;
            margin: 0 4px;
        }

        .ext-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .ext-label { display: none; }

        .ext-price { font-size: 20px; font-weight: bold; white-space: nowrap; }
        .ext-diff { font-size: 16px; font-weight: bold; white-space: nowrap; }
        .ext-chg { font-size: 16px; font-weight: bold; white-space: nowrap; }
        
        .price-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .price-now { font-size: 20px; font-weight: bold; color: #555; white-space: nowrap; }
        .price-diff { font-size: 16px; font-weight: bold; color: #555; white-space: nowrap; }
        .price-chg { font-size: 16px; font-weight: bold; color: #555; white-space: nowrap; }

        .up { color: #ff4444 !important; }
        .dn { color: #4488ff !important; }
        .neu { color: #aaa !important; }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2a2a2a;
            padding-bottom: 5px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .sb-title { color: #ddbb00; font-size: 13px; font-weight: bold; flex: 1; min-width: 0; }
        .sb-trend { font-size: 10px; color: #aaa; background: #1a1a2e; padding: 2px 5px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }

        .timeline {
            position: relative;
            height: 70px;
            margin: 0 6px;
        }

        .tl-track {
            position: absolute;
            top: 38px;
            left: 6%;
            right: 6%;
            height: 3px;
            background: #2a2a3e;
            border-radius: 2px;
        }

        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        .node-top { bottom: 42px; }
        .node-bottom { top: 42px; }

        .dot-triangle {
            position: absolute;
            top: 31px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #4488ff;
            z-index: 20;
        }

        .dot-tl {
            position: absolute;
            top: 39.5px;
            transform: translate(-50%,-50%);
            border-radius: 50%;
        }

        .dot-small { width: 9px; height: 9px; z-index: 2; }

        .lbl-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d0d15;
            padding: 0 2px;
            border-radius: 3px;
        }

        .lbl { font-size: 9px; color: #888; font-weight: bold; margin-bottom: 1px; }
        .val { font-size: 11px; font-weight: bold; }

        .c-red { color: #ff4444; } .bg-red { background: #ff4444; }
        .c-green { color: #44ff66; } .bg-green { background: #44ff66; }
        .c-blue { color: #4488ff; } .bg-blue { background: #4488ff; }
        .c-gold { color: #ffcc00; } .bg-gold { background: #ffcc00; }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 8px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .oi-title { font-size: 13px; font-weight: bold; color: #7799dd; display: flex; align-items: center; }
        .oi-dte { background: #7722cc; color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; white-space: nowrap; }

        /* 옵션 체인 상단 제목 색상 흰색 및 가로바와 적당한 여백(margin-top) 확보 */
        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: #fff;
            border-bottom: 1px solid #2a2a3e;
            padding: 6px 0 8px;
            margin-top: 6px;
            margin-bottom: 8px;
            background: #0f0f1a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 32px 32px 42px 32px 32px 1fr;
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 32px 32px 42px 32px 32px 1fr;
            align-items: center;
            gap: 1px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 2px;
        }

        /* 🌟 삐뚤어짐 없는 완벽한 구역 실선 및 옅은 배경 하이라이트 클래스 */
        .zone-band-outer {
            background-color: rgba(68, 136, 255, 0.04) !important; /* 2차 ~ 2차 예상 전체 구간 옅은 배경 */
        }
        .zone-band-inner {
            background-color: rgba(255, 204, 0, 0.04) !important; /* 1차 ~ 1차 핵심 공방 구역 옅은 배경 */
        }

        .border-t-white { border-top: 1.5px solid #ffffff !important; }
        .border-b-white { border-bottom: 1.5px solid #ffffff !important; }
        .border-t-gray  { border-top: 1.5px solid #888888 !important; }
        .border-b-gray  { border-bottom: 1.5px solid #888888 !important; }

        .oi-bar-wrap { display: flex; width: 100%; align-items: center; }
        .oi-bar-wrap.left { justify-content: flex-end; }
        .oi-bar-wrap.right { justify-content: flex-start; }

        .oi-bar.call { height: 6px; border-radius: 2px 0 0 2px; background: #cc3333; }
        .oi-bar.put { height: 6px; border-radius: 0 2px 2px 0; background: #3366cc; }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 1px 0;
            border-radius: 3px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 11px;
        }
        .strike-box.atm { background: #ffcc00; color: #000; box-shadow: 0 0 4px #ffcc00; }

        .oi-vol { font-size: 9.5px; color: #eee; white-space: nowrap; font-weight: bold; }

        /* ── 차트 영역 ── */
        .chart-wrapper {
            flex: 0 0 240px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section { width: 100%; height: 100%; }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15, 15, 25, 0.85);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .chart-interval-select option { background: #0b0b14; color: #fff; }

        /* ── 사이드바 ── */
        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar::-webkit-scrollbar { display: none; }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; line-height: 1; width: 100%; }
        .sl-strike { font-size: 30px; font-weight: 900; color: #ffdf00; text-shadow: 0 0 15px rgba(255,223,0,0.7); text-transform: uppercase; }
        .sl-zone { font-size: 30px; font-weight: 900; color: #ff8800; text-shadow: 0 0 15px rgba(255,136,0,0.9); text-transform: uppercase; }
        .sl-line { height: 1px; width: 90%; background: linear-gradient(90deg, transparent, #ffcc00, transparent); margin: 12px 0 10px; }
        .sl-sub { font-size: 11.5px; letter-spacing: 8px; font-weight: 800; color: #ffffff; text-transform: uppercase; margin-right: -8px; }

        .sidebar-menu {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #2a2a4a;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
        }

        .sidebar-watchlist {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px solid #1e1e30;
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .search-box {
            background: #070710;
            border: 1px solid #2a2a3e;
            color: #ccc;
            padding: 6px 8px;
            border-radius: 5px;
            margin-bottom: 8px;
            width: 100%;
            font-size: 12px;
        }

        .ticker-list { overflow-y: auto; flex: 1; }
        .ticker-list::-webkit-scrollbar { width: 3px; }
        .ticker-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a28;
            font-size: 12px;
            cursor: pointer;
            color: #aaa;
        }
        .ticker-item input { accent-color: #4488ff; }

        .sidebar-ad {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #222;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 12px;
        }

        /* ── 모바일 환경 미디어 쿼리 ── */
        @media screen and (max-width: 1200px) {
            body { min-width: unset; }
            .top-bar {
                height: auto;
                flex-wrap: wrap;
                padding: 6px 10px;
                gap: 6px;
            }
            .logo-top { 
                width: 100%;
                order: 1; 
                align-items: center;
                margin-top: 2px;
            }
            .top-right { order: 2; }
            .neon-ticker-bar {
                width: 100%;
                max-width: none;
                order: 3;
                margin-top: 2px;
                padding: 2px 6px;
                justify-content: space-around;
            }
            .content-wrapper {
                flex-direction: column;
                overflow-y: auto;
                padding: 6px;
                gap: 8px;
            }
            .dashboard-grid {
                flex-direction: column;
                overflow-y: visible;
                min-height: 0;
            }
            html, body {
                overflow-y: auto;
                height: auto;
            }
            .panel {
                height: auto;
                min-height: 0;
                border-right: none;
                border-bottom: 1px solid #1a1a2e;
                overflow-y: visible;
            }
            .ph { flex-wrap: wrap; }
            
            .price-container {
                flex-direction: column;
                gap: 2px;
            }
            .price-divider { display: none !important; }
            .ext-label { display: none !important; }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                padding-right: 0;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .sidebar-logo { flex: 1; min-width: 180px; }
            .sidebar-menu { flex: 1; min-width: 120px; }
            .sidebar-watchlist {
                flex: 2;
                min-width: 200px;
                max-height: 200px;
            }
            .sidebar-ad { display: none; }
            .chart-wrapper { min-height: 280px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-top">
            <div class="logo-top-main"><span class="lt-strike">STRIKE</span><span class="lt-zone">ZONE</span></div>
            <div class="logo-top-line"></div>
            <div class="logo-top-sub">STOCK &nbsp;·&nbsp; PREMIUM</div>
        </div>
        <div class="neon-ticker-bar">
            <span class="ws-dot dead" id="ws-dot-header"></span>
            <span class="neon-item" id="neon-qqq">QQQ &nbsp;─</span><span style="color:#1a1a30;">|</span>
            <span class="neon-item" id="neon-spy">SPY &nbsp;─</span><span style="color:#1a1a30;">|</span>
            <span class="neon-item" id="neon-vix">VIX &nbsp;─</span>
        </div>
        <div class="top-right"><div class="top-time" id="h-time">연결 대기중</div></div>
    </div>

    <div class="content-wrapper">
        <div class="dashboard-grid">
            <script>
                document.write([0, 1, 2].map(function (i) {
                    return '\
<div class="panel" id="panel-'+ i + '">\
              <div class="ph">\
                <span class="ws-dot dead" id="p'+ i + '-dot"></span>\
                <span class="ticker-name" id="p'+ i + '-ticker">─</span>\
                <div class="price-container">\
                  <div class="price-block" id="p'+ i + '-reg-block">\
                    <span class="price-now" id="p'+ i + '-price">─</span>\
                    <span class="price-diff" id="p'+ i + '-diff">─</span>\
                    <span class="price-chg" id="p'+ i + '-chg">─</span>\
                  </div>\
                  <span class="price-divider" id="p'+ i + '-divider" style="display:none;">|</span>\
                  <div class="ext-block" id="p'+ i + '-ext-block" style="display:none;">\
                    <span class="ext-label" id="p'+ i + '-ext-label"></span>\
                    <span class="ext-price" id="p'+ i + '-ext-price">─</span>\
                    <span class="ext-diff" id="p'+ i + '-ext-diff">─</span>\
                    <span class="ext-chg" id="p'+ i + '-ext-chg">─</span>\
                  </div>\
                </div>\
              </div>\
              <div class="strategy-box">\
                <div class="sb-header">\
                  <span class="sb-title" id="p'+ i + '-sigtitle">🟡 방향성 탐색 (관망)</span>\
                  <span class="sb-trend" id="p'+ i + '-trend">대기중</span>\
                </div>\
                <div class="timeline" id="p'+ i + '-timeline"></div>\
              </div>\
              <div class="oi-box">\
                <div class="oi-header">\
                  <span class="oi-title"><span class="oi-dot" id="p'+ i + '-oi-dot"></span><span id="p' + i + '-oi-title">─ 옵션 체인</span></span>\
                  <span class="oi-dte" id="p'+ i + '-dte">🗓️ 대기중</span>\
                </div>\
                <div class="oi-summary">\
                  <span class="oi-sum-item" id="p'+ i + '-sum-power">수급 대기중</span>\
                  <span class="oi-sum-item" id="p'+ i + '-sum-env">지수 대기중</span>\
                </div>\
                <div class="oi-grid-header">\
                  <div style="text-align:right;padding-right:2px;">콜</div>\
                  <div>OI/V</div><div>등락</div><div>행사가</div><div>등락</div><div>OI/V</div>\
                  <div style="text-align:left;padding-left:2px;">풋</div>\
                </div>\
                <div id="p'+ i + '-oi-rows"></div>\
              </div>\
              <div class="chart-wrapper">\
                <select class="chart-interval-select" id="interval-'+ i + '" onchange="changeInterval(' + i + ', this.value)">\
                  <option value="1">1분봉</option>\
                  <option value="3" selected>3분봉</option>\
                  <option value="5">5분봉</option>\
                  <option value="15">15분봉</option>\
                  <option value="60">1시간</option>\
                  <option value="D">일봉</option>\
                </select>\
                <div class="chart-section" id="chart-'+ i + '"></div>\
              </div>\
</div>';
                }).join(''));
            </script>
        </div>
        <div class="sidebar">
            <div class="sidebar-logo">
                <div class="sl-name"><span class="sl-strike">STRIKE</span><span class="sl-zone">ZONE</span></div>
                <div class="sl-line"></div>
                <div class="sl-sub">STOCK &nbsp;·&nbsp; PREMIUM</div>
            </div>
            <div class="sidebar-menu">[메뉴] 알림 · 설정 · 포트폴리오</div>
            <div class="sidebar-watchlist">
                <h3 style="margin:0 0 8px;font-size:13px;color:#aaa;font-weight:600;">⭐ 관심 종목</h3>
                <input type="text" class="search-box" placeholder="티커 검색 (예: TSLA)">
                <div class="ticker-list">
                    <label class="ticker-item"><input type="checkbox" checked> TSLA (테슬라)</label>
                    <label class="ticker-item"><input type="checkbox" checked> NVDA (엔비디아)</label>
                    <label class="ticker-item"><input type="checkbox" checked> PLTR (팔란티어)</label>
                    <label class="ticker-item"><input type="checkbox"> AAPL (애플)</label>
                    <label class="ticker-item"><input type="checkbox"> MSFT (마이크로소프트)</label>
                    <label class="ticker-item"><input type="checkbox"> AMZN (아마존)</label>
                </div>
            </div>
            <div class="sidebar-ad">광고 영역 (300×250)</div>
        </div>
    </div>

    <script>
        var DASH_TICKERS = ['TSLA', 'NVDA', 'PLTR'];
        var HEADER_TICKERS = ['QQQ', 'SPY', '^VIX'];
        var ALL_SUB = DASH_TICKERS.concat(HEADER_TICKERS);
        var FIREBASE_URL = 'https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/';

        var PricingData = null;
        var yahooWs = null;
        var yahooRunning = false;
        var yahooReconTimer = null;
        var lastMsgTime = 0;

        var prevCloseCache = {};
        var yahooPriceCache = {};
        var panelDataStore = {};
        var headerPrevClose = {};
        var panelIntervals = { 0: '3', 1: '3', 2: '3' };

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';

        (function initProto() {
            var P = 'syntax="proto3";message PricingData{string id=1;float price=2;sint64 time=3;string currency=4;string exchange=5;int32 quoteType=6;int32 marketHours=7;float changePercent=8;sint64 dayVolume=9;float dayHigh=10;float dayLow=11;float change=12;string shortName=13;sint64 expireDate=14;float openPrice=15;float previousClose=16;float strikePrice=17;string underlyingSymbol=18;sint64 openInterest=19;sint64 optionsType=20;sint64 miniOption=21;sint64 lastSize=22;float bid=23;sint64 bidSize=24;float ask=25;sint64 askSize=26;sint64 priceHint=27;sint64 vol_24hr=28;sint64 volAllCurrencies=29;string fromcurrency=30;string lastMarket=31;double circulatingSupply=32;double marketcap=33;}';
            try {
                var root = protobuf.parse(P).root;
                root.resolveAll();
                PricingData = root.lookupType('PricingData');
            } catch (e) { console.error('Proto 실패:', e); }
        })();

        function yahooWsConnect() {
            if (yahooWs && (yahooWs.readyState === WebSocket.CONNECTING || yahooWs.readyState === WebSocket.OPEN)) return;
            yahooRunning = true;
            try {
                yahooWs = new WebSocket('wss://streamer.finance.yahoo.com');
                yahooWs.binaryType = 'arraybuffer';
                yahooWs.onopen = function () {
                    clearTimeout(yahooReconTimer);
                    setWsDot('live');
                    yahooWs.send(JSON.stringify({ subscribe: ALL_SUB }));
                };
                yahooWs.onmessage = function (ev) {
                    if (!PricingData) return;
                    try {
                        var bytes;
                        if (ev.data instanceof ArrayBuffer) {
                            bytes = new Uint8Array(ev.data);
                        } else {
                            var bin = atob(ev.data);
                            bytes = new Uint8Array(bin.length);
                            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        }
                        var msg = PricingData.decode(bytes);
                        if (msg && msg.id && msg.price > 0) onYahooMsg(msg);
                    } catch (e) { }
                };
                yahooWs.onerror = function () { setWsDot('dead'); };
                yahooWs.onclose = function () {
                    setWsDot('dead');
                    if (yahooRunning) yahooReconTimer = setTimeout(yahooWsConnect, 5000);
                };
            } catch (e) {
                setWsDot('dead');
                if (yahooRunning) yahooReconTimer = setTimeout(yahooWsConnect, 5000);
            }
        }

        function initFirebaseBackground() {
            var isWF = window.chrome && window.chrome.webview;
            if (isWF) return;
            try {
                if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_URL });
                firebase.database().ref('tickers').on('value', function (snap) {
                    var data = snap.val();
                    if (data) applyFirebaseData(data);
                });
            } catch (e) { }
        }

        function applyFirebaseData(data) {
            var keys = Object.keys(data);
            if (keys.length && data[keys[0]] && data[keys[0]].header)
                window.onWsMessage(data[keys[0]].header);
            DASH_TICKERS.forEach(function (t, i) {
                if (data[t] && data[t].panel) {
                    var p = JSON.parse(JSON.stringify(data[t].panel));
                    p.panel = i;
                    window.onWsMessage(p);
                }
            });
        }

        function onYahooMsg(msg) {
            lastMsgTime = Date.now();
            updateTimeDisplay();
            var ticker = msg.id;

            if (HEADER_TICKERS.indexOf(ticker) >= 0) { updateHeaderTicker(ticker, msg); return; }

            var idx = DASH_TICKERS.indexOf(ticker);
            if (idx < 0) return;

            var price = msg.price;
            var extChgAmt = msg.change !== undefined ? msg.change : 0;
            var extChgPct = msg.changePercent !== undefined ? msg.changePercent : 0;
            var mh = msg.marketHours || 2;

            var regPrice = price;
            if (mh !== 2) { 
                regPrice = price - extChgAmt; 
            }

            var yesterdayClose = prevCloseCache[ticker] || 0;
            if (msg.previousClose > 0) yesterdayClose = msg.previousClose;
            
            if (yesterdayClose <= 0 && panelDataStore[idx] && panelDataStore[idx].priceDiff !== undefined) {
                yesterdayClose = panelDataStore[idx].price - panelDataStore[idx].priceDiff;
            }
            prevCloseCache[ticker] = yesterdayClose;

            var regChgAmt = 0;
            var regChgPct = 0;
            if (yesterdayClose > 0) {
                regChgAmt = regPrice - yesterdayClose;
                regChgPct = (regChgAmt / yesterdayClose) * 100;
            }

            yahooPriceCache[ticker] = { 
                price: price, changePct: extChgPct, changeAmt: extChgAmt, prevClose: yesterdayClose, mh: mh 
            };

            var tkEl = document.getElementById('p' + idx + '-ticker');
            if (tkEl && tkEl.textContent === '─') {
                tkEl.textContent = ticker;
                var oiTEl = document.getElementById('p' + idx + '-oi-title');
                if (oiTEl) oiTEl.textContent = ticker + ' 옵션 체인';
            }

            updatePanelPrice(idx, price, extChgPct, extChgAmt, mh, regPrice, regChgAmt, regChgPct);

            var d = panelDataStore[idx];
            if (d && d.maxPain > 0) {
                renderTimeline('p' + idx + '-', Object.assign({}, d, { price: price }));
                if (d.optionRows && d.optionRows.length) renderOiGrid('p' + idx + '-', d.optionRows, price, d);
            }
        }

        function updateHeaderTicker(ticker, msg) {
            var prev = headerPrevClose[ticker] || 0;
            var chg = prev > 0 ? ((msg.price - prev) / prev * 100) : msg.changePercent;
            var sign = chg > 0 ? '+' : '';
            var cls = chg > 0 ? 'up' : chg < 0 ? 'dn' : 'neu';

            if (ticker === 'QQQ') {
                globQqq = chg;
                var el = document.getElementById('neon-qqq');
                if (el) { el.textContent = 'QQQ ' + sign + chg.toFixed(2) + '%'; el.className = 'neon-item ' + cls; }
            } else if (ticker === 'SPY') {
                globSpy = chg;
                var el2 = document.getElementById('neon-spy');
                if (el2) { el2.textContent = 'SPY ' + sign + chg.toFixed(2) + '%'; el2.className = 'neon-item ' + cls; }
            } else if (ticker === '^VIX') {
                globVix = msg.price;
                globVixState = msg.price >= 30 ? '공포패닉' : msg.price >= 20 ? '불안' : msg.price >= 15 ? '주의' : '안정';
                var vCol = globVixState.indexOf('공포') >= 0 ? 'up' : globVixState.indexOf('주의') >= 0 ? 'neon-vix-warn' : 'neu';
                var el3 = document.getElementById('neon-vix');
                if (el3) { el3.textContent = 'VIX ' + msg.price.toFixed(2) + ' (' + globVixState + ')'; el3.className = 'neon-item ' + vCol; }
            }
            var hd = document.getElementById('ws-dot-header');
            if (hd) hd.className = 'ws-dot live';
            DASH_TICKERS.forEach(function (_, i) { updateEnvSummary(i); });
        }

        function updatePanelPrice(idx, price, extChgPct, extChgAmt, marketHours, regPrice, regChgAmt, regChgPct) {
            var p = 'p' + idx + '-';
            
            regPrice = regPrice !== undefined ? regPrice : price;
            regChgAmt = regChgAmt !== undefined ? regChgAmt : extChgAmt;
            regChgPct = regChgPct !== undefined ? regChgPct : extChgPct;

            var regCls = regChgPct > 0 ? 'up' : regChgPct < 0 ? 'dn' : 'neu';
            var regPxText = regPrice > 0 ? regPrice.toFixed(2) : '─';
            var regDfText = regPrice > 0 ? (regChgAmt > 0 ? '+' : '') + regChgAmt.toFixed(2) : '─';
            var regCgText = regPrice > 0 ? '(' + (regChgPct > 0 ? '+' : '') + regChgPct.toFixed(2) + '%)' : '─';

            var extCls = extChgPct > 0 ? 'up' : extChgPct < 0 ? 'dn' : 'neu';
            var extPxText = price > 0 ? price.toFixed(2) : '─';
            var extDfText = price > 0 ? (extChgAmt > 0 ? '+' : '') + extChgAmt.toFixed(2) : '─';
            var extCgText = price > 0 ? '(' + (extChgPct > 0 ? '+' : '') + extChgPct.toFixed(2) + '%)' : '─';

            var extBlock = document.getElementById(p + 'ext-block');
            var divider = document.getElementById(p + 'divider');

            var pxEl = document.getElementById(p + 'price');
            var dfEl = document.getElementById(p + 'diff');
            var cgEl = document.getElementById(p + 'chg');

            if (marketHours === 2 || !marketHours) {
                if (extBlock) extBlock.style.display = 'none';
                if (divider) divider.style.display = 'none';

                if (pxEl) { pxEl.textContent = regPxText; pxEl.className = 'price-now ' + regCls; }
                if (dfEl) { dfEl.textContent = regDfText; dfEl.className = 'price-diff ' + regCls; }
                if (cgEl) { cgEl.textContent = regCgText; cgEl.className = 'price-chg ' + regCls; }
            } else {
                if (extBlock) extBlock.style.display = 'flex';
                if (divider) divider.style.display = 'inline-block';

                if (pxEl) { pxEl.textContent = regPxText; pxEl.className = 'price-now ' + regCls; }
                if (dfEl) { dfEl.textContent = regDfText; dfEl.className = 'price-diff ' + regCls; }
                if (cgEl) { cgEl.textContent = regCgText; cgEl.className = 'price-chg ' + regCls; }

                var extPxEl = document.getElementById(p + 'ext-price');
                if (extPxEl) { extPxEl.textContent = extPxText; extPxEl.className = 'ext-price ' + extCls; }
                var extDfEl = document.getElementById(p + 'ext-diff');
                if (extDfEl) { extDfEl.textContent = extDfText; extDfEl.className = 'ext-diff ' + extCls; }
                var extCgEl = document.getElementById(p + 'ext-chg');
                if (extCgEl) { extCgEl.textContent = extCgText; extCgEl.className = 'ext-chg ' + extCls; }
            }

            var dot = document.getElementById(p + 'dot');
            if (dot) dot.className = 'ws-dot live';
        }

        window.onWsMessage = function (d) {
            if (!d || !d.type) return;

            if (d.type === 'headerUpdate') {
                if (Date.now() - lastMsgTime < 30000) return;
                globQqq = d.qqq || 0; globSpy = d.spy || 0;
                globVix = d.vix || 0; globVixState = d.vixState || '안정';
                updateNeonFromGlobal();
                if (d.qqq !== undefined) headerPrevClose['QQQ'] = 0;
                return;
            }

            if (d.type === 'optionUpdate') {
                var panel = d.panel;
                var ticker = d.ticker;
                if (panel === undefined || !ticker) return;

                if (d.prevClose && d.prevClose > 0) {
                    prevCloseCache[ticker] = d.prevClose;
                } else if (d.price > 0 && d.priceDiff !== undefined) {
                    prevCloseCache[ticker] = d.price - d.priceDiff;
                }

                if (d.maxPain !== undefined && d.maxPain !== null) {
                    panelDataStore[panel] = JSON.parse(JSON.stringify(d));
                } else {
                    if (!panelDataStore[panel]) panelDataStore[panel] = {};
                    Object.assign(panelDataStore[panel], d);
                }

                var yc = yahooPriceCache[ticker];
                var price = yc ? yc.price : (d.price || 0);
                var mh = yc ? yc.mh : 2;
                
                var extChgAmt = yc ? yc.changeAmt : (d.priceDiff || 0);
                var extChgPct = yc ? yc.changePct : (d.change || 0);

                var tkEl = document.getElementById('p' + panel + '-ticker');
                if (tkEl && tkEl.textContent === '─') tkEl.textContent = ticker;
                var oiTEl = document.getElementById('p' + panel + '-oi-title');
                if (oiTEl) oiTEl.textContent = ticker + ' 옵션 체인';

                var dotEl = document.getElementById('p' + panel + '-oi-dot');
                if (dotEl && d.maxPain !== undefined && d.maxPain !== null) {
                    dotEl.className = 'oi-dot flash';
                    setTimeout(function () { dotEl.className = 'oi-dot'; }, 900);
                }

                updatePanelPrice(panel, price, extChgPct, extChgAmt, mh, price, extChgAmt, extChgPct);
                renderPanel(panel, panelDataStore[panel], price);
            }
        };

        function renderPanel(panel, d, currentPrice) {
            var p = 'p' + panel + '-';
            var price = currentPrice || d.price || 0;
            
            if (d.score !== undefined) {
                var sigEl = document.getElementById(p + 'sigtitle');
                if (sigEl) {
                    if (d.score >= 9.0) { sigEl.textContent = '극단적 과열 (차익실현 경계)'; sigEl.style.color = '#ff3333'; }
                    else if (d.score >= 7.5) { sigEl.textContent = '강한 상승 (추격매수 주의)'; sigEl.style.color = '#ff6666'; }
                    else if (d.score >= 5.6) { sigEl.textContent = '상승 추세 (콜 매수세 유입)'; sigEl.style.color = '#ffaaaa'; }
                    else if (d.score >= 4.5) { sigEl.textContent = '방향성 탐색 (수급 팽팽)'; sigEl.style.color = '#ddbb00'; }
                    else if (d.score >= 2.6) { sigEl.textContent = '하락 추세 (풋 매수세 유입)'; sigEl.style.color = '#88bbff'; }
                    else if (d.score >= 1.1) { sigEl.textContent = '강한 하락 (투매 동참 주의)'; sigEl.style.color = '#4488ff'; }
                    else { sigEl.textContent = '극단적 투매 (숏커버링 유의)'; sigEl.style.color = '#aa44ff'; }
                }
                var trEl = document.getElementById(p + 'trend');
                if (trEl) trEl.innerHTML = d.trendText || '대기중';
            }

            if (d.maxPain > 0 && price > 0) renderTimeline(p, Object.assign({}, d, { price: price }));

            var dteEl = document.getElementById(p + 'dte');
            if (dteEl && d.dteLabel) dteEl.textContent = '🗓️ ' + d.dteLabel;

            if (d.score !== undefined) {
                var spEl = document.getElementById(p + 'sum-power');
                if (spEl) {
                    var s = '';
                    if (d.score >= 9.0) s = '<b style="color:#ff3333;">숏 스퀴즈 절정</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 7.5) s = '<b style="color:#ff6666;">콜 매수 쏠림</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 5.6) s = '<b style="color:#ffaaaa;">상승 우위</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 4.5) s = '<b class="c-gold">보합 (중립)</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 2.6) s = '<b style="color:#88bbff;">하락 우위</b> (' + d.score.toFixed(1) + '점)';
                    else if (d.score >= 1.1) s = '<b style="color:#4488ff;">풋 매수 쏠림</b> (' + d.score.toFixed(1) + '점)';
                    else s = '<b style="color:#aa44ff;">패닉셀 / 과매도</b> (' + d.score.toFixed(1) + '점)';

                    spEl.innerHTML = '수급: ' + s;
                }
            }
            updateEnvSummary(panel);

            if (d.optionRows && d.optionRows.length) renderOiGrid(p, d.optionRows, price || (d.maxPain || 100), d);

            updateChartWidget(panel, d.ticker);
        }

        function updateChartWidget(panel, ticker) {
            if (!ticker) return;
            var containerId = 'chart-' + panel;
            var currentInterval = panelIntervals[panel] || '3';

            document.getElementById(containerId).innerHTML = '';
            new TradingView.widget({
                autosize: true,
                symbol: ticker,
                interval: currentInterval,
                theme: 'dark',
                style: '1',
                hide_top_toolbar: true,
                hide_side_toolbar: true,
                hide_legend: true,
                allow_symbol_change: false,
                save_image: false,
                details: false,
                withdateranges: false,
                container_id: containerId
            });
        }

        function changeInterval(panel, val) {
            panelIntervals[panel] = val;
            var ticker = window['tvT' + panel] || (panelDataStore[panel] ? panelDataStore[panel].ticker : null);
            if (!ticker) {
                if (panel === 0) ticker = 'TSLA';
                else if (panel === 1) ticker = 'NVDA';
                else if (panel === 2) ticker = 'PLTR';
            }
            updateChartWidget(panel, ticker);
        }

        function updateEnvSummary(i) {
            var el = document.getElementById('p' + i + '-sum-env');
            if (!el) return;
            var qStr = globQqq === null ? '─' : globQqq > 0 ? '<b class="c-red">▲ 상승</b>' : globQqq < 0 ? '<b class="c-blue">▼ 하락</b>' : '<b>─</b>';
            var sStr = globSpy === null ? '─' : globSpy > 0 ? '<b class="c-red">▲ 상승</b>' : globSpy < 0 ? '<b class="c-blue">▼ 하락</b>' : '<b>─</b>';
            var vCol = globVixState.indexOf('공포') >= 0 ? 'c-red' : globVixState.indexOf('주의') >= 0 ? 'c-gold' : 'c-green';
            var vStr = globVix === null ? '─' : '<b class="' + vCol + '">' + globVixState + '</b>';
            el.innerHTML = '지수: QQQ ' + qStr + ' / SPY ' + sStr + ' / VIX ' + vStr;
        }

        function updateNeonFromGlobal() {
            var qEl = document.getElementById('neon-qqq'), sEl = document.getElementById('neon-spy'), vEl = document.getElementById('neon-vix');
            if (globQqq !== null && qEl) { qEl.textContent = 'QQQ ' + (globQqq > 0 ? '+' : '') + globQqq.toFixed(2) + '%'; qEl.className = 'neon-item ' + (globQqq > 0 ? 'up' : globQqq < 0 ? 'dn' : 'neu'); }
            if (globSpy !== null && sEl) { sEl.textContent = 'SPY ' + (globSpy > 0 ? '+' : '') + globSpy.toFixed(2) + '%'; sEl.className = 'neon-item ' + (globSpy > 0 ? 'up' : globSpy < 0 ? 'dn' : 'neu'); }
            if (globVix !== null && vEl) { vEl.textContent = 'VIX ' + globVix.toFixed(2) + ' (' + globVixState + ')'; vEl.className = 'neon-item ' + (globVixState.indexOf('공포') >= 0 ? 'up' : globVixState.indexOf('주의') >= 0 ? 'neon-vix-warn' : 'neu'); }
        }

        function setWsDot(state) {
            var cls = state === 'live' ? 'ws-dot live' : 'ws-dot dead';
            DASH_TICKERS.forEach(function (_, i) { var el = document.getElementById('p' + i + '-dot'); if (el) el.className = cls; });
            var hd = document.getElementById('ws-dot-header'); if (hd) hd.className = cls;
        }

        function updateTimeDisplay() {
            var el = document.getElementById('h-time'); if (!el) return;
            var n = new Date();
            el.textContent = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0') + ' ' + n.toLocaleTimeString('ko-KR');
        }

        setInterval(function () { if (lastMsgTime > 0 && Date.now() - lastMsgTime > 20000) setWsDot('dead'); }, 3000);

        // 🌟 PC 겹침 해결 강화: 창 크기 변화에 상관없이 명확한 가격 비율 계산 적용
        function renderTimeline(p, d) {
            var tl = document.getElementById(p + 'timeline'); if (!tl) return;
            var vals = [d.support2, d.support1, d.maxPain, d.price, d.resistance1, d.resistance2].filter(function (v) { return v > 0; });
            if (!vals.length) return;

            var isMobile = window.innerWidth <= 1200;

            var bots = [
                { val: d.support2, lbl: '2차 지지', c: 'c-red', bg: 'bg-red' },
                { val: d.support1, lbl: '1차 지지', c: 'c-red', bg: 'bg-red' },
                { val: d.maxPain, lbl: 'MaxPain', c: 'c-gold', bg: 'bg-gold' },
                { val: d.resistance1, lbl: '1차 저항', c: 'c-blue', bg: 'bg-blue' },
                { val: d.resistance2, lbl: '2차 저항', c: 'c-blue', bg: 'bg-blue' }
            ].filter(function (n) { return n.val > 0; });

            var tops = [
                { val: d.price, lbl: '현재가', c: 'c-blue', bg: 'bg-blue', lg: true }
            ].filter(function (n) { return n.val > 0; });

            var allNodes = bots.concat(tops);
            allNodes.sort(function (a, b) { return a.val - b.val; });

            if (isMobile && allNodes.length > 1) {
                var step = 88 / (allNodes.length - 1);
                allNodes.forEach(function (n, idx) { n.pos = 6 + (idx * step); });
                bots.forEach(function(bNode) {
                    var found = allNodes.filter(function(an){ return an.val === bNode.val; })[0];
                    if(found) bNode.pos = found.pos;
                });
                tops.forEach(function(tNode) {
                    var found = allNodes.filter(function(an){ return an.val === tNode.val; })[0];
                    if(found) tNode.pos = found.pos;
                });
            } else {
                var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), sp = mx - mn || 1;
                mn -= sp * 0.15; mx += sp * 0.15; sp = mx - mn;
                var gp = function (v) { return 6 + Math.max(0, Math.min(1, (v - mn) / sp)) * 88; };
                
                bots.forEach(function (n) { n.pos = gp(n.val); }); 
                bots.sort(function (a, b) { return a.pos - b.pos; });
                for (var i = 1; i < bots.length; i++) if (bots[i].pos - bots[i - 1].pos < 14) bots[i].pos = bots[i - 1].pos + 14;
                
                tops.forEach(function (n) { n.pos = gp(n.val); }); 
            }

            var html = '<div class="tl-track"></div>';
            bots.forEach(function (n) { 
                html += '<div class="node node-bottom" style="left:' + n.pos + '%"><div class="lbl-box"><span class="val ' + n.c + '">' + n.val.toFixed(1) + '</span><span class="lbl">' + n.lbl + '</span></div></div><div class="dot-tl dot-small ' + n.bg + '" style="left:' + n.pos + '%"></div>'; 
            });
            tops.forEach(function (n) { 
                html += '<div class="node node-top" style="left:' + n.pos + '%;z-index:20;"><div class="lbl-box"><span class="val ' + n.c + '">' + n.lbl + ' ' + n.val.toFixed(1) + '</span></div></div><div class="dot-triangle" style="left:' + n.pos + '%;"></div>'; 
            });
            tl.innerHTML = html;
        }

        // 🌟 옵션 체인 렌더링: 행(Row) 단위 통일 적용으로 삐뚤어짐 없는 실선 및 배경 하이라이트 구현
        function renderOiGrid(p, rows, price, d) {
            var el = document.getElementById(p + 'oi-rows'); if (!el) return;
            var isMobile = window.innerWidth <= 1200;

            var mx = Math.max.apply(null, rows.map(function (r) { return Math.max(r.callOI + r.callVol, r.putOI + r.putVol, 1); }));
            var atm = rows.reduce(function (pv, cv) { return Math.abs(cv.strike - price) < Math.abs(pv.strike - price) ? cv : pv; }).strike;
            var fmt = function (v) { return v >= 1000 ? (v / 1000).toFixed(1) + 'K' : (v === 0 ? '-' : v); };

            var s2 = d.support2 || 0;
            var s1 = d.support1 || 0;
            var r1 = d.resistance1 || 0;
            var r2 = d.resistance2 || 0;

            el.innerHTML = rows.map(function (r) {
                var cw = Math.max(1, ((r.callOI + r.callVol) / mx) * 100), pw = Math.max(1, ((r.putOI + r.putVol) / mx) * 100);
                var ia = r.strike === atm ? 'atm' : '';
                var cc = r.callChg > 0 ? 'up' : r.callChg < 0 ? 'dn' : 'neu', pc = r.putChg > 0 ? 'up' : r.putChg < 0 ? 'dn' : 'neu';

                var callSum = r.callOI + r.callVol;
                var putSum = r.putOI + r.putVol;

                var callVolText = isMobile ? fmt(callSum) : (fmt(r.callOI) + '/' + fmt(r.callVol));
                var putVolText = isMobile ? fmt(putSum) : (fmt(r.putOI) + '/' + fmt(r.putVol));

                var ct = (r.callChg > 0 ? '+' : '') + (isMobile ? Math.round(r.callChg) : r.callChg.toFixed(1)) + '%';
                var pt = (r.putChg > 0 ? '+' : '') + (isMobile ? Math.round(r.putChg) : r.putChg.toFixed(1)) + '%';

                // 행 전체(Row)에 적용할 스타일 판별
                var rowClass = 'oi-row';
                var bgStyle = '';
                
                // 배경 하이라이트 (구역감)
                if (r2 > 0 && s2 > 0 && r.strike <= r2 && r.strike >= s2) {
                    if (r.strike <= r1 && r.strike >= s1) {
                        bgStyle = ' zone-band-inner'; // 1차 ~ 1차 공방 구역
                    } else {
                        bgStyle = ' zone-band-outer'; // 2차 ~ 2차 예상 변동 구간
                    }
                }

                // 경계선 (실선)
                if (r2 > 0 && Math.abs(r.strike - r2) < 0.25) rowClass += ' border-t-white'; // 2차 저항 위쪽 흰색 실선
                else if (r1 > 0 && Math.abs(r.strike - r1) < 0.25) rowClass += ' border-t-gray';  // 1차 저항 위쪽 회색 실선
                else if (s1 > 0 && Math.abs(r.strike - s1) < 0.25) rowClass += ' border-b-gray';  // 1차 지지 아래쪽 회색 실선
                else if (s2 > 0 && Math.abs(r.strike - s2) < 0.25) rowClass += ' border-b-white'; // 2차 지지 아래쪽 흰색 실선

                return '<div class="' + rowClass + bgStyle + '">' +
                    '<div class="oi-bar-wrap left"><div class="oi-bar call" style="width:' + cw + '%"></div></div>' +
                    '<div class="oi-vol">' + callVolText + '</div>' +
                    '<div class="' + cc + '">' + ct + '</div>' +
                    '<div><span class="strike-box ' + ia + '">' + r.strike.toFixed(1) + '</span></div>' +
                    '<div class="' + pc + '">' + pt + '</div>' +
                    '<div class="oi-vol">' + putVolText + '</div>' +
                    '<div class="oi-bar-wrap right"><div class="oi-bar put" style="width:' + pw + '%"></div></div>' +
                    '</div>';
            }).join('');
        }

        (async function start() {
            yahooWsConnect();
            initFirebaseBackground();
        })();
    </script>
</body>
