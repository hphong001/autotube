        .ai-pop button.ai-c small { display: block; font-weight: 400; color: #8b93a7; font-size: 11px; margin-top: 2px; }

        .ai-pop .ai-x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #8b93a7; font-size: 16px; cursor: pointer; }

        .mk-grid { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: 38px 38px; grid-auto-flow: column; column-gap: 8px; row-gap: 5px; }   /* 세로로 채움 → 위: QQQ·나스닥선물·비트코인·달러인덱스·VIX / 아래: SPY·금선물·미국채10년·원달러환율·WTI원유 */
        .mk-cell { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 8px; border-radius: 7px; background: rgba(255, 255, 255, .03); border: 1px solid rgba(160, 170, 200, .16); }
        .mk-txt { flex: 0 0 auto; min-width: 124px; display: flex; flex-direction: column; gap: 1px; }   /* 글자 길이만큼 (최소 124px) → 숫자가 잘리지 않음 */
        .mk-nm { display: flex; align-items: center; gap: 5px; white-space: nowrap; }

        .mk-dot { width: 6px; height: 6px; border-radius: 50%; background: #4a5163; flex-shrink: 0; }
        .mk-dot.live { background: #3ecf8e; box-shadow: 0 0 0 3px rgba(62, 207, 142, .18); }
        .mk-vl { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; overflow: hidden; }

        .mk-cell.stale .val, .mk-cell.stale .mk-ch { color: #aab2c3 !important; }
        .mk-sp { flex: 1 1 auto; min-width: 60px; max-width: 220px; height: 30px; }
        .mk-cell { overflow: hidden; }
        /* 창 폭이 줄면: 글자 칸·차트를 함께 줄여 겹치거나 잘리지 않게 */

        @media screen and (min-width: 1201px) and (max-width: 1320px) { .mk-sp { display: none; } .mk-txt { flex: 1 1 auto; } }   /* 아주 좁으면 숫자 우선 (미니차트 숨김) */   /* 제목 바로 옆에서 시작, 칸의 남은 폭을 채움 (최대 220px) */

    <script>

        // ════════════════════════════════════════════════════════

            'USO': 'WTI 원유 ETF',
            'IAU': '금 현물 ETF(IAU)'
        };
        // ★ system/symbolList : 윈폼(C#)이 코드 순서대로 기록한 [{cd, nm}, ...]
        //   → 콤보박스 순서와 한글 이름은 이 목록을 그대로 따름
        var serverSymbolOrder = [];   // ['SQQQ','TQQQ', ...] (윈폼 코드 순서)
        var serverTickerNames = {};   // { SQQQ:'나스닥 3배 인버스', ... }

        function tickerName(t) { return serverTickerNames[t] || TICKER_NAMES[t] || t; }

        function orderTickers(list) {
            // 윈폼 순서가 있으면 그 순서, 없으면 기본 이름표 순서. 둘 다 없는 종목은 뒤에 알파벳순
            var order = serverSymbolOrder.length ? serverSymbolOrder : Object.keys(TICKER_NAMES);
            return list.slice().sort(function (a, b) {
                var ia = order.indexOf(a), ib = order.indexOf(b);
                if (ia < 0 && ib < 0) return a < b ? -1 : a > b ? 1 : 0;
                if (ia < 0) return 1;
                if (ib < 0) return -1;
                return ia - ib;
            });
        }

        // 서버 종목 목록으로 콤보박스 3개 + 관심종목 사이드바 다시 만들기
        function applyTickerList(list) {
            var ordered = orderTickers(list);
            // 현재 패널에 떠 있는 종목이 목록에 없으면 선택이 깨지지 않도록 유지
            panelTickers.forEach(function (t) { if (t && ordered.indexOf(t) < 0) ordered.push(t); });
            var newWatch = ordered.map(function (t) { return { ticker: t, name: tickerName(t) }; });
            if (JSON.stringify(newWatch) === JSON.stringify(WATCH_LIST)) return; // 변화 없음
            WATCH_LIST = newWatch;

            var opts = WATCH_LIST.map(function (w) { return '<option value="' + w.ticker + '">' + w.ticker + ' (' + w.name + ')</option>'; }).join('');
            [0, 1, 2].forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i);
                if (!sel) return;
                sel.innerHTML = opts;
                sel.value = panelTickers[i];
            });
            buildWatchlist();
            refreshAllDropdowns();
            console.log('[종목] 콤보박스 갱신: ' + WATCH_LIST.length + '종목');
        }

        function loadServerTickerNames() {
            try {
                return firebase.database().ref('system/symbolList').once('value').then(function (snap) {
                    var v = snap.val();
                    if (!v || typeof v !== 'object') return;
                    // 배열로 오거나 {"0":{..},"1":{..}} 형태로 올 수 있음 → 번호 순으로 정리
                    var items = Array.isArray(v) ? v : Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; });
                    var order = [], names = {};
                    items.forEach(function (it) {
                        if (!it || !it.cd || names.hasOwnProperty(it.cd)) return;
                        order.push(it.cd);
                        names[it.cd] = it.nm || it.cd;
                    });
                    if (order.length) { serverSymbolOrder = order; serverTickerNames = names; }
                }).catch(function () { });
            } catch (e) { return Promise.resolve(); }
        }

        var DEFAULT_PANELS = ['TSLA', 'NVDA', 'PLTR'];
        var LS_PANELS = 'sz_panels';
        var LS_INTERVAL = 'sz_interval';

        var panelTickers = loadLS(LS_PANELS, DEFAULT_PANELS);
        var panelIntervals = loadLS(LS_INTERVAL, { 0: '3', 1: '3', 2: '3' });

        var panelDataStore = {};
        var fbRefs = {};
        var PricingData = null;

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';
        var currentChartTicker = { 0: null, 1: null, 2: null };
        var initialLoadDone = false;
        var switchTimers = { 0: null, 1: null, 2: null };
        var switchLocked = { 0: false, 1: false, 2: false };

        function loadLS(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }
        function numberWithCommas(x) {
            if (x === null || x === undefined || x === '') return '─';
            var n = Number(String(x).replace(/,/g, ''));
            if (isNaN(n) || n <= 0) return '─';
            return n.toLocaleString('en-US');
        }

        // ════════════════════════════════════════════════════════
        // ★ 상태 dot 블링킹 함수
        //   panelIdx : 패널 번호 (0,1,2)
        //   color    : '#ff4444' (키움/빨강) 또는 '#00aaff' (야후/파랑)
        //   0.7초 동안 켜졌다가 자동으로 꺼짐 (write 이벤트마다 한 번씩 점등)
        // ════════════════════════════════════════════════════════
        // 현재 패널 dot 상태 추적 (QQQ 헤더와 동일: 상태가 유지되는 동안 계속 켜짐)
        var _dotState = { 0: null, 1: null, 2: null }; // null | 'red' | 'blue'

        function setDotState(panelIdx, state) {
            // state: 'red' | 'blue' | 'red-stale' | 'blue-stale' | null(소등)
            var dotEl = document.getElementById('p' + panelIdx + '-status-dot');
            if (!dotEl) return;
            if (_dotState[panelIdx] === state) return; // 이미 같은 상태면 무시
            _dotState[panelIdx] = state;
            dotEl.classList.remove('dot-red', 'dot-blue', 'dot-stale');
            dotEl.style.removeProperty('background-color');
            dotEl.style.removeProperty('box-shadow');
            dotEl.style.removeProperty('opacity');
            void dotEl.offsetWidth; // reflow
            if (state && state.indexOf('red') === 0) dotEl.classList.add('dot-red');
            else if (state && state.indexOf('blue') === 0) dotEl.classList.add('dot-blue');
            if (state && state.indexOf('-stale') > 0) dotEl.classList.add('dot-stale');
        }

        // blinkDot은 하위 호환용으로 유지 — 색만 전달하면 됨
        function blinkDot(panelIdx, color) {
            var state = (color === '#ff4444' || color === 'red') ? 'red' : 'blue';
            setDotState(panelIdx, state);
        }

        // ──────────────────────────────────────────────────────────
        // ★ [PRO 버전] 아이콘 없음 + VWAP 중복 수정 + 매크로 종합 시황 추가
        // ──────────────────────────────────────────────────────────
        // ════════════════════════════════════════════════════════
        // ★ 실시간 단타 엔진 (틱 버퍼 → 모멘텀·거래량·VWAP·레벨 이벤트)
        //   - VWAP: 키움 연결 시 C#이 체결 단위로 계산한 값(realtime.vwap) 사용
        //           야후 시세일 때는 페이지를 연 뒤 수집한 값으로 자체 계산
        //   - VWAP 세션 기준(ET): 20:00~ / 04:00~ / 09:30~16:00(정규장, 16:00 고정) / 16:00~ (C# VwapAnchorEt 와 동일)
        //   - 정규장 외 시간에는 체결 필터(급변 체결 보류·확인)를 거친 시세만 판단에 사용
        // ════════════════════════════════════════════════════════
        var RT = {};                       // 패널별 실시간 상태
        var RT_KEEP_MS = 15 * 60 * 1000;   // 틱 15분 보관
        var RT_ZONE = 0.15;                // 레벨 "터치" 판정 거리(%)
        var RT_AWAY = 0.30;                // 레벨에서 "벗어남" 판정 거리(%)
        var RT_CROSS = 0.10;               // 돌파/이탈 확정 거리(%)

        function rtState(idx) {
            var tk = panelTickers[idx], s = RT[idx];
            if (!s || s.ticker !== tk) {
                s = RT[idx] = { ticker: tk, ticks: [], pv: 0, vol: 0, lastCum: 0, levels: {}, events: [],
                                src: '', extVwap: 0, sessKey: '' };
            }
            return s;
        }

        // 시세가 들어올 때마다 호출 (applyPanelQuote 안에서)
        // 현재 ET 시각 기준 VWAP 세션 키 (20:00~ / 04:00~ / 09:30~ / 16:00~)
        function rtSessKey() {
            var et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            var m = et.getHours() * 60 + et.getMinutes();
            var d = new Date(et.getFullYear(), et.getMonth(), et.getDate());
            if (m < 240) { d.setDate(d.getDate() - 1); return d.toDateString() + ' 20'; }
            var 마감분 = 정규장마감분(etNowParts().date);   // 조기 폐장일은 13:00 부터 애프터 세션
            return d.toDateString() + (m >= 1200 ? ' 20' : m >= 마감분 ? ' 16' : m >= 570 ? ' 0930' : ' 04');
        }

        // ── 실시간 체결 필터 (정규장 외, C# 체결필터_판정 과 같은 규칙) ──
        //   키움 시세는 C#에서 이미 걸러져 오고, 야후 시세(윈폼 없이 웹만 사용)일 때 여기서 거름
        var 필터_정규장사용 = false, 필터_한도 = { 프리: 1.5, 애프터: 1.5, 오버나이트: 2.0, 정규장: 3.0 };
        function 필터_세션() {
            var et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            var m = et.getHours() * 60 + et.getMinutes(), 요일 = et.getDay();
            if (요일 === 6 || (요일 === 0 && m < 1200)) return '오버나이트';
            return m < 240 || m >= 1200 ? '오버나이트' : m < 570 ? '프리' : m < 정규장마감분(etNowParts().date) ? '정규장' : '애프터';
        }
        function 필터_중앙값(a) { var b = a.slice().sort(function (x, y) { return x - y; }), k = b.length >> 1; return b.length % 2 ? b[k] : (b[k - 1] + b[k]) / 2; }
        // true = 판단에 반영 / false = 보류(이번 체결은 무시)
        function 체결필터(s, 가격) {
            var 세션 = 필터_세션(), f = s.필터 || (s.필터 = { 세션: '', 최근: [], 보류: [], 이어짐: 0, 복귀: 0, 판정수: 0, 방향: 0 });
            if (f.세션 !== 세션) { f.세션 = 세션; f.최근 = []; f.보류 = []; f.이어짐 = f.복귀 = f.판정수 = 0; }
            if (세션 === '정규장' && !필터_정규장사용) return true;
            function 정상(p) { f.최근.push(p); if (f.최근.length > 9) f.최근.shift(); }
            if (f.최근.length < 3) { 정상(가격); return true; }
            var 한도 = 필터_한도[세션], 기준 = 필터_중앙값(f.최근), 이탈 = (가격 - 기준) / 기준 * 100;
            if (!f.보류.length) {
                if (Math.abs(이탈) <= 한도) { 정상(가격); return true; }
                f.보류 = [가격]; f.방향 = 이탈 > 0 ? 1 : -1; f.이어짐 = f.복귀 = f.판정수 = 0;
                return false;
            }
            var 근접 = Math.abs(가격 - f.보류[0]) / f.보류[0] * 100 <= 0.5;
            var 같은방향 = (이탈 > 0 ? 1 : -1) === f.방향 && Math.abs(이탈) > 한도;
            f.판정수++;
            if (근접 || 같은방향) {
                f.보류.push(가격); f.이어짐++;
                if (f.이어짐 >= 2) { f.최근 = f.보류.slice(-9); f.보류 = []; f.이어짐 = f.복귀 = f.판정수 = 0; return true; }
                return false;
            }
            if (Math.abs(이탈) <= 한도) {
                정상(가격); f.복귀++;
                if (f.복귀 >= 2 || f.판정수 >= 3) { console.info('[체결 필터] ' + s.ticker + ' 이상 체결 무시 ' + f.보류.join(', ')); f.보류 = []; f.이어짐 = f.복귀 = f.판정수 = 0; }
                return true;
            }
            f.보류 = [가격]; f.방향 = 이탈 > 0 ? 1 : -1; f.이어짐 = f.복귀 = f.판정수 = 0;
            return false;

                    var 체결가 = 주문.체결조건 === '즉시' ? 가격 : (주문.방향 === '롱' ? Math.max(주문.진입가, 가격) : Math.min(주문.진입가, 가격));

                            계획손익비: Math.abs(주문.목표가 - 체결가) / Math.abs(체결가 - 주문.손절가),

                            신호: 주문.신호, VWAP: 주문.VWAP, 옵션점수: 주문.옵션점수, 시세출처: 주문.시세출처,
                            레벨: 주문.레벨, 레벨키: 주문.레벨키, 최대순행: 0, 최대역행: 0,

        // ── 키움 하트비트 구독 ─────────────────────────────────
        function initKiwoomHeartbeat() {
            try {

                var firstSnap = true;
                firebase.database().ref(KIWOOM_HB_PATH).on('value', function (snap) {

        // 키움 실시간 노드의 첫 스냅샷 시각: 윈폼이 기록한 updatedAtMs (미래 값은 지금으로)

        function pickQuote(ticker) {

                return etYmd(f);

        function restNeeded(t) {
            if (!t) return false;

            Array.prototype.forEach.call(창.querySelectorAll('.al-q button'), function (b) { b.onclick = function () { inp.value = Number(b.getAttribute('data-v')).toFixed(2); 방향표시(); }; });
            Array.prototype.forEach.call(창.querySelectorAll('.al-del'), function (b) { b.onclick = function () { 알람_삭제(종목, b.getAttribute('data-id')); }; });
            Array.prototype.forEach.call(창.querySelectorAll('.al-rdir'), function (b) { b.onclick = function () { 알람_방향바꾸기(종목, b.getAttribute('data-flip')); }; });
        }
        function 알람_모바일() { return window.innerWidth <= 600; }
        // 모바일: 화면 맨 위 전체 폭 + 키보드가 올라오면 보이는 높이에 맞춰 줄이고 창 안에서 스크롤
        function 알람_모바일맞춤() {
            var p = document.getElementById('al-pop'); if (!p || !p.classList.contains('mob')) return;
            var vv = window.visualViewport, h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0;
            p.style.top = (top + 6) + 'px';
            p.style.maxHeight = Math.max(160, h - 12) + 'px';
        }
        if (window.visualViewport) { window.visualViewport.addEventListener('resize', 알람_모바일맞춤); window.visualViewport.addEventListener('scroll', 알람_모바일맞춤); }
        function 알람_창열기(i, 단추) {
            var 종목 = panelTickers[i]; if (!종목) return;
            var 기존 = document.getElementById('al-pop'); if (기존) { var 같음 = 기존._종목 === 종목; 알람_닫기(); if (같음) return; }
            var 창 = document.createElement('div'); 창.className = 'al-pop'; 창.id = 'al-pop'; 창._종목 = 종목;
            // 창 안 클릭 표시: 창 안 단추(✕ 삭제 등)가 다시 그려져 문서에서 떨어져도 "바깥 클릭"으로 보지 않음
            창.addEventListener('click', function (e) { e.알람창안 = true; });
            var 모바일 = 알람_모바일();
            if (모바일) {
                var 어둠 = document.createElement('div'); 어둠.id = 'al-dim'; 어둠.className = 'al-dim'; document.body.appendChild(어둠);
                창.classList.add('mob');
            }
            document.body.appendChild(창); 알람_창그리기(창);
            if (모바일) { 알람_모바일맞춤(); return; }   // 모바일은 키보드가 바로 뜨지 않게 입력칸 자동 선택 안 함
            var r = 단추.getBoundingClientRect();
            창.style.top = Math.max(8, Math.min(window.innerHeight - 창.offsetHeight - 8, r.bottom + 6)) + 'px';
            창.style.left = Math.max(8, Math.min(window.innerWidth - 308, r.right - 300)) + 'px';
            var inp = 창.querySelector('.al-price'); if (inp) { inp.focus(); inp.select(); }
        }
        document.addEventListener('click', function (e) {
            if (e.알람창안) return;
            var b = e.target.closest && e.target.closest('.px-bell');
            if (b) { e.stopPropagation(); 알람_창열기(parseInt(b.getAttribute('data-i'), 10), b); return; }
            var p = document.getElementById('al-pop'); if (p && !p.contains(e.target) && !(e.target.closest && e.target.closest('.lvs-bell'))) 알람_닫기();
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') 알람_닫기(); });

        (function start() {
            initDashboard(); buildWatchlist(); refreshAllDropdowns(); initFirebase();
            [0, 1, 2].forEach(function (i) { try { 레벨요약표시('p' + i + '-', { ticker: panelTickers[i] }); } catch (e) { } });
            try { 알람_화면갱신(); } catch (e) { }   // 요약 틀(빈 줄) 먼저 → 3개 패널 높이 동일
            try {
                firebase.database().ref('system/closeUpdate').on('value', function (snap) {
                    closeStatus = snap.val();
                    ensureCloseUpdated();   // 플래그 OFF(오늘 기록 없음)면 Worker 즉시 실행 요청
                    [0, 1, 2].forEach(function (i) { try { renderPanelQuote(i); } catch (e) { } });
                });
            } catch (e) { }
            // 휴장일 판정·장 마감 스냅샷 (하루 1번 바뀜) → 주말·휴장일이면 Worker 조회 없이 표시
            try {
                var redraw = function () {
                    [0, 1, 2].forEach(function (i) { try { renderPanelQuote(i); } catch (e) { } });
                    try { renderHeaderQuotes(); } catch (e) { }
                };
                var mdFirst = false, snFirst = false;
                var firstDone = function () { if (mdFirst && snFirst && !snapLoaded) { snapLoaded = true; restTick(); } };
                firebase.database().ref('system/marketDay').on('value', function (snap) {
                    marketDay = snap.val(); mdFirst = true; firstDone(); redraw();
                }, function () { mdFirst = true; firstDone(); });
                firebase.database().ref('system/snap').on('value', function (snap) {
                    snapData = snap.val(); snFirst = true; firstDone(); redraw();
                }, function () { snFirst = true; firstDone(); });
            } catch (e) { snapLoaded = true; }
            initGlobalTickersListener(); yahooWsConnect();
            initMacroListener(); initUsdKrwListener();
            setTimeout(restTick, 2600);   // 스냅샷 확인이 늦어져도 2.6초 뒤에는 첫 시세 조회
            // 서버 종목 목록 → 콤보박스 (야후 연결과 무관하게 바로 실행)
            loadServerTickerNames().then(loadServerTickers).then(syncYahooSubs);
        })();
    </script>
