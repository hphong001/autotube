<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }

        #initial-loading {
            position: fixed;
            inset: 0;
            background: #07070c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

            #initial-loading.fade-out {
                opacity: 0;
                pointer-events: none;
            }

        .il-logo {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .il-strike {
            font-size: 36px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
        }

        .il-zone {
            font-size: 36px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
        }

        .il-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        .il-msg {
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
        }

        .panel-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,12,0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 8px;
            flex-direction: column;
            gap: 12px;
        }

            .panel-overlay.active {
                display: flex;
            }

        .po-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .po-msg {
            font-size: 12px;
            color: #888;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes tlPulse {
            0%,100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes tlPulseBorder {
            0%,100% {
                box-shadow: 0 0 6px rgba(255,204,0,0.4);
            }

            50% {
                box-shadow: 0 0 18px rgba(255,204,0,1.0);
            }
        }

        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 6px 0;
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 1400px;
        }

        .sep {
            color: #1a1a30;
            padding: 0 2px;
        }

        .neon-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
        }

            .neon-item .tit {
                font-size: 12px;
                color: #8b949e;
                font-weight: normal;
            }

            .neon-item .val {
                font-size: 13px;
                font-weight: bold;
                color: #ccc;
            }

                .neon-item .val.up {
                    color: #ff4444;
                    text-shadow: 0 0 6px rgba(255,68,68,0.3);
                }

                .neon-item .val.dn {
                    color: #4488ff;
                    text-shadow: 0 0 6px rgba(68,136,255,0.3);
                }

                .neon-item .val.warn {
                    color: #ffcc00;
                    text-shadow: 0 0 6px rgba(255,204,0,0.3);
                }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-time {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

            .ws-dot.live {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: np 2s ease-in-out infinite;
            }

            .ws-dot.kiwoom {
                background: #ff4444;
                box-shadow: 0 0 8px #ff4444;
                animation: np 2s ease-in-out infinite;
            }

            .ws-dot.dead {
                background: #1a1a2a;
                box-shadow: none;
                animation: none;
            }

        @keyframes np {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* 패널 status dot — 키움(빨강) / 야후(파랑) 부드러운 펄스 */
        .dot-red {
            background: #ff4444 !important;
            box-shadow: 0 0 8px #ff4444 !important;
            animation: np 2s ease-in-out infinite !important;
        }

        .dot-blue {
            background: #00aaff !important;
            box-shadow: 0 0 8px #00aaff !important;
            animation: np 2s ease-in-out infinite !important;
        }


        /* ★ 추가: blinkDot 키프레임 (JS에서 animation 이름으로 참조됨) */
        @keyframes blinkDot {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0.15;
            }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

            .oi-dot.flash {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: oiF 0.4s ease-in-out 2;
            }

        @keyframes oiF {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.05;
            }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            gap: 8px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
            position: relative;
        }

            .panel:last-child {
                border-right: none;
            }

        .ph {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            gap: 8px;
        }

        .ph-top {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            height: 30px;
        }

        .ticker-select-wrap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-select {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            background: #0b0b14;
            border: 1px solid #2a2a3e;
            border-radius: 5px;
            padding: 2px 10px;
            cursor: pointer;
            outline: none;
            width: 160px;
        }

            .ticker-select:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .ticker-select option {
                background: #0d0d1a;
                color: #fff;
                font-size: 13px;
            }

        .price-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
            justify-content: center;
        }

        .price-now {
            font-size: 20px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-diff {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-chg {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .vol-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1a2238;
            color: #77aaee;
            border: 1px solid #2a3a5e;
            white-space: nowrap;
            margin-left: 10px;
        }

        .up {
            color: #ff4444 !important;
        }

        .dn {
            color: #4488ff !important;
        }

        .neu {
            color: #aaa !important;
        }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            padding: 8px 12px;
            background: #0d0d1f;
            border-radius: 6px;
            border-left: 3px solid #ddbb00;
            margin-bottom: 6px;
            text-align: center;
            border-left: none;
            border: 1px solid #2a2a4a;
            box-shadow: inset 0 0 20px rgba(255,221,0,0.04);
        }

        .sb-line1 {
            font-size: 13px;
            font-weight: 900;
            color: #ffdd00;
            margin-bottom: 4px;
        }

        .sb-line2 {
            font-size: 13px;
            font-weight: 700;
            color: #ffdd00;
            margin-bottom: 4px;
        }

        .sb-line3 {
            font-size: 13px;
            font-weight: 700;
            color: #ffdd00;
        }

        .timeline {
            position: relative;
            width: 100%;
        }

        .c-red {
            color: #ff4444;
        }

        .bg-red {
            background: #ff4444;
        }

        .c-green {
            color: #44ff66;
        }

        .bg-green {
            background: #44ff66;
        }

        .c-blue {
            color: #4488ff;
        }

        .bg-blue {
            background: #4488ff;
        }

        .c-gold {
            color: #ffcc00;
        }

        .bg-gold {
            background: #ffcc00;
        }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 8px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .oi-title {
            font-size: 13px;
            font-weight: bold;
            color: #7799dd;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .oi-dte {
            background: rgba(243, 156, 18, 0.1);
            color: #f39c12;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: #bbb;
            border-bottom: 1px solid #2a2a3e;
            padding: 5px 0 6px;
            margin-bottom: 8px;
            background: #0f0f1a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            font-size: 10px;
            color: #fff;
            margin-bottom: 4px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            align-items: center;
            gap: 1px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 2px;
        }

        .oi-bar-wrap {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 0 3px;
        }

            .oi-bar-wrap.left {
                justify-content: flex-end;
            }

            .oi-bar-wrap.right {
                justify-content: flex-start;
            }

        .oi-bar.call {
            height: 6px;
            border-radius: 2px 0 0 2px;
            background: #cc3333;
        }

        .oi-bar.put {
            height: 6px;
            border-radius: 0 2px 2px 0;
            background: #3366cc;
        }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 1px 0;
            border-radius: 3px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 11px;
        }

            .strike-box.atm {
                background: #ffcc00;
                color: #000;
                box-shadow: 0 0 4px #ffcc00;
            }

        .oi-vol {
            font-size: 9.5px;
            color: #eee;
            white-space: nowrap;
            font-weight: bold;
        }

        .oi-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            color: #444;
            font-size: 12px;
            gap: 8px;
        }

        .oi-pending-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #222;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .chart-wrapper {
            flex: 1;
            min-height: 220px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section {
            width: 100%;
            height: 100%;
        }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15,15,25,0.85);
            color: #ffcc00;
            border: 1px solid rgba(255,204,0,0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

            .chart-interval-select option {
                background: #0b0b14;
                color: #fff;
            }

        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }

            .sidebar::-webkit-scrollbar {
                display: none;
            }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name {
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
            line-height: 1;
            width: 100%;
        }

        .sl-strike {
            font-size: 30px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
            text-transform: uppercase;
        }

        .sl-zone {
            font-size: 30px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
            text-transform: uppercase;
        }

        .sl-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 12px 0 10px;
        }

        .sl-sub {
            font-size: 11.5px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .sidebar-menu {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #2a2a4a;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
        }

        .sidebar-watchlist {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px solid #1e1e30;
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .watchlist-title {
            margin: 0 0 8px;
            font-size: 13px;
            color: #aaa;
            font-weight: 600;
            flex-shrink: 0;
        }

        .ticker-list {
            overflow-y: auto;
            flex: 1;
            max-height: 340px;
        }

            .ticker-list::-webkit-scrollbar {
                width: 3px;
            }

            .ticker-list::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 2px;
            }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-bottom: 1px solid #1a1a28;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            border-radius: 3px;
        }

            .ticker-item:hover {
                background: #111120;
                color: #ddd;
            }

            .ticker-item.active-panel {
                color: #ffcc00;
            }

        .panel-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            background: #1a2a3e;
            color: #4488ff;
            margin-left: auto;
            white-space: nowrap;
        }

            .panel-badge.p0 {
                background: #2a1a1a;
                color: #ff6666;
            }

            .panel-badge.p1 {
                background: #1a2a1a;
                color: #66cc66;
            }

            .panel-badge.p2 {
                background: #1a1a2a;
                color: #6688ff;
            }

        .sidebar-ad {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #222;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 12px;
        }

        @media screen and (max-width:1200px) {
            body {
                min-width: unset;
            }

            .oi-grid-header {
                grid-template-columns: 1fr 38px 32px 38px 32px 38px 1fr !important;
            }

            .oi-row {
                grid-template-columns: 1fr 38px 32px 38px 32px 38px 1fr !important;
                letter-spacing: -0.3px !important;
            }

            .top-bar {
                height: auto;
                flex-wrap: wrap;
                padding: 10px;
                gap: 8px;
            }

            .logo-top {
                width: 100%;
                order: 1;
                align-items: center;
                margin-top: 2px;
            }

            .top-right {
                order: 2;
                width: 100%;
                justify-content: center;
            }

            #ws-dot-header {
                display: none !important;
            }

            .neon-ticker-bar {
                width: 100% !important;
                max-width: none !important;
                order: 3;
                margin-top: 6px;
                padding: 8px !important;
                display: grid !important;
                grid-template-columns: repeat(6, 1fr) !important;
                gap: 6px !important;
                background: rgba(0,0,0,0.6) !important;
                border: 1px solid rgba(112,144,255,0.2) !important;
                border-radius: 8px !important;
            }

                .neon-ticker-bar .sep {
                    display: none !important;
                }

            .neon-item {
                flex-direction: column !important;
                justify-content: center !important;
                background: rgba(255,255,255,0.05) !important;
                border-radius: 6px !important;
                border: 1px solid rgba(255,255,255,0.1) !important;
                padding: 8px 4px !important;
                height: 100%;
            }

                .neon-item .tit {
                    font-size: 10px !important;
                    margin-bottom: 4px;
                }

                .neon-item .val {
                    font-size: 12px !important;
                    white-space: nowrap !important;
                }

            #neon-qqq, #neon-spy, #neon-vix, #neon-fg {
                grid-column: span 3 !important;
            }

            #neon-nq, #neon-cl, #neon-tnx {
                grid-column: span 2 !important;
            }

            #neon-dxy, #neon-usdkrw {
                grid-column: span 3 !important;
            }

            .content-wrapper {
                flex-direction: column;
                overflow-y: auto;
                padding: 6px;
                gap: 8px;
            }

    <script>
        var WATCH_LIST = [
            { ticker: 'TSLA', name: '테슬라' }, { ticker: 'NVDA', name: '엔비디아' },
            { ticker: 'PLTR', name: '팔란티어' }, { ticker: 'SPY', name: 'S&P 500 ETF' },
            { ticker: 'QQQ', name: '나스닥 100 ETF' }, { ticker: 'AAPL', name: '애플' },
            { ticker: 'AMZN', name: '아마존' }, { ticker: 'META', name: '메타' },
            { ticker: 'MU', name: '마이크론 테크' }, { ticker: 'MSTR', name: '마이크로스트래티지' },
            { ticker: 'AMD', name: '에이엠디' }, { ticker: 'IWM', name: '러셀 2000 ETF' },
            { ticker: 'COIN', name: '코인베이스' }, { ticker: 'SPX', name: 'S&P 500 지수옵션' }
        ];

        var DEFAULT_PANELS = ['TSLA', 'NVDA', 'PLTR'];
        var LS_PANELS = 'sz_panels';
        var LS_INTERVAL = 'sz_interval';

        var panelTickers = loadLS(LS_PANELS, DEFAULT_PANELS);
        var panelIntervals = loadLS(LS_INTERVAL, { 0: '3', 1: '3', 2: '3' });

        var panelDataStore = {};
        var fbRefs = {};
        var PricingData = null;

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';
        var currentChartTicker = { 0: null, 1: null, 2: null };
        var initialLoadDone = false;
        var switchTimers = { 0: null, 1: null, 2: null };
        var switchLocked = { 0: false, 1: false, 2: false };

        function loadLS(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }
        function numberWithCommas(x) {
            if (x === null || x === undefined || x === '') return '─';
            var n = Number(String(x).replace(/,/g, ''));
            if (isNaN(n) || n <= 0) return '─';
            return n.toLocaleString('en-US');
        }

        // ════════════════════════════════════════════════════════
        // ★ 상태 dot 블링킹 함수
        //   panelIdx : 패널 번호 (0,1,2)
        //   color    : '#ff4444' (키움/빨강) 또는 '#00aaff' (야후/파랑)
        //   0.7초 동안 켜졌다가 자동으로 꺼짐 (write 이벤트마다 한 번씩 점등)
        // ════════════════════════════════════════════════════════
        // 현재 패널 dot 상태 추적 (QQQ 헤더와 동일: 상태가 유지되는 동안 계속 켜짐)
        var _dotState = { 0: null, 1: null, 2: null }; // null | 'red' | 'blue'

        function setDotState(panelIdx, state) {
            // state: 'red' | 'blue' | null(소등)
            var dotEl = document.getElementById('p' + panelIdx + '-status-dot');
            if (!dotEl) return;
            if (_dotState[panelIdx] === state) return; // 이미 같은 상태면 무시
            _dotState[panelIdx] = state;
            dotEl.classList.remove('dot-red', 'dot-blue');
            dotEl.style.removeProperty('background-color');
            dotEl.style.removeProperty('box-shadow');
            dotEl.style.removeProperty('opacity');
            void dotEl.offsetWidth; // reflow
            if (state === 'red') dotEl.classList.add('dot-red');
            else if (state === 'blue') dotEl.classList.add('dot-blue');
        }

        // blinkDot은 하위 호환용으로 유지 — 색만 전달하면 됨
        function blinkDot(panelIdx, color) {
            var state = (color === '#ff4444' || color === 'red') ? 'red' : 'blue';
            setDotState(panelIdx, state);
        }

        // ──────────────────────────────────────────────────────────
        // ★ [PRO 버전] 아이콘 없음 + VWAP 중복 수정 + 매크로 종합 시황 추가
        // ──────────────────────────────────────────────────────────
        function applySmartStrategy(panelIdx) {
            var d = panelDataStore[panelIdx];
            if (!d || !d.price || !d.resistance1 || !d.support1) return;

            var price = d.price;
            var r1 = d.resistance1, r2 = d.resistance2;
            var s1 = d.support1, s2 = d.support2;
            var score = d.score || 5;
            var vwap = d.vwap || ((d.dayHigh || price) + (d.dayLow || price) + price) / 3;

            var distToR1 = (Math.abs(r1 - price) / price) * 100;
            var distToS1 = (Math.abs(price - s1) / price) * 100;
            var distToVwap = (Math.abs(price - vwap) / price) * 100;

            var line1 = "", line2 = "", line3 = "";
            var titleColor = "#ffdd00";

            var optState = "";
            var isOverbought = score >= 8.5;
            var isOversold = score <= 1.5;
            var isCallHeavy = score >= 6.0 && score < 8.5;
            var isPutHeavy = score <= 4.0 && score > 1.5;

            if (isOverbought) optState = "콜 과매수(과열)";
            else if (isOversold) optState = "풋 과매도(투매)";
            else if (isCallHeavy) optState = "콜 매수 우위";
            else if (isPutHeavy) optState = "풋 매수 우위";
            else optState = "옵션 수급 중립";

            var vwapTrend = "";
            if (distToVwap <= 0.3) {
                vwapTrend = "공방전 진행중";
            } else {
                vwapTrend = price > vwap ? "당일 매수세 우위" : "당일 매도세 우위";
            }

            if (price > r1) {
                if (isPutHeavy || isOversold) {
                    line1 = '1차 저항($' + r1.toFixed(1) + ') 돌파 (가짜 돌파 의심)';
                    line3 = '주가는 뚫었으나 옵션은 하락 베팅 중. 추격 매수 자제 및 휩소 주의';
                    titleColor = "#ff8800";
                } else if (isOverbought) {
                    line1 = '$' + r1.toFixed(1) + ' 상향 돌파 (단기 과열 구간)';
                    line3 = '콜옵션 과열 상태. 신규 진입보단 분할 익절하며 지지 여부($' + r1.toFixed(1) + ') 확인';
                    titleColor = "#ff3333";
                } else {
                    line1 = '1차 저항($' + r1.toFixed(1) + ') 완벽 돌파 안착';
                    line3 = '상승 추세 확정적. 눌림목 발생 시 $' + r1.toFixed(1) + ' 부근 매수 타점 (목표: $' + r2.toFixed(1) + ')';
                    titleColor = "#ff4444";
                }
            }
            else if (price < s1) {
                if (isCallHeavy || isOverbought) {
                    line1 = '1차 지지($' + s1.toFixed(1) + ') 이탈 (언더슈팅 의심)';
                    line3 = '주가는 빠졌으나 세력은 콜 매집 중. $' + s1.toFixed(1) + ' 재돌파 시 강력한 반등 타점';
                    titleColor = "#ddbb00";
                } else if (isOversold) {
                    line1 = '$' + s1.toFixed(1) + ' 하향 이탈 (투매 절정 구간)';
                    line3 = '풋옵션 극단적 쏠림. 추격 매도는 위험하며 기술적 숏커버링 반등 대비';
                    titleColor = "#cc33ff";
                } else {
                    line1 = '1차 지지($' + s1.toFixed(1) + ') 붕괴 (하락 추세 지속)';
                    line3 = '하방 압력 강함. 2차 지지($' + s2.toFixed(1) + ') 도달 전까지 매수(Buy) 진입 보류';
                    titleColor = "#4488ff";
                }
            }
            else if (distToR1 <= 0.3) {
                line1 = '1차 저항($' + r1.toFixed(1) + ') 초근접 테스트 중';
                line3 = isCallHeavy ? '수급 뒷받침 됨. 돌파 시 숏스퀴즈 발생 가능성' : '돌파 수급 부족. 저항 맞고 밀리면 단기 매도(Sell) 대응';
                titleColor = "#ff6666";
            }
            else if (distToS1 <= 0.3) {
                line1 = '1차 지지($' + s1.toFixed(1) + ') 초근접 방어전';
                line3 = isPutHeavy ? '하방 압력 강함. 붕괴 시 즉시 손절 대응' : '수급 양호. 지지 성공 시 매수 타점';
                titleColor = "#66bbff";
            }
            else {
                var targetLine = distToR1 < distToS1 ? '저항 $' + r1.toFixed(1) : '지지 $' + s1.toFixed(1);
                line1 = targetLine + ' 향해 방향성 탐색 중';
                if (distToVwap <= 0.3) {
                    line3 = '현재 VWAP(' + vwap.toFixed(1) + ') 공방 중. 이기는 쪽으로 추세 터짐 (관망 유지)';
                } else {
                    line3 = '박스권 상/하단 도달 전까지 의미 없는 움직임. 비중 축소 및 단타 대응';
                }
                titleColor = "#ddbb00";
            }

            var extraFlag = "";
            if (d.callWall > 0 && distToR1 < 1.0 && Math.abs(price - d.callWall) / price < 0.01) extraFlag = " [콜월 저항 직면]";
            if (d.putWall > 0 && distToS1 < 1.0 && Math.abs(price - d.putWall) / price < 0.01) extraFlag = " [풋월 방어선 구축]";

            line2 = '추세: ' + vwapTrend + ' | 옵션수급: ' + optState + extraFlag;

            var p = 'p' + panelIdx + '-';
            var sigEl = document.getElementById(p + 'sigtitle');
            if (sigEl) { sigEl.innerHTML = line1; sigEl.style.color = titleColor; }
            var subEl = document.getElementById(p + 'trend-sub');
            if (subEl) subEl.innerHTML = line2;
            var nextEl = document.getElementById(p + 'trend-next');
            if (nextEl) nextEl.innerHTML = "- " + line3;
        }

        // 5초마다 실시간 주가를 반영하여 전략 갱신
        setInterval(function () {
            [0, 1, 2].forEach(function (i) {
                if (panelDataStore[i] && panelDataStore[i].price > 0) {
                    applySmartStrategy(i);
                }
            });
        }, 5000);

        function hideInitialLoading() {
            if (initialLoadDone) return;
            initialLoadDone = true;
            var el = document.getElementById('initial-loading');
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(function () { el.style.display = 'none'; }, 600);
        }
        setTimeout(hideInitialLoading, 8000);

        function buildPanelHTML(i) {
            var opts = WATCH_LIST.map(function (w) { return '<option value="' + w.ticker + '">' + w.ticker + ' (' + w.name + ')</option>'; }).join('');

            return '<div class="panel" id="panel-' + i + '">'
                + '<div class="panel-overlay" id="overlay-' + i + '"><div class="po-spinner"></div><div class="po-msg" id="overlay-msg-' + i + '">종목 전환 중...</div></div>'
                + '<div class="ph">'
                + '<div class="ph-top">'
                + '<div class="ticker-select-wrap">'
                + '<span class="ws-dot dead" id="p' + i + '-status-dot"></span>'
                + '<select class="ticker-select" id="ticker-select-' + i + '" onchange="onTickerSelectChange(' + i + ',this.value)">' + opts + '</select>'
                + '</div>'
                + '<div style="position:absolute; right:0; top:50%; transform:translateY(-50%); display:flex; align-items:center; z-index:5;">'
                + '<span id="p' + i + '-market-badge" style="display:none; background-color:rgba(231,76,60,0.15); color:#e74c3c; border:1px solid rgba(231,76,60,0.4); font-size:10px; font-weight:bold; padding:2px 6px; border-radius:4px;">장마감</span>'
                + '</div>'
                + '</div>'
                + '<div class="price-container">'
                + '<div class="price-block" id="p' + i + '-reg-block">'
                + '<span class="price-now" id="p' + i + '-price">─</span>'
                + '<span class="price-diff" id="p' + i + '-diff">─</span>'
                + '<span class="price-chg"  id="p' + i + '-chg">─</span>'
                + '<span class="vol-badge"  id="p' + i + '-vol">거래량: ─</span>'
                + '</div>'
                + '</div>'
                + '</div>'
                + '<div class="strategy-box">'
                + '<div class="sb-header">'
                + '<div class="sb-line1" id="p' + i + '-sigtitle">🟡 방향성 탐색 (관망)</div>'
                + '<div class="sb-line2" id="p' + i + '-trend-sub">데이터 로딩 중...</div>'
                + '<div class="sb-line3" id="p' + i + '-trend-next"></div>'
                + '</div>'
                + '<div class="timeline" id="p' + i + '-timeline"></div>'
                + '</div>'
                + '<div class="oi-box">'
                + '<div class="oi-header" style="display:flex; justify-content:space-between; align-items:center;">'
                + '<div style="display:flex; align-items:center; gap:4px;">'
                + '<span class="oi-dot" id="p' + i + '-oi-dot"></span>'
                + '<span class="oi-title" id="p' + i + '-oi-title" style="margin:0;">옵션 체인</span>'
                + '<span id="p' + i + '-update-time" style="font-size:10px; color:#ffffff; font-weight:normal; margin-left:12px;"></span>'
                + '</div>'
                + '<span class="oi-dte" id="p' + i + '-dte">옵션만기 : 대기중</span>'
                + '</div>'
                + '<div class="oi-summary"><span id="p' + i + '-sum-power">수급 대기중</span><span id="p' + i + '-sum-env">지수 대기중</span></div>'
                + '<div class="oi-grid-header"><div style="text-align:right;padding-right:2px;">콜</div><div>OI/V</div><div>등락</div><div>행사가</div><div>등락</div><div>OI/V</div><div style="text-align:left;padding-left:2px;">풋</div></div>'
                + '<div id="p' + i + '-oi-rows"></div>'
                + '</div>'
                + '<div class="chart-wrapper">'
                + '<select class="chart-interval-select" id="interval-' + i + '" onchange="changeInterval(' + i + ',this.value)">'
                + '<option value="1">1분봉</option><option value="3" selected>3분봉</option><option value="5">5분봉</option><option value="15">15분봉</option><option value="60">1시간</option><option value="D">일봉</option>'
                + '</select>'
                + '<div class="chart-section" id="chart-' + i + '"></div>'
                + '</div>'
                + '</div>';
        }

        function initDashboard() {
            var grid = document.getElementById('dashboard-grid'); grid.innerHTML = [0, 1, 2].map(buildPanelHTML).join('');
            [0, 1, 2].forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i); if (sel) sel.value = panelTickers[i];
                var intSel = document.getElementById('interval-' + i); if (intSel) intSel.value = panelIntervals[i] || '3';
            });
        }

        function buildWatchlist() {
            var list = document.getElementById('ticker-list');
            list.innerHTML = WATCH_LIST.map(function (w) { return '<div class="ticker-item" id="wl-' + w.ticker + '"><span style="font-weight:bold;min-width:44px;">' + w.ticker + '</span><span style="font-size:10px;color:#666;">' + w.name + '</span><span class="panel-badge" id="wl-badge-' + w.ticker + '" style="display:none;"></span></div>'; }).join('');
            refreshWatchlistBadges();
        }

        function refreshWatchlistBadges() {
            WATCH_LIST.forEach(function (w) {
                var badge = document.getElementById('wl-badge-' + w.ticker); var item = document.getElementById('wl-' + w.ticker);
                if (!badge || !item) return; var idx = panelTickers.indexOf(w.ticker);
                if (idx >= 0) { badge.textContent = '패널' + (idx + 1); badge.className = 'panel-badge p' + idx; badge.style.display = ''; item.classList.add('active-panel'); }
                else { badge.style.display = 'none'; item.classList.remove('active-panel'); }
            });
        }

        function onTickerSelectChange(panelIdx, newTicker) {
            if (panelTickers.indexOf(newTicker) >= 0 && panelTickers.indexOf(newTicker) !== panelIdx) {
                alert('이미 패널에 표시 중인 종목입니다.');
                var sel = document.getElementById('ticker-select-' + panelIdx);
                if (sel) sel.value = panelTickers[panelIdx];
                return;
            }
            clearTimeout(switchTimers[panelIdx]);
            showPanelOverlay(panelIdx, newTicker + ' 데이터 수신 중...');

            switchTimers[panelIdx] = setTimeout(function () {
                executePanelSwitch(panelIdx, newTicker);
            }, 800);

            if (window._safetyTimeouts && window._safetyTimeouts[panelIdx]) {
                clearTimeout(window._safetyTimeouts[panelIdx]);
            }
            if (!window._safetyTimeouts) window._safetyTimeouts = {};

        // ── 키움 하트비트 구독 ─────────────────────────────────

        function subscribeFirebase(panelIdx, ticker) {

        // ════════════════════════════════════════════════════════
        // ★ panel/optionUpdate 이벤트 처리 (Firebase panelRef → onWsMessage)

        window.onWsMessage = function (d) {
            if (!d || !d.type || d.type !== 'optionUpdate' || !d.ticker) return;

            if (d.optionRows && d.optionRows.length > 0) {
                var tCall = 0, tPut = 0;

        (function initProto() {
            var P = 'syntax="proto3";message PricingData{string id=1;float price=2;sint64 time=3;string currency=4;string exchange=5;int32 quoteType=6;int32 marketHours=7;float changePercent=8;sint64 dayVolume=9;float dayHigh=10;float dayLow=11;float change=12;string shortName=13;sint64 expireDate=14;float openPrice=15;float previousClose=16;float strikePrice=17;string underlyingSymbol=18;sint64 openInterest=19;sint64 optionsType=20;sint64 miniOption=21;sint64 lastSize=22;float bid=23;sint64 bidSize=24;float ask=25;sint64 askSize=26;sint64 priceHint=27;sint64 vol_24hr=28;sint64 volAllCurrencies=29;string fromcurrency=30;string lastMarket=31;double circulatingSupply=32;double marketcap=33;}';
            try { PricingData = protobuf.parse(P).root.resolveAll().lookupType('PricingData'); } catch (e) { }
        })();

        // ════════════════════════════════════════════════════════
        // ★ 야후 심볼 매핑 (finance.yahoo.com 에서 확인)
        //   - SPX 지수는 ^GSPC (실시간). ^SPX 는 CBOE 지연 시세, SPX(^ 없음)는 빈 종목
        //   - 나머지 주식/ETF는 티커 그대로
        // ════════════════════════════════════════════════════════
        var YAHOO_SYMBOL_MAP = { 'SPX': '^GSPC' };
        function toYahooSym(t) { return YAHOO_SYMBOL_MAP[t] || t; }
        function fromYahooSym(s) {
            for (var k in YAHOO_SYMBOL_MAP) { if (YAHOO_SYMBOL_MAP[k] === s) return k; }
            return s;
        }

        var HEADER_TICKERS = ['QQQ', 'SPY'];
        // 관심종목 전체 + 헤더 종목 (중복 제거) → 시작 시 한 번에 구독
        function getAllSubs() {
            var all = WATCH_LIST.map(function (w) { return w.ticker; }).concat(HEADER_TICKERS).map(toYahooSym);
            var seen = {}, res = [];
            all.forEach(function (t) { if (!seen[t]) { seen[t] = true; res.push(t); } });
            return res;
        }

        // ── 야후 WebSocket 메시지 디코딩 (3가지 형식 모두 대응) ──
        //   1) 바이너리 protobuf  2) base64 문자열  3) {"type":"pricing","message":"<base64>"}
        function decodeYahooMsg(data) {
            if (data instanceof ArrayBuffer) return PricingData.decode(new Uint8Array(data));
            var s = String(data);
            if (s.charAt(0) === '{') {
                var j = JSON.parse(s);
                if (!j || !j.message) return null;
                s = j.message;
            }
            var bin = atob(s), b = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
            return PricingData.decode(b);
        }

        var yahooWs = null, yahooReconnectTimer = null, yahooLastMsgAt = 0;
        function yahooWsConnect() {
            if (yahooReconnectTimer) { clearTimeout(yahooReconnectTimer); yahooReconnectTimer = null; }
            try {
                yahooWs = new WebSocket('wss://streamer.finance.yahoo.com/?version=2');
                yahooWs.binaryType = 'arraybuffer';

                yahooWs.onopen = function () {
                    yahooLastMsgAt = Date.now();
                    yahooWs.send(JSON.stringify({ subscribe: getAllSubs() }));
                    console.log('[야후] 연결됨, 구독: ' + getAllSubs().join(', '));
                };

                yahooWs.onmessage = function (ev) {
                    yahooLastMsgAt = Date.now();
                    if (!PricingData) return;
                    var msg;
                    try { msg = decodeYahooMsg(ev.data); } catch (e) { return; }
                    if (!msg || !msg.id) return;

                    var ticker = fromYahooSym(msg.id);
                    var px = Number(msg.price) || 0;
                    if (!(px > 0)) return;

                    var prev = yahooCache[ticker] || {};
                    yahooCache[ticker] = {
                        price: px,
                        changeRate: Number(msg.changePercent) || 0,
                        change: Number(msg.change) || 0,
                        volume: Number(msg.dayVolume) > 0 ? Number(msg.dayVolume) : (prev.volume || 0),
                        dayHigh: Number(msg.dayHigh) > 0 ? Number(msg.dayHigh) : (prev.dayHigh || 0),
                        dayLow: Number(msg.dayLow) > 0 ? Number(msg.dayLow) : (prev.dayLow || 0),
                        recvAt: Date.now()
                    };

                    // 헤더(QQQ/SPY)
                    if (HEADER_TICKERS.indexOf(ticker) >= 0) renderHeaderQuotes();

                    // 패널: 해당 종목을 야후 소스로 보여주는 중일 때만 갱신
                    panelTickers.forEach(function (t, idx) {
                        if (t !== ticker) return;
                        var pick = pickQuote(ticker);
                        if (pick && pick.src === 'yahoo') renderPanelQuote(idx);
                    });
                };

                yahooWs.onclose = function () {
                    console.warn('[야후] 연결 끊김 → 3초 후 재연결');
                    yahooReconnectTimer = setTimeout(yahooWsConnect, 3000);
                };
                yahooWs.onerror = function () { try { yahooWs.close(); } catch (e) { } };
            } catch (e) {
                yahooReconnectTimer = setTimeout(yahooWsConnect, 3000);
            }
        }

        // 야후 연결이 살아있는데 60초 이상 아무 메시지도 없으면 강제 재연결 (정규장·프리·애프터 시간에만)
        setInterval(function () {
            if (!yahooWs || yahooWs.readyState !== 1) return;
            if (Date.now() - yahooLastMsgAt < 60000) return;
            var h = Number(new Date().toLocaleString('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false }));
            var dow = new Date().toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short' });
            if (dow === 'Sat' || dow === 'Sun' || h < 4 || h >= 20) return;
            console.warn('[야후] 60초간 수신 없음 → 재연결');
            try { yahooWs.close(); } catch (e) { }
        }, 15000);

                        var dp = Number(data.dxy.price) || 0, dc = Number(String(data.dxy.changeRate).replace('%', '')) || 0;
                        var dEl = document.getElementById('neon-dxy');
                        if (dEl) dEl.innerHTML = '<span class="tit">달러인덱스</span><span class="val ' + (dc > 0 ? 'up' : dc < 0 ? 'dn' : 'neu') + '">' + dp.toFixed(2) + ' (' + (dc > 0 ? '+' : '') + dc.toFixed(2) + '%)</span>';
                    }
                    if (data.vix) {
                        var vp = data.vix.price || 0, vs = data.vix.vixState || '안정';
                        var vixEl = document.getElementById('neon-vix');
                        if (vixEl) vixEl.innerHTML = '<span class="tit">VIX</span><span class="val ' + (vs === '공포패닉' ? 'up' : vs.includes('불안') ? 'warn' : 'neu') + '">' + vp.toFixed(2) + ' [' + vs + ']</span>';
                        globVix = vp; globVixState = vs;
                    }
                    if (data.fearGreed) {
                        var fgs = Math.round(data.fearGreed.score) || 0, fgr = (data.fearGreed.rating || '').toLowerCase();
                        var rKr = fgr.includes('extreme fear') ? '극단적 공포' : fgr.includes('fear') ? '공포' : fgr.includes('extreme greed') ? '극단적 탐욕' : fgr.includes('greed') ? '탐욕' : '중립';
                        var fgEl = document.getElementById('neon-fg');
                        if (fgEl) fgEl.innerHTML = '<span class="tit">F&G</span><span class="val ' + (fgs <= 25 ? 'up' : fgs >= 75 ? 'dn' : 'neu') + '">' + fgs + ' [' + rKr + ']</span>';
                    }
                    [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                });
            } catch (e) { }
        }

        function initUsdKrwListener() {
            try {
                firebase.database().ref('system/exchangeRate').on('value', function (snap) {
                    var data = snap.val();
                    var el = document.getElementById('neon-usdkrw');
                    if (!el || !data) return;
                    var p = typeof data === 'object' ? (Number(data.price) || 0) : (Number(data) || 0);
                    var r = typeof data === 'object' ? (Number(data.changeRate) || 0) : 0;
                    if (p > 100) {
                        el.innerHTML = '<span class="tit">원달러환율</span>'
                            + '<span class="val ' + (r > 0 ? 'up' : r < 0 ? 'dn' : 'neu') + '">'
                            + p.toFixed(2) + '원</span>';
                    }
                });
            } catch (e) { }
        }

        function updateNeonItem(id, name, p, chg) {
            var el = document.getElementById(id); if (!el) return;
            var numP = Number(p) || 0, numC = Number(chg) || 0;
            var cls = numC > 0 ? 'up' : numC < 0 ? 'dn' : 'neu';
            el.innerHTML = '<span class="tit">' + name + '</span><span class="val ' + cls + '">' + numP.toFixed(2) + ' (' + (numC > 0 ? '+' : '') + numC.toFixed(2) + '%)</span>';
        }

        (function start() {
            initDashboard(); buildWatchlist(); refreshAllDropdowns(); initFirebase();
            initGlobalTickersListener(); yahooWsConnect(); initMacroListener(); initUsdKrwListener();
        })();
    </script>
</body>
</html>
