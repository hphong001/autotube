<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <!-- ⭐️ 트레이딩뷰 무료 오픈소스 실시간 라이트웨이트 차트 라이브러리 CDN -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }
        @media screen and (max-width: 1200px) {
            body {
                min-width: unset;
            }
        }

        /* ── 상단 바 ── */
        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6), 0 0 24px rgba(255,200,0,0.4);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8), 0 0 24px rgba(255,100,0,0.5);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg, transparent, #ffcc00, transparent);
            margin: 6px 0;
            box-shadow: 0 0 5px rgba(255,204,0,0.5);
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 6px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            text-transform: uppercase;
            margin-right: -6px;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.4);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 420px;
        }

        .neon-item {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            white-space: nowrap;
        }

        .neon-item.up { color: #ff4444; text-shadow: 0 0 6px rgba(255,68,68,0.5); }
        .neon-item.dn { color: #4488ff; text-shadow: 0 0 6px rgba(68,136,255,0.5); }
        .neon-item.neu { color: #ccc; }
        .neon-vix-warn { color: #ffcc00; }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-time {
            font-size: 11px;
            color: #333;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

        .ws-dot.live {
            background: #00aaff;
            box-shadow: 0 0 8px #00aaff;
            animation: np 1.5s infinite;
        }

        .ws-dot.dead { background: #1a1a2a; animation: none; }

        @keyframes np {
            0%,100% { opacity: 1 }
            50% { opacity: 0.3 }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .oi-dot.flash {
            background: #00aaff;
            box-shadow: 0 0 8px #00aaff;
            animation: oiF 0.4s ease-in-out 2;
        }

        @keyframes oiF {
            0%,100% { opacity: 1 }
            50% { opacity: 0.05 }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
        }

        .panel:last-child { border-right: none; }

        .ph {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            flex-wrap: nowrap;
        }

        .ticker-name { font-size: 20px; font-weight: bold; flex-shrink: 0; }
        .price-block { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-width: 0; }
        .price-now { font-size: 20px; font-weight: bold; color: #555; white-space: nowrap; }
        .price-diff { font-size: 16px; font-weight: bold; color: #555; white-space: nowrap; }
        .price-chg { font-size: 16px; font-weight: bold; color: #555; white-space: nowrap; }

        .up { color: #ff4444 !important; }
        .dn { color: #4488ff !important; }
        .neu { color: #aaa !important; }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2a2a2a;
            padding-bottom: 5px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .sb-title { color: #ddbb00; font-size: 13px; font-weight: bold; flex: 1; min-width: 0; }
        .sb-trend { font-size: 10px; color: #aaa; background: #1a1a2e; padding: 2px 5px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }

        .timeline { position: relative; height: 65px; margin: 0 6px; }
        .tl-track { position: absolute; top: 33px; left: 8%; right: 8%; height: 3px; background: #2a2a3e; border-radius: 2px; }

        .node { position: absolute; display: flex; flex-direction: column; align-items: center; width: 70px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
        .node-top { bottom: 40px; }
        .node-bottom { top: 40px; }

        .dot-tl { position: absolute; top: 34.5px; transform: translate(-50%,-50%); border-radius: 50%; }
        .dot-small { width: 9px; height: 9px; z-index: 2; }
        .dot-large { width: 13px; height: 13px; z-index: 10; border: 2px solid #fff; }

        .lbl-box { display: flex; flex-direction: column; align-items: center; background: #0d0d15; padding: 0 2px; border-radius: 3px; }
        .lbl { font-size: 9px; color: #888; font-weight: bold; margin-bottom: 1px; }
        .val { font-size: 11px; font-weight: bold; }

        .c-red { color: #ff4444; } .bg-red { background: #ff4444; }
        .c-green { color: #44ff66; } .bg-green { background: #44ff66; }
        .c-blue { color: #4488ff; } .bg-blue { background: #4488ff; }
        .c-gold { color: #ffcc00; } .bg-gold { background: #ffcc00; }

        .oi-box { border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px; background: #0b0b14; flex-shrink: 0; }
        .oi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .oi-title { font-size: 13px; font-weight: bold; color: #7799dd; display: flex; align-items: center; }
        .oi-dte { background: #7722cc; color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; white-space: nowrap; }

        .oi-summary {
            display: flex; justify-content: center; gap: 10px; font-size: 11px; color: #bbb;
            border-bottom: 1px solid #2a2a3e; padding: 5px 0 6px; margin-bottom: 8px; background: #0f0f1a; border-radius: 5px; flex-wrap: wrap;
        }

        .oi-grid-header { display: grid; grid-template-columns: 1fr 46px 38px 50px 38px 46px 1fr; font-size: 10px; color: #888; margin-bottom: 4px; text-align: center; }
        .oi-row { display: grid; grid-template-columns: 1fr 46px 38px 50px 38px 46px 1fr; align-items: center; gap: 2px; font-size: 11px; text-align: center; margin-bottom: 2px; }

        .oi-bar-wrap { display: flex; width: 100%; align-items: center; }
        .oi-bar-wrap.left { justify-content: flex-end; }
        .oi-bar-wrap.right { justify-content: flex-start; }

        .oi-bar.call { height: 6px; border-radius: 2px 0 0 2px; background: #cc3333; }
        .oi-bar.put { height: 6px; border-radius: 0 2px 2px 0; background: #3366cc; }

        .strike-box { background: #1a1a2e; color: #fff; padding: 1px 0; border-radius: 3px; font-weight: bold; width: 100%; display: block; font-size: 11px; }
        .strike-box.atm { background: #ffcc00; color: #000; box-shadow: 0 0 4px #ffcc00; }
        .oi-vol { font-size: 10px; color: #eee; white-space: nowrap; font-weight: bold; }

        /* ── 실시간 라이트웨이트 차트 영역 ── */
        .chart-wrapper {
            flex: 0 0 240px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section {
            width: 100%;
            height: 100%;
        }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15, 15, 25, 0.85);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .chart-interval-select option {
            background: #0b0b14;
            color: #fff;
        }

        /* ── 사이드바 ── */
        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar { display: none; }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; line-height: 1; width: 100%; }
        .sl-strike { font-size: 30px; font-weight: 900; color: #ffdf00; text-shadow: 0 0 15px rgba(255,223,0,0.7); text-transform: uppercase; }
        .sl-zone { font-size: 30px; font-weight: 900; color: #ff8800; text-shadow: 0 0 15px rgba(255,136,0,0.9); text-transform: uppercase; }

        .sl-line { height: 1px; width: 90%; background: linear-gradient(90deg, transparent, #ffcc00, transparent); margin: 12px 0 10px; }
        .sl-sub { font-size: 11.5px; letter-spacing: 8px; font-weight: 800; color: #ffffff; text-transform: uppercase; margin-right: -8px; }

        .sidebar-menu {
            background: #0d0d1a; border-radius: 8px; border: 1px dashed #2a2a4a;
            height: 60px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px;
        }

        .sidebar-watchlist {
            background: #0d0d1a; border-radius: 8px; border: 1px solid #1e1e30;
            padding: 12px; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;
        }

        .search-box { background: #070710; border: 1px solid #2a2a3e; color: #ccc; padding: 6px 8px; border-radius: 5px; margin-bottom: 8px; width: 100%; font-size: 12px; }
        .ticker-list { overflow-y: auto; flex: 1; }
        .ticker-list::-webkit-scrollbar { width: 3px; }
        .ticker-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .ticker-item { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid #1a1a28; font-size: 12px; cursor: pointer; color: #aaa; }
        .ticker-item input { accent-color: #4488ff; }

        .sidebar-ad {
            background: #0d0d1a; border-radius: 8px; border: 1px dashed #222;
            height: 160px; display: flex; align-items: center; justify-content: center; color: #333; font-size: 12px;
        }

        @media screen and (max-width: 1200px) {
            .content-wrapper { flex-direction: column; overflow-y: auto; padding: 6px; gap: 8px; }
            .dashboard-grid { flex-direction: column; overflow-y: visible; min-height: 0; }
            html, body { overflow-y: auto; height: auto; }
            .panel { height: auto; min-height: 0; border-right: none; border-bottom: 1px solid #1a1a2e; overflow-y: visible; }
            .sidebar { width: 100%; height: auto; position: static; padding-right: 0; flex-direction: row; flex-wrap: wrap; }
            .sidebar-logo { flex: 1; min-width: 180px; }
            .sidebar-menu { flex: 1; min-width: 120px; }
            .sidebar-watchlist { flex: 2; min-width: 200px; max-height: 200px; }
            .sidebar-ad { display: none; }
            .chart-wrapper { flex: 0 0 280px; }
        }
    </style>
</head>
<body>

    <script>
var DASH_TICKERS   = ['TSLA','NVDA','PLTR'];
var HEADER_TICKERS = ['QQQ','SPY','^VIX'];
var ALL_SUB        = DASH_TICKERS.concat(HEADER_TICKERS);
var FIREBASE_URL   = 'https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/';

var PricingData    = null;
var yahooWs        = null;
var yahooRunning   = false;
var yahooReconTimer= null;
var lastMsgTime    = 0;

var prevCloseCache  = {};
var yahooPriceCache = {};
var panelDataStore  = {};
var headerPrevClose = {};
var panelIntervals  = { 0: '3', 1: '3', 2: '3' }; // 패널별 분봉 주기 저장

// ⭐️ 라이트웨이트 실시간 차트 관리 객체
var lwCharts       = {}; // { 0: { chart, series, lastTime, lastClose } }

var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';

(function initProto() {
    var P = 'syntax="proto3";message PricingData{string id=1;float price=2;sint64 time=3;string currency=4;string exchange=5;int32 quoteType=6;int32 marketHours=7;float changePercent=8;sint64 dayVolume=9;float dayHigh=10;float dayLow=11;float change=12;string shortName=13;sint64 expireDate=14;float openPrice=15;float previousClose=16;float strikePrice=17;string underlyingSymbol=18;sint64 openInterest=19;sint64 optionsType=20;sint64 miniOption=21;sint64 lastSize=22;float bid=23;sint64 bidSize=24;float ask=25;sint64 askSize=26;sint64 priceHint=27;sint64 vol_24hr=28;sint64 volAllCurrencies=29;string fromcurrency=30;string lastMarket=31;double circulatingSupply=32;double marketcap=33;}';
    try {
        var root = protobuf.parse(P).root;
        root.resolveAll();
        PricingData = root.lookupType('PricingData');
    } catch(e) { console.error('Proto 실패:', e); }
})();

function initFirebase() {
    return new Promise(function(resolve) {
        var isWF = window.chrome && window.chrome.webview;
        if (isWF) { resolve(); return; }
        try {
            if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_URL });
            var done = false;
            firebase.database().ref('tickers').on('value', function(snap) {
                var data = snap.val();
                if (data) applyFirebaseData(data);
                if (!done) { done = true; resolve(); }
            });
            setTimeout(function(){ if (!done){ done=true; resolve(); } }, 5000);
        } catch(e) { resolve(); }
    });
}

function applyFirebaseData(data) {
    var keys = Object.keys(data);
    if (keys.length && data[keys[0]] && data[keys[0]].header)
        window.onWsMessage(data[keys[0]].header);
    DASH_TICKERS.forEach(function(t, i) {
        if (data[t] && data[t].panel) {
            var p = JSON.parse(JSON.stringify(data[t].panel));
            p.panel = i;
            window.onWsMessage(p);
        }
    });
}

function yahooWsConnect() {
    if (yahooWs && (yahooWs.readyState === WebSocket.CONNECTING || yahooWs.readyState === WebSocket.OPEN)) return;
    yahooRunning = true;
    try {
        yahooWs = new WebSocket('wss://streamer.finance.yahoo.com');
        yahooWs.binaryType = 'arraybuffer';
        yahooWs.onopen = function() {
            clearTimeout(yahooReconTimer);
            setWsDot('live');
            yahooWs.send(JSON.stringify({ subscribe: ALL_SUB }));
        };
        yahooWs.onmessage = function(ev) {
            if (!PricingData) return;
            try {
                var bytes;
                if (ev.data instanceof ArrayBuffer) {
                    bytes = new Uint8Array(ev.data);
                } else {
                    var bin = atob(ev.data);
                    bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                }
                var msg = PricingData.decode(bytes);
                if (msg && msg.id && msg.price > 0) onYahooMsg(msg);
            } catch(e) {}
        };
        yahooWs.onerror = function() { setWsDot('dead'); };
        yahooWs.onclose = function() {
            setWsDot('dead');
            if (yahooRunning) yahooReconTimer = setTimeout(yahooWsConnect, 5000);
        };
    } catch(e) {
        setWsDot('dead');
        if (yahooRunning) yahooReconTimer = setTimeout(yahooWsConnect, 5000);
    }
}

function onYahooMsg(msg) {
    lastMsgTime = Date.now();
    updateTimeDisplay();
    var ticker = msg.id;

    if (HEADER_TICKERS.indexOf(ticker) >= 0) { updateHeaderTicker(ticker, msg); return; }

    var idx = DASH_TICKERS.indexOf(ticker);
    if (idx < 0) return;

    var prevClose = prevCloseCache[ticker] || 0;
    if (prevClose <= 0) {
        prevClose = msg.changePercent !== 0 ? msg.price / (1.0 + msg.changePercent / 100.0) : msg.price;
        prevCloseCache[ticker] = prevClose;
    }

    var price   = msg.price;
    var chgAmt  = price - prevClose;
    var chgPct  = prevClose > 0 ? (chgAmt / prevClose * 100) : 0;

    yahooPriceCache[ticker] = { price: price, changePct: chgPct, changeAmt: chgAmt, prevClose: prevClose, mh: msg.marketHours };

    var tkEl = document.getElementById('p' + idx + '-ticker');
    if (tkEl && tkEl.textContent === '─') {
        tkEl.textContent = ticker;
        var oiTEl = document.getElementById('p' + idx + '-oi-title');
        if (oiTEl) oiTEl.textContent = ticker + ' 옵션 체인';
    }

    updatePanelPrice(idx, price, chgPct, chgAmt);

    // ⭐️ 실시간 가격 틱(Tick)을 라이트웨이트 차트에 실시간 반영 (마지막 캔들 종가·고가·저가 갱신)
    updateRealtimeChartTick(idx, price);

    var d = panelDataStore[idx];
    if (d && d.maxPain > 0) {
        renderTimeline('p' + idx + '-', Object.assign({}, d, { price: price }));
        if (d.optionRows && d.optionRows.length) renderOiGrid('p' + idx + '-', d.optionRows, price);
    }
}

function updateHeaderTicker(ticker, msg) {
    var prev = headerPrevClose[ticker] || 0;
    var chg  = prev > 0 ? ((msg.price - prev) / prev * 100) : msg.changePercent;
    var sign = chg > 0 ? '+' : '';
    var cls  = chg > 0 ? 'up' : chg < 0 ? 'dn' : 'neu';

    if (ticker === 'QQQ') {
        globQqq = chg;
        var el = document.getElementById('neon-qqq');
        if (el) { el.textContent = 'QQQ ' + sign + chg.toFixed(2) + '%'; el.className = 'neon-item ' + cls; }
    } else if (ticker === 'SPY') {
        globSpy = chg;
        var el2 = document.getElementById('neon-spy');
        if (el2) { el2.textContent = 'SPY ' + sign + chg.toFixed(2) + '%'; el2.className = 'neon-item ' + cls; }
    } else if (ticker === '^VIX') {
        globVix = msg.price;
        globVixState = msg.price >= 30 ? '공포패닉' : msg.price >= 20 ? '불안' : msg.price >= 15 ? '주의' : '안정';
        var vCol = globVixState.indexOf('공포') >= 0 ? 'up' : globVixState.indexOf('주의') >= 0 ? 'neon-vix-warn' : 'neu';
        var el3 = document.getElementById('neon-vix');
        if (el3) { el3.textContent = 'VIX ' + msg.price.toFixed(2) + ' (' + globVixState + ')'; el3.className = 'neon-item ' + vCol; }
    }
    var hd = document.getElementById('ws-dot-header');
    if (hd) hd.className = 'ws-dot live';
    DASH_TICKERS.forEach(function(_, i) { updateEnvSummary(i); });
}

function updatePanelPrice(idx, price, chgPct, chgAmt) {
    var p   = 'p' + idx + '-';
    var cls = chgPct > 0 ? 'up' : chgPct < 0 ? 'dn' : 'neu';
    var arr = chgPct > 0 ? '▲' : chgPct < 0 ? '▼' : '';
    var sgn = chgPct > 0 ? '+' : '';

    var pxEl = document.getElementById(p + 'price');
    if (pxEl) { pxEl.textContent = '$' + price.toFixed(2); pxEl.className = 'price-now ' + cls; }
    var dfEl = document.getElementById(p + 'diff');
    if (dfEl) {
        dfEl.textContent = chgAmt >= 0 ? '(+$' + Math.abs(chgAmt).toFixed(2) + ')' : '(-$' + Math.abs(chgAmt).toFixed(2) + ')';
        dfEl.className = 'price-diff ' + cls;
    }
    var cgEl = document.getElementById(p + 'chg');
    if (cgEl) { cgEl.textContent = arr + ' ' + sgn + Math.abs(chgPct).toFixed(2) + '%'; cgEl.className = 'price-chg ' + cls; }
    var dot = document.getElementById(p + 'dot');
    if (dot) dot.className = 'ws-dot live';
}

window.onWsMessage = function(d) {
    if (!d || !d.type) return;

    if (d.type === 'headerUpdate') {
        if (Date.now() - lastMsgTime < 30000) return;
        globQqq = d.qqq || 0; globSpy = d.spy || 0;
        globVix = d.vix || 0; globVixState = d.vixState || '안정';
        updateNeonFromGlobal();
        if (d.qqq !== undefined) headerPrevClose['QQQ'] = 0;
        return;
    }

    if (d.type === 'optionUpdate') {
        var panel  = d.panel;
        var ticker = d.ticker;
        if (panel === undefined || !ticker) return;

        if (d.prevClose && d.prevClose > 0) prevCloseCache[ticker] = d.prevClose;

        if (d.maxPain !== undefined && d.maxPain !== null) {
            panelDataStore[panel] = JSON.parse(JSON.stringify(d));
        } else {
            if (!panelDataStore[panel]) panelDataStore[panel] = {};
            Object.assign(panelDataStore[panel], d);
        }

        var yc     = yahooPriceCache[ticker];
        var price  = yc ? yc.price    : (d.price    || 0);
        var chgPct = yc ? yc.changePct: (d.change   || 0);
        var chgAmt = yc ? yc.changeAmt: (d.priceDiff|| 0);

        var tkEl = document.getElementById('p' + panel + '-ticker');
        if (tkEl && tkEl.textContent === '─') tkEl.textContent = ticker;
        var oiTEl = document.getElementById('p' + panel + '-oi-title');
        if (oiTEl) oiTEl.textContent = ticker + ' 옵션 체인';

        var dotEl = document.getElementById('p' + panel + '-oi-dot');
        if (dotEl && d.maxPain !== undefined && d.maxPain !== null) {
            dotEl.className = 'oi-dot flash';
            setTimeout(function() { dotEl.className = 'oi-dot'; }, 900);
        }

        renderPanel(panel, Object.assign({}, panelDataStore[panel], {
            price: price, changePct: chgPct, changeAmt: chgAmt
        }));
    }
};

            else                     { sigEl.textContent = '극단적 투매 (숏커버링 유의)'; sigEl.style.color = '#aa44ff'; }
        }

    }

            else if (d.score >= 7.5) s = '<b style="color:#ff6666;">콜 매수 쏠림</b> (' + d.score.toFixed(1) + '점)';

}

// ⭐️ 라이트웨이트 차트 생성 및 초기 데이터 설정 함수
function initOrUpdateLightweightChart(panel, ticker, currentPrice) {
    if (!ticker) return;
    var containerId = 'chart-' + panel;
    var container = document.getElementById(containerId);
    if (!container) return;

    // 이미 차트가 생성되어 있다면 중복 생성 방지 (데이터는 실시간 틱으로 업데이트됨)
    if (lwCharts[panel] && lwCharts[panel].ticker === ticker && lwCharts[panel].interval === panelIntervals[panel]) {
        return;
    }

    container.innerHTML = ''; // 기존 DOM 정리

    var chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
            background: { type: 'solid', color: '#07070c' },
            textColor: '#9999aa',
        },
        grid: {
            vertLines: { color: '#1a1a2e' },
            horzLines: { color: '#1a1a2e' },
        },
        timeScale: {
            timeVisible: true,
            secondsVisible: false,
            borderColor: '#2a2a3e',
        },
        rightPriceScale: {
            borderColor: '#2a2a3e',
        }
    });

    var candlestickSeries = chart.addCandlestickSeries({
        upColor: '#ff4444',
        downColor: '#4488ff',
        borderDownColor: '#4488ff',
        borderUpColor: '#ff4444',
        wickDownColor: '#4488ff',
        wickUpColor: '#ff4444',
    });

    // 가상의 초기 봉 데이터 생성 (현재가 기준 데모 샘플 데이터)
    var basePrice = currentPrice > 0 ? currentPrice : 100.0;
    var nowSec = Math.floor(Date.now() / 1000);
    var intervalMin = parseInt(panelIntervals[panel] || '3') * 60;
    if (isNaN(intervalMin)) intervalMin = 180;

    var initialData = [];
    for (var i = 30; i >= 0; i--) {
        var t = nowSec - (i * intervalMin);
        var pVar = basePrice + (Math.sin(i) * 1.5);
        initialData.push({
            time: t,
            open: pVar - 0.5,
            high: pVar + 1.0,
            low: pVar - 1.0,
            close: pVar
        });
    }

    candlestickSeries.setData(initialData);
    chart.timeScale().fitContent();

    // 관리 객체에 저장
    lwCharts[panel] = {
        chart: chart,
        series: candlestickSeries,
        ticker: ticker,
        interval: panelIntervals[panel],
        lastTime: nowSec,
        lastOpen: basePrice,
        lastHigh: basePrice + 1.0,
        lastLow: basePrice - 1.0
    };

    // 창크기 변경 시 차트 리사이징 대응
    window.addEventListener('resize', function() {
        if (container.clientWidth > 0 && container.clientHeight > 0) {
            chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
        }
    });
}

// ⭐️ 실시간 틱 데이터가 들어올 때 마지막 캔들을 즉시 갱신하는 함수
function updateRealtimeChartTick(panel, price) {
    var obj = lwCharts[panel];
    if (!obj || !obj.series) return;

    var nowSec = Math.floor(Date.now() / 1000);
    var intervalSec = parseInt(panelIntervals[panel] || '3') * 60;
    if (isNaN(intervalSec)) intervalSec = 180;

    // 현재 봉의 타임스탬프 계산
    var currentBarTime = nowSec - (nowSec % intervalSec);

    if (currentBarTime > obj.lastTime) {
        // 새로운 봉으로 넘어간 경우
        obj.lastTime = currentBarTime;
        obj.lastOpen = price;
        obj.lastHigh = price;
        obj.lastLow = price;
    } else {
        // 기존 봉에서 고가/저가/종가 실시간 갱신
        if (price > obj.lastHigh) obj.lastHigh = price;
        if (price < obj.lastLow) obj.lastLow = price;
    }

    obj.series.update({
        time: obj.lastTime,
        open: obj.lastOpen,
        high: obj.lastHigh,
        low: obj.lastLow,
        close: price
    });
}

// ⭐️ 분봉 드롭다운 변경 시 실행되는 함수
function changeInterval(panel, val) {
    panelIntervals[panel] = val;
    // 기존 차트 객체 초기화 후 해당 주기로 재생성 유도
    if (lwCharts[panel]) {
        lwCharts[panel].chart.remove();
        delete lwCharts[panel];
    }
    var ticker = panelDataStore[panel] ? panelDataStore[panel].ticker : null;
    if (!ticker) {
        if (panel === 0) ticker = 'TSLA';
        else if (panel === 1) ticker = 'NVDA';
        else if (panel === 2) ticker = 'PLTR';
    }
    var curPrice = yahooPriceCache[ticker] ? yahooPriceCache[ticker].price : 100.0;
    initOrUpdateLightweightChart(panel, ticker, curPrice);
}

function updateEnvSummary(i) {
    var el = document.getElementById('p' + i + '-sum-env');
    if (!el) return;
    var qStr = globQqq === null ? '─' : globQqq > 0 ? '<b class="c-red">▲ 상승</b>' : globQqq < 0 ? '<b class="c-blue">▼ 하락</b>' : '<b>─</b>';
    var sStr = globSpy === null ? '─' : globSpy > 0 ? '<b class="c-red">▲ 상승</b>' : globSpy < 0 ? '<b class="c-blue">▼ 하락</b>' : '<b>─</b>';
    var vCol = globVixState.indexOf('공포') >= 0 ? 'c-red' : globVixState.indexOf('주의') >= 0 ? 'c-gold' : 'c-green';
    var vStr = globVix === null ? '─' : '<b class="' + vCol + '">' + globVixState + '</b>';
    el.innerHTML = '지수: QQQ ' + qStr + ' / SPY ' + sStr + ' / VIX ' + vStr;
}

function updateNeonFromGlobal() {
    var qEl=document.getElementById('neon-qqq'), sEl=document.getElementById('neon-spy'), vEl=document.getElementById('neon-vix');
    if (globQqq!==null&&qEl){qEl.textContent='QQQ '+(globQqq>0?'+':'')+globQqq.toFixed(2)+'%';qEl.className='neon-item '+(globQqq>0?'up':globQqq<0?'dn':'neu');}

    if (globVix!==null&&vEl){vEl.textContent='VIX '+globVix.toFixed(2)+' ('+globVixState+')';vEl.className='neon-item '+(globVixState.indexOf('공포')>=0?'up':globVixState.indexOf('주의')>=0?'neon-vix-warn':'neu');}
}

function setWsDot(state) {
    var cls = state==='live' ? 'ws-dot live' : 'ws-dot dead';
    DASH_TICKERS.forEach(function(_,i){var el=document.getElementById('p'+i+'-dot');if(el)el.className=cls;});
    var hd=document.getElementById('ws-dot-header'); if(hd) hd.className=cls;
}

function updateTimeDisplay() {
    var el=document.getElementById('h-time'); if(!el) return;
    var n=new Date();
    el.textContent=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')+' '+n.toLocaleTimeString('ko-KR');
}

setInterval(function(){ if(lastMsgTime>0&&Date.now()-lastMsgTime>20000) setWsDot('dead'); }, 3000);

function renderTimeline(p, d) {
    var tl=document.getElementById(p+'timeline'); if(!tl) return;
    var vals=[d.support2,d.support1,d.maxPain,d.price,d.resistance1,d.resistance2].filter(function(v){return v>0;});
    if(!vals.length) return;
    var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=mx-mn||1;
    mn-=sp*0.1;mx+=sp*0.1;sp=mx-mn;
    var gp=function(v){return 8+Math.max(0,Math.min(1,(v-mn)/sp))*84;};
    var bots=[{val:d.support2,lbl:'2차 지지',c:'c-red',bg:'bg-red'},{val:d.support1,lbl:'1차 지지',c:'c-red',bg:'bg-red'},{val:d.resistance1,lbl:'1차 저항',c:'c-blue',bg:'bg-blue'},{val:d.resistance2,lbl:'2차 저항',c:'c-blue',bg:'bg-blue'}].filter(function(n){return n.val>0;});
    bots.forEach(function(n){n.pos=gp(n.val);}); bots.sort(function(a,b){return a.pos-b.pos;});
    for(var i=1;i<bots.length;i++) if(bots[i].pos-bots[i-1].pos<12) bots[i].pos=bots[i-1].pos+12;
    var tops=[{val:d.maxPain,lbl:'MaxPain',c:'c-gold',bg:'bg-gold',lg:false},{val:d.price,lbl:'현재가',c:'c-blue',bg:'bg-blue',lg:true}].filter(function(n){return n.val>0;});
    tops.forEach(function(n){n.pos=gp(n.val);}); tops.sort(function(a,b){return a.pos-b.pos;});
    if(tops.length===2&&Math.abs(tops[1].pos-tops[0].pos)<10){tops[0].tx='-100%';tops[1].tx='0%';}
    var html='<div class="tl-track"></div>';
    bots.forEach(function(n){html+='<div class="node node-bottom" style="left:'+n.pos+'%"><div class="lbl-box"><span class="val '+n.c+'">'+n.val.toFixed(1)+'</span><span class="lbl">'+n.lbl+'</span></div></div><div class="dot-tl dot-small '+n.bg+'" style="left:'+n.pos+'%"></div>';});
    tops.forEach(function(n){var sh=n.tx?'transform:translateX('+n.tx+');':'';html+='<div class="node node-top" style="left:'+n.pos+'%;'+sh+'z-index:'+(n.lg?20:10)+'"><div class="lbl-box"><span class="lbl '+n.c+'">'+n.lbl+'</span><span class="val '+n.c+'">'+n.val.toFixed(1)+'</span></div></div><div class="dot-tl '+(n.lg?'dot-large':'dot-small')+' '+n.bg+'" style="left:'+n.pos+'%;z-index:'+(n.lg?20:10)+'"></div>';});
    tl.innerHTML=html;
}

function renderOiGrid(p, rows, price) {
    var el=document.getElementById(p+'oi-rows'); if(!el) return;
    var mx=Math.max.apply(null,rows.map(function(r){return Math.max(r.callOI+r.callVol,r.putOI+r.putVol,1);}));
    var atm=rows.reduce(function(pv,cv){return Math.abs(cv.strike-price)<Math.abs(pv.strike-price)?cv:pv;}).strike;
    var fmt=function(v){return v>=1000?(v/1000).toFixed(1)+'K':(v===0?'-':v);};
    el.innerHTML=rows.map(function(r){
        var cw=Math.max(1,((r.callOI+r.callVol)/mx)*100),pw=Math.max(1,((r.putOI+r.putVol)/mx)*100);
        var ia=r.strike===atm?'atm':'';
        var cc=r.callChg>0?'up':r.callChg<0?'dn':'neu',pc=r.putChg>0?'up':r.putChg<0?'dn':'neu';
        var ct=(r.callChg>0?'+':'')+r.callChg.toFixed(1)+'%',pt=(r.putChg>0?'+':'')+r.putChg.toFixed(1)+'%';
        return '<div class="oi-row"><div class="oi-bar-wrap left"><div class="oi-bar call" style="width:'+cw+'%"></div></div><div class="oi-vol">'+fmt(r.callOI)+'/'+fmt(r.callVol)+'</div><div class="'+cc+'_'+ct+'"></div><div><span class="strike-box '+ia+'">'+r.strike.toFixed(1)+'</span></div><div class="'+pc+'">'+pt+'</div><div class="oi-vol">'+fmt(r.putOI)+'/'+fmt(r.putVol)+'</div><div class="oi-bar-wrap right"><div class="oi-bar put" style="width:'+pw+'%"></div></div></div>';
    }).join('');
}

(async function start() {
    await initFirebase();
    yahooWsConnect();
})();
