<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }

        #initial-loading {
            position: fixed;
            inset: 0;
            background: #07070c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

            #initial-loading.fade-out {
                opacity: 0;
                pointer-events: none;
            }

        .il-logo {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .il-strike {
            font-size: 36px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
        }

        .il-zone {
            font-size: 36px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
        }

        .il-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        .il-msg {
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
        }

        .panel-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,12,0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 8px;
            flex-direction: column;
            gap: 12px;
        }

            .panel-overlay.active {
                display: flex;
            }

        .po-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .po-msg {
            font-size: 12px;
            color: #888;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── 상단 바 ── */
        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 6px 0;
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 1400px;
        }

        .sep {
            color: #1a1a30;
            padding: 0 2px;
        }

        .neon-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
        }

            .neon-item .tit {
                font-size: 12px;
                color: #8b949e;
                font-weight: normal;
            }

            .neon-item .val {
                font-size: 13px;
                font-weight: bold;
                color: #ccc;
            }

                .neon-item .val.up {
                    color: #ff4444;
                    text-shadow: 0 0 6px rgba(255,68,68,0.3);
                }

                .neon-item .val.dn {
                    color: #4488ff;
                    text-shadow: 0 0 6px rgba(68,136,255,0.3);
                }

                .neon-item .val.warn {
                    color: #ffcc00;
                    text-shadow: 0 0 6px rgba(255,204,0,0.3);
                }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-time {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

            .ws-dot.live {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: np 1.5s infinite;
            }

            .ws-dot.dead {
                background: #1a1a2a;
                animation: none;
            }

        @keyframes np {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

            .oi-dot.flash {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: oiF 0.4s ease-in-out 2;
            }

        @keyframes oiF {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.05;
            }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            gap: 8px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
            position: relative;
        }

            .panel:last-child {
                border-right: none;
            }

        .ph {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            gap: 8px;
        }

        .ph-top {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            height: 30px;
        }

        .ticker-select-wrap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-select {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            background: #0b0b14;
            border: 1px solid #2a2a3e;
            border-radius: 5px;
            padding: 2px 10px;
            cursor: pointer;
            outline: none;
            width: 160px;
        }

            .ticker-select:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .ticker-select option {
                background: #0d0d1a;
                color: #fff;
                font-size: 13px;
            }

        .price-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
            justify-content: center;
        }

        .price-now {
            font-size: 20px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-diff {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-chg {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .vol-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1a2238;
            color: #77aaee;
            border: 1px solid #2a3a5e;
            white-space: nowrap;
            margin-left: 10px;
        }

        .up {
            color: #ff4444 !important;
        }

        .dn {
            color: #4488ff !important;
        }

        .neu {
            color: #aaa !important;
        }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2a2a2a;
            padding-bottom: 5px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .sb-title {
            color: #ddbb00;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            min-width: 0;
        }

        .sb-trend {
            font-size: 10px;
            color: #aaa;
            background: #1a1a2e;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .timeline {
            position: relative;
            height: 70px;
            margin: 0 6px;
        }

        .tl-track {
            position: absolute;
            top: 38px;
            left: 6%;
            right: 6%;
            height: 3px;
            background: #2a2a3e;
            border-radius: 2px;
        }

        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
        }

        .node-top {
            bottom: 42px;
        }

        .node-bottom {
            top: 46px;
        }

        .dot-triangle {
            position: absolute;
            top: 31px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #4488ff;
            z-index: 20;
        }

        .dot-tl {
            position: absolute;
            top: 39.5px;
            transform: translate(-50%,-50%);
            border-radius: 50%;
        }

        .dot-small {
            width: 9px;
            height: 9px;
            z-index: 2;
        }

        .lbl-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d0d15;
            padding: 0 2px;
            border-radius: 3px;
        }

        .lbl {
            font-size: 9px;
            color: #888;
            font-weight: bold;
            margin-bottom: 1px;
        }

        .val {
            font-size: 11px;
            font-weight: bold;
        }

        .c-red {
            color: #ff4444;
        }

        .bg-red {
            background: #ff4444;
        }

        .c-green {
            color: #44ff66;
        }

        .bg-green {
            background: #44ff66;
        }

        .c-blue {
            color: #4488ff;
        }

        .bg-blue {
            background: #4488ff;
        }

        .c-gold {
            color: #ffcc00;
        }

        .bg-gold {
            background: #ffcc00;
        }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 8px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .oi-title {
            font-size: 13px;
            font-weight: bold;
            color: #7799dd;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .oi-dte {
            background: rgba(243, 156, 18, 0.1);
            color: #f39c12;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: #bbb;
            border-bottom: 1px solid #2a2a3e;
            padding: 5px 0 6px;
            margin-bottom: 8px;
            background: #0f0f1a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            font-size: 10px;
            color: #fff;
            margin-bottom: 4px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            align-items: center;
            gap: 1px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 2px;
        }

        .oi-bar-wrap {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 0 3px;
        }

            .oi-bar-wrap.left {
                justify-content: flex-end;
            }

            .oi-bar-wrap.right {
                justify-content: flex-start;
            }

        .oi-bar.call {
            height: 6px;
            border-radius: 2px 0 0 2px;
            background: #cc3333;
        }

        .oi-bar.put {
            height: 6px;
            border-radius: 0 2px 2px 0;
            background: #3366cc;
        }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 1px 0;
            border-radius: 3px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 11px;
        }

            .strike-box.atm {
                background: #ffcc00;
                color: #000;
                box-shadow: 0 0 4px #ffcc00;
            }

        .oi-vol {
            font-size: 9.5px;
            color: #eee;
            white-space: nowrap;
            font-weight: bold;
        }

        .oi-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            color: #444;
            font-size: 12px;
            gap: 8px;
        }

        .oi-pending-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #222;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .chart-wrapper {
            flex: 0 0 240px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section {
            width: 100%;
            height: 100%;
        }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15,15,25,0.85);
            color: #ffcc00;
            border: 1px solid rgba(255,204,0,0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

            .chart-interval-select option {
                background: #0b0b14;
                color: #fff;
            }

        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }

            .sidebar::-webkit-scrollbar {
                display: none;
            }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name {
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
            line-height: 1;
            width: 100%;
        }

        .sl-strike {
            font-size: 30px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
            text-transform: uppercase;
        }

        .sl-zone {
            font-size: 30px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
            text-transform: uppercase;
        }

        .sl-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 12px 0 10px;
        }

        .sl-sub {
            font-size: 11.5px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .sidebar-menu {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #2a2a4a;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
        }

        .sidebar-watchlist {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px solid #1e1e30;
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .watchlist-title {
            margin: 0 0 8px;
            font-size: 13px;
            color: #aaa;
            font-weight: 600;
            flex-shrink: 0;
        }

        .ticker-list {
            overflow-y: auto;
            flex: 1;
            max-height: 340px;
        }

            .ticker-list::-webkit-scrollbar {
                width: 3px;
            }

            .ticker-list::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 2px;
            }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-bottom: 1px solid #1a1a28;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            border-radius: 3px;
        }

            .ticker-item:hover {
                background: #111120;
                color: #ddd;
            }

            .ticker-item.active-panel {
                color: #ffcc00;
            }

        .panel-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            background: #1a2a3e;
            color: #4488ff;
            margin-left: auto;
            white-space: nowrap;
        }

            .panel-badge.p0 {
                background: #2a1a1a;
                color: #ff6666;
            }

            .panel-badge.p1 {
                background: #1a2a1a;
                color: #66cc66;
            }

            .panel-badge.p2 {
                background: #1a1a2a;
                color: #6688ff;
            }

        .sidebar-ad {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #222;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 12px;
        }

        /* ── 모바일 환경 미디어 쿼리 ── */
        @media screen and (max-width:1200px) {
            body {
                min-width: unset;
            }

            .top-bar {
                height: auto;
                flex-wrap: wrap;
                padding: 10px;
                gap: 8px;
            }

            .logo-top {
                width: 100%;
                order: 1;
                align-items: center;
                margin-top: 2px;
            }

            .top-right {
                order: 2;
                width: 100%;
                justify-content: center;
            }

            #ws-dot-header {
                display: none !important;
            }

            .neon-ticker-bar {
                width: 100% !important;
                max-width: none !important;
                order: 3;
                margin-top: 6px;
                padding: 8px !important;
                display: grid !important;
                grid-template-columns: repeat(6, 1fr) !important;
                gap: 6px !important;
                background: rgba(0,0,0,0.6) !important;
                border: 1px solid rgba(112,144,255,0.2) !important;
                border-radius: 8px !important;
            }

                .neon-ticker-bar .sep {
                    display: none !important;
                }

            .neon-item {
                flex-direction: column !important;
                justify-content: center !important;
                background: rgba(255,255,255,0.05) !important;
                border-radius: 6px !important;
                border: 1px solid rgba(255,255,255,0.1) !important;
                padding: 8px 4px !important;
                height: 100%;
            }

                .neon-item .tit {
                    font-size: 10px !important;
                    margin-bottom: 4px;
                }

                .neon-item .val {
                    font-size: 12px !important;
                    white-space: nowrap !important;
                }

            #neon-qqq, #neon-spy, #neon-vix, #neon-fg {
                grid-column: span 3 !important;
            }

            #neon-nq, #neon-cl, #neon-tnx {
                grid-column: span 2 !important;
            }

            #neon-dxy, #neon-usdkrw {
                grid-column: span 3 !important;
            }

            .content-wrapper {
                flex-direction: column;
                overflow-y: auto;
                padding: 6px;
                gap: 8px;
            }

            .dashboard-grid {
                flex-direction: column;
                overflow-y: visible;
                min-height: 0;
            }

            html, body {

        function showPanelOverlay(panelIdx, msg) { var ov = document.getElementById('overlay-' + panelIdx); if (ov) ov.classList.add('active'); }

        function setSelectDisabled(panelIdx, val) { var sel = document.getElementById('ticker-select-' + panelIdx); if (sel) sel.disabled = val; var isel = document.getElementById('interval-' + panelIdx); if (isel) isel.disabled = val; }

        function refreshAllDropdowns() {
            [0, 1, 2].forEach(function (i) { var sel = document.getElementById('ticker-select-' + i); if (!sel) return; var opts = sel.options; for (var k = 0; k < opts.length; k++) { var t = opts[k].value; var usedIdx = panelTickers.indexOf(t); opts[k].disabled = (usedIdx >= 0 && usedIdx !== i); } });
        }

        var FIREBASE_URL = 'https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/';
        var fbGen = { 0: 0, 1: 0, 2: 0 };

        function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_URL });
                [0, 1, 2].forEach(function (i) { subscribeFirebase(i, panelTickers[i]); });
            } catch (e) { }
        }

        function subscribeFirebase(panelIdx, ticker) {
            if (!ticker) return; unsubscribeFirebase(panelIdx); fbGen[panelIdx]++; var myGen = fbGen[panelIdx];
            try {
                var rtRef = firebase.database().ref('tickers/' + ticker + '/realtime');
                rtRef.on('value', function (snap) { if (fbGen[panelIdx] !== myGen || panelTickers[panelIdx] !== ticker) return; var rtData = snap.val(); if (rtData) updatePanelPrice(panelIdx, rtData.price, rtData.changeRate, rtData.change, rtData.volume); });
                var panelRef = firebase.database().ref('tickers/' + ticker + '/panel');
                panelRef.on('value', function (snap) { if (fbGen[panelIdx] !== myGen || panelTickers[panelIdx] !== ticker) return; var panelData = snap.val(); if (panelData) { var p = JSON.parse(JSON.stringify(panelData)); p.ticker = ticker; p.type = 'optionUpdate'; window.onWsMessage(p); } });
                fbRefs[panelIdx] = { refs: [rtRef, panelRef], ticker: ticker, gen: myGen };

        }

        function unsubscribeFirebase(panelIdx) { try { if (fbRefs[panelIdx] && fbRefs[panelIdx].refs) fbRefs[panelIdx].refs.forEach(function (r) { r.off(); }); } catch (e) { } fbRefs[panelIdx] = null; fbGen[panelIdx]++; }

        window.onWsMessage = function (d) {
            if (!d || !d.type || d.type !== 'optionUpdate' || !d.ticker) return;
            var panel = panelTickers.indexOf(d.ticker); if (panel < 0) return;

            // ★ [서버 점수 강제 오버라이드 및 자체 완벽 재계산 로직] ★
            if (d.optionRows && d.optionRows.length > 0) {
                var tCall = 0, tPut = 0;
                d.optionRows.forEach(function (r) {
                    // ★ 핵심: C# 원본처럼 프리미엄 등락률을 가중치로 곱해주고 방향(양/음)을 적용합니다.
                    var cChgMult = (1 + Math.abs(r.callChg) / 100.0) * (r.callChg >= 0 ? 1 : -1);
                    var pChgMult = (1 + Math.abs(r.putChg) / 100.0) * (r.putChg >= 0 ? 1 : -1);

                    tCall += (r.callOI + r.callVol) * cChgMult;
                    tPut += (r.putOI + r.putVol) * pChgMult;
                });

                var totalEnergy = Math.abs(tCall) + Math.abs(tPut);
                if (totalEnergy > 0) {
                    var eRatio = (tCall - tPut) / totalEnergy;

                    var isIndex = (d.ticker === 'QQQ' || d.ticker === 'SPY' || d.ticker === 'IWM' || d.ticker === 'SPX');
                    var targetVol = isIndex ? 2.5 : 6.0;

                    var domRate = 0;
                    var cgEl = document.getElementById('p' + panel + '-chg');

                        var matches = cgEl.textContent.match(/-?\d+(\.\d+)?/g);

                    }
                    if (domRate === 0 && d.change !== undefined) {
                        domRate = Number(d.change) || 0;
                    }

                    var intensity = Math.min(1.0, Math.abs(domRate) / targetVol);
                    var calcScore = 5.0 + (eRatio * 5.0 * intensity);

                    d.score = Math.max(0, Math.min(10, calcScore));

        function updatePanelPrice(idx, price, changeRate, changeAmt, volume) {

                }

                                d.score >= 4.5 ? '<b class="c-gold">수급 중립</b>' :
                                    d.score >= 2.6 ? '<b style="color:#88bbff;">하락 전환</b>' :
                                        d.score >= 1.1 ? '<b style="color:#4488ff;">풋 매수 우위</b>' :
                                            '<b style="color:#aa44ff;">풋 쏠림 심화</b>';
                    spEl.innerHTML = '수급: ' + s + ' (' + d.score.toFixed(1) + '점)';
                }
            }
            updateEnvSummary(panel);
            if (d.optionRows && d.optionRows.length) renderOiSafe(panel, d.optionRows, price || (d.maxPain || 100));
            var chartTicker = d.ticker || panelTickers[panel];
            if (!currentChartTicker[panel] || currentChartTicker[panel] !== chartTicker) { currentChartTicker[panel] = chartTicker; updateChartWidget(panel, chartTicker); }
            hideInitialLoading();
        }

        function getIndexStatusHtml(val) {
            if (val === null) return '─';
            if (val >= 1.5) return '<b class="c-red">▲ 급등</b>';
            if (val >= 0.5) return '<b class="c-red">▲ 상승</b>';
            if (val > 0.0) return '<b class="c-red">▲ 강보합</b>';
            if (val === 0.0) return '<b class="c-gold">─ 보합</b>';
            if (val > -0.5) return '<b class="c-blue">▼ 약보합</b>';
            if (val > -1.5) return '<b class="c-blue">▼ 하락</b>';
            return '<b class="c-blue">▼ 급락</b>';
        }

        function updateEnvSummary(i) {
            var el = document.getElementById('p' + i + '-sum-env'); if (!el) return;
            var qStr = getIndexStatusHtml(globQqq);
            var sStr = getIndexStatusHtml(globSpy);
            el.innerHTML = '지수: QQQ ' + qStr + ' / SPY ' + sStr + ' / VIX <b class="' + (globVixState.indexOf('공포') >= 0 ? 'c-red' : 'c-green') + '">' + globVixState + '</b>';
        }

        function updateTimeDisplay() {
            var el = document.getElementById('h-time'); if (!el) return; var n = new Date();
            el.textContent = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0') + ' ' + (n.getHours() >= 12 ? '오후' : '오전') + ' ' + (n.getHours() % 12 || 12) + ':' + String(n.getMinutes()).padStart(2, '0') + ':' + String(n.getSeconds()).padStart(2, '0');
        } setInterval(updateTimeDisplay, 1000);

        function renderTimeline(p, d) {
            var tl = document.getElementById(p + 'timeline'); if (!tl) return;
            var vals = [d.support2, d.support1, d.maxPain, d.price, d.resistance1, d.resistance2].filter(function (v) { return v > 0; }); if (!vals.length) return;
            var isMobile = window.innerWidth <= 1200;
            var bots = [{ val: d.support2, lbl: '2차 지지', c: 'c-red', bg: 'bg-red' }, { val: d.support1, lbl: '1차 지지', c: 'c-red', bg: 'bg-red' }, { val: d.maxPain, lbl: 'MaxPain', c: 'c-gold', bg: 'bg-gold' }, { val: d.resistance1, lbl: '1차 저항', c: 'c-blue', bg: 'bg-blue' }, { val: d.resistance2, lbl: '2차 저항', c: 'c-blue', bg: 'bg-blue' }].filter(function (n) { return n.val > 0; });
            var tops = [{ val: d.price, lbl: '현재가', c: 'c-blue', bg: 'bg-blue' }].filter(function (n) { return n.val > 0; });
            var allNodes = bots.concat(tops); allNodes.sort(function (a, b) { return a.val - b.val; });
            if (isMobile && allNodes.length > 1) { var step = 88 / (allNodes.length - 1); allNodes.forEach(function (n, idx) { n.pos = 6 + (idx * step); }); bots.forEach(function (bNode) { var f = allNodes.filter(function (an) { return an.val === bNode.val; })[0]; if (f) bNode.pos = f.pos; }); tops.forEach(function (tNode) { var f = allNodes.filter(function (an) { return an.val === tNode.val; })[0]; if (f) tNode.pos = f.pos; }); }
            else { var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), sp = mx - mn || 1; mn -= sp * 0.1; mx += sp * 0.1; sp = mx - mn; var gp = function (v) { return 6 + Math.max(0, Math.min(1, (v - mn) / sp)) * 88; }; bots.forEach(function (n) { n.pos = gp(n.val); }); tops.forEach(function (n) { n.pos = gp(n.val); }); }
            var html = '<div class="tl-track"></div>';
            bots.forEach(function (n) { html += '<div class="node node-bottom" style="left:' + n.pos + '%"><div class="lbl-box"><span class="val ' + n.c + '">' + n.val.toFixed(1) + '</span><span class="lbl">' + n.lbl + '</span></div></div><div class="dot-tl dot-small ' + n.bg + '" style="left:' + n.pos + '%"></div>'; });
            tops.forEach(function (n) { html += '<div class="node node-top" style="left:' + n.pos + '%;z-index:20;"><div class="lbl-box"><span class="val ' + n.c + '">' + n.lbl + ' ' + n.val.toFixed(1) + '</span></div></div><div class="dot-triangle" style="left:' + n.pos + '%;"></div>'; });
            tl.innerHTML = html;
        }

        function renderOiSafe(panelIdx, rows, price) {
            var p = 'p' + panelIdx + '-'; var el = document.getElementById(p + 'oi-rows'); if (!el) return;
            var isMobile = el.closest('.panel') ? el.closest('.panel').offsetWidth <= 400 : window.innerWidth <= 1200;
            var mx = Math.max.apply(null, rows.map(function (r) { return Math.max(r.callOI + r.callVol, r.putOI + r.putVol, 1); }));
            var atm = rows.reduce(function (pv, cv) { return Math.abs(cv.strike - price) < Math.abs(pv.strike - price) ? cv : pv; }).strike;
            var fmt = function (v) { return v >= 1000 ? (v / 1000).toFixed(1) + 'K' : (v === 0 ? '-' : v); };
            hideInitialLoading();
            el.innerHTML = rows.map(function (r) {
                var cw = Math.max(1, ((r.callOI + r.callVol) / mx) * 100), pw = Math.max(1, ((r.putOI + r.putVol) / mx) * 100);
                var ia = r.strike === atm ? 'atm' : '';
                var cc = r.callChg > 0 ? 'up' : r.callChg < 0 ? 'dn' : 'neu', pc = r.putChg > 0 ? 'up' : r.putChg < 0 ? 'dn' : 'neu';
                var cvTxt = isMobile ? fmt(r.callOI + r.callVol) : (fmt(r.callOI) + '/' + fmt(r.callVol));
                var pvTxt = isMobile ? fmt(r.putOI + r.putVol) : (fmt(r.putOI) + '/' + fmt(r.putVol));
                return '<div class="oi-row"><div class="oi-bar-wrap left"><div class="oi-bar call" style="width:' + cw + '%"></div></div><div class="oi-vol">' + cvTxt + '</div><div class="' + cc + '">' + (r.callChg > 0 ? '+' : '') + Math.round(r.callChg) + '%</div><div><span class="strike-box ' + ia + '">' + r.strike.toFixed(1) + '</span></div><div class="' + pc + '">' + (r.putChg > 0 ? '+' : '') + Math.round(r.putChg) + '%</div><div class="oi-vol">' + pvTxt + '</div><div class="oi-bar-wrap right"><div class="oi-bar put" style="width:' + pw + '%"></div></div></div>';
            }).join('');
        }

        var chartTimers = { 0: null, 1: null, 2: null };
        function updateChartWidget(panel, ticker) {
            if (!ticker) return; var containerId = 'chart-' + panel; var container = document.getElementById(containerId); if (!container) return;
            if (chartTimers[panel]) { clearTimeout(chartTimers[panel]); chartTimers[panel] = null; } container.innerHTML = '';
            chartTimers[panel] = setTimeout(function () { try { new TradingView.widget({ autosize: true, symbol: ticker, interval: panelIntervals[panel] || '3', theme: 'dark', style: '1', hide_top_toolbar: true, hide_side_toolbar: true, hide_legend: true, allow_symbol_change: false, save_image: false, details: false, withdateranges: false, container_id: containerId }); } catch (e) { } }, 300);
        }

        function changeInterval(panel, val) { panelIntervals[panel] = val; saveLS(LS_INTERVAL, panelIntervals); updateChartWidget(panel, panelTickers[panel]); }

        (function initProto() {
            var P = 'syntax="proto3";message PricingData{string id=1;float price=2;sint64 time=3;string currency=4;string exchange=5;int32 quoteType=6;int32 marketHours=7;float changePercent=8;sint64 dayVolume=9;float dayHigh=10;float dayLow=11;float change=12;string shortName=13;sint64 expireDate=14;float openPrice=15;float previousClose=16;float strikePrice=17;string underlyingSymbol=18;sint64 openInterest=19;sint64 optionsType=20;sint64 miniOption=21;sint64 lastSize=22;float bid=23;sint64 bidSize=24;float ask=25;sint64 askSize=26;sint64 priceHint=27;sint64 vol_24hr=28;sint64 volAllCurrencies=29;string fromcurrency=30;string lastMarket=31;double circulatingSupply=32;double marketcap=33;}';
            try { PricingData = protobuf.parse(P).root.resolveAll().lookupType('PricingData'); } catch (e) { }
        })();

        var HEADER_TICKERS = ['QQQ', 'SPY'];
        function getAllSubs() { var all = WATCH_LIST.map(function (w) { return w.ticker; }).concat(HEADER_TICKERS).map(function (t) { return t === 'SPX' ? '^SPX' : t; }); var seen = {}, res = []; all.forEach(function (t) { if (!seen[t]) { seen[t] = true; res.push(t); } }); return res; }

        var yahooWs = null;
        function yahooWsConnect() {
            try {
                yahooWs = new WebSocket('wss://streamer.finance.yahoo.com'); yahooWs.binaryType = 'arraybuffer';
                yahooWs.onopen = function () { yahooWs.send(JSON.stringify({ subscribe: getAllSubs() })); };
                yahooWs.onmessage = function (ev) {
                    if (!PricingData) return;
                    try {
                        var bytes = ev.data instanceof ArrayBuffer ? new Uint8Array(ev.data) : (function () { var bin = atob(ev.data), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; })();
                        var msg = PricingData.decode(bytes);
                    } catch (e) { }
                };
            } catch (e) { }
        }

        // ★ [강력한 2중 방어선] realtime이 없으면 무조건 panel에서 데이터를 긁어와 상단을 채웁니다. ★
        function initGlobalTickersListener() {
            ['QQQ', 'SPY'].forEach(function (ticker) {

                function applyTop(price, rateRaw) {
                    var p = Number(price) || 0;
                    var chgStr = String(rateRaw || '0').replace('%', '').trim();
                    var chg = Number(chgStr) || 0;
                    if (ticker === 'QQQ') { globQqq = chg; updateNeonItem('neon-qqq', '나스닥(QQQ)', p, chg); }
                    else if (ticker === 'SPY') { globSpy = chg; updateNeonItem('neon-spy', 'S&P500(SPY)', p, chg); }
                    var hd = document.getElementById('ws-dot-header'); if (hd) hd.className = 'ws-dot live';
                    [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                }

                var rtRef = firebase.database().ref('tickers/' + ticker + '/realtime');
                var pRef = firebase.database().ref('tickers/' + ticker + '/panel');

                rtRef.on('value', function (snap) {
                    var data = snap.val();
                    if (data) {
                        applyTop(data.price, data.changeRate);
                    } else {
                        // realtime이 없으면 panel 1회 강제 로드
                        pRef.once('value').then(function (ps) {
                            var pd = ps.val();
                            if (pd) applyTop(pd.price, pd.change); // panel은 change가 %임
                        });
                    }
                });

                // 패널 업데이트 시 realtime 폴더가 없을 때를 대비한 동기화
                pRef.on('value', function (snap) {
                    var pd = snap.val();
                    if (!pd) return;
                    rtRef.once('value').then(function (rs) {
                        if (!rs.exists()) {
                            applyTop(pd.price, pd.change);
                        }
                    });
                });
            });
        }

        function initMacroListener() {
            try {
                firebase.database().ref('system/macro').on('value', function (snap) {
                    var data = snap.val(); if (!data) return;
                    if (data.nq_f) updateNeonItem('neon-nq', '나스닥선물', data.nq_f.price, data.nq_f.changeRate);
                    if (data.cl_f) updateNeonItem('neon-cl', 'WTI원유', data.cl_f.price, data.cl_f.changeRate);
                    if (data.tnx) updateNeonItem('neon-tnx', '미국채10년', data.tnx.price, data.tnx.changeRate);
                    if (data.dxy) {
                        var dp = Number(data.dxy.price) || 0, dc = Number(String(data.dxy.changeRate).replace('%', '')) || 0;
                        var dEl = document.getElementById('neon-dxy');
                        if (dEl) dEl.innerHTML = '<span class="tit">달러인덱스</span><span class="val ' + (dc > 0 ? 'up' : dc < 0 ? 'dn' : 'neu') + '">' + dp.toFixed(2) + ' (' + (dc > 0 ? '+' : '') + dc.toFixed(2) + '%)</span>';
                    }
                    if (data.vix) {
                        var vp = data.vix.price || 0, vs = data.vix.vixState || '안정';
                        var vixEl = document.getElementById('neon-vix');
                        if (vixEl) vixEl.innerHTML = '<span class="tit">VIX</span><span class="val ' + (vs === '공포패닉' ? 'up' : vs.includes('불안') ? 'warn' : 'neu') + '">' + vp.toFixed(2) + ' [' + vs + ']</span>';
                        globVix = vp; globVixState = vs;
                    }
                    if (data.fearGreed) {
                        var fgs = Math.round(data.fearGreed.score) || 0, fgr = (data.fearGreed.rating || '').toLowerCase();
                        var rKr = fgr.includes('extreme fear') ? '극단적 공포' : fgr.includes('fear') ? '공포' : fgr.includes('extreme greed') ? '극단적 탐욕' : fgr.includes('greed') ? '탐욕' : '중립';
                        var fgEl = document.getElementById('neon-fg');
                        if (fgEl) fgEl.innerHTML = '<span class="tit">F&G</span><span class="val ' + (fgs <= 25 ? 'up' : fgs >= 75 ? 'dn' : 'neu') + '">' + fgs + ' [' + rKr + ']</span>';
                    }
                    [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                });
            } catch (e) { }
        }

        function initUsdKrwListener() {
            try {
                firebase.database().ref('system/exchangeRate').on('value', function (snap) {
                    var data = snap.val(), el = document.getElementById('neon-usdkrw');
                    if (el && data) {
                        var p = typeof data === 'object' ? (Number(data.price) || 0) : (Number(data) || 0);
                        var r = Number(String(typeof data === 'object' ? data.changeRate : '0').replace('%', '')) || 0;
                        el.innerHTML = '<span class="tit">원달러환율</span><span class="val ' + (r > 0 ? 'up' : r < 0 ? 'dn' : 'neu') + '">' + p.toFixed(2) + '원</span>';
                    }
                });
            } catch (e) { }
        }

        function updateNeonItem(id, name, p, chg) {
            var el = document.getElementById(id); if (!el) return;
            var numP = Number(p) || 0, numC = Number(chg) || 0;
            var cls = numC > 0 ? 'up' : numC < 0 ? 'dn' : 'neu';
            el.innerHTML = '<span class="tit">' + name + '</span><span class="val ' + cls + '">' + numP.toFixed(2) + ' (' + (numC > 0 ? '+' : '') + numC.toFixed(2) + '%)</span>';
        }

        (function start() {
            initDashboard(); buildWatchlist(); refreshAllDropdowns(); initFirebase();
            initGlobalTickersListener(); yahooWsConnect(); initMacroListener(); initUsdKrwListener();
        })();
    </script>
