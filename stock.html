            if (dfEl) { dfEl.textContent = numPrice > 0 ? (numAmt > 0 ? '+' : '') + numAmt.toFixed(2) : '─'; dfEl.className = 'price-diff ' + cls; }
            if (cgEl) { cgEl.textContent = numPrice > 0 ? '(' + (numRate > 0 ? '+' : '') + numRate.toFixed(2) + '%)' : '─'; cgEl.className = 'price-chg ' + cls; }
        }

        // ════════════════════════════════════════════════════════
        // ★ 장외 시간 2줄 표시 (야후 방식)
        //   정규장(09:30~16:00 ET) : 1줄 — 현재가 (기존과 동일)
        //   그 외 시간             : 1줄 = 마지막 정규장 종가 + 전일 대비
        //                            2줄 = 프리마켓/애프터마켓/오버나이트 현재가 + 종가 대비
        //   종가 정보: Cloudflare Worker가 매일 자동 기록한 tickers/{종목}/session (우선)
        //              → 날짜 검증 후 사용, 브라우저에도 저장해 다음 방문 시 즉시 표시
        //              없으면 야후 장외 시세(현재가 - 종가대비)로 역산
        //   현재가: 실시간 값이 도착하기 전에는 숫자 대신 "실시간 연결 중" 표시 (지난 값 표시 안 함)
        // ════════════════════════════════════════════════════════
        var sessionCache = {};   // ticker → { regClose, regDate, prevClose }
        var yahooRegCache = {};  // ticker → { regClose, prevClose } (야후 장외 시세에서 역산)

        function etNowParts() {
            var et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            return { d: et.getDay(), m: et.getHours() * 60 + et.getMinutes(), et: et };
        }

        // 현재 ET 세션 구분
        function marketPhase() {
            var t = etNowParts(), d = t.d, m = t.m;
            var weekend = d === 6 || (d === 0 && m < 1200) || (d === 5 && m >= 1200);
            if (weekend) return { type: 'WEEKEND', label: '주말 휴장 · 마지막 시세', icon: '⏸' };
            if (m >= 570 && m < 960) return { type: 'REG' };
            if (m >= 240 && m < 570) return { type: 'PRE', label: '프리마켓', icon: '☀' };
            if (m >= 960 && m < 1200) return { type: 'POST', label: '애프터마켓', icon: '🌙' };
            return { type: 'NIGHT', label: '오버나이트', icon: '🌙' };
        }

        var closeStatus = null;           // system/closeUpdate (Worker 진행 상태)
        // ★ Cloudflare Worker 주소 (배포 후 실제 주소로 바꾸세요. 예: https://stock-close.계정이름.workers.dev)
        var CLOSE_WORKER_URL = 'https://yahoo-real-data.garam781.workers.dev';
        var _ensureAt = 0;

        // 오늘 필요한 종가가 아직 기록되지 않았으면 Worker에 즉시 실행 요청 (3분에 1번까지)
        function ensureCloseUpdated() {
            if (!CLOSE_WORKER_URL || CLOSE_WORKER_URL.indexOf('YOUR-ACCOUNT') >= 0) return;
            if (closeStatus && closeStatus.completedDate === expectedSessionDate() && closeStatus.ver === 2) return;
            if (Date.now() - _ensureAt < 3 * 60 * 1000) return;
            _ensureAt = Date.now();
            fetch(CLOSE_WORKER_URL.replace(/\/+$/, '') + '/ensure', { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(function (j) { console.info('[종가 Worker] ensure →', j && j.result); })
                .catch(function (e) { console.warn('[종가 Worker] 호출 실패', e); });
        }
        var LS_SESSION = 'sessionClose_v1';

        // 지금 기준 "마지막으로 끝난 정규장" 날짜 (ET, Worker 와 동일 규칙: 16:10 ET 이후 오늘, 주말 제외)
        function expectedSessionDate() {
            var t = etNowParts(), et = t.et;
            var d = new Date(et.getFullYear(), et.getMonth(), et.getDate(), 12);
            if (t.m < 16 * 60 + 10) d.setDate(d.getDate() - 1);
            while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
            return d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
        }

        // 저장된 종가가 "지금 기준 최신 정규장" 값인지 검증
        function sessionValid(ticker, s) {
            if (!s || !(s.regClose > 0) || !s.regDate) return false;
            var exp = expectedSessionDate();
            if (s.regDate === exp) return true;
            // 휴장일: Worker가 오늘 기준으로 확인을 마쳤는데 날짜가 더 이르면 그 값이 최신
            return s.regDate < exp && !!closeStatus && closeStatus.expected === exp && closeStatus.ver === 2 &&
                   !!closeStatus.done && closeStatus.done[ticker] === exp;
        }

        function saveSessionLS() { try { localStorage.setItem(LS_SESSION, JSON.stringify(sessionCache)); } catch (e) { } }
        (function loadSessionLS() {
            try { var v = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); if (v) sessionCache = v; } catch (e) { }
        })();

        function getRegClose(ticker) {
            var s = sessionCache[ticker];
            var y0 = yahooRegCache[ticker];
            // 저장 종가가 최신 날짜가 아닌데(휴장일 판정) 야후 실시간 기준 종가와 다르면 → 저장값 대신 실시간 기준 사용
            if (sessionValid(ticker, s) && s.regDate < expectedSessionDate() && y0 && y0.regClose > 0 &&
                Math.abs(y0.regClose - s.regClose) > 0.005) s = null;
            if (sessionValid(ticker, s)) return { regClose: s.regClose, prevClose: s.prevClose || 0, regDate: s.regDate, regVolume: s.regVolume || 0, src: s.source || '' };
            var y = yahooRegCache[ticker];
            if (y && y.regClose > 0) return { regClose: y.regClose, prevClose: y.prevClose || 0, regDate: '', src: 'yahoo-live' };
            return null;
        }

        function fmtSigned(v, dig) { return (v > 0 ? '+' : '') + v.toFixed(dig); }
        function clsOf(v) { return v > 0 ? 'up' : v < 0 ? 'dn' : 'neu'; }

        function updatePanelPrice(idx, price, changeRate, changeAmt, volume) {
            var p = 'p' + idx + '-';
            var numPrice = Number(String(price).replace(/[^0-9.-]+/g, "")) || 0;
            var numAmt = Number(String(changeAmt).replace(/[^0-9.-]+/g, "")) || 0;
            var numRate = Number(String(changeRate || '0').replace('%', '').trim()) || 0;
            var pxEl = document.getElementById(p + 'price'),
                dfEl = document.getElementById(p + 'diff'),
                cgEl = document.getElementById(p + 'chg'),
                volEl = document.getElementById(p + 'vol'),
                regLbl = document.getElementById(p + 'reg-label'),
                extEl = document.getElementById(p + 'ext');

            var phase = marketPhase();
            var rc = phase.type !== 'REG' ? getRegClose(panelTickers[idx]) : null;

            if (rc) {
                // ── 1줄: 마지막 정규장 종가 ──
                var regAmt = rc.prevClose > 0 ? rc.regClose - rc.prevClose : null;
                var regPct = rc.prevClose > 0 ? regAmt / rc.prevClose * 100 : null;
                var rcls = regAmt === null ? 'neu' : clsOf(regAmt);
                if (pxEl) { pxEl.textContent = rc.regClose.toFixed(2); pxEl.className = 'price-now ' + rcls; }
                if (dfEl) { dfEl.textContent = regAmt === null ? '' : fmtSigned(regAmt, 2); dfEl.className = 'price-diff ' + rcls; }
                if (cgEl) { cgEl.textContent = regPct === null ? '' : '(' + fmtSigned(regPct, 2) + '%)'; cgEl.className = 'price-chg ' + rcls; }
                if (regLbl) {
                    regLbl.textContent = '종가' + (rc.regDate ? ' ' + rc.regDate.substring(5).replace('-', '/') : '') + ' 16:00 ET' +
                        (rc.src === 'yahoo' ? ' ✓' : '');
                    regLbl.title = rc.src === 'yahoo' ? '자동 기록된 공식 종가 (Worker)' : '야후 장외 시세에서 계산한 종가';
                }

                // ── 2줄: 장외 현재가 (종가 대비) ──
                var extAmt = numPrice - rc.regClose, extPct = extAmt / rc.regClose * 100, ecls = clsOf(extAmt);
                var t = etNowParts().et;
                var hh = t.getHours(), mm = t.getMinutes();
                var clock = (hh % 12 === 0 ? 12 : hh % 12) + ':' + (mm < 10 ? '0' : '') + mm + (hh < 12 ? ' AM' : ' PM') + ' ET';
                var ePx = document.getElementById(p + 'ext-px'), eDf = document.getElementById(p + 'ext-diff'),
                    eCg = document.getElementById(p + 'ext-chg'), eLb = document.getElementById(p + 'ext-label');
                if (numPrice > 0) {
                    if (ePx) { ePx.textContent = numPrice.toFixed(2); ePx.className = 'ext-px ' + ecls; }
                    if (eDf) { eDf.textContent = fmtSigned(extAmt, 2); eDf.className = 'ext-diff ' + ecls; }
                    if (eCg) { eCg.textContent = '(' + fmtSigned(extPct, 2) + '%)'; eCg.className = 'ext-chg ' + ecls; }
                    if (eLb) eLb.textContent = phase.icon + ' ' + phase.label + ' · ' + clock;
                } else {
                    // 실시간 값이 아직 없음 → 지난 값 대신 연결 중 표시
                    if (ePx) { ePx.textContent = '⋯'; ePx.className = 'ext-px neu'; }
                    if (eDf) eDf.textContent = '';
                    if (eCg) eCg.textContent = '';
                    if (eLb) eLb.textContent = phase.icon + ' ' + phase.label + ' · 실시간 연결 중';
                }
                if (extEl) extEl.style.display = '';
            } else {
                // ── 정규장 (또는 종가 정보 없음): 기존 1줄 ──
                var cls = numRate > 0 ? 'up' : numRate < 0 ? 'dn' : 'neu';
                if (pxEl) { pxEl.textContent = numPrice > 0 ? numPrice.toFixed(2) : '⋯ 연결 중'; pxEl.className = 'price-now ' + cls; }
                if (dfEl) { dfEl.textContent = numPrice > 0 ? (numAmt > 0 ? '+' : '') + numAmt.toFixed(2) : ''; dfEl.className = 'price-diff ' + cls; }
                if (cgEl) { cgEl.textContent = numPrice > 0 ? '(' + (numRate > 0 ? '+' : '') + numRate.toFixed(2) + '%)' : ''; cgEl.className = 'price-chg ' + cls; }
                if (regLbl) regLbl.textContent = '';
                if (extEl) extEl.style.display = 'none';
            }
            // 정확한 값(확정 종가 또는 실시간 현재가)이 하나라도 표시되면 전체 로딩 화면을 바로 걷어냄
            if (rc || numPrice > 0) { try { hideInitialLoading(); } catch (e) { } }

            // 거래량: 장외 시간에는 확정된 정규장 거래량(Worker 저장값) 표시 / 정규장에는 실시간 거래량
            if (volEl) {
                if (rc && rc.regVolume > 0) {
                    volEl.textContent = '거래량: ' + numberWithCommas(rc.regVolume);
                    volEl.title = '정규장 거래량 (' + (rc.regDate || '') + ')';
                } else if (volume !== null && volume !== undefined && Number(String(volume).replace(/,/g, '')) > 0) {
                    volEl.textContent = '거래량: ' + numberWithCommas(volume);
                    volEl.title = '';
                } else if (phase.type === 'REG' && numPrice === 0) {
                    volEl.textContent = '거래량: ─';
                }
            }
        }

        // 세션 경계(09:30 / 16:00 등)를 넘을 때 표시 방식이 바로 바뀌도록 1분마다 다시 그림
        setInterval(function () {
            ensureCloseUpdated();
            [0, 1, 2].forEach(function (i) { try { renderPanelQuote(i); } catch (e) { } });
        }, 60000);

        function renderPanel(panel, d) {
            var p = 'p' + panel + '-'; var price = d.price || 0;
            if (d.score !== undefined) {
                var sigEl = document.getElementById(p + 'sigtitle');
                if (sigEl) {
                    if (d.score >= 9.0) { sigEl.textContent = '과매수 구간 (차익실현 고려)'; sigEl.style.color = '#ff3333'; }
                    else if (d.score >= 7.5) { sigEl.textContent = '상승 확장 (신규 진입 유의)'; sigEl.style.color = '#ff6666'; }
                    else if (d.score >= 5.6) { sigEl.textContent = '상승 추세 (콜 수급 유입)'; sigEl.style.color = '#ffaaaa'; }
                    else if (d.score >= 4.5) { sigEl.textContent = '보합권 (방향성 대기)'; sigEl.style.color = '#ddbb00'; }
                    else if (d.score >= 2.6) { sigEl.textContent = '하락 추세 (풋 수급 유입)'; sigEl.style.color = '#88bbff'; }
                    else if (d.score >= 1.1) { sigEl.textContent = '하락 확장 (추격 매도 유의)'; sigEl.style.color = '#4488ff'; }
                    else { sigEl.textContent = '과매도 구간 (기술적 반등 유의)'; sigEl.style.color = '#aa44ff'; }
                }
            }
            if (d.maxPain > 0 && price > 0) renderTimeline(p, Object.assign({}, d, { price: price }));
            var dteEl = document.getElementById(p + 'dte'); if (dteEl && d.dteLabel) { dteEl.textContent = '옵션만기 : ' + d.dteLabel; }
            var oit = document.getElementById(p + 'oi-title'); if (oit) { oit.textContent = (d.ticker || panelTickers[panel]) + ' 옵션 체인'; }
            var timeEl = document.getElementById(p + 'update-time');
            if (timeEl && d.updatedAt) { var rawTime = d.updatedAt; if (rawTime.length >= 16) timeEl.textContent = '(최신 갱신 : ' + rawTime.substring(5, 7) + '월 ' + rawTime.substring(8, 10) + '일 ' + rawTime.substring(11, 16) + ')'; }
            var badgeElem = document.getElementById(p + 'market-badge'); if (badgeElem) { badgeElem.style.display = d.isMarketOpen === false ? 'inline-block' : 'none'; }
            if (d.score !== undefined) {
                var spEl = document.getElementById(p + 'sum-power');
                if (spEl) {
                    var s = d.score >= 9.0 ? '<b style="color:#ff3333;">콜 쏠림 심화</b>' :
                        d.score >= 7.5 ? '<b style="color:#ff6666;">콜 매수 우위</b>' :
                            d.score >= 5.6 ? '<b style="color:#ffaaaa;">상승 전환</b>' :
                                d.score >= 4.5 ? '<b class="c-gold">수급 중립</b>' :
                                    d.score >= 2.6 ? '<b style="color:#88bbff;">하락 전환</b>' :
                                        d.score >= 1.1 ? '<b style="color:#4488ff;">풋 매수 우위</b>' :
                                            '<b style="color:#aa44ff;">풋 쏠림 심화</b>';
                    spEl.innerHTML = '수급: ' + s + ' (' + d.score.toFixed(1) + '점)';
                }
            }
            updateEnvSummary(panel);
            if (d.optionRows && d.optionRows.length) renderOiSafe(panel, d.optionRows, price || (d.maxPain || 100));
            var chartTicker = d.ticker || panelTickers[panel];
            if (!currentChartTicker[panel] || currentChartTicker[panel] !== chartTicker) { currentChartTicker[panel] = chartTicker; updateChartWidget(panel, chartTicker); }
            hideInitialLoading();

            applyPanelSituation(p, d);
        }

        function applyPanelSituation(p, d) {
            // 기존 applySmartStrategy가 panelIdx를 사용하므로 별도 로직은 생략
            // renderPanel 후 applySmartStrategy 호출
            var idx = parseInt(p.replace('p', '').replace('-', ''));
            if (!isNaN(idx)) applySmartStrategy(idx);
        }

        function getIndexStatusHtml(val) {
            if (val === null) return '─';
            if (val >= 1.5) return '<b class="c-red">▲ 급등</b>';
            if (val >= 0.5) return '<b class="c-red">▲ 상승</b>';
            if (val > 0.0) return '<b class="c-red">▲ 강보합</b>';
            if (val === 0.0) return '<b class="c-gold">─ 보합</b>';
            if (val > -0.5) return '<b class="c-blue">▼ 약보합</b>';
            if (val > -1.5) return '<b class="c-blue">▼ 하락</b>';
            return '<b class="c-blue">▼ 급락</b>';
        }

        function updateEnvSummary(i) {
            var el = document.getElementById('p' + i + '-sum-env'); if (!el) return;
            var qStr = getIndexStatusHtml(globQqq);
            var sStr = getIndexStatusHtml(globSpy);
            el.innerHTML = '지수: QQQ ' + qStr + ' / SPY ' + sStr + ' / VIX <b class="' + (globVixState.indexOf('공포') >= 0 ? 'c-red' : 'c-green') + '">' + globVixState + '</b>';
        }

        function updateTimeDisplay() {
            var el = document.getElementById('h-time'); if (!el) return; var n = new Date();
            el.textContent = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0') + ' ' + (n.getHours() >= 12 ? '오후' : '오전') + ' ' + (n.getHours() % 12 || 12) + ':' + String(n.getMinutes()).padStart(2, '0') + ':' + String(n.getSeconds()).padStart(2, '0');
        } setInterval(updateTimeDisplay, 1000);

        function renderTimeline(prefix, d) {
            var host = document.getElementById(prefix + 'timeline');
            if (!host) return;

            var price = d.price || 0;
            var r2 = d.resistance2 || 0, r1 = d.resistance1 || 0;
            var mp = d.maxPain || 0;
            var s1 = d.support1 || 0, s2 = d.support2 || 0;
            if (!r2 || !s2 || !mp || price <= 0) { host.innerHTML = ''; return; }

            var currentChgRate = Number(d.change) || 0;

            var PAD_L = 0.05, PAD_R = 0.05;
            var TRK_W = 1 - PAD_L - PAD_R;

            var minV = s2, maxV = r2, span = maxV - minV || 1;
            function pct(v) {
                var r = Math.max(0, Math.min(1, (v - minV) / span));
                return (PAD_L + r * TRK_W) * 100;
            }

            var dayHigh = (d.dayHigh && d.dayHigh > 0) ? d.dayHigh : Math.min(r2, price * 1.01);
            var dayLow = (d.dayLow && d.dayLow > 0) ? d.dayLow : Math.max(s2, price * 0.99);

            var pctL = pct(dayLow);
            var pctH = pct(dayHigh);
            if (pctH - pctL < 5) { pctH += 3; pctL -= 3; }

            var pctP = pct(price);

            var BOT_TRACK_Y = 50;
            var TOP_BASE_Y = BOT_TRACK_Y - 14;
            var TOP_TRACK_H = 5;
            var TOP_TRI_Y = TOP_BASE_Y - 10;
            var TOP_LBL_Y = TOP_TRI_Y - 14;

            var BOT_TRACK_H = 7;
            var NODE_CY = BOT_TRACK_Y + BOT_TRACK_H / 2;
            var PRICE_Y = BOT_TRACK_Y + BOT_TRACK_H + 5;
            var LABEL_Y0 = PRICE_Y + 12;
            var PCT_Y0 = LABEL_Y0 + 12;
            var COUNT_Y0 = PCT_Y0 + 12;
            var TOTAL_H = COUNT_Y0 + 8;

            host.style.position = 'relative';
            host.style.height = TOTAL_H + 'px';
            host.innerHTML = '';

            var lEl = mkEl({
                position: 'absolute', zIndex: '6', top: (TOP_BASE_Y - 4) + 'px', left: (pctL + 0.8) + '%', transform: 'translateX(-100%)',
                fontSize: '9.5px', fontWeight: 'bold', color: '#66bbff', whiteSpace: 'nowrap'
            });
            lEl.textContent = 'L ' + dayLow.toFixed(1);
            host.appendChild(lEl);

            var titleEl = mkEl({
                position: 'absolute', zIndex: '5', top: (TOP_BASE_Y - 4) + 'px', left: (pctL + 0.8) + '%', transform: 'translateX(calc(-100% - 48px))',
                fontSize: '9.5px', fontWeight: 'bold', color: '#8899aa', whiteSpace: 'nowrap'
            });
            titleEl.textContent = '당일변동';
            host.appendChild(titleEl);

            var hlTrackBg = mkEl({
                position: 'absolute', zIndex: '1', top: TOP_BASE_Y + 'px', height: TOP_TRACK_H + 'px',
                left: (pctL + 1.2) + '%', width: (pctH - (pctL + 1.2)) + '%',
                background: 'linear-gradient(90deg, rgba(68,136,255,0.8) 0%, rgba(120,120,160,0.4) 50%, rgba(255,68,68,0.8) 100%)',
                borderRadius: '3px',
            });
            host.appendChild(hlTrackBg);

            var hEl = mkEl({
                position: 'absolute', zIndex: '6', top: (TOP_BASE_Y - 4) + 'px', left: (pctH + 1.6) + '%', transform: 'translateX(0%)',
                fontSize: '9.5px', fontWeight: 'bold', color: '#ff6666', whiteSpace: 'nowrap'
            });
            hEl.textContent = 'H ' + dayHigh.toFixed(1);
            host.appendChild(hEl);

            var riseFromLow = (dayLow > 0 && price >= dayLow) ? ((price - dayLow) / dayLow) * 100 : 0;
            var riseStr = '(+' + riseFromLow.toFixed(2) + '%)';
            var dropFromHigh = (dayHigh > 0 && price <= dayHigh) ? ((price - dayHigh) / dayHigh) * 100 : 0;
            var dropStr = '(' + dropFromHigh.toFixed(2) + '%)';

            var cLbl = mkEl({
                position: 'absolute', zIndex: '12', top: TOP_LBL_Y + 'px', left: pctP + '%', transform: 'translateX(-50%)',
                fontSize: '9.5px', fontWeight: 'bold', color: '#00ddff', whiteSpace: 'nowrap',
                display: 'flex', alignItems: 'center', gap: '5px'
            });
            cLbl.innerHTML = '<span style="font-size:8.5px; color:#66bbff; font-weight:normal;">' + riseStr + '</span>' +
                '<span style="font-size:11px; font-weight:900; color:#00ddff;">' + price.toFixed(2) + '</span>' +
                '<span style="font-size:8.5px; color:#ff6666; font-weight:normal;">' + dropStr + '</span>';
            host.appendChild(cLbl);

            var tri = mkEl({
                position: 'absolute', zIndex: '11', top: TOP_TRI_Y + 'px', left: pctP + '%', transform: 'translateX(-50%)',
                width: '0', height: '0', borderLeft: '5px solid transparent', borderRight: '5px solid transparent',
                borderTop: '7px solid #00ddff'
            });

            var sortedRows = rows.slice().sort(function (a, b) { return b.strike - a.strike; });
            var atmIndex = sortedRows.findIndex(function (r) { return r.strike === atm; });
            var displayRows = sortedRows;

            if (atmIndex !== -1) {
                var startIdx = Math.max(0, atmIndex - 7);
                var endIdx = Math.min(sortedRows.length, startIdx + 14);
                if (endIdx - startIdx < 14) { startIdx = Math.max(0, endIdx - 14); }
                displayRows = sortedRows.slice(startIdx, endIdx);

        (function initProto() {
            var P = 'syntax="proto3";message PricingData{string id=1;float price=2;sint64 time=3;string currency=4;string exchange=5;int32 quoteType=6;int32 marketHours=7;float changePercent=8;sint64 dayVolume=9;float dayHigh=10;float dayLow=11;float change=12;string shortName=13;sint64 expireDate=14;float openPrice=15;float previousClose=16;float strikePrice=17;string underlyingSymbol=18;sint64 openInterest=19;sint64 optionsType=20;sint64 miniOption=21;sint64 lastSize=22;float bid=23;sint64 bidSize=24;float ask=25;sint64 askSize=26;sint64 priceHint=27;sint64 vol_24hr=28;sint64 volAllCurrencies=29;string fromcurrency=30;string lastMarket=31;double circulatingSupply=32;double marketcap=33;}';
            try { PricingData = protobuf.parse(P).root.resolveAll().lookupType('PricingData'); } catch (e) { }
        })();

        // ════════════════════════════════════════════════════════
        // ★ 야후 심볼 매핑 (finance.yahoo.com 에서 확인)
        //   - SPX 지수는 ^GSPC (실시간). ^SPX 는 CBOE 지연 시세, SPX(^ 없음)는 빈 종목
        //   - 나머지 주식/ETF는 티커 그대로
        // ════════════════════════════════════════════════════════
        var YAHOO_SYMBOL_MAP = { 'SPX': '^GSPC' };
        function toYahooSym(t) { return YAHOO_SYMBOL_MAP[t] || t; }
        function fromYahooSym(s) {
            for (var k in YAHOO_SYMBOL_MAP) { if (YAHOO_SYMBOL_MAP[k] === s) return k; }
            return s;
        }

        var HEADER_TICKERS = ['QQQ', 'SPY'];

        // ════════════════════════════════════════════════════════
        // ★ 야후 구독 종목 = 서버(Firebase tickers)에 등록된 종목
        //   - 키움(C#)이 기록하는 종목을 그대로 따라감 → HTML에서 종목 관리 불필요
        //   - shallow=true : 하위 데이터 없이 종목 이름만 받음 (1KB 미만)
        //   - 5분마다, 그리고 야후 재연결 때마다 다시 확인 → 추가/삭제 자동 반영
        //   - 서버 목록을 못 받으면(규칙 차단/네트워크) 관심종목+헤더로 대체
        // ════════════════════════════════════════════════════════
        var SYMBOL_REFRESH_MS = 5 * 60 * 1000;
        var serverTickers = null;            // 서버에서 받은 종목 목록 (null = 아직 못 받음)
        var yahooSubscribed = {};            // 현재 야후에 구독 중인 심볼

        function getAllSubs() {
            var base = (serverTickers && serverTickers.length
                ? serverTickers
                : WATCH_LIST.map(function (w) { return w.ticker; }))
                .concat(HEADER_TICKERS, panelTickers.filter(Boolean));   // 화면 종목은 항상 포함
            var seen = {}, res = [];
            base.map(toYahooSym).forEach(function (t) { if (!seen[t]) { seen[t] = true; res.push(t); } });
            return res;
        }

        function loadServerTickers() {
            return fetch(FIREBASE_URL.replace(/\/+$/, '') + '/tickers.json?shallow=true', { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (obj) {
                    var list = obj ? Object.keys(obj).sort() : [];
                    if (!list.length) throw new Error('종목 없음');
                    serverTickers = list;
                    applyTickerList(list);          // 콤보박스 3개 + 관심종목 갱신
                })
                .catch(function (e) {
                    console.warn('[야후] 서버 종목 목록 수신 실패 (' + e.message + ') → 관심종목으로 대체. '
                        + 'Firebase 규칙에서 tickers 읽기 권한을 확인하세요.');
                });
        }

        // 원하는 목록과 현재 구독을 비교해 추가/해제만 전송
        function syncYahooSubs() {
            if (!yahooWs || yahooWs.readyState !== 1) return;
            var want = getAllSubs(), wantMap = {};
            want.forEach(function (s) { wantMap[s] = true; });
            var add = want.filter(function (s) { return !yahooSubscribed[s]; });
            var del = Object.keys(yahooSubscribed).filter(function (s) { return !wantMap[s]; });
            if (add.length) yahooWs.send(JSON.stringify({ subscribe: add }));
            if (del.length) yahooWs.send(JSON.stringify({ unsubscribe: del }));
            yahooSubscribed = wantMap;
            if (add.length || del.length) {
                console.log('[야후] 구독 ' + want.length + '종목'
                    + (add.length ? ' | 추가: ' + add.join(', ') : '')
                    + (del.length ? ' | 해제: ' + del.join(', ') : ''));
            }
        }

        setInterval(function () { loadServerTickerNames().then(loadServerTickers).then(syncYahooSubs); }, SYMBOL_REFRESH_MS);

        // ── 야후 WebSocket 메시지 디코딩 (3가지 형식 모두 대응) ──
        //   1) 바이너리 protobuf  2) base64 문자열  3) {"type":"pricing","message":"<base64>"}
        function decodeYahooMsg(data) {
            if (data instanceof ArrayBuffer) return PricingData.decode(new Uint8Array(data));
            var s = String(data);
            if (s.charAt(0) === '{') {
                var j = JSON.parse(s);
                if (!j || !j.message) return null;
                s = j.message;
            }
            var bin = atob(s), b = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
            return PricingData.decode(b);
        }

        var yahooWs = null, yahooReconnectTimer = null, yahooLastMsgAt = 0;
        function yahooWsConnect() {
            if (yahooReconnectTimer) { clearTimeout(yahooReconnectTimer); yahooReconnectTimer = null; }
            try {
                yahooWs = new WebSocket('wss://streamer.finance.yahoo.com/?version=2');
                yahooWs.binaryType = 'arraybuffer';

                yahooWs.onopen = function () {
                    yahooLastMsgAt = Date.now();
                    yahooSubscribed = {};                         // 새 연결은 구독이 비어 있음
                    syncYahooSubs();                              // 화면 종목부터 즉시 구독 (첫 시세 대기시간 단축)
                    loadServerTickers().then(syncYahooSubs);      // 최신 서버 목록으로 전체 구독
                };

                yahooWs.onmessage = function (ev) {
                    yahooLastMsgAt = Date.now();
                    if (!PricingData) return;
                    var msg;
                    try { msg = decodeYahooMsg(ev.data); } catch (e) { return; }
                    if (!msg || !msg.id) return;

                    var ticker = fromYahooSym(msg.id);
                    var px = Number(msg.price) || 0;
                    if (!(px > 0)) return;
                    yahooWsAt[ticker] = Date.now();   // 이 종목은 WebSocket 수신 중 → REST 보조 조회 중단

                    // 장외 시세(marketHours ≠ 1)의 대비는 정규장 종가 기준 → 종가 역산 (Firebase 종가 정보가 없을 때 대체용)
                    var mh = Number(msg.marketHours);
                    if (!window._pcLogged) window._pcLogged = {};
                    if (!window._pcLogged[ticker]) {
                        window._pcLogged[ticker] = 1;
                        console.info('[야후 확인] ' + ticker + ' marketHours=' + mh + ' price=' + px +
                            ' change=' + msg.change + ' previousClose=' + msg.previousClose);
                    }
                    if (mh !== 1 && msg.change !== undefined && Math.abs(Number(msg.change)) < px) {
                        var yrc = px - Number(msg.change);
                        if (yrc > 0) yahooRegCache[ticker] = {
                            regClose: Math.round(yrc * 10000) / 10000,
                            // previousClose 가 종가와 같으면(장외 기준값) 전일 종가로 쓸 수 없음
                            prevClose: (Number(msg.previousClose) > 0 && Math.abs(Number(msg.previousClose) - yrc) > 0.005)
                                ? Number(msg.previousClose) : ((yahooRegCache[ticker] || {}).prevClose || 0)
                        };
                    }

                    var prev = yahooCache[ticker] || {};
                    yahooCache[ticker] = {
                        price: px,
                        changeRate: Number(msg.changePercent) || 0,
                        change: Number(msg.change) || 0,
                        volume: Number(msg.dayVolume) > 0 ? Number(msg.dayVolume) : (prev.volume || 0),
                        dayHigh: Number(msg.dayHigh) > 0 ? Number(msg.dayHigh) : (prev.dayHigh || 0),
                        dayLow: Number(msg.dayLow) > 0 ? Number(msg.dayLow) : (prev.dayLow || 0),
                        recvAt: Date.now()
                    };

                    // 헤더(QQQ/SPY)
                    if (HEADER_TICKERS.indexOf(ticker) >= 0) renderHeaderQuotes();

                    // 패널: 해당 종목을 야후 소스로 보여주는 중일 때만 갱신
                    panelTickers.forEach(function (t, idx) {
                        if (t !== ticker) return;
                        var pick = pickQuote(ticker);
                        if (pick && pick.src === 'yahoo') renderPanelQuote(idx);
                    });
                };

                yahooWs.onclose = function () {
                    console.warn('[야후] 연결 끊김 → 3초 후 재연결');
                    yahooReconnectTimer = setTimeout(yahooWsConnect, 3000);
                };
                yahooWs.onerror = function () { try { yahooWs.close(); } catch (e) { } };
            } catch (e) {
                yahooReconnectTimer = setTimeout(yahooWsConnect, 3000);
            }

        // 야후 연결이 살아있는데 60초 이상 아무 메시지도 없으면 강제 재연결 (정규장·프리·애프터 시간에만)
        setInterval(function () {

                        if (fgEl) fgEl.innerHTML = '<span class="tit">F&G</span><span class="val ' + (fgs <= 25 ? 'up' : fgs >= 75 ? 'dn' : 'neu') + '">' + fgs + ' [' + rKr + ']</span>';
                    }
                    [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                });
            } catch (e) { }
        }

        function initUsdKrwListener() {
            try {
                firebase.database().ref('system/exchangeRate').on('value', function (snap) {
                    var data = snap.val();
                    var el = document.getElementById('neon-usdkrw');
                    if (!el || !data) return;
                    var p = typeof data === 'object' ? (Number(data.price) || 0) : (Number(data) || 0);
                    var r = typeof data === 'object' ? (Number(data.changeRate) || 0) : 0;
                    if (p > 100) {
                        el.innerHTML = '<span class="tit">원달러환율</span>'
                            + '<span class="val ' + (r > 0 ? 'up' : r < 0 ? 'dn' : 'neu') + '">'
                            + p.toFixed(2) + '원</span>';
                    }
                });
            } catch (e) { }
        }

        function updateNeonItem(id, name, p, chg) {
            var el = document.getElementById(id); if (!el) return;
            var numP = Number(p) || 0, numC = Number(chg) || 0;
            var cls = numC > 0 ? 'up' : numC < 0 ? 'dn' : 'neu';
            el.innerHTML = '<span class="tit">' + name + '</span><span class="val ' + cls + '">' + numP.toFixed(2) + ' (' + (numC > 0 ? '+' : '') + numC.toFixed(2) + '%)</span>';
        }

        (function start() {
            initDashboard(); buildWatchlist(); refreshAllDropdowns(); initFirebase();
            try {
                firebase.database().ref('system/closeUpdate').on('value', function (snap) {
                    closeStatus = snap.val();
                    ensureCloseUpdated();   // 플래그 OFF(오늘 기록 없음)면 Worker 즉시 실행 요청
                    [0, 1, 2].forEach(function (i) { try { renderPanelQuote(i); } catch (e) { } });
                });
            } catch (e) { }
            initGlobalTickersListener(); yahooWsConnect();
            initMacroListener(); initUsdKrwListener();
            restTick();   // ★ 첫 화면 즉시 시세 (WebSocket 첫 체결을 기다리지 않음)
            // 서버 종목 목록 → 콤보박스 (야후 연결과 무관하게 바로 실행)
            loadServerTickerNames().then(loadServerTickers).then(syncYahooSubs);
        })();
    </script>
</body>
</html>
