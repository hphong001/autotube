    <script>
        // 뉴스 창(주소 ?news=1): 대시보드 본체는 실행하지 않고 뉴스 목록만 그림 (아래 오류는 의도한 중단)
        if (/[?&]news=1(&|$)/.test(location.search)) { 뉴스창_시작(); throw new Error('[뉴스 창] 대시보드 본체는 실행하지 않음 (정상)'); }
        // 대시보드2 (윈폼 버튼11 창, 주소 ?grid=1): 차트 10개 화면 · 윈폼 창에서만 (웹 브라우저는 보통 대시보드)
        var 격자모드 = /[?&]grid=1(&|$)/.test(location.search) && !!(window.chrome && window.chrome.webview);
        var 패널수 = 격자모드 ? 10 : 3;
        function 패널들() { var a = []; for (var i = 0; i < 패널수; i++) a.push(i); return a; }
        function 패널칸(v) { var o = {}; for (var i = 0; i < 패널수; i++) o[i] = v; return o; }
        var WATCH_LIST = [
            { ticker: 'TSLA', name: '테슬라' }, { ticker: 'NVDA', name: '엔비디아' },
            { ticker: 'PLTR', name: '팔란티어' }, { ticker: 'SPY', name: 'S&P 500 ETF' },
            { ticker: 'QQQ', name: '나스닥 100 ETF' }, { ticker: 'AAPL', name: '애플' },
            { ticker: 'AMZN', name: '아마존' }, { ticker: 'META', name: '메타' },
            { ticker: 'MU', name: '마이크론 테크' }, { ticker: 'MSTR', name: '마이크로스트래티지' },
            { ticker: 'AMD', name: '에이엠디' }, { ticker: 'IWM', name: '러셀 2000 ETF' },
            { ticker: 'COIN', name: '코인베이스' }, { ticker: 'SPX', name: 'S&P 500 지수옵션' }
        ];

        // ════════════════════════════════════════════════════════
        // ★ 콤보박스/관심종목 목록 = 서버(Firebase tickers)에 등록된 종목
        //   - 위 WATCH_LIST 는 서버 목록을 받기 전·실패 시에만 쓰는 초기값
        //   - 한글 이름: system/symbolNames (C#이 기록하면 우선 사용) → 아래 기본 이름표 → 티커
        //   - 콤보박스 순서: 아래 이름표 순서, 이름표에 없는 종목은 뒤에 알파벳순
        // ════════════════════════════════════════════════════════
        var TICKER_NAMES = {
            'TSLA': '테슬라',
            'NVDA': '엔비디아',
            'PLTR': '팔란티어',
            'AAPL': '애플',
            'AMD': 'AMD',
            'AMZN': '아마존닷컴',
            'MU': '마이크론 테크놀로지',
            'META': '메타 플랫폼스',
            'MSFT': '마이크로소프트',
            'AVGO': '브로드컴',
            'GOOGL': '알파벳 A',
            'MSTR': '마이크로스트레티지',
            'COIN': '코인베이스',
            'IBIT': '블랙록 비트코인 ETF',
            'GDX': '금광주 ETF',
            'GLD': '금 현물 ETF',
            'TSM': 'TSMC(ADR)',
            'SKHY': 'SK하이닉스(ADR)',
            'SPCX': '스페이스X',
            'LLY': '일라이 릴리',
            'JPM': '제이피모간 체이스',
            'WMT': '월마트',
            'GOOG': '알파벳 C',
            'IWM': '러셀2000 ETF',
            'IVV': 'S&P 500 코어 아이셰어즈 ETF',
            'SPX': 'S&P 500 지수옵션',
            'QQQ': '나스닥100(QQQ)',
            'SPY': 'S&P500(SPY)',
            'DIA': '다우(DIA)',
            'SQQQ': '나스닥 3배 인버스',
            'TQQQ': '나스닥 3배 레버리지',
            'SOXX': '반도체 섹터',
            'XLK': '기술주 섹터',
            'XLF': '금융주 섹터',
            'XLE': '에너지 섹터',
            'XLV': '헬스케어 섹터',
            'XLI': '산업재 섹터',
            'XLY': '임의소비재 섹터',
            'XLP': '필수소비재 섹터',
            'XLB': '소재 섹터',
            'IBB': '바이오테크 섹터',
            'TLT': '미국 20년 국채 ETF',
            'UUP': '달러 인덱스 ETF',
            'FXI': '중국 대형주 ETF',
            'MARA': '비트코인 채굴(MARA)',
            'RIOT': '비트코인 채굴(RIOT)',
            'USO': 'WTI 원유 ETF',
            'IAU': '금 현물 ETF(IAU)'
        };
        // ★ system/symbolList : 윈폼(C#)이 코드 순서대로 기록한 [{cd, nm}, ...]
        //   → 콤보박스 순서와 한글 이름은 이 목록을 그대로 따름
        var serverSymbolOrder = [];   // ['SQQQ','TQQQ', ...] (윈폼 코드 순서)
        var serverTickerNames = {};   // { SQQQ:'나스닥 3배 인버스', ... }

        function tickerName(t) { return serverTickerNames[t] || TICKER_NAMES[t] || t; }

        function orderTickers(list) {
            // 윈폼 순서가 있으면 그 순서, 없으면 기본 이름표 순서. 둘 다 없는 종목은 뒤에 알파벳순
            var order = serverSymbolOrder.length ? serverSymbolOrder : Object.keys(TICKER_NAMES);
            return list.slice().sort(function (a, b) {
                var ia = order.indexOf(a), ib = order.indexOf(b);
                if (ia < 0 && ib < 0) return a < b ? -1 : a > b ? 1 : 0;
                if (ia < 0) return 1;
                if (ib < 0) return -1;
                return ia - ib;
            });
        }

        // 서버 종목 목록으로 콤보박스 3개 + 관심종목 사이드바 다시 만들기
        function applyTickerList(list) {
            var ordered = orderTickers(list);
            // 현재 패널에 떠 있는 종목이 목록에 없으면 선택이 깨지지 않도록 유지
            panelTickers.forEach(function (t) { if (t && ordered.indexOf(t) < 0) ordered.push(t); });
            var newWatch = ordered.map(function (t) { return { ticker: t, name: tickerName(t) }; });
            if (JSON.stringify(newWatch) === JSON.stringify(WATCH_LIST)) return; // 변화 없음
            WATCH_LIST = newWatch;

            var opts = WATCH_LIST.map(function (w) { return '<option value="' + w.ticker + '">' + w.ticker + ' (' + w.name + ')</option>'; }).join('');
            패널들().forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i);
                if (!sel) return;
                sel.innerHTML = opts;
                sel.value = panelTickers[i];
            });
            buildWatchlist();
            refreshAllDropdowns();
            console.log('[종목] 콤보박스 갱신: ' + WATCH_LIST.length + '종목');
        }

        function loadServerTickerNames() {
            try {
                return firebase.database().ref('system/symbolList').once('value').then(function (snap) {
                    var v = snap.val();
                    if (!v || typeof v !== 'object') return;
                    // 배열로 오거나 {"0":{..},"1":{..}} 형태로 올 수 있음 → 번호 순으로 정리
                    var items = Array.isArray(v) ? v : Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; });
                    var order = [], names = {};
                    items.forEach(function (it) {
                        if (!it || !it.cd || names.hasOwnProperty(it.cd)) return;
                        order.push(it.cd);
                        names[it.cd] = it.nm || it.cd;
                    });
                    if (order.length) { serverSymbolOrder = order; serverTickerNames = names; }
                }).catch(function () { });
            } catch (e) { return Promise.resolve(); }
        }

        var DEFAULT_PANELS = 격자모드 ? ['TSLA', 'NVDA', 'PLTR', 'SPY', 'QQQ', 'AAPL', 'MSFT', 'AMZN', 'META', 'AMD'] : ['TSLA', 'NVDA', 'PLTR'];
        var LS_PANELS = 격자모드 ? 'sz_grid_panels' : 'sz_panels';          // 대시보드2 는 따로 저장 (같은 주소라 저장소를 같이 씀)
        var LS_INTERVAL = 격자모드 ? 'sz_grid_interval' : 'sz_interval';

        var panelTickers = loadLS(LS_PANELS, DEFAULT_PANELS);
        if (!Array.isArray(panelTickers)) panelTickers = DEFAULT_PANELS.slice();
        panelTickers = 패널들().map(function (i) { var t = panelTickers[i] || DEFAULT_PANELS[i]; return panelTickers.indexOf(t) !== i && panelTickers.indexOf(t) >= 0 ? DEFAULT_PANELS[i] : t; });
        var panelIntervals = loadLS(LS_INTERVAL, 패널칸('3'));
        if (!panelIntervals || typeof panelIntervals !== 'object') panelIntervals = 패널칸('3');
        패널들().forEach(function (i) { if (!panelIntervals[i]) panelIntervals[i] = '3'; });

        var panelDataStore = {};
        var fbRefs = {};
        var PricingData = null;

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';
        var currentChartTicker = 패널칸(null);
        var initialLoadDone = false;
        var switchTimers = 패널칸(null);
        var switchLocked = 패널칸(false);

        function loadLS(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }
        function numberWithCommas(x) {
            if (x === null || x === undefined || x === '') return '─';
            var n = Number(String(x).replace(/,/g, ''));
            if (isNaN(n) || n <= 0) return '─';
            return n.toLocaleString('en-US');
        }

        // ════════════════════════════════════════════════════════
        // ★ 상태 dot 블링킹 함수
        //   panelIdx : 패널 번호 (0,1,2)
        //   color    : '#ff4444' (키움/빨강) 또는 '#00aaff' (야후/파랑)
