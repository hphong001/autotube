<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #07070c;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-width: 1920px;
        }

        #initial-loading {
            position: fixed;
            inset: 0;
            background: #07070c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

            #initial-loading.fade-out {
                opacity: 0;
                pointer-events: none;
            }

        .il-logo {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .il-strike {
            font-size: 36px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
        }

        .il-zone {
            font-size: 36px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
        }

        .il-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        .il-msg {
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
        }

        .panel-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,12,0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 8px;
            flex-direction: column;
            gap: 12px;
        }

            .panel-overlay.active {
                display: flex;
            }

        .po-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #1a1a2e;
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .po-msg {
            font-size: 12px;
            color: #888;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes tlPulse {
            0%,100% { opacity:.55; }
            50%      { opacity:1; }
        }
        @keyframes tlPulseBorder {
            0%,100% { box-shadow: 0 0 6px rgba(255,204,0,0.4); }
            50%      { box-shadow: 0 0 18px rgba(255,204,0,1.0); }
        }

        /* ── 상단 바 ── */
        .top-bar {
            background: #080812;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .logo-top-main {
            display: flex;
            align-items: baseline;
        }

        .lt-strike {
            font-size: 22px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 12px rgba(255,223,0,0.6);
            text-transform: uppercase;
        }

        .lt-zone {
            font-size: 22px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 12px rgba(255,136,0,0.8);
            text-transform: uppercase;
        }

        .logo-top-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 6px 0;
        }

        .logo-top-sub {
            font-size: 9px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }

        .neon-ticker-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(112,144,255,0.2);
            flex: 1;
            justify-content: center;
            max-width: 1400px;
        }

        .sep {
            color: #1a1a30;
            padding: 0 2px;
        }

        .neon-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
        }

            .neon-item .tit {
                font-size: 12px;
                color: #8b949e;
                font-weight: normal;
            }

            .neon-item .val {
                font-size: 13px;
                font-weight: bold;
                color: #ccc;
            }

                .neon-item .val.up {
                    color: #ff4444;
                    text-shadow: 0 0 6px rgba(255,68,68,0.3);
                }

                .neon-item .val.dn {
                    color: #4488ff;
                    text-shadow: 0 0 6px rgba(68,136,255,0.3);
                }

                .neon-item .val.warn {
                    color: #ffcc00;
                    text-shadow: 0 0 6px rgba(255,204,0,0.3);
                }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-time {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            flex-shrink: 0;
        }

            .ws-dot.live {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: np 1.5s infinite;
            }

            .ws-dot.dead {
                background: #1a1a2a;
                animation: none;
            }

        @keyframes np {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .oi-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a2a;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

            .oi-dot.flash {
                background: #00aaff;
                box-shadow: 0 0 8px #00aaff;
                animation: oiF 0.4s ease-in-out 2;
            }

        @keyframes oiF {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.05;
            }
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 8px 0 8px 8px;
            gap: 10px;
        }

        .dashboard-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            gap: 8px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            border-right: 1px solid #1a1a2e;
            height: 100%;
            min-width: 0;
            overflow-y: auto;
            background: #07070c;
            position: relative;
        }

            .panel:last-child {
                border-right: none;
            }

        .ph {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #0b0b14;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3e;
            gap: 8px;
        }

        .ph-top {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            height: 30px;
        }

        .ticker-select-wrap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-select {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            background: #0b0b14;
            border: 1px solid #2a2a3e;
            border-radius: 5px;
            padding: 2px 10px;
            cursor: pointer;
            outline: none;
            width: 160px;
        }

            .ticker-select:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .ticker-select option {
                background: #0d0d1a;
                color: #fff;
                font-size: 13px;
            }

        .price-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
            justify-content: center;
        }

        .price-now {
            font-size: 20px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-diff {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .price-chg {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .vol-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1a2238;
            color: #77aaee;
            border: 1px solid #2a3a5e;
            white-space: nowrap;
            margin-left: 10px;
        }

        .up {
            color: #ff4444 !important;
        }

        .dn {
            color: #4488ff !important;
        }

        .neu {
            color: #aaa !important;
        }

        .strategy-box {
            border: 1px solid #2a2a1a;
            border-radius: 8px;
            padding: 8px;
            background: #0d0d15;
            flex-shrink: 0;
        }

        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #2a2a2a;
            padding-bottom: 5px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .sb-title {
            color: #ddbb00;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            min-width: 0;
        }

        .sb-trend {
            font-size: 10px;
            color: #aaa;
            background: #1a1a2e;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* ── 타임라인 컨테이너 ── */
        .timeline {
            position: relative;
            width: 100%;
        }

        .oi-box {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 8px;
            background: #0b0b14;
            flex-shrink: 0;
        }

        .oi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .oi-title {
            font-size: 13px;
            font-weight: bold;
            color: #7799dd;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .oi-dte {
            background: rgba(243, 156, 18, 0.1);
            color: #f39c12;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .oi-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: #bbb;
            border-bottom: 1px solid #2a2a3e;
            padding: 5px 0 6px;
            margin-bottom: 8px;
            background: #0f0f1a;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .oi-grid-header {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            font-size: 10px;
            color: #fff;
            margin-bottom: 4px;
            text-align: center;
        }

        .oi-row {
            display: grid;
            grid-template-columns: 1fr 52px 36px 42px 36px 52px 1fr;
            align-items: center;
            gap: 1px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 2px;
        }

        .oi-bar-wrap {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 0 3px;
        }

            .oi-bar-wrap.left {
                justify-content: flex-end;
            }

            .oi-bar-wrap.right {
                justify-content: flex-start;
            }

        .oi-bar.call {
            height: 6px;
            border-radius: 2px 0 0 2px;
            background: #cc3333;
        }

        .oi-bar.put {
            height: 6px;
            border-radius: 0 2px 2px 0;
            background: #3366cc;
        }

        .strike-box {
            background: #1a1a2e;
            color: #fff;
            padding: 1px 0;
            border-radius: 3px;
            font-weight: bold;
            width: 100%;
            display: block;
            font-size: 11px;
        }

            .strike-box.atm {
                background: #ffcc00;
                color: #000;
                box-shadow: 0 0 4px #ffcc00;
            }

        .oi-vol {
            font-size: 9.5px;
            color: #eee;
            white-space: nowrap;
            font-weight: bold;
        }

        .oi-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            color: #444;
            font-size: 12px;
            gap: 8px;
        }

        .oi-pending-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #222;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .chart-wrapper {
            flex: 0 0 240px;
            position: relative;
            background: #07070c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            display: flex;
            flex-direction: column;
        }

        .chart-section {
            width: 100%;
            height: 100%;
        }

        .chart-interval-select {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 20;
            background: rgba(15,15,25,0.85);
            color: #ffcc00;
            border: 1px solid rgba(255,204,0,0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

            .chart-interval-select option {
                background: #0b0b14;
                color: #fff;
            }

        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            height: 100%;
            padding-right: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }

            .sidebar::-webkit-scrollbar {
                display: none;
            }

        .sidebar-logo {
            background: #0b0c15;
            border: 1px solid #1a2a40;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sl-name {
            display: flex;
            align-items: baseline;
            justify-content: center;
            white-space: nowrap;
            line-height: 1;
            width: 100%;
        }

        .sl-strike {
            font-size: 30px;
            font-weight: 900;
            color: #ffdf00;
            text-shadow: 0 0 15px rgba(255,223,0,0.7);
            text-transform: uppercase;
        }

        .sl-zone {
            font-size: 30px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 15px rgba(255,136,0,0.9);
            text-transform: uppercase;
        }

        .sl-line {
            height: 1px;
            width: 90%;
            background: linear-gradient(90deg,transparent,#ffcc00,transparent);
            margin: 12px 0 10px;
        }

        .sl-sub {
            font-size: 11.5px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .sidebar-menu {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #2a2a4a;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
        }

        .sidebar-watchlist {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px solid #1e1e30;
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .watchlist-title {
            margin: 0 0 8px;
            font-size: 13px;
            color: #aaa;
            font-weight: 600;
            flex-shrink: 0;
        }

        .ticker-list {
            overflow-y: auto;
            flex: 1;
            max-height: 340px;
        }

            .ticker-list::-webkit-scrollbar {
                width: 3px;
            }

            .ticker-list::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 2px;
            }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-bottom: 1px solid #1a1a28;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            border-radius: 3px;
        }

            .ticker-item:hover {
                background: #111120;
                color: #ddd;
            }

            .ticker-item.active-panel {
                color: #ffcc00;
            }

        .panel-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            background: #1a2a3e;
            color: #4488ff;
            margin-left: auto;
            white-space: nowrap;
        }

            .panel-badge.p0 {
                background: #2a1a1a;
                color: #ff6666;
            }

            .panel-badge.p1 {
                background: #1a2a1a;
                color: #66cc66;
            }

            .panel-badge.p2 {
                background: #1a1a2a;
                color: #6688ff;
            }

        .sidebar-ad {
            background: #0d0d1a;
            border-radius: 8px;
            border: 1px dashed #222;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 12px;
        }

        /* ── 모바일 환경 미디어 쿼리 ── */
        @media screen and (max-width:1200px) {
            body {
                min-width: unset;
            }

            .oi-grid-header {
                grid-template-columns: 1fr 38px 32px 38px 32px 38px 1fr !important;
            }

            .oi-row {
                grid-template-columns: 1fr 38px 32px 38px 32px 38px 1fr !important;
                letter-spacing: -0.3px !important;
            }

            .top-bar {
                height: auto;
                flex-wrap: wrap;
                padding: 10px;
                gap: 8px;
            }

            .logo-top {
                width: 100%;
                order: 1;
                align-items: center;
                margin-top: 2px;
            }

            .top-right {
                order: 2;
                width: 100%;
                justify-content: center;
            }

            #ws-dot-header {
                display: none !important;
            }

            .neon-ticker-bar {
                width: 100% !important;
                max-width: none !important;
                order: 3;
                margin-top: 6px;
                padding: 8px !important;
                display: grid !important;
                grid-template-columns: repeat(6, 1fr) !important;
                gap: 6px !important;
                background: rgba(0,0,0,0.6) !important;
                border: 1px solid rgba(112,144,255,0.2) !important;
                border-radius: 8px !important;
            }

                .neon-ticker-bar .sep {
                    display: none !important;
                }

            .neon-item {
                flex-direction: column !important;
                justify-content: center !important;
                background: rgba(255,255,255,0.05) !important;
                border-radius: 6px !important;
                border: 1px solid rgba(255,255,255,0.1) !important;
                padding: 8px 4px !important;
                height: 100%;
            }

                .neon-item .tit {
                    font-size: 10px !important;
                    margin-bottom: 4px;
                }

                .neon-item .val {
                    font-size: 12px !important;
                    white-space: nowrap !important;
                }

            #neon-qqq, #neon-spy, #neon-vix, #neon-fg {
                grid-column: span 3 !important;
            }

            #neon-nq, #neon-cl, #neon-tnx {
                grid-column: span 2 !important;
            }

            #neon-dxy, #neon-usdkrw {
                grid-column: span 3 !important;
            }

            .content-wrapper {
                flex-direction: column;
                overflow-y: auto;
                padding: 6px;
                gap: 8px;
            }

            .dashboard-grid {
                flex-direction: column;
                overflow-y: visible;
                min-height: 0;
            }

            html, body {
                overflow-y: auto;
                height: auto;
            }

            .panel {
                height: auto;
                min-height: 0;
                border-right: none;
                border-bottom: 1px solid #1a1a2e;
                overflow-y: visible;
            }

            .ph {
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .ph-top {
                width: 100%;
                justify-content: center;
            }

            .ticker-select-wrap {
                position: static;
                transform: none;
                width: 100%;
                justify-content: center;
            }

            .ticker-select {
                width: 140px !important;
                font-size: 14px;
            }

            .price-container {
                flex-direction: column;
                gap: 4px;
                width: 100%;
                align-items: center;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                padding-right: 0;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .sidebar-logo {
                flex: 1;
                min-width: 180px;
            }

            .sidebar-menu {
                flex: 1;
                min-width: 120px;
            }

            .sidebar-watchlist {
                flex: 2;
                min-width: 200px;
                max-height: 200px;
            }

            .sidebar-ad {
                display: none;
            }

            .chart-wrapper {
                min-height: 280px;
            }
        }

    <script>
        var WATCH_LIST = [
            { ticker: 'TSLA', name: '테슬라' }, { ticker: 'NVDA', name: '엔비디아' },
            { ticker: 'PLTR', name: '팔란티어' }, { ticker: 'SPY', name: 'S&P 500 ETF' },

            { ticker: 'AMZN', name: '아마존' }, { ticker: 'META', name: '메타' },
            { ticker: 'MU', name: '마이크론 테크' }, { ticker: 'MSTR', name: '마이크로스트래티지' },
            { ticker: 'AMD', name: '에이엠디' }, { ticker: 'IWM', name: '러셀 2000 ETF' },
            { ticker: 'COIN', name: '코인베이스' }, { ticker: 'SPX', name: 'S&P 500 지수옵션' }

        var LS_INTERVAL = 'sz_interval';

        var panelTickers = loadLS(LS_PANELS, DEFAULT_PANELS);
        var panelIntervals = loadLS(LS_INTERVAL, { 0: '3', 1: '3', 2: '3' });

        var panelDataStore = {};
        var fbRefs = {};
        var PricingData = null;

        var globQqq = null, globSpy = null, globVix = null, globVixState = '안정';
        var currentChartTicker = { 0: null, 1: null, 2: null };
        var initialLoadDone = false;
        var switchTimers = { 0: null, 1: null, 2: null };
        var switchLocked = { 0: false, 1: false, 2: false };

        function loadLS(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }
        function numberWithCommas(x) { if (!x && x !== 0) return '─'; return Number(x).toLocaleString('en-US'); }

        function hideInitialLoading() {
            if (initialLoadDone) return;
            initialLoadDone = true;
            var el = document.getElementById('initial-loading');
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(function () { el.style.display = 'none'; }, 600);
        }
        setTimeout(hideInitialLoading, 8000);

        function buildPanelHTML(i) {
            var opts = WATCH_LIST.map(function (w) { return '<option value="' + w.ticker + '">' + w.ticker + ' (' + w.name + ')</option>'; }).join('');

            return '<div class="panel" id="panel-' + i + '">'
                + '<div class="panel-overlay" id="overlay-' + i + '"><div class="po-spinner"></div><div class="po-msg" id="overlay-msg-' + i + '">종목 전환 중...</div></div>'
                + '<div class="ph">'
                + '<div class="ph-top">'
                + '<div class="ticker-select-wrap">'
                + '<span class="ws-dot dead" id="p' + i + '-dot"></span>'
                + '<select class="ticker-select" id="ticker-select-' + i + '" onchange="onTickerSelectChange(' + i + ',this.value)">' + opts + '</select>'
                + '</div>'
                + '<div style="position:absolute; right:0; top:50%; transform:translateY(-50%); display:flex; align-items:center; z-index:5;">'
                + '<span id="p' + i + '-market-badge" style="display:none; background-color:rgba(231,76,60,0.15); color:#e74c3c; border:1px solid rgba(231,76,60,0.4); font-size:10px; font-weight:bold; padding:2px 6px; border-radius:4px;">장마감</span>'
                + '</div>'
                + '</div>'
                + '<div class="price-container">'
                + '<div class="price-block" id="p' + i + '-reg-block">'
                + '<span class="price-now" id="p' + i + '-price">─</span>'
                + '<span class="price-diff" id="p' + i + '-diff">─</span>'
                + '<span class="price-chg"  id="p' + i + '-chg">─</span>'
                + '<span class="vol-badge"  id="p' + i + '-vol">거래량: ─</span>'
                + '</div>'
                + '</div>'
                + '</div>'
                + '<div class="strategy-box">'
                + '<div class="sb-header"><span class="sb-title" id="p' + i + '-sigtitle">🟡 방향성 탐색 (관망)</span><span class="sb-trend" id="p' + i + '-trend">대기중</span></div>'
                + '<div class="timeline" id="p' + i + '-timeline"></div>'
                + '</div>'
                + '<div class="oi-box">'
                + '<div class="oi-header" style="display:flex; justify-content:space-between; align-items:center;">'
                + '<div style="display:flex; align-items:center; gap:4px;">'
                + '<span class="oi-dot" id="p' + i + '-oi-dot"></span>'
                + '<span class="oi-title" id="p' + i + '-oi-title" style="margin:0;">옵션 체인</span>'
                + '<span id="p' + i + '-update-time" style="font-size:10px; color:#8b949e; font-weight:normal; margin-left:12px;"></span>'
                + '</div>'
                + '<span class="oi-dte" id="p' + i + '-dte">옵션만기 : 대기중</span>'
                + '</div>'
                + '<div class="oi-summary"><span id="p' + i + '-sum-power">수급 대기중</span><span id="p' + i + '-sum-env">지수 대기중</span></div>'
                + '<div class="oi-grid-header"><div style="text-align:right;padding-right:2px;">콜</div><div>OI/V</div><div>등락</div><div>행사가</div><div>등락</div><div>OI/V</div><div style="text-align:left;padding-left:2px;">풋</div></div>'
                + '<div id="p' + i + '-oi-rows"></div>'
                + '</div>'
                + '<div class="chart-wrapper">'
                + '<select class="chart-interval-select" id="interval-' + i + '" onchange="changeInterval(' + i + ',this.value)">'
                + '<option value="1">1분봉</option><option value="3" selected>3분봉</option><option value="5">5분봉</option><option value="15">15분봉</option><option value="60">1시간</option><option value="D">일봉</option>'
                + '</select>'
                + '<div class="chart-section" id="chart-' + i + '"></div>'
                + '</div>'
                + '</div>';
        }

        function initDashboard() {
            var grid = document.getElementById('dashboard-grid'); grid.innerHTML = [0, 1, 2].map(buildPanelHTML).join('');
            [0, 1, 2].forEach(function (i) {
                var sel = document.getElementById('ticker-select-' + i); if (sel) sel.value = panelTickers[i];
                var intSel = document.getElementById('interval-' + i); if (intSel) intSel.value = panelIntervals[i] || '3';
            });
        }

        function buildWatchlist() {
            var list = document.getElementById('ticker-list');
            list.innerHTML = WATCH_LIST.map(function (w) { return '<div class="ticker-item" id="wl-' + w.ticker + '"><span style="font-weight:bold;min-width:44px;">' + w.ticker + '</span><span style="font-size:10px;color:#666;">' + w.name + '</span><span class="panel-badge" id="wl-badge-' + w.ticker + '" style="display:none;"></span></div>'; }).join('');
            refreshWatchlistBadges();
        }

        function refreshWatchlistBadges() {
            WATCH_LIST.forEach(function (w) {
                var badge = document.getElementById('wl-badge-' + w.ticker); var item = document.getElementById('wl-' + w.ticker);
                if (!badge || !item) return; var idx = panelTickers.indexOf(w.ticker);
                if (idx >= 0) { badge.textContent = '패널' + (idx + 1); badge.className = 'panel-badge p' + idx; badge.style.display = ''; item.classList.add('active-panel'); }
                else { badge.style.display = 'none'; item.classList.remove('active-panel'); }
            });
        }

        function onTickerSelectChange(panelIdx, newTicker) {
            if (panelTickers.indexOf(newTicker) >= 0 && panelTickers.indexOf(newTicker) !== panelIdx) { alert('이미 패널에 표시 중인 종목입니다.'); var sel = document.getElementById('ticker-select-' + panelIdx); if (sel) sel.value = panelTickers[panelIdx]; return; }
            clearTimeout(switchTimers[panelIdx]); showPanelOverlay(panelIdx, newTicker + ' 데이터 수신 중...'); switchTimers[panelIdx] = setTimeout(function () { executePanelSwitch(panelIdx, newTicker); }, 800);
        }

        function executePanelSwitch(panelIdx, newTicker) {
            panelTickers[panelIdx] = newTicker; saveLS(LS_PANELS, panelTickers);
            setSelectDisabled(panelIdx, true); switchLocked[panelIdx] = true; panelDataStore[panelIdx] = null;
            resetPanelUI(panelIdx, newTicker); subscribeFirebase(panelIdx, newTicker);
            currentChartTicker[panelIdx] = null; setTimeout(function () { updateChartWidget(panelIdx, newTicker); }, 200);
            refreshWatchlistBadges(); refreshAllDropdowns();
        }

        function resetPanelUI(panelIdx, ticker) {
            var p = 'p' + panelIdx + '-';
            ['price', 'diff', 'chg', 'vol'].forEach(function (f) { var el = document.getElementById(p + f); if (el) el.textContent = '─'; });
            var sig = document.getElementById(p + 'sigtitle'); if (sig) sig.textContent = '🟡 방향성 탐색 (관망)';
            var tr = document.getElementById(p + 'trend'); if (tr) tr.textContent = '대기중';
            var dte = document.getElementById(p + 'dte'); if (dte) dte.textContent = '옵션만기 : 대기중';
            var tl = document.getElementById(p + 'timeline'); if (tl) tl.innerHTML = '';
            var oit = document.getElementById(p + 'oi-title'); if (oit) oit.textContent = ticker + ' 옵션 체인';
            setOiPending(panelIdx, ticker);
        }

        function setOiPending(panelIdx, ticker) { var el = document.getElementById('p' + panelIdx + '-oi-rows'); if (el) el.innerHTML = '<div class="oi-pending"><div class="oi-pending-spinner"></div><span>데이터 준비중...</span></div>'; }
        function showPanelOverlay(panelIdx, msg) { var ov = document.getElementById('overlay-' + panelIdx); if (ov) ov.classList.add('active'); }
        function hidePanelOverlay(panelIdx) { var ov = document.getElementById('overlay-' + panelIdx); if (ov) ov.classList.remove('active'); }
        function setSelectDisabled(panelIdx, val) { var sel = document.getElementById('ticker-select-' + panelIdx); if (sel) sel.disabled = val; var isel = document.getElementById('interval-' + panelIdx); if (isel) isel.disabled = val; }

        function refreshAllDropdowns() {
            [0, 1, 2].forEach(function (i) { var sel = document.getElementById('ticker-select-' + i); if (!sel) return; var opts = sel.options; for (var k = 0; k < opts.length; k++) { var t = opts[k].value; var usedIdx = panelTickers.indexOf(t); opts[k].disabled = (usedIdx >= 0 && usedIdx !== i); } });
        }

        var FIREBASE_URL = 'https://hphong-2cb03-default-rtdb.asia-southeast1.firebasedatabase.app/';
        var fbGen = { 0: 0, 1: 0, 2: 0 };

        function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_URL });
                [0, 1, 2].forEach(function (i) { subscribeFirebase(i, panelTickers[i]); });
            } catch (e) { }
        }

        function subscribeFirebase(panelIdx, ticker) {
            if (!ticker) return; unsubscribeFirebase(panelIdx); fbGen[panelIdx]++; var myGen = fbGen[panelIdx];
            try {
                var rtRef = firebase.database().ref('tickers/' + ticker + '/realtime');
                rtRef.on('value', function (snap) {
                    if (fbGen[panelIdx] !== myGen || panelTickers[panelIdx] !== ticker) return;
                    var rtData = snap.val();
                    if (rtData) {
                        // ★ 수정: Firebase에서는 거래량(volume) null 전달 — Yahoo WS가 단일 소스
                        updatePanelPrice(panelIdx, rtData.price, rtData.changeRate, rtData.change, null);

                        var safePrice = Number(String(rtData.price).replace(/[^0-9.-]+/g, "")) || 0;

                        if (panelDataStore[panelIdx] && safePrice > 0) {
                            panelDataStore[panelIdx].price = safePrice;
                            var p = 'p' + panelIdx + '-';
                            if (panelDataStore[panelIdx].maxPain > 0) {
                                renderTimeline(p, panelDataStore[panelIdx]);
                            }
                            if (panelDataStore[panelIdx].optionRows && panelDataStore[panelIdx].optionRows.length > 0) {
                                renderOiSafe(panelIdx, panelDataStore[panelIdx].optionRows, safePrice);
                            }
                        }
                    }
                });
                var panelRef = firebase.database().ref('tickers/' + ticker + '/panel');
                panelRef.on('value', function (snap) { if (fbGen[panelIdx] !== myGen || panelTickers[panelIdx] !== ticker) return; var panelData = snap.val(); if (panelData) { var p = JSON.parse(JSON.stringify(panelData)); p.ticker = ticker; p.type = 'optionUpdate'; window.onWsMessage(p); } });
                fbRefs[panelIdx] = { refs: [rtRef, panelRef], ticker: ticker, gen: myGen };
            } catch (e) { }
        }

        function unsubscribeFirebase(panelIdx) { try { if (fbRefs[panelIdx] && fbRefs[panelIdx].refs) fbRefs[panelIdx].refs.forEach(function (r) { r.off(); }); } catch (e) { } fbRefs[panelIdx] = null; fbGen[panelIdx]++; }

        window.onWsMessage = function (d) {
            if (!d || !d.type || d.type !== 'optionUpdate' || !d.ticker) return;
            var panel = panelTickers.indexOf(d.ticker); if (panel < 0) return;

            if (d.optionRows && d.optionRows.length > 0) {
                var tCall = 0, tPut = 0;
                d.optionRows.forEach(function (r) {
                    var cChgMult = (1 + Math.abs(r.callChg) / 100.0) * (r.callChg >= 0 ? 1 : -1);
                    var pChgMult = (1 + Math.abs(r.putChg) / 100.0) * (r.putChg >= 0 ? 1 : -1);
                    tCall += (r.callOI + r.callVol) * cChgMult;
                    tPut += (r.putOI + r.putVol) * pChgMult;
                });

                var totalEnergy = Math.abs(tCall) + Math.abs(tPut);
                if (totalEnergy > 0) {
                    var eRatio = (tCall - tPut) / totalEnergy;
                    var isIndex = (d.ticker === 'QQQ' || d.ticker === 'SPY' || d.ticker === 'IWM' || d.ticker === 'SPX');
                    var targetVol = isIndex ? 2.5 : 6.0;
                    var domRate = 0;
                    var cgEl = document.getElementById('p' + panel + '-chg');
                    if (cgEl && cgEl.textContent !== '─') {
                        var matches = cgEl.textContent.match(/-?\d+(\.\d+)?/g);
                        if (matches) domRate = Number(matches[matches.length - 1]) || 0;
                    }
                    if (domRate === 0 && d.change !== undefined) { domRate = Number(d.change) || 0; }
                    var intensity = Math.min(1.0, Math.abs(domRate) / targetVol);
                    var calcScore = 5.0 + (eRatio * 5.0 * intensity);
                    d.score = Math.max(0, Math.min(10, calcScore));
                }
            }

            panelDataStore[panel] = JSON.parse(JSON.stringify(d)); renderPanel(panel, panelDataStore[panel]);
            hidePanelOverlay(panel); setSelectDisabled(panel, false); switchLocked[panel] = false;
        };

        // ★ 수정: volume이 null이면 거래량 표시 갱신하지 않음
        function updatePanelPrice(idx, price, changeRate, changeAmt, volume) {
            var p = 'p' + idx + '-';
            var numPrice = Number(String(price).replace(/[^0-9.-]+/g, "")) || 0;
            var numAmt   = Number(String(changeAmt).replace(/[^0-9.-]+/g, "")) || 0;
            var numRate  = Number(String(changeRate || '0').replace('%', '').trim()) || 0;
            var cls = numRate > 0 ? 'up' : numRate < 0 ? 'dn' : 'neu';
            var pxEl = document.getElementById(p + 'price'),
                dfEl = document.getElementById(p + 'diff'),
                cgEl = document.getElementById(p + 'chg'),
                volEl = document.getElementById(p + 'vol');
            if (pxEl) { pxEl.textContent = numPrice > 0 ? numPrice.toFixed(2) : '─'; pxEl.className = 'price-now ' + cls; }
            if (dfEl) { dfEl.textContent = numPrice > 0 ? (numAmt > 0 ? '+' : '') + numAmt.toFixed(2) : '─'; dfEl.className = 'price-diff ' + cls; }
            if (cgEl) { cgEl.textContent = numPrice > 0 ? '(' + (numRate > 0 ? '+' : '') + numRate.toFixed(2) + '%)' : '─'; cgEl.className = 'price-chg ' + cls; }
            // ★ 수정: volume이 null이 아닐 때만 거래량 업데이트
            if (volEl && volume !== null && volume !== undefined) {
                volEl.textContent = '거래량: ' + numberWithCommas(volume);
            }
        }

        function renderPanel(panel, d) {
            var p = 'p' + panel + '-'; var price = d.price || 0;
            if (d.score !== undefined) {
                var sigEl = document.getElementById(p + 'sigtitle');
                if (sigEl) {
                    if (d.score >= 9.0) { sigEl.textContent = '과매수 구간 (차익실현 고려)'; sigEl.style.color = '#ff3333'; }
                    else if (d.score >= 7.5) { sigEl.textContent = '상승 확장 (신규 진입 유의)'; sigEl.style.color = '#ff6666'; }
                    else if (d.score >= 5.6) { sigEl.textContent = '상승 추세 (콜 수급 유입)'; sigEl.style.color = '#ffaaaa'; }
                    else if (d.score >= 4.5) { sigEl.textContent = '보합권 (방향성 대기)'; sigEl.style.color = '#ddbb00'; }
                    else if (d.score >= 2.6) { sigEl.textContent = '하락 추세 (풋 수급 유입)'; sigEl.style.color = '#88bbff'; }
                    else if (d.score >= 1.1) { sigEl.textContent = '하락 확장 (추격 매도 유의)'; sigEl.style.color = '#4488ff'; }
                    else { sigEl.textContent = '과매도 구간 (기술적 반등 유의)'; sigEl.style.color = '#aa44ff'; }
                }
                var trEl = document.getElementById(p + 'trend'); if (trEl) trEl.innerHTML = d.trendText || '대기중';
            }
            if (d.maxPain > 0 && price > 0) renderTimeline(p, Object.assign({}, d, { price: price }));
            var dteEl = document.getElementById(p + 'dte'); if (dteEl && d.dteLabel) { dteEl.textContent = '옵션만기 : ' + d.dteLabel; }
            var oit = document.getElementById(p + 'oi-title'); if (oit) { oit.textContent = (d.ticker || panelTickers[panel]) + ' 옵션 체인'; }
            var timeEl = document.getElementById(p + 'update-time');
            if (timeEl && d.updatedAt) { var rawTime = d.updatedAt; if (rawTime.length >= 16) timeEl.textContent = `(최신 갱신 : ${rawTime.substring(5, 7)}월 ${rawTime.substring(8, 10)}일 ${rawTime.substring(11, 16)})`; }
            var badgeElem = document.getElementById(p + 'market-badge'); if (badgeElem) { badgeElem.style.display = d.isMarketOpen === false ? 'inline-block' : 'none'; }
            if (d.score !== undefined) {
                var spEl = document.getElementById(p + 'sum-power');
                if (spEl) {
                    var s = d.score >= 9.0 ? '<b style="color:#ff3333;">콜 쏠림 심화</b>' :
                        d.score >= 7.5 ? '<b style="color:#ff6666;">콜 매수 우위</b>' :
                            d.score >= 5.6 ? '<b style="color:#ffaaaa;">상승 전환</b>' :
                                d.score >= 4.5 ? '<b class="c-gold">수급 중립</b>' :
                                    d.score >= 2.6 ? '<b style="color:#88bbff;">하락 전환</b>' :
                                        d.score >= 1.1 ? '<b style="color:#4488ff;">풋 매수 우위</b>' :
                                            '<b style="color:#aa44ff;">풋 쏠림 심화</b>';
                    spEl.innerHTML = '수급: ' + s + ' (' + d.score.toFixed(1) + '점)';
                }
            }
            updateEnvSummary(panel);
            if (d.optionRows && d.optionRows.length) renderOiSafe(panel, d.optionRows, price || (d.maxPain || 100));
            var chartTicker = d.ticker || panelTickers[panel];
            if (!currentChartTicker[panel] || currentChartTicker[panel] !== chartTicker) { currentChartTicker[panel] = chartTicker; updateChartWidget(panel, chartTicker); }
            hideInitialLoading();
        }

        /* ════════════════════════════════════════════════════════
           ★ 수정: renderTimeline — v4 기반 전면 교체
           데이터 필드:
             d.price / d.resistance2 / d.resistance1 / d.maxPain
             d.support1 / d.support2
             d.dayHigh / d.dayLow
             d.touchCounts = { r2, r1, mp, s1, s2 }  (없으면 0)
             d.touchedKey  = 'r2'|'r1'|'mp'|'s1'|'s2'|null
        ════════════════════════════════════════════════════════ */
        function renderTimeline(prefix, d) {
            var host = document.getElementById(prefix + 'timeline');
            if (!host) return;

            var price = d.price || 0;
            var r2 = d.resistance2 || 0, r1 = d.resistance1 || 0;
            var mp = d.maxPain || 0;
            var s1 = d.support1 || 0, s2 = d.support2 || 0;
            if (!r2 || !s2 || !mp || price <= 0) { host.innerHTML = ''; return; }

            /* ── 레이아웃 상수 ── */
            var PAD_L  = 0.05, PAD_R = 0.05;
            var TRK_W  = 1 - PAD_L - PAD_R;
            var CURR_LBL_Y = 0;
            var CURR_TRI_Y = 14;
            var HL_Y       = 28;   // H/L 행 (가로바 위, 삼각형 아래)
            var TRACK_Y    = 40;   // 가로바 top
            var TRACK_H    = 7;    // 가로바 두께
            var NODE_CY    = TRACK_Y + TRACK_H / 2;
            var PRICE_Y    = TRACK_Y + TRACK_H + 11;  // 가격 줄 (여백 11px)
            var LABEL_Y0   = PRICE_Y + 13;
            var COUNT_Y0   = LABEL_Y0 + 13;
            var TOTAL_H    = COUNT_Y0 + 20;

            host.style.position = 'relative';
            host.style.height   = TOTAL_H + 'px';
            host.innerHTML      = '';

            var minV = s2, maxV = r2, span = maxV - minV || 1;
            function pct(v) {
                var r = Math.max(0, Math.min(1, (v - minV) / span));
                return (PAD_L + r * TRK_W) * 100;
            }

            var nodes = [
                { key:'s2', val:s2, label:'2차지지', color:'#3355cc', glow:'rgba(51,85,204,0.6)' },
                { key:'s1', val:s1, label:'1차지지', color:'#6699ff', glow:'rgba(102,153,255,0.5)' },
                { key:'mp', val:mp, label:'MaxPain', color:'#ffcc00', glow:'rgba(255,204,0,0.7)' },
                { key:'r1', val:r1, label:'1차저항', color:'#ff7777', glow:'rgba(255,119,119,0.5)' },
                { key:'r2', val:r2, label:'2차저항', color:'#ff3333', glow:'rgba(255,51,51,0.7)' },
            ];

            var counts    = d.touchCounts || {};
            var touchedKey = d.touchedKey  || null;

            var dayHigh = d.dayHigh || 0;
            var dayLow  = d.dayLow  || 0;
            var showH   = dayHigh > 0 && dayHigh <= r2;
            var showL   = dayLow  > 0 && dayLow  >= s2;
            var pctH    = showH ? pct(dayHigh) : (1 - PAD_R) * 100;
            var pctL    = showL ? pct(dayLow)  : PAD_L * 100;
            var pctP    = pct(price);

            /* 1. 가로바 배경 */
            var trackBg = mkDiv({
                position:'absolute', zIndex:'1',
                top: TRACK_Y + 'px', height: TRACK_H + 'px',
                left: (PAD_L*100)+'%', right: (PAD_R*100)+'%',
                background:'#16162a', borderRadius:'4px',
            });
            host.appendChild(trackBg);

            /* 2. H/L 그라데이션 오버레이 (가로바 위) */
            var gradL = Math.min(pctL, pctH);
            var gradR = Math.max(pctL, pctH);
            var gradW = Math.max(0, gradR - gradL);
            if (gradW > 0) {
                host.appendChild(mkDiv({
                    position:'absolute', zIndex:'2',
                    top: TRACK_Y + 'px', height: TRACK_H + 'px',
                    left: gradL + '%', width: gradW + '%',
                    borderRadius:'3px',
                    background:'linear-gradient(90deg,' +
                        'rgba(68,136,255,0.85) 0%,' +
                        'rgba(68,100,200,0.40) 25%,' +
                        'rgba(90,90,130,0.20) 50%,' +
                        'rgba(200,80,80,0.40) 75%,' +
                        'rgba(255,68,68,0.85) 100%)',
                }));
            }

            /* 3. H/L 레이블 — 그라데이션 끝점 vs 가로바 끝 선택 */
            // 노드 위치 배열
            var nodePcts = nodes.map(function(n){ return pct(n.val); });

            // H 레이블 위치 결정
            if (showH) {
                // 가장 가까운 노드와의 간격 확인
                var minDistH = Math.min.apply(null, nodePcts.map(function(np){ return Math.abs(np - pctH); }));
                var hLeft = minDistH < 6 ? ((1 - PAD_R) * 100) : pctH;
                var hEl = mkDiv({
                    position:'absolute', zIndex:'6',
                    top: HL_Y + 'px',
                    left: hLeft + '%',
                    transform: 'translateX(-50%)',
                    fontSize:'9px', fontWeight:'bold',
                    color:'#ff5555', whiteSpace:'nowrap',
                });
                hEl.textContent = 'H ' + dayHigh.toFixed(1);
                host.appendChild(hEl);
            }

            // L 레이블 위치 결정
            if (showL) {
                var minDistL = Math.min.apply(null, nodePcts.map(function(np){ return Math.abs(np - pctL); }));
                var lLeft = minDistL < 6 ? (PAD_L * 100) : pctL;
                var lEl = mkDiv({
                    position:'absolute', zIndex:'6',
                    top: HL_Y + 'px',
                    left: lLeft + '%',
                    transform: 'translateX(-50%)',
                    fontSize:'9px', fontWeight:'bold',
                    color:'#5599ff', whiteSpace:'nowrap',
                });
                lEl.textContent = 'L ' + dayLow.toFixed(1);
                host.appendChild(lEl);
            }

            /* 4. 현재가 삼각형 + 레이블 */
            var isTouched = !!touchedKey;
            var triColor  = isTouched ? '#ffcc00' : '#00ddff';
            var triGlow   = isTouched ? 'rgba(255,204,0,0.9)' : 'rgba(0,221,255,0.8)';

            var cLbl = mkDiv({
                position:'absolute', zIndex:'12',
                top: CURR_LBL_Y + 'px',
                left: pctP + '%', transform:'translateX(-50%)',
                fontSize:'10px', fontWeight:'bold',
                color: triColor, whiteSpace:'nowrap',
                textShadow:'0 0 8px ' + triGlow,
            });
            cLbl.textContent = '▼ ' + price.toFixed(2);
            if (isTouched) cLbl.style.animation = 'tlPulse 1.3s ease-in-out infinite';
            host.appendChild(cLbl);

            var tri = mkDiv({
                position:'absolute', zIndex:'11',
                top: CURR_TRI_Y + 'px',
                left: pctP + '%', transform:'translateX(-50%)',
                width:'0', height:'0',
                borderLeft:'7px solid transparent',
                borderRight:'7px solid transparent',
                borderTop:'10px solid ' + triColor,
                filter:'drop-shadow(0 0 5px ' + triGlow + ')',
            });
            if (isTouched) tri.style.animation = 'tlPulse 1.3s ease-in-out infinite';
            host.appendChild(tri);

            /* 5. 노드 점 + 진입존 */
            nodes.forEach(function(n) {
                var lp   = pct(n.val);
                var isTch = (touchedKey === n.key);

                if (isTch) {
                    var zoneW = (n.val * 0.005 / span) * TRK_W * 100 * 2;
                    host.appendChild(mkDiv({
                        position:'absolute', zIndex:'3',
                        top: (TRACK_Y - 4) + 'px',
                        left: (lp - zoneW/2) + '%', width: zoneW + '%',
                        height: (TRACK_H + 8) + 'px',
                        background:'rgba(255,204,0,0.13)',
                        border:'1px solid rgba(255,204,0,0.5)',
                        borderRadius:'3px',
                        animation:'tlPulse 1.3s ease-in-out infinite',
                    }));
                }

                var dotSz = isTch ? 14 : 10;
                var dot = mkDiv({
                    position:'absolute', zIndex:'5',
                    top: (NODE_CY - dotSz/2) + 'px',
                    left: lp + '%', transform:'translateX(-50%)',
                    width: dotSz+'px', height: dotSz+'px',
                    borderRadius:'50%',
                    background: n.color,
                    boxShadow:'0 0 ' + (isTch?14:5) + 'px ' + n.glow,
                });
                if (isTch) {
                    dot.style.border    = '2px solid #ffcc00';
                    dot.style.animation = 'tlPulseBorder 1.3s ease-in-out infinite';
                }
                host.appendChild(dot);
            });

            /* 6. 하단 레이블 (충돌 감지 → 수직 오프셋) */
            var offsets = nodePcts.map(function(){ return 0; });
            for (var i = 0; i < nodePcts.length - 1; i++) {
                if (nodePcts[i+1] - nodePcts[i] < 9) {
                    offsets[i+1] = offsets[i] === 0 ? 13 : 0;
                }
            }

            nodes.forEach(function(n, i) {
                var lp     = nodePcts[i];
                var off    = offsets[i];
                var cnt    = counts[n.key] || 0;
                var isTch  = (touchedKey === n.key);
                var isR    = n.key.startsWith('r');
                var isMp   = n.key === 'mp';
                var lblClr = isTch ? '#ffaa00' : n.color;

                // 가격
                var prEl = mkDiv({
                    position:'absolute', zIndex:'7',
                    top: (PRICE_Y + off) + 'px',
                    left: lp + '%', transform:'translateX(-50%)',
                    fontSize:'9px', fontWeight:'bold',
                    color: lblClr, whiteSpace:'nowrap', textAlign:'center',
                });
                prEl.textContent = n.val.toFixed(1);
                host.appendChild(prEl);

                // 이름
                var nmEl = mkDiv({
                    position:'absolute', zIndex:'7',
                    top: (LABEL_Y0 + off) + 'px',
                    left: lp + '%', transform:'translateX(-50%)',
                    fontSize:'8.5px',
                    color: isTch ? '#ffaa00' : '#555',
                    whiteSpace:'nowrap', textAlign:'center',
                });
                nmEl.textContent = n.label + (isTch ? ' ⚡' : '');
                host.appendChild(nmEl);

                // 카운트 — ★ 수정: 폰트 9px (가격과 동일)
                if (cnt > 0) {
                    var bg  = isTch ? 'rgba(255,170,0,0.22)'  : isR ? 'rgba(255,60,60,0.18)'  : isMp ? 'rgba(255,204,0,0.15)' : 'rgba(68,136,255,0.18)';
                    var bdr = isTch ? 'rgba(255,170,0,0.6)'   : isR ? 'rgba(255,80,80,0.4)'   : isMp ? 'rgba(255,204,0,0.4)'  : 'rgba(68,136,255,0.4)';
                    var clr = isTch ? '#ffcc00' : isR ? '#ff7777' : isMp ? '#ffcc00' : '#7799ff';
                    var cEl = mkDiv({
                        position:'absolute', zIndex:'7',
                        top: (COUNT_Y0 + off) + 'px',
                        left: lp + '%', transform:'translateX(-50%)',
                        fontSize:'9px', fontWeight:'bold',   // ★ 9px
                        padding:'1px 6px', borderRadius:'8px',
                        background: bg, border:'1px solid ' + bdr,
                        color: clr, whiteSpace:'nowrap',
                    });
                    cEl.textContent = '×' + cnt + (isTch ? ' +1?' : '');
                    if (isTch) cEl.style.animation = 'tlPulse 1.3s ease-in-out infinite';
                    host.appendChild(cEl);
                }
            });
        }

        /* div 생성 헬퍼 */
        function mkDiv(styles) {
            var d = document.createElement('div');
            Object.assign(d.style, styles);
            return d;
        }

        function renderOiSafe(panelIdx, rows, price) {
            var p = 'p' + panelIdx + '-';
            var el = document.getElementById(p + 'oi-rows');
            if (!el) return;

            var isMobile = window.innerWidth <= 800;

            var atmItem = rows.reduce(function (pv, cv) {
                return Math.abs(cv.strike - price) < Math.abs(pv.strike - price) ? cv : pv;
            });
            var atm = atmItem.strike;

            var sortedRows = rows.slice().sort(function(a, b) { return b.strike - a.strike; });

            var atmIndex = sortedRows.findIndex(function(r) { return r.strike === atm; });
            var displayRows = sortedRows;

            if (atmIndex !== -1) {
                var startIdx = Math.max(0, atmIndex - 7);
                var endIdx = Math.min(sortedRows.length, startIdx + 14);
                if (endIdx - startIdx < 14) { startIdx = Math.max(0, endIdx - 14); }
                displayRows = sortedRows.slice(startIdx, endIdx);
            }

            var mx = Math.max.apply(null, displayRows.map(function (r) {
                return Math.max(r.callOI + r.callVol, r.putOI + r.putVol, 1);
            }));
            var fmt = function (v) { return v >= 1000 ? (v / 1000).toFixed(1) + 'K' : (v === 0 ? '-' : v); };

            hideInitialLoading();

            el.innerHTML = displayRows.map(function (r) {
                var cw = Math.max(1, ((r.callOI + r.callVol) / mx) * 100);
                var pw = Math.max(1, ((r.putOI + r.putVol) / mx) * 100);
                var ia = r.strike === atm ? 'atm' : '';
                var cc = r.callChg > 0 ? 'up' : r.callChg < 0 ? 'dn' : 'neu';
                var pc = r.putChg > 0 ? 'up' : r.putChg < 0 ? 'dn' : 'neu';
                var cvTxt = isMobile ? fmt(r.callOI + r.callVol) : (fmt(r.callOI) + '/' + fmt(r.callVol));
                var pvTxt = isMobile ? fmt(r.putOI + r.putVol)  : (fmt(r.putOI)  + '/' + fmt(r.putVol));

                return '<div class="oi-row">' +
                       '<div class="oi-bar-wrap left"><div class="oi-bar call" style="width:' + cw + '%"></div></div>' +
                       '<div class="oi-vol">' + cvTxt + '</div>' +
                       '<div class="' + cc + '">' + (r.callChg > 0 ? '+' : '') + Math.round(r.callChg) + '%</div>' +
                       '<div><span class="strike-box ' + ia + '">' + r.strike.toFixed(1) + '</span></div>' +
                       '<div class="' + pc + '">' + (r.putChg > 0 ? '+' : '') + Math.round(r.putChg) + '%</div>' +
                       '<div class="oi-vol">' + pvTxt + '</div>' +
                       '<div class="oi-bar-wrap right"><div class="oi-bar put" style="width:' + pw + '%"></div></div>' +
                       '</div>';
            }).join('');
        }

        function initGlobalTickersListener() {

                    var p = Number(price) || 0;

                rtRef.on('value', function (snap) {
                    var data = snap.val();

            });

                        if (dEl) dEl.innerHTML = '<span class="tit">달러인덱스</span><span class="val ' + (dc > 0 ? 'up' : dc < 0 ? 'dn' : 'neu') + '">' + dp.toFixed(2) + ' (' + (dc > 0 ? '+' : '') + dc.toFixed(2) + '%)</span>';
                    }
                    if (data.vix) {
                        var vp = data.vix.price || 0, vs = data.vix.vixState || '안정';
                        var vixEl = document.getElementById('neon-vix');
                        if (vixEl) vixEl.innerHTML = '<span class="tit">VIX</span><span class="val ' + (vs === '공포패닉' ? 'up' : vs.includes('불안') ? 'warn' : 'neu') + '">' + vp.toFixed(2) + ' [' + vs + ']</span>';
                        globVix = vp; globVixState = vs;
                    }
                    if (data.fearGreed) {
                        var fgs = Math.round(data.fearGreed.score) || 0, fgr = (data.fearGreed.rating || '').toLowerCase();
                        var rKr = fgr.includes('extreme fear') ? '극단적 공포' : fgr.includes('fear') ? '공포' : fgr.includes('extreme greed') ? '극단적 탐욕' : fgr.includes('greed') ? '탐욕' : '중립';
                        var fgEl = document.getElementById('neon-fg');
                        if (fgEl) fgEl.innerHTML = '<span class="tit">F&G</span><span class="val ' + (fgs <= 25 ? 'up' : fgs >= 75 ? 'dn' : 'neu') + '">' + fgs + ' [' + rKr + ']</span>';
                    }
                    [0, 1, 2].forEach(function (i) { updateEnvSummary(i); });
                });
            } catch (e) { }
        }

        function initUsdKrwListener() {
            try {
                firebase.database().ref('system/exchangeRate').on('value', function (snap) {
                    var data = snap.val(), el = document.getElementById('neon-usdkrw');
                    if (el && data) {
                        var p = typeof data === 'object' ? (Number(data.price) || 0) : (Number(data) || 0);
                        var r = Number(String(typeof data === 'object' ? data.changeRate : '0').replace('%', '')) || 0;
                        el.innerHTML = '<span class="tit">원달러환율</span><span class="val ' + (r > 0 ? 'up' : r < 0 ? 'dn' : 'neu') + '">' + p.toFixed(2) + '원</span>';
                    }
                });
            } catch (e) { }
        }

        function updateNeonItem(id, name, p, chg) {
            var el = document.getElementById(id); if (!el) return;
            var numP = Number(p) || 0, numC = Number(chg) || 0;
            var cls = numC > 0 ? 'up' : numC < 0 ? 'dn' : 'neu';
            el.innerHTML = '<span class="tit">' + name + '</span><span class="val ' + cls + '">' + numP.toFixed(2) + ' (' + (numC > 0 ? '+' : '') + numC.toFixed(2) + '%)</span>';
        }

        (function start() {
            initDashboard(); buildWatchlist(); refreshAllDropdowns(); initFirebase();
            initGlobalTickersListener(); yahooWsConnect(); initMacroListener(); initUsdKrwListener();
        })();
    </script>
</body>
</html>
