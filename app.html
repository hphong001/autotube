<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소싱 스테이션 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ERP 작업공간 — 상단바 / 좌측 모듈 사이드바 / 멀티탭 본문, 모바일은 하단 탭바 + 드로어. 다크 기본(화물 컨테이너 오렌지 포인트). */
:root{
  --bg:#0f1519; --panel:#151d23; --panel2:#1b252c; --line:#26333c; --line2:#31404b;
  --fg:#dde6eb; --muted:#8798a5; --dim:#5d6f7c;
  --accent:#e58a3c; --accent-ink:#1a1006; --info:#6ea8d9; --good:#5cbf8c; --warn:#e2c159; --bad:#e3665d;
  --f-ui:"IBM Plex Sans KR","Noto Sans SC",system-ui,-apple-system,"Malgun Gothic","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef2f4; --panel:#ffffff; --panel2:#f5f8f9; --line:#dbe3e8; --line2:#c9d4db;
  --fg:#16212a; --muted:#5b6c78; --dim:#8695a0;
  --accent:#c4661c; --accent-ink:#ffffff; --info:#2f6fa8; --good:#23885a; --warn:#a07a12; --bad:#c23c33; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef2f4; --panel:#ffffff; --panel2:#f5f8f9; --line:#dbe3e8; --line2:#c9d4db;
  --fg:#16212a; --muted:#5b6c78; --dim:#8695a0;
  --accent:#c4661c; --accent-ink:#ffffff; --info:#2f6fa8; --good:#23885a; --warn:#a07a12; --bad:#c23c33; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#stage{height:100%}
#stage.preview{display:flex;align-items:center;justify-content:center;padding:12px;background:repeating-linear-gradient(135deg,var(--bg) 0 14px,var(--panel2) 14px 28px)}
#stage.preview .app{width:390px;max-width:100%;height:min(820px,100%);border:1px solid var(--line2);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}

.app{position:relative;height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);grid-template-areas:"top top" "side main";background:var(--bg);overflow:hidden}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 12px var(--f-mono)}
.brand small{display:block;font:500 10px var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-top:-3px}
.srch{position:relative;flex:1;max-width:420px;min-width:0}
.srch input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px 0 34px}
.srch>svg{position:absolute;left:10px;top:8px;color:var(--muted)}
.srch .res{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;z-index:40;max-height:340px;overflow:auto;padding:4px}
.srch .res button{display:flex;width:100%;gap:8px;align-items:center;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer}
.srch .res button:hover,.srch .res button.on{background:var(--panel2)}
.srch .res small{color:var(--muted);margin-left:auto;font-size:11px}
.sp{flex:1}
.tb-r{display:flex;align-items:center;gap:6px;flex:none}
.ib{height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.ib:hover{border-color:var(--line2)}
.ib.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:34px}
.seg button{border:0;background:var(--panel2);padding:0 10px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.rolesel{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 8px;max-width:170px}
.collect{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:0 10px;height:34px;border:1px solid var(--line);border-radius:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.lockchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 16%,var(--panel2));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);font-size:12px;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:600;font-size:12px;cursor:pointer}

.side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px}
.grp{margin-bottom:4px}
.grp>button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px 8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.grp>button:hover{color:var(--fg)}
.grp>button .cv{margin-left:auto;transition:transform .15s}
.grp.closed>button .cv{transform:rotate(-90deg)}
.grp.closed .mis{display:none}
.mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 8px 6px 35px;border-radius:7px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--fg)}
.mi:hover{background:var(--panel2)}
.mi.on{background:color-mix(in srgb,var(--accent) 16%,var(--panel2));color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.mi .tg{margin-left:auto;display:flex;gap:4px;align-items:center}
.mi .tg svg{width:13px;height:13px;color:var(--warn)}
.ph{font:600 9.5px var(--f-mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--muted)}
.ph.p1{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.sidefoot{margin:14px 8px 0;padding:10px;border:1px dashed var(--line2);border-radius:8px;font-size:11.5px;color:var(--muted)}

.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;flex:none;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--muted);background:none}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--fg);margin-bottom:-1px}
.tab .x{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px}
.tab .x:hover{background:var(--panel2)}
.tab .x svg{width:12px;height:12px}
.view{flex:1;overflow:auto;padding-block:18px 40px;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px));min-width:0}

.mh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:12px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mh h1{font-size:22px;line-height:1.25;margin:2px 0 0;letter-spacing:-.015em;text-wrap:balance}
.mh p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bdg{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.bdg.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.bdg.wrn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.bdg svg{width:12px;height:12px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.subs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px;color:var(--muted)}
.subs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.subs .lbl{font:600 10.5px var(--f-mono);color:var(--dim);letter-spacing:.08em;align-self:center;margin-right:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--muted);font-weight:400;margin-left:auto;font-size:11.5px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gl{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:600 22px var(--f-mono);margin-top:4px;letter-spacing:-.02em}
.kpi .d{font:500 11.5px var(--f-mono);margin-top:2px}
.up{color:var(--good)} .dn{color:var(--bad)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input,.tools select,.fld input,.fld select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;min-width:0}
.tools .q{flex:1;min-width:140px;max-width:300px}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.fchip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tb th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;position:sticky;top:0}
.tb td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
.tb tr.click{cursor:pointer}
.tb .r{text-align:right}
.kw{display:flex;flex-direction:column;line-height:1.25}
.kw small{color:var(--dim);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.pill.good::before{background:var(--good)} .pill.warn::before{background:var(--warn)} .pill.bad::before{background:var(--bad)} .pill.info::before{background:var(--info)} .pill.acc::before{background:var(--accent)}
.mask{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-family:var(--f-mono)}
.mask svg{width:12px;height:12px}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.scorec{display:flex;align-items:center;gap:8px}
.scorec .num{width:24px;text-align:right}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.hb .t{height:12px;border-radius:4px;background:var(--panel2);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hb .t i.neg{background:var(--bad)}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font:10.5px var(--f-mono);fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.heat td.h{width:7.5%;text-align:center;font:500 11px var(--f-mono);padding:7px 2px;border-left:1px solid var(--bg)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px}
.kcol h4{margin:0 0 10px;font-size:12.5px;display:flex;justify-content:space-between;color:var(--muted)}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12.5px;cursor:grab}
.kc b{display:block;font-size:13px;margin-bottom:4px}
.kc .m{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}

.fmap{columns:3 300px;column-gap:14px}
.fg{break-inside:avoid;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fg h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}
.fm{padding:8px 0;border-top:1px solid var(--line)}
.fm:first-of-type{border-top:0}
.fm button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;text-align:left}
.fm button:hover{color:var(--accent)}
.fm p{margin:2px 0 6px;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.fm.off{opacity:.45}

.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.fld input,.fld select{color:var(--fg);width:100%}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.calcout{display:flex;flex-direction:column;gap:8px}
.calcout .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.calcout .big{font:600 30px var(--f-mono);letter-spacing:-.02em}

.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:19px;background:var(--accent-ink)}
.switch input:disabled+span{opacity:.4}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.mrow small{color:var(--muted);display:block;font-size:11.5px}
.perm{display:flex;gap:3px}
.perm label{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;border:1px solid var(--line2);font:600 10px var(--f-mono);cursor:pointer;color:var(--dim);user-select:none}
.perm input{display:none}
.perm input:checked+label{background:color-mix(in srgb,var(--accent) 22%,var(--panel2));border-color:var(--accent);color:var(--fg)}
.perm input:disabled+label{cursor:not-allowed}
.mkt{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mc .zh{font-size:15px;font-weight:700;font-family:"Noto Sans SC",var(--f-ui)}
.mc .loc{font-size:12px;color:var(--muted)}
.mc .it{font-size:12.5px}
.mc .ft{display:flex;gap:6px;margin-top:4px;align-items:center}
.cq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.cq .z{font:700 20px "Noto Sans SC",var(--f-ui)}
.cq .k{color:var(--muted);font-size:13px}
.big .cq .z{font-size:30px}
.scanbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 16px;border:2px dashed var(--line2);border-radius:14px;text-align:center}
.scanbox input{width:min(360px,100%);height:48px;font:600 18px var(--f-mono);text-align:center;border-radius:10px;border:1px solid var(--accent);background:var(--panel2)}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.plan.hl{border-color:var(--accent)}
.plan .pr{font:600 24px var(--f-mono);margin:6px 0 10px}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.chn{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed var(--line2)}
.tree>ul{padding-left:0;border:0}
.tree li{padding:4px 0;font-size:13px}
.tree li span{color:var(--muted);font-size:11.5px;margin-left:6px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:50px 16px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--warn)}
.empty h2{color:var(--fg);margin:0;font-size:18px}
.note{font-size:12px;color:var(--muted);padding:10px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);margin-top:12px}
.note b{color:var(--fg)}

.bnav{grid-area:bnav;display:none}
.scrim{display:none}
.hamb{display:none}

/* 모바일 레이아웃 (실제 폭 또는 미리보기 모드) */
.app.is-mobile{grid-template-columns:minmax(0,1fr);grid-template-rows:54px minmax(0,1fr) 62px;grid-template-areas:"top" "main" "bnav"}
.app.is-mobile .hamb{display:inline-flex}
.app.is-mobile .srch,.app.is-mobile .collect,.app.is-mobile .dk{display:none}
.app.is-mobile .brand small{display:none}
.app.is-mobile .side{position:absolute;z-index:30;top:54px;bottom:0;left:0;width:84%;max-width:320px;transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 30px rgba(0,0,0,.3)}
.app.is-mobile.drawer .side{transform:none}
.app.is-mobile.drawer .scrim{display:block;position:absolute;inset:54px 0 0;background:rgba(0,0,0,.4);z-index:25}
.app.is-mobile .tabs{display:none}
.app.is-mobile .view{padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
.app.is-mobile .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.app.is-mobile .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);cursor:pointer;min-width:0}
.app.is-mobile .bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.app.is-mobile .bnav button.on{color:var(--accent)}
.app.is-mobile .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.app.is-mobile .g2,.app.is-mobile .g3,.app.is-mobile .gl,.app.is-mobile .form,.app.is-mobile .plans{grid-template-columns:minmax(0,1fr)}
.app.is-mobile .mh h1{font-size:19px}
.app.is-mobile .badges{margin-left:0}
.app.is-mobile .rolesel{max-width:120px}
.app.is-mobile .mrow{grid-template-columns:minmax(0,1fr) auto}
.app.is-mobile .mrow .hm{display:none}
@media (max-width:1100px){.app:not(.is-mobile) .collect{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

.modal{position:fixed;inset:0;background:rgba(5,9,12,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.dlg{width:min(420px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dlg h2{margin:0 0 6px;font-size:18px;display:flex;gap:8px;align-items:center}
.dlg h2 svg{color:var(--warn);width:20px;height:20px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:13px}
.pin{display:flex;gap:10px;justify-content:center;margin:12px 0}
.pin input{width:52px;height:58px;text-align:center;font:600 24px var(--f-mono);border-radius:10px;border:1px solid var(--line2);background:var(--panel2)}
.dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.err{color:var(--bad);font-size:12.5px;min-height:18px;text-align:center}
.ulist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ulist button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left}
.ulist button.on{border-color:var(--accent)}
.ulist small{color:var(--muted);display:block;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:120;max-width:calc(100% - 32px)}
.modal[hidden],.toast[hidden],.srch .res[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function lineChart(series,labels,{h=220,money=false}={}){
 const W=640,H=h,pl=46,pr=14,pt=14,pb=26,all=series.flatMap(s=>s.v),mx=Math.max(...all)*1.08,mn=Math.min(0,Math.min(...all));
 const x=i=>pl+i*(W-pl-pr)/(labels.length-1),y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
 const cols=['var(--accent)','var(--info)','var(--good)'];let g='';
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end">${money?Math.round(v/1e4)+(li()?'万':'만'):fmt(v)}</text>`}
 const step=Math.ceil(labels.length/8);labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
 series.forEach((s,si)=>{const p=s.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  if(si===0)g+=`<polygon points="${pl},${y(mn)} ${p} ${x(s.v.length-1)},${y(mn)}" fill="var(--accent)" opacity=".1"/>`;
  g+=`<polyline points="${p}" fill="none" stroke="${cols[si]}" stroke-width="2" ${si?'stroke-dasharray="5 4"':''}/><circle cx="${x(s.v.length-1)}" cy="${y(s.v[s.v.length-1])}" r="3.5" fill="${cols[si]}"/>`});
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${series.map((s,i)=>`<span><i style="background:${cols[i]}"></i>${L(s.n)}</span>`).join('')}</div>`}
function hbars(rows,{max,fmtv=v=>fmt(v)}={}){const m=max||Math.max(...rows.map(r=>Math.abs(r[1])));
 return `<div class="hbars">${rows.map(r=>`<div class="hb"><span>${L(r[0])}</span><span class="t"><i class="${r[1]<0?'neg':''}" style="width:${Math.abs(r[1])/m*100}%"></i></span><span class="num" style="text-align:right">${fmtv(r[1])}</span></div>`).join('')}</div>`}

document.addEventListener('focusout',e=>{if(e.target.id==='gsearch')setTimeout(()=>{const r=$('gres');if(r)r.hidden=true},150)});
function searchMenu(q){const r=$('gres');q=q.trim().toLowerCase();if(!q){r.hidden=true;return}const out=[];
 Object.values(MODS).filter(visible).forEach(m=>{const nm=(m.n[0]+' '+m.n[1]).toLowerCase();if(nm.includes(q)||(m.d[0]+m.d[1]).toLowerCase().includes(q))out.push([m.id,L(m.n),L(m.g.n),undefined]);
  m.f.forEach((f,i)=>{if((f.n[0]+' '+f.n[1]).toLowerCase().includes(q))out.push([m.id,L(f.n),L(m.n),i])})});
 r.innerHTML=out.slice(0,12).map(o=>`<button data-go="${o[0]}" data-gs="${o[3]??''}">${L(['→','→'])} ${o[1]}<small>${o[2]}</small></button>`).join('')||`<div style="padding:10px;color:var(--muted)">${t('noRes')}</div>`;r.hidden=false;
 r.querySelectorAll('button').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();open(b.dataset.go,{sub:b.dataset.gs===''?undefined:+b.dataset.gs});r.hidden=true;$('gsearch').value=''})}
matchMedia('(max-width: 820px)').addEventListener('change',()=>{applyShell()});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(MODS[id]&&id!==S.active)open(id)});
setInterval(()=>{const el=$('lockleft');const left=S.unlockUntil-Date.now();
 if(el){if(left<=0){render();return}el.textContent=`${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`}},1000);

load();
{const h=location.hash.slice(1);if(MODS[h]&&h!=='dashboard'){S.tabs.push(h);S.active=h}}
render();
</script>
